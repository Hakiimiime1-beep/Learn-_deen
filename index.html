waa waajib saaran Muslim kasta.","h25":"Ruuxii rumeeya Allaah iyo Maalinta Dambe, ha dhibin deriskiisa.","h26":"Hodannimadu maaha inaad hanti badan leedahay; hodannimada runta ah waa naf-dhergga.","h27":"Arrinka mu'minku wuu yaab badan yahay: dhammaantiis wuu ka wanaagsan yahay, taasna qof kale ma helo mu'min mooyaane. Haddii wanaag ku timaado wuu mahadiyaa, taasna waa wanaag; haddii xumaan ku timaado wuu samraa, taasna waa wanaag.","h28":"Allaah ma eego muuqaalkiinna iyo hantidiinna, laakiin wuxuu eegaa quluubtiinna iyo camalladiinna.","h29":"Camalka Allaah ugu jecel waa kan joogtada ah, haddii uu yar yahay mid.","h30":"Ruuxii maalintii boqol jeer yidhaaha SubhanAllahi wa bihamdihi, dembiyadiisa waa la cafiyaa xataa haddii ay u egyihiin xumbada badda."},"names":{"n1":"Naxariis-badanaha","n2":"Naxariis-yeelaha","n3":"Boqorka","n4":"Ka Nadiifka ah","n5":"Isha Nabadda","n6":"Amaan-bixiyaha","n7":"Ilaaliyaha","n8":"Awood-leh","n9":"Xoog-leh","n10":"Weyn-sare","n11":"Abuuraha","n12":"Sameeyaha","n13":"Qaabeeyaha","n14":"Cafis-badanaha","n15":"Adkaha","n16":"Deeq-bixiyaha","n17":"Arzaaqaha","n18":"Furaha","n19":"Aqoon-badanaha","n20":"Xidhaha","n21":"Ballaadhiyaha","n22":"Hoos-dhigaha","n23":"Kor-u-qaadaha","n24":"Sharfaha","n25":"Dulleeyaha","n26":"Maqlaha","n27":"Arkaha","n28":"Xaakinka","n29":"Caddaalad-badanaha","n30":"Naxariis-fudaydka ah, Dhaqdhaqaaqa qarsoon","n31":"Khabiirka","n32":"Xalimka","n33":"Weyn-sharaf","n34":"Cafiyaha","n35":"Mahadnaq-badanaha","n36":"Ka Sarreeya","n37":"Ka Weyn","n38":"Xafidaha","n39":"Quudiyaha","n40":"Xisaab-qaadaha","n41":"Sharaf-badanaha","n42":"Deeqsiga","n43":"Hubiyaha","n44":"Jawaab-bixiyaha","n45":"Wax-walba-ku-ballaaran","n46":"Xikmad-badanaha","n47":"Jacayl-badanaha","n48":"Ammaan-mudanaha","n49":"Kicinaha","n50":"Markhaatiga","n51":"Runta","n52":"Wakiilka","n53":"Xoog-badanaha","n54":"Adkaha","n55":"Gargaaraha","n56":"Mahad-mudanaha","n57":"Tiriyaha","n58":"Bilaabaha","n59":"Celiyaha","n60":"Nooleeyaha","n61":"Dhimiyaha","n62":"Ka Nool","n63":"Qaa'imaha","n64":"Helaha","n65":"Sharfan","n66":"Kan Keliya","n67":"Gaarka ah","n68":"Kan Loo Baahan Yahay","n69":"Karaha","n70":"Awood-badanaha","n71":"Hormariyaha","n72":"Dib-dhigaha","n73":"Kan Ugu Horreeya","n74":"Kan Ugu Dambeeya","n75":"Muuqda","n76":"Qarsoon","n77":"Maamulaha","n78":"Aad u Sarreeya","n79":"Isha Wanaagga","n80":"Toobad-aqbalaha","n81":"Ka-aarsadaha","n82":"Cafiyaha","n83":"Roonaha","n84":"Mulkiga oo dhan Leh","n85":"Sharaf iyo Deeqsinimo Leh","n86":"Caddaaladeeyaha","n87":"Ururiyaha","n88":"Isku-filaha","n89":"Hodmiyaha","n90":"Ka-hortagaha","n91":"Dhibaatayntaha","n92":"Faa'iidaha","n93":"Nuurka","n94":"Hanuuniyaha","n95":"Bilaabaha aan la mid ahayn","n96":"Waaraha","n97":"Dhaxlaha","n98":"Hanuuniyaha Jidka Toosan","n99":"Samir-badanaha"},"course":[{"id":"L1","w":1,"title":"Allah waa kuma?","teach":"Muslimiintu waxay rumaysan yihiin Ilaah keliya, Allah. Isagu wuxuu abuuray wax kasta, shuraako ma leh, ilmo ma leh, wax isaga la mid ahna ma jiraan. Rumaysadkan waxaa la yiraahdaa Tawhid. Erayga Islaam macnihiisu waa u hoggaansanaan nabadgelyo leh Allah, Muslimkuna waa qofka isaga u hoggaansan. Allah waa Ar-Rahman, ka naxariis badan, iyo Al-Khaliq, Abuuraha.","qs":[{"q":"Tawhid macnihiisu waa maxay?","o":["Rumaysadka ah in Allah yahay mid","Soonka Ramadan","Salaadda shanta jeer","Bixinta sadaqada"],"a":0},{"q":"Magaca Ar-Rahman macnihiisu waa maxay?","o":["Ka naxariis badan","Abuuraha","Dambi dhaafaha","Ka sarreeya"],"a":0},{"q":"Muslim waa qof…","o":["u hoggaansan Allah","ku nool Makkah","ku hadla Carabi","ku dhashay qoys Muslim ah"],"a":0},{"q":"Run ama been: Allah shuraako buu leeyahay.","o":["Run","Been"],"a":1}]},{"id":"N1","title":"Magacyada qurxoon ee Allah","teach":"Allah wuxuu leeyahay 99 magac oo qurxoon (Al-Asma’ul-Husna), laga helo Quranka iyo Sunnada. Nabiga ﷺ wuxuu yiri Allah wuxuu leeyahay sagaal iyo sagaashan magac, qofkii barta oo ku dhaqmana wuxuu geli doonaa Jannada (Sahih al-Bukhari, Sahih Muslim). Tusaale ahaan waxaa jira Ar-Rahman (Naxariis badan), Al-Malik (Boqorka) iyo Al-Ghaffar (Dambi dhaafka badan). Allah waxaan ugu baryaa magacyadiisa marka aan dua samayno: ‘Allah waxaa u gaar ah magacyada ugu wanaagsan, ku barya iyaga’ (Quran 7:180). Dhammaan 99-ka ka eeg tabka Names.","qs":[{"q":"Imisa magac oo qurxoon oo Allah ayaa si caan ah loo taxay?","o":["99","33","40","114"],"a":0},{"q":"Al-Ghaffar macnihiisu waa maxay?","o":["Dambi dhaafka badan","Boqorka","Abuuraha","Risqi bixiyaha"],"a":0},{"q":"Allah maxuu noogu sheegay inaan ku sameyno magacyadiisa qurxoon?","o":["Ku barya iyaga","Qarsoon ka dhig","Hal mar kaliya akhri","Derbiyada ku qor"],"a":0},{"q":"Al-Malik macnihiisu waa maxay?","o":["Boqorka","Bogsiiyaha","Garsooraha","Iftiinka"],"a":0}],"w":1},{"id":"L3","w":1,"title":"Lixda tiir ee Iman","teach":"Iman waa rumayn. Muslimku wuxuu rumaystaa lix shay: Allah, malaa’igtiisa, kutubtiisa, rasuuladiisa, Maalinta Ugu Dambeysa, iyo Qadr, kaas oo ah aqoonta iyo xukunka Allah ee wax walba, wanaag iyo xumaanba. Malaa’igta waxaa laga abuuray nuur, aadanaha dhoobo, jinka na dab aan qiiq lahayn.","qs":[{"q":"Imisa tiir oo Iman ah ayaa jira?","o":["6","5","4","7"],"a":0},{"q":"Midkee kuwan ah ma aha mid ka mid ah lixda tiir ee Iman?","o":["Soonka","Rumaynta malaa’igta","Rumaynta Maalinta Ugu Dambeysa","Rumaynta kutubta Allah"],"a":0},{"q":"Malaa’igta waxaa laga abuuray…","o":["Nuur","Dhoobo","Dab aan qiiq lahayn","Biyo"],"a":0},{"q":"Aadanaha waxaa laga abuuray…","o":["Dhoobo","Nuur","Dab aan qiiq lahayn","Dhagax"],"a":0}]},{"id":"L5","w":1,"title":"Shanta tiir ee Islaamka","teach":"Islaamku wuxuu ku dhisan yahay shan tiir. 1. Shahada: caddaynta rumaysadka. 2. Salah: salaadda shanta jeer maalintii. 3. Zakat: bixinta sadaqo ka mid ah maalkaaga. 4. Sawm: soonka Ramadan. 5. Hajj: safarka xajka Makkah, hal mar nolosha oo dhan kuwa awooda.","qs":[{"q":"Imisa tiir oo Islaam ah ayaa jira?","o":["5","6","3","4"],"a":0},{"q":"Tiirkee ayaa ah salaadda shanta jeer maalintii?","o":["Salah","Zakat","Hajj","Sawm"],"a":0},{"q":"Bisheed ayay Muslimiintu soomaan?","o":["Ramadan","Shawwal","Muharram","Rajab"],"a":0},{"q":"Hajj waa waajib…","o":["hal mar nolosha oo dhan, kuwa awooda","sannad kasta","bil kasta","culimada oo keliya"],"a":0}]},{"id":"L7","w":2,"title":"Sheegidda Shahada","teach":"Shahada waa caddaynta rumaysadka ka dhigta qof Muslim: ‘Ash-hadu an la ilaha illallah, wa ash-hadu anna Muhammadan rasulullah.’ Macnaheedu waa: Waxaan marqaati ka ahay in aan ilaah la caabudi karin Allah mooyee, waxaanan marqaati ka ahay in Muhammad yahay Rasuulka Allah. Waa in lagu sheegaa faham iyo daacadnimo.","ar":"أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","qs":[{"q":"Shahada macnaheedu waa maxay?","o":["Marqaati furid","Soon","Salaad","Sadaqo"],"a":0},{"q":"Qaybta koowaad waxay leedahay ma jiro ilaah mooyee…","o":["Allah","Nabiga","Malaa’igta","Kacbada"],"a":0},{"q":"Qaybta labaad waxay leedahay Muhammad waa…","o":["Rasuulka Allah","Boqor","Malaa’ig","Ilaah"],"a":0},{"q":"Shahada waa in lagu sheegaa…","o":["faham iyo daacadnimo","cod dheer oo keliya","koox oo keliya","Carabi oo keliya"],"a":0}]},{"id":"L21","w":2,"title":"Nabiyada Allah","teach":"Allah wuxuu u soo diray nabiyo quruun kasta isagoo wata fariin isku mid ah: Allah keliya caabuda. Quranku wuxuu magacaabayaa 25 ka mid ah, oo ay ku jiraan Adam, Nuh, Ibrahim, Musa, Isa iyo Muhammad ﷺ, nabiga ugu dambeeya. Musa wuxuu helay Tawrat, Dawud Zabur, Isa Injil, Muhammad ﷺ na Quran.","qs":[{"q":"Yaa ah nabiga ugu dambeeya?","o":["Muhammad ﷺ","Isa","Musa","Ibrahim"],"a":0},{"q":"Kitaabkee la siiyay Musa?","o":["Tawrat","Injil","Zabur","Quran"],"a":0},{"q":"Quranka waxaa loo soo dejiyay…","o":["Muhammad ﷺ","Dawud","Isa","Nuh"],"a":0},{"q":"Fariinta nabi kasta maxay ahayd?","o":["Allah keliya caabud","Magaalooyin dhis","Ganacsi bilow","Awood hel"],"a":0}]},{"id":"L17","w":2,"title":"Nabiga ﷺ: sannadihii hore","teach":"Muhammad ﷺ wuxuu ku dhashay Makkah qiyaastii 570 CE, Sannadkii Maroodiga. Aabbihiis wuu dhintay isaga oo aan weli dhalan, hooyadiisna markuu lix jir ku dhawaa. Awoowgiis, kaddibna adeerkiis Abu Talib ayaa soo korsaday. Waxaa loo yiqiin As-Sadiq Al-Amin, runlaha iyo aaminka ah. Markuu 25 jir ahaa wuxuu guursaday Khadijah, Allah ha ka raalli ahaado.","qs":[{"q":"Xaggee ku dhashay Nabiga ﷺ?","o":["Makkah","Madinah","Qudus","Taif"],"a":0},{"q":"Waxaa loo yiqiin…","o":["runlaha iyo aaminka ah","kan ugu hodansan","kan ugu xoog badan","gabyaaga"],"a":0},{"q":"Yuu guursaday markuu 25 jir ahaa?","o":["Khadijah","Aisha","Hafsah","Maryam"],"a":0},{"q":"Yaa soo korsaday awoowgiis kadib?","o":["Adeerkiis Abu Talib","Abu Lahab","Abu Bakr","Umar"],"a":0}]},{"id":"L19","w":3,"title":"Wahyiga iyo Hijrada","teach":"Markuu 40 jir ahaa, Godka Hira, malaa’igta Jibril ayaa keentay wahyigii ugu horreeyay: ‘Iqra’ (Akhri!), bilowga Surah Al-Alaq. 13 sano Nabiga ﷺ wuxuu dadka ugu yeedhay Allah Makkah wuxuuna la kulmay dhibaato. Sannadkii 622 CE wuxuu u hijrooday Madinah. Hijradan waxay calaamad u tahay bilowga taariikhda Islaamka.","qs":[{"q":"Xaggee ka yimid wahyigii ugu horreeyay?","o":["Godka Hira","Kacbada","Madinah","Buurta Siinay"],"a":0},{"q":"Eraygii ugu horreeyay ee la soo dejiyay waa maxay?","o":["Iqra (Akhri)","Bismillah","Qul (Dheh)","Alhamdulillah"],"a":0},{"q":"Hijrada waxay ahayd u hijrid…","o":["Madinah","Masar","Yaman","Baghdad"],"a":0},{"q":"Hijrada waxay calaamad u tahay bilowga…","o":["taariikhda Islaamka","Ramadan","Hajj","Eid"],"a":0}]},{"id":"L23","w":3,"title":"Madinah iyo furashada Makkah","teach":"Madinah Nabiga ﷺ wuxuu dhisay masaajidkii ugu horreeyay, Masjid an-Nabawi, wuxuuna sameeyay bulsho ku dhisan walaaltinimo iyo caddaalad. Sannadkii 630 CE Makkah waa loo furay Muslimiinta, Nabiga ﷺ wuxuuna cafiyay dadkii la dagaallamay. Wuxuu geeriyooday 632 CE isagoo 63 jir ah, waxaana lagu aasay Madinah.","qs":[{"q":"Maxay ahayd waxa ugu horreeyay ee Nabiga ﷺ dhistay Madinah?","o":["Masaajid","Qalcad","Suuq","Dugsi"],"a":0},{"q":"Sidee ula dhaqmay cadaawayaashiisii hore ee Makkah?","o":["Wuu cafiyay","Wuu ciqaabay","Wuu iska indhatiray","Wuu eryay"],"a":0},{"q":"Xaggee lagu aasay Nabiga ﷺ?","o":["Madinah","Makkah","Taif","Qudus"],"a":0},{"q":"Surahkee ayaa ka hadlaya guusha iyo dadka oo kooxo-kooxo ugu soo gelaya Islaamka?","o":["An-Nasr","Al-Fil","Al-Asr","Quraysh"],"a":0}]},{"id":"N2","title":"Quranka: soo dejinta iyo ilaalinta","teach":"Quranku waa kalaamka Allah, oo loo soo dejiyay Nabiga ﷺ afka Carabiga muddo qiyaastii 23 sano ah. Wuxuu leeyahay 114 surah. Waa la xifdiyay waana la qoray intii Nabigu ﷺ nooshay. Isaga kadib, Abu Bakr wuxuu ka dhigay hal kitaab, Uthman na wuxuu sameeyay nuskhado ah qoraalka caadiga ah wuxuuna u diray magaalooyinka waaweyn. Allah wuxuu ballanqaaday inuu ilaalin doono (Quran 15:9).","qs":[{"q":"Imisa surah ayuu Quranku leeyahay?","o":["114","99","30","60"],"a":0},{"q":"Qiyaastii intee in le'eg ayaa Quranka lagu soo dejiyay?","o":["23 sano","3 sano","40 sano","1 sano"],"a":0},{"q":"Yaa Quranka ka dhigay hal kitaab?","o":["Abu Bakr","Abu Lahab","Hamza","Bilal"],"a":0},{"q":"Yaa u diray nuskhadaha qoraalka caadiga ah magaalooyinka waaweyn?","o":["Uthman","Ali","Umar","Khalid"],"a":0}],"w":3},{"id":"L9","w":4,"title":"Wudu: maydhashada salaadda","teach":"Wudu waa maydhashada loo baahan yahay salaadda ka hor. Niyadda qalbigaaga ku samee oo dheh Bismillah. Kadib dhaq gacmahaaga 3 jeer, afkaaga ku shiil 3 jeer, biyo sanka ku jiid oo ka feer 3 jeer, wajiga dhaq 3 jeer, gacmaha dhaq ilaa suulasha 3 jeer (midig, kadib bidix), madaxa mar mar ku mish (dhegahana), cagaha na dhaq ilaa anqawyada 3 jeer (midig, kadib bidix). Wudu waxaa jebiya musqusha tegidda, dabayl ka baxda, hurdo dheer, ama miyir beel.","qs":[{"q":"Maxaad dhahdaa bilowga wudu?","o":["Bismillah","Allahu Akbar","Alhamdulillah","SubhanAllah"],"a":0},{"q":"Imisa jeer ayaa madaxa lagu mishaa?","o":["Hal mar","Seddex jeer","Ma la mishin","Toddoba jeer"],"a":0},{"q":"Kuwanee ayaa jebiya wudu?","o":["Hurdo dheer","Cunista rootiga","Socodka","Akhrinta"],"a":0},{"q":"Gacmaha waxaa la dhaqaa ilaa…","o":["Suulasha","Curcurka","Garbaha","Jilbaha"],"a":0}]},{"id":"L11","w":4,"title":"Salah: waqtiyada iyo rakaadka","teach":"Muslimiintu waxay tukadaan shan jeer maalintii, iyagoo u jeedsan Qibla (jihada Kacbada Makkah). Fajr (waaberi) waxay leedahay 2 rakaad, Dhuhr (duhur) 4, Asr (galab) 4, Maghrib (qorrax dhac) 3, iyo Isha (habeen) 4. Rakaad waa hal wareeg oo istaag, ruku iyo sujuud ah. Isku day inaad salaad kasta waqtigeeda ku tukato.","qs":[{"q":"Imisa rakaad ayay leedahay Fajr?","o":["2","3","4","5"],"a":0},{"q":"Salaaddee ayaa leh 3 rakaad?","o":["Maghrib","Fajr","Asr","Isha"],"a":0},{"q":"Jihadee ay Muslimiintu u jeedsadaan salaadda?","o":["Qibla, xagga Kacbada","Waqooyi","Bari","Qorraxda"],"a":0},{"q":"Imisa salaad oo maalinle ah ayaa jira?","o":["5","3","4","6"],"a":0}]},{"id":"L13","w":4,"title":"Sida loo tukado: tallaabo tallaabo","teach":"1. Niyayso, dheh ‘Allahu Akbar’ oo gacmahaaga kor u qaad. 2. Istaag oo akhri Al-Fatiha iyo surah kale. 3. Ruku: foorar oo dheh ‘Subhana Rabbiyal ‘Azim’. 4. Istaag adigoo dhihaya ‘Sami’allahu liman hamidah’. 5. Sujud: ku sujuud toddoba xubnood (foodda sanka la jirta, labada gacmood, labada jilib, labada cag) oo dheh ‘Subhana Rabbiyal A’la’. 6. Fadhiiso, kadib mar kale sujuud. Rakaadda ugu dambeysa, ku fadhiiso Tashahhud, Nabiga ﷺ salaamo ku sii, kuna dhammee Taslim: ‘As-salamu alaykum wa rahmatullah’ midig iyo bidix. Waxaa fiican inuu qof ku tuso si toos ah.","qs":[{"q":"Maxaad dhahdaa ruku (foorarka)?","o":["Subhana Rabbiyal ‘Azim","Subhana Rabbiyal A’la","Bismillah","Alhamdulillah"],"a":0},{"q":"Sujuudka, imisa xubnood ayaa dhulka taabta?","o":["7","3","5","10"],"a":0},{"q":"Salaaddu sidee ayay u bilaabantaa?","o":["Takbir: Allahu Akbar","Salaan","Ruku","Sujuud"],"a":0},{"q":"Salaaddu sidee ayay u dhammaataa?","o":["Taslim: As-salamu alaykum wa rahmatullah","Takbir","Al-Fatiha","Sujuud"],"a":0}]},{"id":"L25","w":5,"title":"Soonka iyo Ramadan","teach":"Ramadan waa bisha sagaalaad ee taariikhda Islaamka. Muslimiintu waxay soomaan waaberi (Fajr) ilaa qorrax dhac (Maghrib): cunto ma jirto, cabitaan ma jiro. Soonku wuxuu barayaa samir, mahadnaq iyo daryeelka masaakiinta. Quranka waxaa la soo dejiyay Ramadan, Laylat al-Qadr, Habeenka Awoodda, na waxay ku jirtaa toddobaadkii ugu dambeeyay ee Ramadan. Eid al-Fitr waxay timaaddaa bisha kadib.","qs":[{"q":"Soonka maalinlaha ah goorma bay socotaa?","o":["Waaberi ilaa qorrax dhac","Qorrax soo bax ilaa duhur","Qorrax dhac ilaa waaberi","Duhur ilaa habeen"],"a":0},{"q":"Laylat al-Qadr waxay ku jirtaa…","o":["tobankii habeen ee ugu dambeeyay Ramadan","Muharram","Dhul Hijjah","habeenka koowaad ee Ramadan"],"a":0},{"q":"Iidda kee ayaa Ramadan ku xigta?","o":["Eid al-Fitr","Eid al-Adha","Arafah","Hijra"],"a":0},{"q":"Ramadan waa bisheeda imisaad ee taariikhda Islaamka?","o":["9aad","1aad","12aad","5aad"],"a":0}]},{"id":"L27","w":5,"title":"Zakat iyo Sadaqah","teach":"Zakat waa tiirka saddexaad. Waa 2.5% hayaanka ka sarreeya cabbir ugu yar (nisab) muddo hal sannad oo dayax ah, waxaana la siiyaa dadka u baahan iyo kooxaha kale ee Quranka lagu sheegay. Sadaqah waa sadaqo tabaruc ah: qadar kasta, xataa hadal wanaagsan ama dhoollacadeyn. Sadaqadu waxay nadiifisaa maalka iyo qalbiga.","qs":[{"q":"Imisa boqolkiiba ayay tahay zakada hayaanka?","o":["2.5%","10%","50%","1%"],"a":0},{"q":"Sadaqada tabaruca ah maxaa la yiraahdaa?","o":["Sadaqah","Zakat","Hajj","Sawm"],"a":0},{"q":"Yaa u ah zakada?","o":["Masaakiinta iyo kuwa u baahan, iyo kuwo kale","Qaraabada hodanka ah","Milkiilayaasha dukaamada","Qof kasta oo weydiista"],"a":0},{"q":"Sadaqadu waxay nadiifisaa…","o":["maalka iyo qalbiga","jidhka oo keliya","guryaha","gawaarida"],"a":0}]},{"id":"L29","w":5,"title":"Hajj iyo Umrah","teach":"Hajj waa safarka Makkah bisha Dhul Hijjah, waana waajib hal mar nolosha oo dhan kuwa awooda. Xujeydu waxay xidhaan dharka cad ee fudud (ihram), waxay wareegaan Kacbada (tawaf), waxay u socdaan Safa iyo Marwah dhexdooda, waxayna istaagaan Bannaanka Arafah, maalinta ugu muhiimsan. Umrah waa safar yar oo la samayn karo waqti kasta oo sannadka ah.","qs":[{"q":"Bisheed ayuu yahay Hajj?","o":["Dhul Hijjah","Ramadan","Rajab","Muharram"],"a":0},{"q":"Wareegidda Kacbada maxaa la yiraahdaa?","o":["Tawaf","Sa’i","Ihram","Wudu"],"a":0},{"q":"Maalinta ugu muhiimsan ee Hajj waa mee?","o":["Istaagidda Arafah","Eid","Jimce","Qorrax soo bax"],"a":0},{"q":"Kee ayaa ah safarka yar?","o":["Umrah","Zakat","Salah","Sawm"],"a":0}]},{"id":"L15","w":6,"title":"Anshax wanaagsan iyo dabeecad","teach":"Muslimiintu waxay salaamaan ‘As-salamu alaykum’ (nabad korkiinna ha ahaato), jawaabtuna waa ‘Wa alaykumus-salam’. Dheh ‘Bismillah’ cunista ka hor iyo ‘Alhamdulillah’ kadib. Runlow, deriska u roon, waalidkaaguna ixtiraam. Allah wuxuu noo sheegay inaynaan xataa ku odhan ‘uff’ (Quran 17:23). Ka fogow xaaraan-cunista (gheeba), taas oo ah inaad xumaan ka sheegto qof markuusan joogin. Nabigu ﷺ wuxuu yiri: ‘Kuwa idinka ugu wanaagsan waa kuwa dabeecadda ugu fiican leh’ (Sahih al-Bukhari).","qs":[{"q":"Jawaabta ‘As-salamu alaykum’ waa maxay?","o":["Wa alaykumus-salam","Bismillah","SubhanAllah","Allahu Akbar"],"a":0},{"q":"Maxaan dhahnaa cunista ka hor?","o":["Bismillah","Alhamdulillah","Astaghfirullah","Inshallah"],"a":0},{"q":"Allah maxuu noogu sheegay inaynaan waligeen waalidkeenna ku odhan?","o":["‘Uff’ (erayga cadhada)","Mahadsanid","Nabad","Soo dhawoow"],"a":0},{"q":"Sida Nabigu ﷺ yiri, dadka ugu wanaagsan waa kuwa leh ugu fiicnaanta…","o":["dabeecadda","maalka","guryaha","dharka"],"a":0}]},{"id":"L31","w":6,"title":"Halal iyo haram","teach":"Halal macnaheedu waa la oggol yahay, haram na waa la reebay. Allah wuxuu reebay waxyaabaha waxyeelada leh sida khamrada, hilibka doofaarka, khamaarka, tuugada, been-sheegga iyo riba (ribada). Waxyaabaha badankood waa halal haddii Allah reebin. Lacagtaada si daacad ah u hel oo si miyir leh u isticmaal. Marka aadan hubin, weydii culimo la aamini karo.","qs":[{"q":"Halal macnaheedu waa maxay?","o":["La oggol yahay","La reebay","La nacay","Waajib"],"a":0},{"q":"Kuwanee ayaa haram ah?","o":["Riba (ribada)","Ganacsi daacad ah","Bixinta sadaqada","Soonka"],"a":0},{"q":"Waxyaabaha badankood waa…","o":["halal haddii aan la reebin","haram haddii aan la oggolayn","la mamnuucay","ikhtiyaari"],"a":0},{"q":"Sidee lacagta u heli karnaa?","o":["Si daacad ah","Si kasta oo suurtagal ah","Khiyaano","Khamaar"],"a":0}]},{"id":"L32","w":6,"title":"Aakhiro","teach":"Qof kasta wuu dhiman doonaa wuuna ku noqon doonaa Allah. Malaa’igtu waxay duubaan camalkeena. Geerida kadib waxaa imanaya nolosha qabriga (barzakh), kadib Maalinta Xisaabta, markaas oo qof kasta la soo kicinayo oo la xisaabtamayo. Kuwa wanaagsan waxay geli doonaan Jannah (Jannada) naxariista Allah. Allah waa ka naxariis badan wuxuuna cafiyaa kuwa si daacad ah toobad keena.","qs":[{"q":"Maxaa geerida ku xiga?","o":["Nolosha qabriga, kadib Maalinta Xisaabta","Waxba","Nolol kale dhulka","Hurdo weligeed ah"],"a":0},{"q":"Yaa duuba camalkeena?","o":["Malaa’igta","Aadanaha","Jinka","Shimbiraha"],"a":0},{"q":"Jannada maxaa la yiraahdaa?","o":["Jannah","Jahannam","Barzakh","Qadr"],"a":0},{"q":"Allah wuu cafiyaa kuwa…","o":["si daacad ah toobad keena","faanaya","aan weligood tukan","qarsada"],"a":0}]},{"id":"N3","title":"Sida dua loo sameeyo","teach":"Dua macnaheedu waa Allah weydiisasho. Nabigu ﷺ wuxuu yiri: ‘Dua waa cibaado’ (Abu Dawud, At-Tirmidhi). Anshaxa duada: ku bilow ammaanta Allah iyo salaanta Nabiga ﷺ, daacad ahow, hubso in Allah ku maqlayo, mar kasta soo noqnoqo, waligaana ha weydiisan wax dembi ah. Waqtiyada duadu si gaar ah rajo u leedahay waxaa ka mid ah saddexdii dambe ee habeenka, sujuudka salaadda, iyo adhaanka iyo iqaamada dhexdooda. Allah wuxuu kuu siin karaa wixii aad weydiisatay, wuxuu kaa celin karaa dhibaato, ama wuxuu kuu keydin karaa abaalka Aakhiro.","qs":[{"q":"Nabigu ﷺ wuxuu yiri dua waa…","o":["cibaado","kuwa buka oo keliya","Jimcaha oo keliya","caado"],"a":0},{"q":"Habka wanaagsan ee loo bilaabo dua waa…","o":["ammaanta Allah","cabasho","qaylo","weydiisashada waxyeelo"],"a":0},{"q":"Waqtigee duadu si gaar ah rajo u leedahay?","o":["Saddexdii dambe ee habeenka","Habeenka marna","Duhurka oo keliya","Ramadan oo keliya"],"a":0},{"q":"Haddii aadan arkin duadaada oo si degdeg ah loo jawaabay, waa inaad…","o":["sii weydiisato oo Allah talo saartaa","joojiso weydiinta","naftaada oo keliya eedeyso","qof kale weydiisato Allah beddelkiis"],"a":0}],"w":6},{"id":"N4","title":"Seddex qaybood oo Tawhid ah","teach":"Culimadu inta badan waxay Tawhid u sharxaan seddex qaybood. Tawhid ar-Rububiyyah: Allah keliya ayaa ah Rabbiga, Abuuraha iyo Raasaqa. Tawhid al-Uluhiyyah: Allah keliya ayaa istaahila cibaado. Tawhid al-Asma was-Sifat: rumaynta magacyada iyo sifooyinka Allah sida Quranka iyo Sunnada ay u sifeeyeen, isagoo aan lala simin makhluuqiisa. Kani waa hal habka caadiga ah ee loo habeeyo mawduucan.","qs":[{"q":"Imisa qaybood ayay culimadu inta badan u qaybiyaan Tawhid?","o":["3","2","5","7"],"a":0},{"q":"Tawhid ar-Rububiyyah macnaheedu waa in Allah keliya yahay…","o":["Rabbiga iyo Abuuraha","nabiga kaliya","malaa’igta kaliya","magaalada kaliya"],"a":0},{"q":"Tawhid al-Uluhiyyah macnaheedu waa in Allah keliya istaahilo…","o":["cibaado","cashuur","ciidamo","guri"],"a":0},{"q":"Tawhid al-Asma was-Sifat waa rumayn…","o":["magacyada iyo sifooyinka Allah","magacyada magaalooyinka","magacyada malaa’igta oo keliya","magacyada bilaha"],"a":0}],"w":7},{"id":"N5","title":"Shirk iyo waxa waxyeeleeya iimaanka","teach":"Shirk waa Allah shuraako u yeelid. Waa dembiga ugu weyn haddii qof ku dhinto (Quran 4:48). Waxaa ku jira caabudidda ama baryidda cid kale Allah ka sokow. Waxaa kale oo jira shirk yar, sida isla-bandhigga cibaadada, oo la yiraahdo riya. Nabigu ﷺ wuxuu ka baqay taas ummadiisa. Albaabka toobadda waa furan yahay: Allah wuxuu cafiyaa kuwa si daacad ah ugu soo laabta geerida ka hor.","qs":[{"q":"Shirk macnaheedu waa maxay?","o":["Allah shuraako u yeelid","Soon seegid","Daahid","Cunid badan"],"a":0},{"q":"Isla-bandhigga cibaadada waxaa la yiraahdaa…","o":["riya","zakat","sujuud","hijra"],"a":0},{"q":"Albaabka toobaddu miyuu furan yahay?","o":["Haa, ilaa geerida","Maya, weligiis","Jimcaha oo keliya","Culimada oo keliya"],"a":0},{"q":"Yaan baryaa oo talo saarannaa?","o":["Allah keliya","Awliyada","Qorraxda","Awowayaasheen"],"a":0}],"w":7},{"id":"N6","title":"Sida xadiisyada loo darajeeyo","teach":"Xadiis waa warbixin ku saabsan hadalka, falka ama oggolaanshaha Nabiga ﷺ. Wuxuu leeyahay laba qaybood: isnad (silsiladda gudbiyayaasha) iyo matn (qoraalka). Culimadu waxay hubiyeen gudbiye kasta waxayna xadiisyada u darajeeyeen sahih (run ah), hasan (wanaagsan), da’if (daciif) ama mawdu’ (been abuur). Sahih al-Bukhari iyo Sahih Muslim waa kutubta ugu la aamini karo. Iyaga iyo Abu Dawud, At-Tirmidhi, An-Nasa’i iyo Ibn Majah, waxay yihiin lixda ururin ee ugu waaweyn.","qs":[{"q":"Isnadka xadiiska waa…","o":["silsiladda gudbiyayaasha","qoraalka","cinwaanka","jaldiga kitaabka"],"a":0},{"q":"Matnka xadiiska waa…","o":["qoraalka","silsiladda","darajada","turjubaanka"],"a":0},{"q":"Mawdu’ macnaheedu waa maxay?","o":["Been abuur","Run ah","Wanaagsan","Caan ah"],"a":0},{"q":"Imisa ururin oo ugu waaweyn xadiis ayaa jira?","o":["6","3","10","99"],"a":0}],"w":7},{"id":"N7","title":"Ilaha sharciga Islaamka","teach":"Sharciga Islaamka (shariah) waxaa laga qaadaa ilo si isku xigta. 1. Quranka. 2. Sunnada, barashada iyo tusaalaha Nabiga ﷺ. 3. Ijma, isku raacidda culimada xukun. 4. Qiyas, miisaaminta iyadoo la barbar dhigayo xukun la yaqaan. Fiqh waa fahamka xukummadan ee culimada u qalma. Marka aynaan wax ogeyn, waxaan weydiinaa dadka aqoonta leh.","qs":[{"q":"Waa maxay isha ugu horreysa ee sharciga Islaamka?","o":["Quranka","Ijma","Qiyas","Caado"],"a":0},{"q":"Sunnada macnaheedu waa…","o":["Barashada iyo tusaalaha Nabiga ﷺ","Magaalo","Nooc ah sajaadad","Bisha soonka"],"a":0},{"q":"Ijma waa…","o":["isku raacidda culimada","ciid","sadaqo","salaad"],"a":0},{"q":"Maxaan sameynaa marka aynaan ogeyn xukun?","o":["Weydiinaa dadka aqoonta leh","Qiyaasnaa","Iska indhatirnaa","Qof kasta oo online ah weydiinaa"],"a":0}],"w":8},{"id":"N8","title":"Afartii Khaliifo ee Toosnaa","teach":"Nabiga ﷺ kadib, Muslimiinta waxaa hoggaamiyay afar khaliifo oo toosnaa (Al-Khulafa ar-Rashidun): Abu Bakr as-Siddiq, Umar ibn al-Khattab, Uthman ibn Affan iyo Ali ibn Abi Talib, Allah ha ka raalli ahaado. Abu Bakr wuxuu soo uruuriyay Quranka, Umar waxaa lagu yiqiin caddaalad, Uthman wuxuu nuqulay qoraalka caadiga ah, Ali na wuxuu ahaa ina adeerka Nabiga ﷺ iyo curadkiisa. Kani waa aragtida Sunniga ee isku xigga iyo darajadooda.","qs":[{"q":"Imisa khaliifo oo toosan ayaa jiray?","o":["4","2","3","7"],"a":0},{"q":"Yaa ahaa khaliifkii ugu horreeyay?","o":["Abu Bakr","Umar","Uthman","Ali"],"a":0},{"q":"Yaa sameeyay nuskhado ah qoraalka caadiga ah ee Quranka?","o":["Uthman","Umar","Bilal","Hamza"],"a":0},{"q":"Ali wuxuu ahaa Nabiga ﷺ…","o":["ina adeerkiis iyo curadkiisa","walaalkiis","adeerkiis","macallinkiisa"],"a":0}],"w":8},{"id":"N9","title":"Afarta madhhab ee fiqhiga","teach":"Muslimiinta Sunniga ah waxay raacaan mid ka mid ah afarta madhhab ee fiqhiga ee caadiga ah: Hanafi (Abu Hanifa), Maliki (Malik ibn Anas), Shafi’i (Imam ash-Shafi’i) iyo Hanbali (Ahmad ibn Hanbal). Way isku raacsan yihiin caqiidada iyo tiirarka Islaamka, waxayna ku kala duwan yihiin faahfaahin qaar, tusaale ahaan sida qaar ka mid ah cibaadada loo sameeyo. Khilaafka culimada ee arrimaha furuuca ah waa caadi mana aha sabab muran. Muslimiin badan oo Bariga Afrika ah waxay raacaan madhhabka Shafi’i.","qs":[{"q":"Imisa madhhab oo fiqhi oo Sunni ah oo caadi ah ayaa jira?","o":["4","2","6","10"],"a":0},{"q":"Madhhabkee ayaa loogu magac daray Imam ash-Shafi’i?","o":["Shafi’i","Hanafi","Maliki","Hanbali"],"a":0},{"q":"Madhhabyadu way isku raacsan yihiin…","o":["caqiidada iyo tiirarka Islaamka","faahfaahin yar kasta","waxba","taariikhda Eid oo keliya"],"a":0},{"q":"Sidee ula dhaqmaa khilaafka arrimaha furuuca ah?","o":["Ixtiraam, muran la'aan","Dagaal","Ku jees-jeesid dadka kale","Islaamka iska daynta"],"a":0}],"w":8}]},"sw":{"ui":{"n_duas":"Dua","n_learn":"Jifunze","n_hadith":"Hadithi","n_names":"Majina","n_more":"Zaidi","streak_days":"Siku {n} mfululizo","d_title":"Dua","d_sub":"Dua kwa kila hisia na kila wakati","d_ph":"Unajisikiaje?","d_none":"Hakuna dua inayolingana. Jaribu hisia, kama hofu au huzuni.","d_adhkar":"Adhkar za kila siku","d_morning":"Asubuhi","d_evening":"Jioni","d_sleep":"Kabla ya kulala","d_done":"imekamilika","d_cats":"Tafuta kwa hisia","d_note":"Linganisha maandishi ya Kiarabu na msahafu uliochapishwa au chanzo cha kuaminika.","d_count":"dua","l_title":"Jifunze Uislamu","l_sub":"Safari ya wiki 8 kutoka mwanzo hadi juu.","l_week":"Wiki","l_xp":"XP","l_done":"masomo yamekamilika","l_start":"Anza","l_review":"Rudia","l_locked":"Maliza somo lililotangulia ili kufungua hili.","l_quiz":"Anza jaribio","l_check":"Hakiki","l_continue":"Endelea","l_correct":"Sahihi!","l_wrong":"Si sahihi. Jibu ni:","l_complete":"Somo limekamilika","l_earned":"XP ulizopata","l_back":"Rudi kwenye masomo","l_q":"Swali","l_of":"kati ya","l_beg":"Mwanzo","l_int":"Kati","l_adv":"Juu","l_read":"Soma kwenye quran.com","l_next":"Somo linalofuata","l_perfect":"Alama kamili!","l_review_note":"Kurudia hakuongezi XP.","l_lesson":"Somo","h_title":"Hadithi","h_sub":"Maneno sahihi ya Mtume ﷺ","h_ph":"Tafuta hadithi","h_all":"Zote","h_none":"Hakuna hadithi iliyopatikana.","h_books":"Soma mikusanyo kamili","h_books_s":"Hufungua sunnah.com kwa Kiarabu na Kiingereza.","h_note":"Linganisha maneno na kitabu kamili kabla ya kunukuu.","tp_faith":"Imani","tp_character":"Tabia","tp_knowledge":"Elimu","tp_dhikr":"Dhikri na dua","tp_community":"Jamii","nm_title":"Majina 99 ya Allah","nm_sub":"Jifunze majina mazuri na maana zake.","nm_ph":"Tafuta majina","nm_learned":"yamejifunzwa","nm_none":"Hakuna jina lililopatikana.","nm_ref":"‘Na Mwenyezi Mungu ana majina mazuri kabisa, basi muombeni kwa majina hayo.’ (Quran 7:180)","nm_note":"Wanazuoni huorodhesha majina kwa tofauti ndogo. Hii ni orodha maarufu.","m_title":"Zaidi","m_calm":"Utulivu","m_calm_s":"Kupumua, kipima muda na sauti","m_dhikr":"Tasbihi na dhikri ya moja kwa moja","m_dhikr_s":"Kihesabu, Istighfar na Swalawat","m_journal":"Shajara","m_journal_s":"Andika unavyojisikia","m_juz":"Quran kwa juzuu","m_juz_s":"Fuatilia khatma yako","m_support":"Msaidie mwandishi","m_support_s":"Si lazima, kuanzia $1","m_lang":"Lugha","m_back":"Zaidi","m_free":"Bure kwa wote","dn_title":"Msaidie mwandishi","dn_text":"Hamudi Teach ni bure kwa wote na itabaki hivyo siku zote. Ukipenda kunisaidia mimi na familia yangu, unaweza kutuma mchango mdogo wa takriban $1 (karibu KES 130) kwa M-Pesa. Kama huwezi, tafadhali tuombee dua. Hilo lina thamani kubwa kwetu.","dn_send":"Tuma kwa M-Pesa kwa","dn_copy":"Nakili namba","dn_copied":"Namba imenakiliwa","dn_note":"Kutoa ni hiari. Hakuna kitu katika programu kinachotegemea hilo."},"dua_cat":{"anx":"Wasiwasi na mahangaiko","dis":"Dhiki na moyo mzito","fgv":"Msamaha","gui":"Uongofu na imani","prv":"Riziki na kipato halali","eas":"Wepesi na elimu","grf":"Huzuni na msiba","fea":"Hofu na kinga","hlt":"Afya na ugonjwa","slp":"Kuamka na kulala","fod":"Chakula na kinywaji","hom":"Nyumbani na safarini","fam":"Familia na wazazi","grt":"Shukrani na sifa","suc":"Mafanikio duniani na akhera","pat":"Subira na kutegemea","umm":"Mtume ﷺ na Waislamu","dly":"Maisha ya kila siku"},"dua":{"anx1":"Ee Allah, najilinda kwako kutokana na wasiwasi na huzuni, unyonge na uvivu, ubahili na woga, mzigo wa deni na kushindwa nguvu na watu.","anx2":"Allah ananitosha. Hakuna mungu ila Yeye. Nimemtegemea Yeye, naye ndiye Mola wa Arshi tukufu.","anx3":"Ee Allah, nataraji rehema Yako. Usiniache nafsi yangu hata kwa kupepesa jicho, na nitengenezee mambo yangu yote. Hakuna mungu ila Wewe.","anx4":"Hakuna mungu ila Allah, Mwenye nguvu, Mpole. Hakuna mungu ila Allah, Mola wa Arshi tukufu. Hakuna mungu ila Allah, Mola wa mbingu, Mola wa ardhi na Mola wa Arshi ya heshima.","dis1":"Hakuna mungu ila Wewe, umetakasika. Hakika mimi nimekuwa miongoni mwa walioonea nafsi zao.","dis2":"Ewe Uliye hai, Ewe Msimamizi wa kila kitu, naomba msaada kwa rehema Yako.","dis3":"Allah anatutosha, naye ndiye Mlinzi bora.","fgv1":"Mola wangu, nisamehe na ukubali toba yangu. Wewe ndiye Mwenye kukubali toba, Mwenye kurehemu.","fgv2":"Ee Allah, Wewe ni Mola wangu. Hakuna mungu ila Wewe. Umeniumba nami ni mja Wako, nashikilia agano Lako na ahadi Yako kadri niwezavyo. Najilinda kwako kutokana na ubaya nilioufanya. Nakiri neema Yako juu yangu na nakiri dhambi yangu, basi nisamehe, kwani hakuna anayesamehe dhambi ila Wewe.","fgv3":"Mola wetu, tumejidhulumu wenyewe. Usipotusamehe na kuturehemu, hakika tutakuwa miongoni mwa waliopata hasara.","fgv4":"Ee Allah, Wewe ni Mwingi wa kusamehe na unapenda kusamehe, basi nisamehe.","fgv5":"Namwomba Allah msamaha na narejea kwake kwa toba.","gui1":"Tuongoze njia iliyonyooka.","gui2":"Mola wetu, usipotoshe nyoyo zetu baada ya kutuongoza, na utupe rehema itokayo kwako. Hakika Wewe ndiye Mpaji.","gui3":"Ewe Mgeuzaji wa nyoyo, thibitisha moyo wangu juu ya dini Yako.","gui4":"Ee Allah, nakuomba uongofu, uchamungu, kujiheshimu na kujitosheleza.","prv1":"Ee Allah, nitoshe kwa halali Yako nijiepushe na haramu Yako, na unitajirishe kwa fadhila Zako nisimhitaji mwingine ila Wewe.","prv2":"Ee Allah, nakuomba elimu yenye manufaa, riziki njema na matendo yanayokubaliwa.","prv3":"Mola wangu, hakika mimi ni mhitaji wa kheri yoyote utakayoniteremshia.","eas1":"Mola wangu, nipanulie kifua changu na unifanyie jambo langu liwe jepesi.","eas2":"Mola wangu, nizidishie elimu.","eas3":"Ee Allah, hakuna jepesi ila ulilolifanya jepesi, nawe unaweza kulifanya gumu liwe jepesi ukitaka.","grf1":"Sisi ni wa Allah na kwake tutarejea. Ee Allah, nilipe thawabu katika msiba wangu na unibadilishie kilicho bora kuliko hicho.","grf2":"Ee Allah, msamehe, mrehemu, mpe afya njema na umsamehe makosa yake.","fea1":"Kwa jina la Allah, ambaye kwa jina Lake hakuna kinachoweza kudhuru duniani wala mbinguni. Yeye ndiye Msikivu, Mjuzi.","fea2":"Najilinda kwa maneno kamili ya Allah kutokana na shari ya alichokiumba.","fea3":"Ee Allah, tunakuweka Wewe mbele yao na tunajilinda kwako kutokana na shari yao.","hlt1":"Ee Allah, Mola wa watu, ondoa madhara na uponyeshe. Wewe ndiye Mponyaji. Hakuna uponyaji ila uponyaji Wako, uponyaji usioacha ugonjwa.","hlt2":"Weka mkono wako mahali penye maumivu, sema Bismillah mara tatu, kisha sema: Najilinda kwa utukufu wa Allah na uwezo Wake kutokana na shari ya ninachokihisi na ninachokihofia.","hlt3":"Unapomtembelea mgonjwa, sema mara saba: Namwomba Allah Mkuu, Mola wa Arshi tukufu, akuponye.","hlt4":"Ee Allah, nipe afya njema mwilini mwangu. Ee Allah, nipe afya njema masikioni mwangu. Ee Allah, nipe afya njema machoni mwangu. Hakuna mungu ila Wewe.","slp1":"Sifa njema ni za Allah aliyetufufua baada ya kutufisha, na kwake ndiko kufufuka.","slp2":"Kwa jina Lako, Ee Allah, nakufa na nakuwa hai.","slp3":"Ee Allah, nilinde na adhabu Yako siku utakapowafufua waja Wako.","fod1":"Kwa jina la Allah. Sema hivi kabla ya kula.","fod2":"Sifa njema ni za Allah aliyenilisha hiki na kunipa bila nguvu wala uwezo kutoka kwangu.","fod3":"Unapofungua saumu, sema: Kiu imeisha, mishipa imelowa, na thawabu zimethibitika, Mungu akipenda.","hom1":"Kwa jina la Allah, nimemtegemea Allah, na hakuna nguvu wala uwezo ila kwa Allah. Sema hivi unapotoka nyumbani.","hom2":"Sema unapoingia nyumbani: Kwa jina la Allah tunaingia, kwa jina la Allah tunatoka, na kwa Mola wetu tunamtegemea.","hom3":"Utukufu ni wa Yule aliyetutiishia hiki, nasi hatukuweza kukitiisha wenyewe. Na kwa Mola wetu tutarejea. Sema hivi unaposafiri.","fam1":"Mola wetu, tupe katika wake zetu na watoto wetu kiburudisho cha macho, na utufanye viongozi wa wachamungu.","fam2":"Mola wangu, niwezeshe nishukuru neema Yako uliyonineemesha mimi na wazazi wangu, na nitende mema yanayokuridhisha, na unitengenezee watoto wangu. Hakika nimetubu kwako na mimi ni miongoni mwa wanaojisalimisha.","fam3":"Mola wangu, wahurumie wote wawili kama walivyonilea nilipokuwa mdogo.","fam4":"Mola wetu, nisamehe mimi, wazazi wangu na waumini siku hesabu itakaposimama.","grt1":"Sifa njema ni za Allah, sifa nyingi, nzuri na zenye baraka.","grt2":"Ee Allah, neema yoyote niliyo nayo mimi au kiumbe chochote Chako asubuhi hii inatoka kwako peke Yako, huna mshirika. Basi sifa na shukrani ni Zako.","grt3":"Ee Allah, nisaidie kukukumbuka, kukushukuru na kukuabudu vizuri.","suc1":"Mola wetu, tupe mema duniani na mema akhera, na utulinde na adhabu ya Moto.","suc2":"Ee Allah, nakuomba Pepo na najilinda kwako kutokana na Moto.","suc3":"Ee Allah, nitengenezee dini yangu, ambayo ni kinga ya mambo yangu. Nitengenezee dunia yangu, ambamo mna maisha yangu. Nitengenezee akhera yangu, ambako ni marejeo yangu. Ufanye uhai uwe nyongeza kwangu katika kila kheri, na kifo kiwe pumziko kwangu kutokana na kila shari.","pat1":"Mola wetu, tumiminie subira, uimarishe miguu yetu na utusaidie.","pat2":"Mola wangu, nimeshindwa, basi nisaidie.","pat3":"Nakabidhi jambo langu kwa Allah. Hakika Allah anawaona waja Wake.","umm1":"Ee Allah, mrehemu Muhammad na ahli wa Muhammad, kama ulivyomrehemu Ibrahim na ahli wa Ibrahim. Hakika Wewe ni Mwenye kusifiwa, Mtukufu. Ee Allah, mbariki Muhammad na ahli wa Muhammad, kama ulivyombariki Ibrahim na ahli wa Ibrahim. Hakika Wewe ni Mwenye kusifiwa, Mtukufu.","umm2":"Mola wetu, tusamehe sisi na ndugu zetu waliotutangulia katika imani, wala usijaalie chuki mioyoni mwetu juu ya walioamini. Mola wetu, hakika Wewe ni Mpole, Mwenye kurehemu.","dly1":"Sema kabla ya kuingia chooni: Ee Allah, najilinda kwako kutokana na shari na watenda shari.","dly2":"Sema unapovaa nguo mpya: Sifa njema ni za Allah aliyenivisha hii na kunipa bila nguvu wala uwezo kutoka kwangu.","dly3":"Sema mvua inaponyesha: Ee Allah, ifanye iwe mvua yenye manufaa.","dly4":"Sema unapojitazama kwenye kioo: Ee Allah, uliufanya mwili wangu kuwa mzuri, basi ufanye tabia yangu iwe nzuri.","dly5":"Sema Alhamdulillah unapopiga chafya. Wengine hujibu: Yarhamukallah (Allah akurehemu). Wewe unajibu: Yahdikumullahu wa yuslihu balakum (Allah awaongoze na awatengenezee mambo yenu)."},"adhkar":{"am1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Kinga kutwa nzima."},"am2":{"h":"Al-Ikhlas, Al-Falaq na An-Nas","en":"Soma kila moja ya sura hizi tatu fupi mara tatu."},"am3":{"h":"Sifa za asubuhi","en":"Tumefikia asubuhi na ufalme wote ni wa Allah. Sifa ni za Allah. Hakuna anayestahili kuabudiwa ila Allah peke Yake, hana mshirika. Ufalme ni Wake na sifa ni Zake, naye ni muweza wa kila kitu. (Sahih Muslim)"},"am4":{"h":"Kwa Wewe tunaianza siku","en":"Ee Allah, kwa Wewe tumefikia asubuhi na kwa Wewe tumefikia jioni. Kwa Wewe tunaishi na kufa, na kwako ndiko kufufuka. (At-Tirmidhi)"},"am5":{"h":"Kuridhika na Allah","en":"Nimeridhika na Allah kuwa Mola wangu, Uislamu kuwa dini yangu na Muhammad kuwa Mtume wangu. (Abu Dawud)"},"am6":{"h":"SubhanAllah wa bihamdih","en":"Utukufu na sifa ni za Allah. (Sahih Muslim)"},"am7":{"h":"Kuomba msamaha","en":"Namwomba Allah msamaha na narejea kwake kwa toba."},"pm1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Kinga usiku mzima."},"pm2":{"h":"Al-Ikhlas, Al-Falaq na An-Nas","en":"Soma kila moja ya sura hizi tatu fupi mara tatu."},"pm3":{"h":"Sifa za jioni","en":"Tumefikia jioni na ufalme wote ni wa Allah. Sifa ni za Allah. Hakuna anayestahili kuabudiwa ila Allah peke Yake, hana mshirika. Ufalme ni Wake na sifa ni Zake, naye ni muweza wa kila kitu. (Sahih Muslim)"},"pm4":{"h":"Kwa Wewe tunaanza usiku","en":"Ee Allah, kwa Wewe tumefikia jioni na kwa Wewe tumefikia asubuhi. Kwa Wewe tunaishi na kufa, na kwako ndiko marejeo ya mwisho. (At-Tirmidhi)"},"pm5":{"h":"Kujilinda","en":"Najilinda kwa maneno kamili ya Allah kutokana na shari ya alichokiumba. (Sahih Muslim)"},"pm6":{"h":"Kuridhika na Allah","en":"Nimeridhika na Allah kuwa Mola wangu, Uislamu kuwa dini yangu na Muhammad kuwa Mtume wangu. (Abu Dawud)"},"pm7":{"h":"SubhanAllah wa bihamdih","en":"Utukufu na sifa ni za Allah. (Sahih Muslim)"},"sl1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Anayeisoma wakati wa kulala atakuwa na mlinzi kutoka kwa Allah usiku mzima. (Sahih al-Bukhari)"},"sl2":{"h":"Aya mbili za mwisho za Al-Baqarah","en":"Quran 2:285-286. Aya hizi mbili zinamtosha mwenye kuzisoma usiku. (Sahih al-Bukhari, Sahih Muslim)"},"sl3":{"h":"Al-Ikhlas, Al-Falaq na An-Nas","en":"Kusanya viganja vyako, vipulizie, soma sura hizi tatu, kisha pitisha mikono yako mwilini, ukianzia kichwani na usoni. Fanya hivi mara tatu. (Sahih al-Bukhari)"},"sl4":{"h":"Surat Al-Mulk","en":"Mtume ﷺ hakulala mpaka asome Al-Mulk na As-Sajdah. (At-Tirmidhi)"},"sl5":{"h":"Surat As-Sajdah","en":"Sura ya 32, husomwa kabla ya kulala pamoja na Al-Mulk."},"sl6":{"h":"Tasbihi kabla ya kulala","en":"SubhanAllah mara 33, Alhamdulillah mara 33, Allahu Akbar mara 34. (Sahih al-Bukhari)"},"sl7":{"h":"Kwa jina Lako nakufa na nakuwa hai","en":"Kwa jina Lako, Ee Allah, nakufa na nakuwa hai. (Sahih al-Bukhari)"},"sl8":{"h":"Kinga siku ya Hukumu","en":"Ee Allah, nilinde na adhabu Yako siku utakapowafufua waja Wako. (Abu Dawud)"}},"hadith":{"h1":"Hakika matendo hufuata nia, na kila mtu atapata kile alichokinuia tu.","h2":"Uislamu umejengwa juu ya mambo matano: kushuhudia kwamba hakuna mungu ila Allah na kwamba Muhammad ni Mtume wa Allah, kusimamisha swala, kutoa zaka, kuhiji Nyumba tukufu, na kufunga Ramadhani.","h3":"Dini ni nasaha. Tukauliza: Kwa ajili ya nani? Akasema: Kwa ajili ya Allah, Kitabu Chake, Mtume Wake, viongozi wa Waislamu na watu wao wa kawaida.","h4":"Miongoni mwa uzuri wa Uislamu wa mtu ni kuacha lisilomhusu.","h5":"Hakuna mmoja wenu anayeamini kikamilifu mpaka ampendelee ndugu yake kile anachojipendelea mwenyewe.","h6":"Anayemwamini Allah na Siku ya Mwisho, aseme mema au anyamaze.","h7":"Mtu mmoja alimwambia Mtume ﷺ: Nipe nasaha. Akasema: Usikasirike. Yule mtu alirudia mara kadhaa, na kila mara alisema: Usikasirike.","h8":"Mche Allah popote ulipo, fuatisha uovu kwa wema nao utaufuta, na wafanyie watu tabia njema.","h9":"Mkumbuke Allah naye atakulinda. Mkumbuke Allah utamkuta mbele yako. Ukiomba, mwombe Allah; ukitaka msaada, omba msaada kwa Allah.","h10":"Kuwa duniani kama mgeni au msafiri.","h11":"Hakuna kudhuru wala kulipiza dhara.","h12":"Bora wenu ni yule anayejifunza Quran na kuifundisha.","h13":"Kuna maneno mawili mepesi ulimini, mazito mizani, na yanapendwa na Mwingi wa rehema: SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.","h14":"Dua ni ibada.","h15":"Miongoni mwa bora wenu ni wale wenye tabia njema zaidi.","h16":"Muumini mwenye nguvu ni bora na anapendwa zaidi na Allah kuliko muumini dhaifu, ingawa kuna kheri kwa wote wawili.","h17":"Tabasamu lako usoni mwa ndugu yako ni sadaka.","h18":"Rahisisheni wala msitie ugumu; toeni habari njema wala msiwafukuze watu.","h19":"Asiyewashukuru watu hamshukuru Allah.","h20":"Utawaona waumini katika huruma, mapenzi na upendo wao kwa wao kama mwili mmoja: kiungo kimoja kikiumwa, mwili mzima hujibu kwa kukosa usingizi na homa.","h21":"Wahurumieni walioko duniani, naye Aliye mbinguni (Allah) atawahurumia.","h22":"Muislamu ni yule ambaye Waislamu wako salama kutokana na ulimi wake na mkono wake.","h23":"Anayepita njia kutafuta elimu, Allah humrahisishia njia ya kwenda Peponi.","h24":"Kutafuta elimu ni wajibu kwa kila Muislamu.","h25":"Anayemwamini Allah na Siku ya Mwisho, asimdhuru jirani yake.","h26":"Utajiri si wingi wa mali; utajiri wa kweli ni utajiri wa nafsi.","h27":"Ni ajabu ilioje hali ya muumini: yote ni kheri kwake, na hilo si kwa yeyote ila muumini. Likimpata jema, hushukuru, na hilo ni kheri kwake; likimpata baya, husubiri, na hilo ni kheri kwake.","h28":"Allah haangalii sura zenu wala mali yenu, bali anaangalia nyoyo zenu na matendo yenu.","h29":"Matendo yanayopendwa zaidi na Allah ni yale yanayodumu, hata kama ni machache.","h30":"Anayesema SubhanAllahi wa bihamdihi mara mia kwa siku, dhambi zake husamehewa hata kama ni nyingi kama povu la bahari."},"names":{"n1":"Mwingi wa Neema","n2":"Mwingi wa Rehema","n3":"Mfalme","n4":"Mtakatifu Kabisa","n5":"Chanzo cha Amani","n6":"Mtoaji wa Usalama","n7":"Mlinzi","n8":"Mwenye Nguvu Zote","n9":"Mwenye Kulazimisha","n10":"Mkuu Kabisa","n11":"Muumbaji","n12":"Mwanzilishi wa Viumbe","n13":"Mtoaji wa Maumbo","n14":"Mwingi wa Kusamehe","n15":"Mshindi","n16":"Mtoaji wa Zawadi","n17":"Mruzuku","n18":"Mfunguzi","n19":"Mjuzi wa Yote","n20":"Mwenye Kuzuia","n21":"Mwenye Kukunjua","n22":"Mwenye Kushusha","n23":"Mwenye Kukweza","n24":"Mwenye Kuheshimisha","n25":"Mwenye Kudhalilisha","n26":"Msikivu wa Yote","n27":"Mwenye Kuona Yote","n28":"Hakimu","n29":"Mwadilifu Kabisa","n30":"Mpole Mwenye Kufikia Siri","n31":"Mwenye Kujua Kila Undani","n32":"Mvumilivu","n33":"Mwenye Utukufu Mkuu","n34":"Mwenye Kusamehe","n35":"Mwenye Kushukuru Sana","n36":"Aliye Juu Kabisa","n37":"Mkuu Kabisa","n38":"Mhifadhi","n39":"Mruzuku wa Mahitaji","n40":"Mhesabu","n41":"Mwenye Ukuu","n42":"Mkarimu Kabisa","n43":"Mchunguzi","n44":"Mwenye Kuitikia","n45":"Mwenye Kuenea Kila Mahali","n46":"Mwenye Hekima Yote","n47":"Mwenye Mapenzi Mengi","n48":"Mtukufu","n49":"Mfufuaji","n50":"Shahidi","n51":"Haki","n52":"Mwakilishi","n53":"Mwenye Nguvu Kamili","n54":"Imara","n55":"Rafiki Mlinzi","n56":"Mwenye Kusifiwa","n57":"Mhesabuji","n58":"Mwanzilishi","n59":"Mrejeshaji","n60":"Mtoaji wa Uhai","n61":"Mchukuaji wa Uhai","n62":"Aliye Hai Daima","n63":"Msimamizi wa Kila Kitu","n64":"Mpataji","n65":"Mtukufu wa Heshima","n66":"Mmoja","n67":"Pekee","n68":"Anayetegemewa na Wote","n69":"Mwenye Uwezo","n70":"Mwenye Nguvu","n71":"Mwenye Kutangulisha","n72":"Mwenye Kuchelewesha","n73":"wa Kwanza","n74":"wa Mwisho","n75":"Aliye Dhahiri","n76":"Aliye Fichika","n77":"Mtawala","n78":"Aliye Juu Zaidi","n79":"Chanzo cha Wema","n80":"Mwenye Kukubali Toba","n81":"Mwenye Kulipiza","n82":"Mwenye Kuachilia","n83":"Mwenye Huruma Kabisa","n84":"Mmiliki wa Ufalme Wote","n85":"Mwenye Utukufu na Ukarimu","n86":"Mwenye Insafu","n87":"Mkusanyaji","n88":"Asiyehitaji Chochote","n89":"Mtajirishaji","n90":"Mwenye Kuzuia Madhara","n91":"Mwenye Kuleta Dhiki","n92":"Mfadhili","n93":"Nuru","n94":"Mwongozaji","n95":"Muumba Asiye na Mfano","n96":"Adumuye Milele","n97":"Mrithi","n98":"Mwongozaji wa Njia Sahihi","n99":"Mvumilivu Kupita Wote"},"course":[{"id":"L1","w":1,"title":"Allah ni nani?","teach":"Waislamu wanaamini Mungu mmoja, Allah. Yeye aliumba kila kitu, hana mshirika wala watoto, na hakuna kitu kama Yeye. Imani hii inaitwa Tawhidi. Neno Uislamu linamaanisha kujisalimisha kwa amani kwa Allah, na Muislamu ni mtu anayejisalimisha kwake. Allah ni Ar-Rahman, Mwingi wa Rehema, na Al-Khaliq, Muumbaji.","qs":[{"q":"Tawhidi inamaanisha nini?","o":["Imani kwamba Allah ni Mmoja","Kufunga Ramadhani","Kuswali mara tano","Kutoa sadaka"],"a":0},{"q":"Jina Ar-Rahman lina maana gani?","o":["Mwingi wa Rehema","Muumbaji","Mwenye Kusamehe","Aliye Juu Kabisa"],"a":0},{"q":"Muislamu ni mtu ambaye…","o":["anajisalimisha kwa Allah","anaishi Makka","anaongea Kiarabu","amezaliwa katika familia ya Kiislamu"],"a":0},{"q":"Kweli au uongo: Allah ana washirika.","o":["Kweli","Uongo"],"a":1}]},{"id":"N1","title":"Majina Mazuri ya Allah","teach":"Allah ana majina mazuri 99 (Al-Asma’ul-Husna), yaliyomo katika Quran na Sunna. Mtume ﷺ alisema kwamba Allah ana majina tisini na tisa, na anayeyajua na kuyafanyia kazi ataingia Peponi (Sahih al-Bukhari, Sahih Muslim). Mifano ni Ar-Rahman (Mwingi wa Neema), Al-Malik (Mfalme) na Al-Ghaffar (Mwingi wa Kusamehe). Tunamwomba Allah kwa majina Yake tunapofanya dua: ‘Na Mwenyezi Mungu ana majina mazuri kabisa, basi muombeni kwa majina hayo’ (Quran 7:180). Yaone yote 99 katika kichupo cha Majina.","qs":[{"q":"Ni majina mangapi mazuri ya Allah yanayojulikana sana?","o":["99","33","40","114"],"a":0},{"q":"Al-Ghaffar lina maana gani?","o":["Mwingi wa Kusamehe","Mfalme","Muumbaji","Mruzuku"],"a":0},{"q":"Allah anatuambia tufanye nini na majina Yake mazuri?","o":["Tumwombe kwa majina hayo","Tuyafiche","Tuyasome mara moja tu","Tuyaandike ukutani"],"a":0},{"q":"Al-Malik lina maana gani?","o":["Mfalme","Mponyaji","Hakimu","Nuru"],"a":0}],"w":1},{"id":"L3","w":1,"title":"Nguzo sita za Imani","teach":"Imani ni kuamini. Muislamu anaamini mambo sita: Allah, Malaika Wake, Vitabu Vyake, Mitume Wake, Siku ya Mwisho, na Qadari, yaani elimu na hukumu ya Allah juu ya vitu vyote, vizuri na vibaya. Malaika waliumbwa kwa nuru, binadamu kwa udongo, na majini kwa moto usio na moshi.","qs":[{"q":"Nguzo za Imani ni ngapi?","o":["6","5","4","7"],"a":0},{"q":"Ni lipi kati ya haya SI nguzo ya Imani?","o":["Kufunga","Kuamini malaika","Kuamini Siku ya Mwisho","Kuamini vitabu vya Allah"],"a":0},{"q":"Malaika waliumbwa kutokana na…","o":["Nuru","Udongo","Moto usio na moshi","Maji"],"a":0},{"q":"Binadamu waliumbwa kutokana na…","o":["Udongo","Nuru","Moto usio na moshi","Jiwe"],"a":0}]},{"id":"L5","w":1,"title":"Nguzo tano za Uislamu","teach":"Uislamu umejengwa juu ya nguzo tano. 1. Shahada: kutamka imani. 2. Swala: kuswali mara tano kwa siku. 3. Zaka: kutoa sadaka kutoka katika mali yako. 4. Saumu: kufunga Ramadhani. 5. Hija: safari ya ibada ya Makka, mara moja katika maisha kwa mwenye uwezo.","qs":[{"q":"Nguzo za Uislamu ni ngapi?","o":["5","6","3","4"],"a":0},{"q":"Nguzo ipi ni kuswali mara tano kwa siku?","o":["Swala","Zaka","Hija","Saumu"],"a":0},{"q":"Waislamu hufunga katika mwezi upi?","o":["Ramadhani","Shawwal","Muharram","Rajab"],"a":0},{"q":"Hija ni wajibu…","o":["mara moja katika maisha kwa mwenye uwezo","kila mwaka","kila mwezi","kwa wanazuoni tu"],"a":0}]},{"id":"L7","w":2,"title":"Kutamka Shahada","teach":"Shahada ni tamko la imani linalomfanya mtu kuwa Muislamu: ‘Ash-hadu an la ilaha illallah, wa ash-hadu anna Muhammadan rasulullah.’ Maana yake: Nashuhudia kwamba hakuna mungu ila Allah, na nashuhudia kwamba Muhammad ni Mtume wa Allah. Inapaswa kutamkwa kwa kuelewa na kwa ikhlasi.","ar":"أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","qs":[{"q":"Shahada inamaanisha nini?","o":["Kushuhudia","Kufunga","Swala","Sadaka"],"a":0},{"q":"Sehemu ya kwanza inasema hakuna mungu ila…","o":["Allah","Mtume","Malaika","Al-Kaaba"],"a":0},{"q":"Sehemu ya pili inasema Muhammad ni…","o":["Mtume wa Allah","Mfalme","Malaika","Mungu"],"a":0},{"q":"Shahada inapaswa kutamkwa kwa…","o":["kuelewa na ikhlasi","sauti kubwa tu","kundi tu","Kiarabu tu"],"a":0}]},{"id":"L21","w":2,"title":"Mitume wa Allah","teach":"Allah alituma mitume kwa kila taifa wakiwa na ujumbe mmoja: muabudu Allah peke Yake. Quran inataja majina ya 25 kati yao, akiwemo Adam, Nuhu, Ibrahim, Musa, Isa na Muhammad ﷺ, mtume wa mwisho. Musa alipewa Tawrati, Daudi Zaburi, Isa Injili, na Muhammad ﷺ Quran.","qs":[{"q":"Nani ni mtume wa mwisho?","o":["Muhammad ﷺ","Isa","Musa","Ibrahim"],"a":0},{"q":"Ni kitabu gani alipewa Musa?","o":["Tawrati","Injili","Zaburi","Quran"],"a":0},{"q":"Quran iliteremshwa kwa…","o":["Muhammad ﷺ","Daudi","Isa","Nuhu"],"a":0},{"q":"Ujumbe wa kila mtume ulikuwa upi?","o":["Muabudu Allah peke Yake","Jengeni miji","Anzisheni biashara","Pateni madaraka"],"a":0}]},{"id":"L17","w":2,"title":"Mtume ﷺ: miaka ya mwanzo","teach":"Muhammad ﷺ alizaliwa Makka karibu mwaka 570 BK, katika Mwaka wa Tembo. Baba yake alifariki kabla hajazaliwa na mama yake alipokuwa na umri wa miaka sita hivi. Babu yake, kisha mjomba wake Abu Talib, walimlea. Alijulikana kama As-Sadiq Al-Amin, mkweli na mwaminifu. Alipokuwa na miaka 25 alimwoa Khadija, Allah amridhie.","qs":[{"q":"Mtume ﷺ alizaliwa wapi?","o":["Makka","Madina","Yerusalemu","Taif"],"a":0},{"q":"Alijulikana kama…","o":["mkweli na mwaminifu","tajiri zaidi","hodari zaidi","mshairi"],"a":0},{"q":"Alimwoa nani akiwa na miaka 25?","o":["Khadija","Aisha","Hafsa","Maryam"],"a":0},{"q":"Nani alimlea baada ya babu yake?","o":["Mjomba wake Abu Talib","Abu Lahab","Abu Bakr","Umar"],"a":0}]},{"id":"L19","w":3,"title":"Wahyi na Hijra","teach":"Akiwa na umri wa miaka 40, katika pango la Hira, malaika Jibril alileta wahyi wa kwanza: ‘Iqra’ (Soma!), mwanzo wa Surat Al-Alaq. Kwa miaka 13 Mtume ﷺ aliwalingania watu kwa Allah huko Makka na akakumbana na mateso. Mwaka 622 BK alihamia Madina. Hijra hii ndiyo mwanzo wa kalenda ya Kiislamu.","qs":[{"q":"Wahyi wa kwanza ulikuja wapi?","o":["Pango la Hira","Al-Kaaba","Madina","Mlima Sinai"],"a":0},{"q":"Neno la kwanza lililoteremshwa lilikuwa lipi?","o":["Iqra (Soma)","Bismillah","Qul (Sema)","Alhamdulillah"],"a":0},{"q":"Hijra ilikuwa kuhamia…","o":["Madina","Misri","Yemen","Baghdad"],"a":0},{"q":"Hijra ni mwanzo wa…","o":["kalenda ya Kiislamu","Ramadhani","Hija","Eid"],"a":0}]},{"id":"L23","w":3,"title":"Madina na ufunguzi wa Makka","teach":"Madina Mtume ﷺ alijenga msikiti wa kwanza, Masjid an-Nabawi, na akaunda jamii iliyojengwa juu ya udugu na uadilifu. Mwaka 630 BK Makka ilifunguliwa kwa Waislamu, na Mtume ﷺ akawasamehe watu waliompinga. Alifariki mwaka 632 BK akiwa na umri wa miaka 63 na amezikwa Madina.","qs":[{"q":"Mtume ﷺ alijenga nini kwanza Madina?","o":["Msikiti","Ngome","Soko","Shule"],"a":0},{"q":"Aliwatendeaje maadui wake wa zamani wa Makka?","o":["Aliwasamehe","Aliwaadhibu","Aliwapuuza","Aliwafukuza"],"a":0},{"q":"Mtume ﷺ amezikwa wapi?","o":["Madina","Makka","Taif","Yerusalemu"],"a":0},{"q":"Ni sura ipi inayozungumzia ushindi na watu kuingia katika Uislamu makundi makundi?","o":["An-Nasr","Al-Fil","Al-Asr","Quraysh"],"a":0}]},{"id":"N2","title":"Quran: wahyi na uhifadhi wake","teach":"Quran ni neno la Allah, lililoteremshwa kwa Mtume ﷺ kwa Kiarabu kwa muda wa miaka 23 hivi. Ina sura 114. Ilihifadhiwa vichwani na kuandikwa wakati wa uhai wa Mtume ﷺ. Baada yake, Abu Bakr aliikusanya katika kitabu kimoja, na Uthman alitengeneza nakala za andiko sanifu na kuzituma katika miji mikuu. Allah aliahidi kuilinda (Quran 15:9).","qs":[{"q":"Quran ina sura ngapi?","o":["114","99","30","60"],"a":0},{"q":"Quran iliteremshwa kwa muda wa takriban miaka mingapi?","o":["Miaka 23","Miaka 3","Miaka 40","Mwaka 1"],"a":0},{"q":"Nani aliikusanya Quran katika kitabu kimoja?","o":["Abu Bakr","Abu Lahab","Hamza","Bilal"],"a":0},{"q":"Nani alituma nakala za andiko sanifu katika miji mikuu?","o":["Uthman","Ali","Umar","Khalid"],"a":0}],"w":3},{"id":"L9","w":4,"title":"Udhu: kujiosha kwa ajili ya swala","teach":"Udhu ni kujiosha kunakohitajika kabla ya swala. Fanya nia moyoni na useme Bismillah. Kisha osha mikono mara 3, sukutua kinywa mara 3, vuta maji puani na uyatoe mara 3, osha uso mara 3, osha mikono hadi kwenye viwiko mara 3 (kulia, kisha kushoto), pangusa kichwa mara moja (pamoja na masikio), na osha miguu hadi kwenye vifundo mara 3 (kulia, kisha kushoto). Udhu hutenguka kwa kwenda chooni, kutoa upepo, usingizi mzito, au kupoteza fahamu.","qs":[{"q":"Unasema nini mwanzoni mwa udhu?","o":["Bismillah","Allahu Akbar","Alhamdulillah","SubhanAllah"],"a":0},{"q":"Kichwa hupanguswa mara ngapi?","o":["Mara moja","Mara tatu","Hakipanguswi kabisa","Mara saba"],"a":0},{"q":"Ni kipi kati ya hivi hutengua udhu?","o":["Usingizi mzito","Kula mkate","Kutembea","Kusoma"],"a":0},{"q":"Mikono huoshwa hadi…","o":["Viwiko","Vifundo vya mikono","Mabega","Magoti"],"a":0}]},{"id":"L11","w":4,"title":"Swala: nyakati na rakaa","teach":"Waislamu huswali mara tano kwa siku, wakielekea Qibla (upande wa Al-Kaaba huko Makka). Alfajiri (Fajr) ina rakaa 2, Adhuhuri (Dhuhr) 4, Alasiri (Asr) 4, Magharibi (Maghrib) 3, na Isha (usiku) 4. Rakaa moja ni mzunguko wa kusimama, kurukuu na kusujudu. Jitahidi kuswali kila swala kwa wakati wake.","qs":[{"q":"Swala ya Alfajiri ina rakaa ngapi?","o":["2","3","4","5"],"a":0},{"q":"Ni swala ipi yenye rakaa 3?","o":["Magharibi","Alfajiri","Alasiri","Isha"],"a":0},{"q":"Waislamu huelekea upande gani wanaposwali?","o":["Qibla, kuelekea Al-Kaaba","Kaskazini","Mashariki","Jua"],"a":0},{"q":"Swala za kila siku ni ngapi?","o":["5","3","4","6"],"a":0}]},{"id":"L13","w":4,"title":"Jinsi ya kuswali: hatua kwa hatua","teach":"1. Fanya nia, sema ‘Allahu Akbar’ na inua mikono yako. 2. Simama na usome Al-Fatiha na sura nyingine. 3. Rukuu: inama na useme ‘Subhana Rabbiyal ‘Azim’. 4. Simama ukisema ‘Sami’allahu liman hamidah’. 5. Sujudu: sujudu kwa viungo saba (paji la uso pamoja na pua, mikono yote miwili, magoti yote mawili, nyayo zote mbili) na useme ‘Subhana Rabbiyal A’la’. 6. Keti, kisha sujudu tena. Katika rakaa ya mwisho, keti kwa Tashahhud, mswalie Mtume ﷺ, na malizia kwa Taslim: ‘As-salamu alaykum wa rahmatullah’ kulia na kushoto. Inasaidia kuonyeshwa na mtu ana kwa ana.","qs":[{"q":"Unasema nini katika rukuu (kuinama)?","o":["Subhana Rabbiyal ‘Azim","Subhana Rabbiyal A’la","Bismillah","Alhamdulillah"],"a":0},{"q":"Katika sujudu, ni viungo vingapi vinagusa ardhi?","o":["7","3","5","10"],"a":0},{"q":"Swala huanzaje?","o":["Takbiri: Allahu Akbar","Salamu","Rukuu","Sujudu"],"a":0},{"q":"Swala humalizikaje?","o":["Taslim: As-salamu alaykum wa rahmatullah","Takbiri","Al-Fatiha","Sujudu"],"a":0}]},{"id":"L25","w":5,"title":"Funga na Ramadhani","teach":"Ramadhani ni mwezi wa tisa wa kalenda ya Kiislamu. Waislamu hufunga kuanzia alfajiri (Fajr) hadi machweo (Maghrib): hakuna chakula, hakuna kinywaji. Funga hufundisha subira, shukrani na kuwajali maskini. Quran iliteremshwa kwanza katika Ramadhani, na Laylat al-Qadr, Usiku wa Cheo, uko katika siku zake kumi za mwisho. Eid al-Fitr huja baada ya mwezi huo.","qs":[{"q":"Funga ya kila siku hudumu kwa muda gani?","o":["Kuanzia alfajiri hadi machweo","Kuanzia macheo hadi adhuhuri","Kuanzia machweo hadi alfajiri","Kuanzia adhuhuri hadi usiku"],"a":0},{"q":"Laylat al-Qadr iko katika…","o":["siku kumi za mwisho za Ramadhani","Muharram","Dhul Hijjah","usiku wa kwanza wa Ramadhani"],"a":0},{"q":"Sikukuu ipi huja baada ya Ramadhani?","o":["Eid al-Fitr","Eid al-Adha","Arafa","Hijra"],"a":0},{"q":"Ramadhani ni mwezi wa ngapi wa kalenda ya Kiislamu?","o":["Wa 9","Wa 1","Wa 12","Wa 5"],"a":0}]},{"id":"L27","w":5,"title":"Zaka na Sadaka","teach":"Zaka ni nguzo ya tatu. Ni asilimia 2.5 ya akiba inayobaki juu ya kiwango cha chini (nisabu) kwa mwaka mmoja wa mwandamo wa mwezi, inayotolewa kwa wenye uhitaji na makundi mengine yaliyotajwa katika Quran. Sadaka ni msaada wa hiari: kiasi chochote, hata neno jema au tabasamu. Sadaka husafisha mali na moyo.","qs":[{"q":"Zaka ya akiba ni asilimia ngapi?","o":["2.5%","10%","50%","1%"],"a":0},{"q":"Msaada wa hiari unaitwaje?","o":["Sadaka","Zaka","Hija","Saumu"],"a":0},{"q":"Zaka ni kwa ajili ya nani?","o":["Maskini na wahitaji, miongoni mwa wengine","Ndugu matajiri","Wenye maduka","Yeyote anayeomba"],"a":0},{"q":"Sadaka husafisha…","o":["mali na moyo","mwili tu","nyumba","magari"],"a":0}]},{"id":"L29","w":5,"title":"Hija na Umra","teach":"Hija ni safari ya ibada ya Makka katika mwezi wa Dhul Hijjah, wajibu mara moja katika maisha kwa mwenye uwezo. Mahujaji huvaa nguo nyeupe rahisi (ihramu), huizunguka Al-Kaaba (tawafu), hutembea kati ya Safa na Marwa, na husimama katika uwanda wa Arafa, siku muhimu zaidi. Umra ni hija ndogo inayoweza kufanywa wakati wowote wa mwaka.","qs":[{"q":"Hija hufanyika katika mwezi upi?","o":["Dhul Hijjah","Ramadhani","Rajab","Muharram"],"a":0},{"q":"Kuizunguka Al-Kaaba kunaitwaje?","o":["Tawafu","Sa’i","Ihramu","Udhu"],"a":0},{"q":"Siku muhimu zaidi ya Hija ni ipi?","o":["Kusimama Arafa","Eid","Ijumaa","Macheo"],"a":0},{"q":"Ni ipi hija ndogo?","o":["Umra","Zaka","Swala","Saumu"],"a":0}]},{"id":"L15","w":6,"title":"Adabu njema na tabia","teach":"Waislamu husalimiana kwa ‘As-salamu alaykum’ (amani iwe juu yenu), na jibu ni ‘Wa alaykumus-salam’. Sema ‘Bismillah’ kabla ya kula na ‘Alhamdulillah’ baada yake. Kuwa mkweli, mwema kwa majirani zako, na mwenye heshima kwa wazazi wako: Allah anatuambia tusiwaambie hata ‘ah’ (Quran 17:23). Epuka kusengenya, yaani kumsema mtu vibaya asipokuwepo. Mtume ﷺ alisema: ‘Bora wenu ni wale wenye tabia njema zaidi’ (Sahih al-Bukhari).","qs":[{"q":"Jibu la ‘As-salamu alaykum’ ni lipi?","o":["Wa alaykumus-salam","Bismillah","SubhanAllah","Allahu Akbar"],"a":0},{"q":"Tunasema nini kabla ya kula?","o":["Bismillah","Alhamdulillah","Astaghfirullah","Inshallah"],"a":0},{"q":"Allah anatuambia tusiwaambie wazazi wetu nini kamwe?","o":["‘Ah’ (neno la kero)","Asante","Amani","Karibu"],"a":0},{"q":"Kulingana na Mtume ﷺ, watu bora ni wale wenye…","o":["tabia njema zaidi","mali","nyumba","nguo"],"a":0}]},{"id":"L31","w":6,"title":"Halali na haramu","teach":"Halali inamaanisha kuruhusiwa na haramu inamaanisha kukatazwa. Allah alikataza vitu vyenye madhara kama pombe, nyama ya nguruwe, kamari, wizi, uongo na riba. Vitu vingi ni halali isipokuwa alivyovikataza Allah. Tafuta pesa zako kwa uaminifu na uzitumie kwa busara. Usipokuwa na uhakika, muulize mwanazuoni unayemwamini.","qs":[{"q":"Halali inamaanisha nini?","o":["Kuruhusiwa","Kukatazwa","Kuchukiza","Wajibu"],"a":0},{"q":"Ni kipi kati ya hivi ni haramu?","o":["Riba","Biashara ya uaminifu","Kutoa sadaka","Kufunga"],"a":0},{"q":"Vitu vingi ni…","o":["halali isipokuwa vimekatazwa","haramu isipokuwa vimeruhusiwa","vimepigwa marufuku","hiari"],"a":0},{"q":"Tunapaswa kutafuta pesa vipi?","o":["Kwa uaminifu","Kwa njia yoyote","Kwa udanganyifu","Kwa kamari"],"a":0}]},{"id":"L32","w":6,"title":"Akhera","teach":"Kila mtu atakufa na kurudi kwa Allah. Malaika huandika matendo yetu. Baada ya kifo huja maisha ya kaburi (barzakh), kisha Siku ya Hukumu, ambapo kila mtu atafufuliwa na kuhesabiwa. Wema wataingia Jannah (Pepo) kwa rehema ya Allah. Allah ni Mwingi wa Rehema na husamehe wanaotubu kwa dhati.","qs":[{"q":"Nini hufuata baada ya kifo?","o":["Maisha ya kaburi, kisha Siku ya Hukumu","Hakuna kitu","Maisha mengine duniani","Kulala milele"],"a":0},{"q":"Nani huandika matendo yetu?","o":["Malaika","Binadamu","Majini","Ndege"],"a":0},{"q":"Pepo inaitwaje?","o":["Jannah","Jahannam","Barzakh","Qadari"],"a":0},{"q":"Allah husamehe wale ambao…","o":["hutubu kwa dhati","hujivuna","hawaswali kamwe","hujificha"],"a":0}]},{"id":"N3","title":"Jinsi ya kufanya dua","teach":"Dua inamaanisha kumwomba Allah. Mtume ﷺ alisema: ‘Dua ni ibada’ (Abu Dawud, At-Tirmidhi). Adabu njema za dua: anza kwa kumsifu Allah na kumswalia Mtume ﷺ, kuwa mkweli, kuwa na yakini kwamba Allah anakusikia, omba tena na tena, na kamwe usiombe jambo la dhambi. Nyakati ambazo dua ina matumaini makubwa ni pamoja na theluthi ya mwisho ya usiku, wakati wa kusujudu katika swala, na kati ya adhana na iqama. Allah anaweza kukupa ulichoomba, kukuepusha na madhara, au kukuwekea thawabu kwa ajili ya akhera.","qs":[{"q":"Mtume ﷺ alisema dua ni…","o":["ibada","kwa wagonjwa tu","kwa Ijumaa tu","desturi"],"a":0},{"q":"Njia nzuri ya kuanza dua ni…","o":["kwa kumsifu Allah","kwa kulalamika","kwa kupiga kelele","kwa kuomba madhara"],"a":0},{"q":"Ni wakati upi ambao dua ina matumaini makubwa?","o":["Theluthi ya mwisho ya usiku","Kamwe usiku","Adhuhuri tu","Ramadhani tu"],"a":0},{"q":"Usipoona dua yako ikijibiwa mara moja, unapaswa…","o":["kuendelea kuomba na kumtegemea Allah","kuacha kuomba","kujilaumu tu","kumwomba mtu mwingine badala ya Allah"],"a":0}],"w":6},{"id":"N4","title":"Sehemu tatu za Tawhidi","teach":"Wanazuoni mara nyingi hueleza Tawhidi kwa sehemu tatu. Tawhid ar-Rububiyyah: Allah peke Yake ndiye Mola, Muumbaji na Mwendeshaji. Tawhid al-Uluhiyyah: Allah peke Yake anastahili kuabudiwa. Tawhid al-Asma was-Sifat: kuamini majina na sifa za Allah kama Quran na Sunna zinavyoeleza, bila kumfananisha na viumbe Vyake. Hii ni njia moja maarufu ya kupanga mada hii.","qs":[{"q":"Wanazuoni mara nyingi hugawa Tawhidi katika sehemu ngapi?","o":["3","2","5","7"],"a":0},{"q":"Tawhid ar-Rububiyyah inamaanisha kwamba Allah peke Yake ni…","o":["Mola na Muumbaji","nabii pekee","malaika pekee","mji pekee"],"a":0},{"q":"Tawhid al-Uluhiyyah inamaanisha kwamba Allah peke Yake anastahili…","o":["ibada","kodi","majeshi","nyumba"],"a":0},{"q":"Tawhid al-Asma was-Sifat ni imani juu ya…","o":["majina na sifa za Allah","majina ya miji","majina ya malaika tu","majina ya miezi"],"a":0}],"w":7},{"id":"N5","title":"Shirki na yanayoharibu imani","teach":"Shirki ni kumfanyia Allah mshirika. Ni dhambi kubwa kuliko zote mtu akifa juu yake (Quran 4:48). Inajumuisha kuabudu au kuomba kwa yeyote asiyekuwa Allah. Pia kuna shirki ndogo, kama kujionyesha katika ibada, inayoitwa riya. Mtume ﷺ aliihofia kwa umma wake. Mlango wa toba unabaki wazi: Allah husamehe wanaorejea kwake kwa dhati kabla ya kifo.","qs":[{"q":"Shirki inamaanisha nini?","o":["Kumfanyia Allah mshirika","Kukosa funga","Kuchelewa","Kula kupita kiasi"],"a":0},{"q":"Kujionyesha katika ibada kunaitwa…","o":["riya","zaka","sujudu","hijra"],"a":0},{"q":"Je, mlango wa toba uko wazi?","o":["Ndiyo, hadi kifo","Hapana, kamwe","Siku ya Ijumaa tu","Kwa wanazuoni tu"],"a":0},{"q":"Tunapaswa kumwomba na kumtegemea nani?","o":["Allah peke Yake","Watakatifu","Jua","Mababu zetu"],"a":0}],"w":7},{"id":"N6","title":"Jinsi hadithi zinavyopimwa daraja","teach":"Hadithi ni habari ya maneno, vitendo au idhini ya Mtume ﷺ. Ina sehemu mbili: isnadi (mlolongo wa wapokezi) na matn (maandishi). Wanazuoni walichunguza kila mpokezi na kupima hadithi kuwa sahihi (halisi), hasan (nzuri), dhaifu au mawdu’ (ya kubuniwa). Sahih al-Bukhari na Sahih Muslim ni vitabu vinavyoaminika zaidi. Pamoja na Abu Dawud, At-Tirmidhi, An-Nasa’i na Ibn Majah, huunda mikusanyo sita mikuu.","qs":[{"q":"Isnadi ya hadithi ni…","o":["mlolongo wa wapokezi","maandishi","kichwa","jalada la kitabu"],"a":0},{"q":"Matn ya hadithi ni…","o":["maandishi","mlolongo","daraja","mfasiri"],"a":0},{"q":"Mawdu’ inamaanisha nini?","o":["Ya kubuniwa","Sahihi","Nzuri","Maarufu"],"a":0},{"q":"Mikusanyo mikuu ya hadithi ni mingapi?","o":["6","3","10","99"],"a":0}],"w":7},{"id":"N7","title":"Vyanzo vya sheria ya Kiislamu","teach":"Sheria ya Kiislamu (shariah) huchukuliwa kutoka kwenye vyanzo kwa mpangilio. 1. Quran. 2. Sunna, mafundisho na mfano wa Mtume ﷺ. 3. Ijmaa, makubaliano ya wanazuoni juu ya hukumu. 4. Qiyas, kufikiri kwa kulinganisha na hukumu inayojulikana. Fiqhi ni uelewa wa hukumu hizi na wanazuoni wenye sifa. Tusipojua jambo, tunawauliza wenye elimu.","qs":[{"q":"Chanzo cha kwanza cha sheria ya Kiislamu ni kipi?","o":["Quran","Ijmaa","Qiyas","Desturi"],"a":0},{"q":"Sunna inamaanisha…","o":["Mafundisho na mfano wa Mtume ﷺ","Mji","Aina ya mkeka wa swala","Mwezi wa funga"],"a":0},{"q":"Ijmaa ni…","o":["makubaliano ya wanazuoni","sikukuu","sadaka","swala"],"a":0},{"q":"Tunafanya nini tusipojua hukumu?","o":["Tunawauliza wenye elimu","Tunakisia","Tunaipuuza","Tunamuuliza yeyote mtandaoni"],"a":0}],"w":8},{"id":"N8","title":"Makhalifa wanne waongofu","teach":"Baada ya Mtume ﷺ, Waislamu waliongozwa na makhalifa wanne waongofu (Al-Khulafa ar-Rashidun): Abu Bakr as-Siddiq, Umar ibn al-Khattab, Uthman ibn Affan na Ali ibn Abi Talib, Allah awaridhie. Abu Bakr alikusanya Quran, Umar alijulikana kwa uadilifu, Uthman alinakili andiko sanifu, na Ali alikuwa binamu na mkwe wa Mtume ﷺ. Huu ni mtazamo wa Kisunni kuhusu mpangilio na hadhi yao.","qs":[{"q":"Makhalifa waongofu walikuwa wangapi?","o":["4","2","3","7"],"a":0},{"q":"Nani alikuwa khalifa wa kwanza?","o":["Abu Bakr","Umar","Uthman","Ali"],"a":0},{"q":"Nani alitengeneza nakala za andiko sanifu la Quran?","o":["Uthman","Umar","Bilal","Hamza"],"a":0},{"q":"Ali alikuwa kwa Mtume ﷺ…","o":["binamu na mkwe","ndugu","mjomba","mwalimu"],"a":0}],"w":8},{"id":"N9","title":"Madhehebu manne ya fiqhi","teach":"Waislamu wa Kisunni hufuata mojawapo ya madhehebu manne ya kale ya fiqhi: Hanafi (Abu Hanifa), Maliki (Malik ibn Anas), Shafi’i (Imamu ash-Shafi’i) na Hanbali (Ahmad ibn Hanbal). Wanakubaliana juu ya imani na nguzo za Uislamu, na wanatofautiana katika baadhi ya mambo madogo, kwa mfano jinsi sehemu fulani za ibada zinavyofanywa. Tofauti kati ya wanazuoni katika mambo ya pembeni ni za kawaida na si sababu ya kugombana. Waislamu wengi wa Afrika Mashariki hufuata madhehebu ya Shafi’i.","qs":[{"q":"Madhehebu ya kale ya Kisunni ya fiqhi ni mangapi?","o":["4","2","6","10"],"a":0},{"q":"Ni madhehebu yapi yametajwa kwa jina la Imamu ash-Shafi’i?","o":["Shafi’i","Hanafi","Maliki","Hanbali"],"a":0},{"q":"Madhehebu yanakubaliana juu ya…","o":["imani na nguzo za Uislamu","kila jambo dogo","hakuna kitu","tarehe ya Eid tu"],"a":0},{"q":"Tunapaswa kuzichukuliaje tofauti katika mambo ya pembeni?","o":["Kwa heshima, bila kugombana","Kwa kupigana","Kwa kuwadhihaki wengine","Kwa kuipuuza Uislamu"],"a":0}],"w":8}]},"hi":{"ui":{"n_duas":"दुआएँ","n_learn":"सीखें","n_hadith":"हदीस","n_names":"नाम","n_more":"और","streak_days":"{n} दिन लगातार","d_title":"दुआएँ","d_sub":"हर एहसास और हर मौके की दुआएँ","d_ph":"आप कैसा महसूस कर रहे हैं?","d_none":"कोई दुआ नहीं मिली। डर या ग़म जैसा कोई एहसास लिखकर देखें।","d_adhkar":"रोज़ के अज़कार","d_morning":"सुबह","d_evening":"शाम","d_sleep":"सोने से पहले","d_done":"पूरा","d_cats":"एहसास के मुताबिक़ देखें","d_note":"अरबी को छपे हुए मुसहफ़ या किसी भरोसेमंद स्रोत से मिला लें।","d_count":"दुआएँ","l_title":"इस्लाम सीखें","l_sub":"शुरुआत से उन्नत स्तर तक 8 हफ़्तों का सफ़र।","l_week":"हफ़्ता","l_xp":"XP","l_done":"सबक़ पूरे","l_start":"शुरू करें","l_review":"दोहराएँ","l_locked":"इसे खोलने के लिए पिछला सबक़ पूरा करें।","l_quiz":"क्विज़ शुरू करें","l_check":"जाँचें","l_continue":"आगे बढ़ें","l_correct":"सही!","l_wrong":"ठीक नहीं। सही जवाब है:","l_complete":"सबक़ पूरा हुआ","l_earned":"XP मिले","l_back":"सबक़ों पर वापस","l_q":"सवाल","l_of":"में से","l_beg":"शुरुआती","l_int":"मध्यम","l_adv":"उन्नत","l_read":"quran.com पर पढ़ें","l_next":"अगला सबक़","l_perfect":"पूरे नंबर!","l_review_note":"दोहराने पर और XP नहीं मिलते।","l_lesson":"सबक़","h_title":"हदीस","h_sub":"नबी ﷺ के सही फ़रमान","h_ph":"हदीस खोजें","h_all":"सब","h_none":"कोई हदीस नहीं मिली।","h_books":"पूरे संग्रह पढ़ें","h_books_s":"sunnah.com खुलता है, अरबी और अंग्रेज़ी के साथ।","h_note":"हवाला देने से पहले पूरी किताब में अल्फ़ाज़ मिला लें।","tp_faith":"ईमान","tp_character":"अख़लाक़","tp_knowledge":"इल्म","tp_dhikr":"ज़िक्र और दुआ","tp_community":"समाज","nm_title":"अल्लाह के 99 नाम","nm_sub":"ख़ूबसूरत नाम और उनके मतलब सीखें।","nm_ph
