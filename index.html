है। अल्लाह के सिवा कोई माबूद नहीं, जो बड़े अर्श का रब है। अल्लाह के सिवा कोई माबूद नहीं, जो आसमानों का रब, ज़मीन का रब और अर्श-ए-करीम का रब है।","dis1":"तेरे सिवा कोई माबूद नहीं, तू पाक है। बेशक मैं ज़ालिमों में से हो गया।","dis2":"ऐ ज़िंदा रहने वाले, ऐ सबको सँभालने वाले, मैं तेरी रहमत के वसीले से फ़रियाद करता हूँ।","dis3":"हमारे लिए अल्लाह काफ़ी है और वह बेहतरीन कारसाज़ है।","fgv1":"मेरे रब, मुझे बख़्श दे और मेरी तौबा क़ुबूल कर। तू ही तौबा क़ुबूल करने वाला, रहम करने वाला है।","fgv2":"ऐ अल्लाह, तू मेरा रब है। तेरे सिवा कोई माबूद नहीं। तूने मुझे पैदा किया और मैं तेरा बंदा हूँ, और मैं अपनी ताक़त भर तेरे अहद और वादे पर क़ायम हूँ। मैं अपने किए की बुराई से तेरी पनाह माँगता हूँ। मैं अपने ऊपर तेरी नेमत को मानता हूँ और अपने गुनाह का इक़रार करता हूँ, तो मुझे बख़्श दे, क्योंकि तेरे सिवा कोई गुनाह नहीं बख़्शता।","fgv3":"ऐ हमारे रब, हमने अपने ऊपर ज़ुल्म किया। अगर तू हमें न बख़्शे और हम पर रहम न करे, तो हम ज़रूर घाटे में पड़ने वालों में से होंगे।","fgv4":"ऐ अल्लाह, तू माफ़ करने वाला है और माफ़ करना पसंद करता है, तो मुझे माफ़ कर दे।","fgv5":"मैं अल्लाह से माफ़ी माँगता हूँ और उसी की तरफ़ तौबा करता हूँ।","gui1":"हमें सीधा रास्ता दिखा।","gui2":"ऐ हमारे रब, हिदायत देने के बाद हमारे दिलों को टेढ़ा न कर, और हमें अपनी तरफ़ से रहमत अता कर। बेशक तू ही बहुत देने वाला है।","gui3":"ऐ दिलों को पलटने वाले, मेरे दिल को अपने दीन पर जमाए रख।","gui4":"ऐ अल्लाह, मैं तुझसे हिदायत, परहेज़गारी, पाकदामनी और बेनियाज़ी माँगता हूँ।","prv1":"ऐ अल्लाह, हलाल चीज़ों को मेरे लिए काफ़ी कर दे ताकि मैं हराम से बचा रहूँ, और अपने फ़ज़ल से मुझे ऐसा मालदार कर दे कि मैं तेरे सिवा किसी का मोहताज न रहूँ।","prv2":"ऐ अल्लाह, मैं तुझसे फ़ायदेमंद इल्म, पाकीज़ा रिज़्क़ और क़ुबूल होने वाले अमल माँगता हूँ।","prv3":"ऐ मेरे रब, तू जो भी भलाई मुझ पर उतारे, मैं उसका मोहताज हूँ।","eas1":"ऐ मेरे रब, मेरा सीना खोल दे और मेरा काम मेरे लिए आसान कर दे।","eas2":"ऐ मेरे रब, मेरा इल्म बढ़ा दे।","eas3":"ऐ अल्लाह, कुछ भी आसान नहीं सिवा उसके जिसे तू आसान कर दे, और तू चाहे तो मुश्किल को आसान कर सकता है।","grf1":"हम अल्लाह ही के हैं और उसी की तरफ़ लौटकर जाने वाले हैं। ऐ अल्लाह, मुझे मेरी मुसीबत में अज्र दे और इसके बदले इससे बेहतर चीज़ अता कर।","grf2":"ऐ अल्लाह, इसे बख़्श दे, इस पर रहम कर, इसे आफ़ियत दे और इसे माफ़ कर दे।","fea1":"अल्लाह के नाम से, जिसके नाम के साथ ज़मीन और आसमान की कोई चीज़ नुक़सान नहीं पहुँचा सकती। वह सब कुछ सुनने वाला, सब कुछ जानने वाला है।","fea2":"मैं अल्लाह के पूरे कलिमात की पनाह माँगता हूँ, उसकी पैदा की हुई चीज़ों की बुराई से।","fea3":"ऐ अल्लाह, हम तुझे उनके मुक़ाबले में रखते हैं और उनकी बुराई से तेरी पनाह माँगते हैं।","hlt1":"ऐ अल्लाह, लोगों के रब, तकलीफ़ दूर कर दे और शिफ़ा दे। तू ही शिफ़ा देने वाला है। तेरी शिफ़ा के सिवा कोई शिफ़ा नहीं, ऐसी शिफ़ा जो कोई बीमारी न छोड़े।","hlt2":"दर्द की जगह पर हाथ रखें, तीन बार बिस्मिल्लाह कहें, फिर सात बार कहें: मैं अल्लाह की इज़्ज़त और क़ुदरत की पनाह माँगता हूँ, उस चीज़ की बुराई से जो मैं महसूस करता हूँ और जिससे डरता हूँ।","hlt3":"बीमार की इयादत करते वक़्त सात बार कहें: मैं बड़े अर्श के रब, अज़मत वाले अल्लाह से दुआ करता हूँ कि वह तुम्हें शिफ़ा दे।","hlt4":"ऐ अल्लाह, मेरे बदन को आफ़ियत दे। ऐ अल्लाह, मेरे सुनने में आफ़ियत दे। ऐ अल्लाह, मेरे देखने में आफ़ियत दे। तेरे सिवा कोई माबूद नहीं।","slp1":"तमाम तारीफ़ अल्लाह के लिए है जिसने हमें मौत देने के बाद ज़िंदा किया, और उसी की तरफ़ उठकर जाना है।","slp2":"ऐ अल्लाह, तेरे ही नाम से मैं मरता हूँ और जीता हूँ।","slp3":"ऐ अल्लाह, मुझे अपने अज़ाब से बचा, उस दिन जब तू अपने बंदों को उठाएगा।","fod1":"अल्लाह के नाम से। खाने से पहले यह कहें।","fod2":"तमाम तारीफ़ अल्लाह के लिए है जिसने मुझे यह खिलाया और बिना मेरी किसी ताक़त और क़ुव्वत के मुझे अता किया।","fod3":"रोज़ा खोलते वक़्त कहें: प्यास बुझ गई, रगें तर हो गईं और अज्र पक्का हो गया, इंशा अल्लाह।","hom1":"अल्लाह के नाम से, मैंने अल्लाह पर भरोसा किया, और अल्लाह के बग़ैर न कोई ताक़त है न क़ुव्वत। घर से निकलते वक़्त यह कहें।","hom2":"घर में दाख़िल होते वक़्त कहें: अल्लाह के नाम से हम दाख़िल हुए, अल्लाह के नाम से हम निकले, और अपने रब पर हमने भरोसा किया।","hom3":"पाक है वह जिसने इसे हमारे बस में कर दिया, वरना हम इसे क़ाबू में नहीं कर सकते थे। और हमें अपने रब की तरफ़ लौटकर जाना है। सफ़र में यह कहें।","fam1":"ऐ हमारे रब, हमें हमारी बीवियों और औलाद से आँखों की ठंडक अता कर, और हमें परहेज़गारों का पेशवा बना।","fam2":"ऐ मेरे रब, मुझे तौफ़ीक़ दे कि मैं तेरी उस नेमत का शुक्र करूँ जो तूने मुझ पर और मेरे माँ-बाप पर की, और ऐसा नेक अमल करूँ जिससे तू राज़ी हो, और मेरी औलाद को नेक बना दे। मैं तेरी तरफ़ तौबा करता हूँ और फ़रमाँबरदारों में से हूँ।","fam3":"ऐ मेरे रब, उन दोनों पर रहम कर जैसे उन्होंने बचपन में मुझे पाला।","fam4":"ऐ हमारे रब, मुझे, मेरे माँ-बाप को और सब ईमान वालों को उस दिन बख़्श दे जब हिसाब क़ायम होगा।","grt1":"अल्लाह की ख़ूब तारीफ़, पाकीज़ा और बरकत वाली तारीफ़।","grt2":"ऐ अल्लाह, आज सुबह मुझे या तेरी किसी भी मख़्लूक़ को जो नेमत मिली है, वह सिर्फ़ तेरी तरफ़ से है, तेरा कोई शरीक नहीं। तो तारीफ़ और शुक्र सब तेरे ही लिए है।","grt3":"ऐ अल्लाह, मेरी मदद कर कि मैं तुझे याद करूँ, तेरा शुक्र करूँ और अच्छे तरीक़े से तेरी इबादत करूँ।","suc1":"ऐ हमारे रब, हमें दुनिया में भलाई दे और आख़िरत में भी भलाई दे, और हमें आग के अज़ाब से बचा।","suc2":"ऐ अल्लाह, मैं तुझसे जन्नत माँगता हूँ और जहन्नम की आग से तेरी पनाह माँगता हूँ।","suc3":"ऐ अल्लाह, मेरा दीन दुरुस्त कर दे जो मेरे हर काम की हिफ़ाज़त है। मेरी दुनिया दुरुस्त कर दे जिसमें मेरी रोज़ी है। मेरी आख़िरत दुरुस्त कर दे जहाँ मुझे लौटना है। ज़िंदगी को मेरे लिए हर भलाई में बढ़ोतरी बना दे, और मौत को मेरे लिए हर बुराई से राहत बना दे।","pat1":"ऐ हमारे रब, हम पर सब्र उंडेल दे, हमारे क़दम जमा दे और हमारी मदद कर।","pat2":"ऐ मेरे रब, मैं दबा दिया गया हूँ, तू मेरी मदद कर।","pat3":"मैं अपना मामला अल्लाह के हवाले करता हूँ। बेशक अल्लाह अपने बंदों को देखने वाला है।","umm1":"ऐ अल्लाह, मुहम्मद और आले-मुहम्मद पर रहमत भेज, जैसे तूने इब्राहीम और आले-इब्राहीम पर रहमत भेजी। बेशक तू तारीफ़ के लायक़ और बुज़ुर्गी वाला है। ऐ अल्लाह, मुहम्मद और आले-मुहम्मद पर बरकत नाज़िल कर, जैसे तूने इब्राहीम और आले-इब्राहीम पर बरकत नाज़िल की। बेशक तू तारीफ़ के लायक़ और बुज़ुर्गी वाला है।","umm2":"ऐ हमारे रब, हमें बख़्श दे और हमारे उन भाइयों को भी जो हमसे पहले ईमान ला चुके, और हमारे दिलों में ईमान वालों के लिए कोई कीना न रख। ऐ हमारे रब, तू बड़ा शफ़ीक़ और रहम करने वाला है।","dly1":"बैतुलख़ला में जाने से पहले कहें: ऐ अल्लाह, मैं तेरी पनाह माँगता हूँ बुराई और बुरे लोगों से।","dly2":"नए कपड़े पहनते वक़्त कहें: तमाम तारीफ़ अल्लाह के लिए है जिसने मुझे यह पहनाया और बिना मेरी किसी ताक़त और क़ुव्वत के मुझे अता किया।","dly3":"बारिश होने पर कहें: ऐ अल्लाह, इसे फ़ायदेमंद बारिश बना दे।","dly4":"आईना देखते वक़्त कहें: ऐ अल्लाह, तूने मेरा जिस्म ख़ूबसूरत बनाया, तो मेरा अख़लाक़ भी ख़ूबसूरत बना दे।","dly5":"छींक आए तो अल्हम्दुलिल्लाह कहें। सुनने वाले जवाब में कहें: यरहमुकल्लाह (अल्लाह तुम पर रहम करे)। आप उसके जवाब में कहें: यहदीकुमुल्लाहु व युस्लिहु बालकुम (अल्लाह तुम्हें हिदायत दे और तुम्हारे हालात सँवार दे)।"},"adhkar":{"am1":{"h":"आयतुल कुर्सी","en":"क़ुरआन 2:255। दिन भर हिफ़ाज़त के लिए।"},"am2":{"h":"अल-इख़्लास, अल-फ़लक़ और अन-नास","en":"इन तीनों छोटी सूरतों में से हर एक को तीन बार पढ़ें।"},"am3":{"h":"सुबह की हम्द","en":"हमने सुबह की और सारी बादशाही अल्लाह की है। तारीफ़ अल्लाह के लिए है। अकेले अल्लाह के सिवा कोई इबादत के लायक़ नहीं, उसका कोई शरीक नहीं। बादशाही उसी की है और तारीफ़ उसी की है, और वह हर चीज़ पर क़ादिर है। (सही मुस्लिम)"},"am4":{"h":"तेरे ही नाम से दिन शुरू करते हैं","en":"ऐ अल्लाह, तेरे ही सहारे हमने सुबह की और तेरे ही सहारे शाम करते हैं। तेरे ही सहारे हम जीते और मरते हैं, और तेरी ही तरफ़ उठकर जाना है। (तिर्मिज़ी)"},"am5":{"h":"अल्लाह से राज़ी","en":"मैं अल्लाह को रब, इस्लाम को दीन और मुहम्मद को नबी मानकर राज़ी हूँ। (अबू दाऊद)"},"am6":{"h":"सुब्हानल्लाहि व बिहम्दिही","en":"अल्लाह पाक है और उसी की तारीफ़ है। (सही मुस्लिम)"},"am7":{"h":"माफ़ी माँगना","en":"मैं अल्लाह से माफ़ी माँगता हूँ और उसी की तरफ़ तौबा करता हूँ।"},"pm1":{"h":"आयतुल कुर्सी","en":"क़ुरआन 2:255। रात भर हिफ़ाज़त के लिए।"},"pm2":{"h":"अल-इख़्लास, अल-फ़लक़ और अन-नास","en":"इन तीनों छोटी सूरतों में से हर एक को तीन बार पढ़ें।"},"pm3":{"h":"शाम की हम्द","en":"हमने शाम की और सारी बादशाही अल्लाह की है। तारीफ़ अल्लाह के लिए है। अकेले अल्लाह के सिवा कोई इबादत के लायक़ नहीं, उसका कोई शरीक नहीं। बादशाही उसी की है और तारीफ़ उसी की है, और वह हर चीज़ पर क़ादिर है। (सही मुस्लिम)"},"pm4":{"h":"तेरे ही नाम से रात शुरू करते हैं","en":"ऐ अल्लाह, तेरे ही सहारे हमने शाम की और तेरे ही सहारे सुबह करते हैं। तेरे ही सहारे हम जीते और मरते हैं, और तेरी ही तरफ़ आख़िरी वापसी है। (तिर्मिज़ी)"},"pm5":{"h":"पनाह माँगना","en":"मैं अल्लाह के पूरे कलिमात की पनाह माँगता हूँ, उसकी पैदा की हुई चीज़ों की बुराई से। (सही मुस्लिम)"},"pm6":{"h":"अल्लाह से राज़ी","en":"मैं अल्लाह को रब, इस्लाम को दीन और मुहम्मद को नबी मानकर राज़ी हूँ। (अबू दाऊद)"},"pm7":{"h":"सुब्हानल्लाहि व बिहम्दिही","en":"अल्लाह पाक है और उसी की तारीफ़ है। (सही मुस्लिम)"},"sl1":{"h":"आयतुल कुर्सी","en":"क़ुरआन 2:255। जो सोते वक़्त इसे पढ़ता है, उसके लिए अल्लाह की तरफ़ से रात भर एक निगहबान रहता है। (सही बुख़ारी)"},"sl2":{"h":"सूरह अल-बक़रह की आख़िरी दो आयतें","en":"क़ुरआन 2:285-286। जो इन्हें रात में पढ़े, उसके लिए ये दोनों काफ़ी हैं। (सही बुख़ारी, सही मुस्लिम)"},"sl3":{"h":"अल-इख़्लास, अल-फ़लक़ और अन-नास","en":"दोनों हथेलियाँ मिलाएँ, उनमें फूँकें, तीनों सूरतें पढ़ें, फिर सिर और चेहरे से शुरू करके हाथ पूरे बदन पर फेरें। यह तीन बार करें। (सही बुख़ारी)"},"sl4":{"h":"सूरह अल-मुल्क","en":"नबी ﷺ अल-मुल्क और अस-सजदह पढ़े बग़ैर नहीं सोते थे। (तिर्मिज़ी)"},"sl5":{"h":"सूरह अस-सजदह","en":"सूरह 32, सोने से पहले अल-मुल्क के साथ पढ़ी जाती है।"},"sl6":{"h":"सोने से पहले तस्बीह","en":"सुब्हानल्लाह 33 बार, अल्हम्दुलिल्लाह 33 बार, अल्लाहु अकबर 34 बार। (सही बुख़ारी)"},"sl7":{"h":"तेरे नाम से मरता और जीता हूँ","en":"ऐ अल्लाह, तेरे ही नाम से मैं मरता हूँ और जीता हूँ। (सही बुख़ारी)"},"sl8":{"h":"क़यामत के दिन की हिफ़ाज़त","en":"ऐ अल्लाह, मुझे अपने अज़ाब से बचा, उस दिन जब तू अपने बंदों को उठाएगा। (अबू दाऊद)"}},"hadith":{"h1":"आमाल का दारोमदार नीयतों पर है, और हर इंसान को वही मिलेगा जिसकी उसने नीयत की।","h2":"इस्लाम की बुनियाद पाँच चीज़ों पर है: इस बात की गवाही कि अल्लाह के सिवा कोई माबूद नहीं और मुहम्मद अल्लाह के रसूल हैं, नमाज़ क़ायम करना, ज़कात देना, बैतुल्लाह का हज करना और रमज़ान के रोज़े रखना।","h3":"दीन ख़ैरख़्वाही का नाम है। हमने पूछा: किसके लिए? आप ने फ़रमाया: अल्लाह के लिए, उसकी किताब के लिए, उसके रसूल के लिए, मुसलमानों के हाकिमों के लिए और आम मुसलमानों के लिए।","h4":"आदमी के इस्लाम की ख़ूबी में से है कि वह उस चीज़ को छोड़ दे जो उससे मुताल्लिक़ नहीं।","h5":"तुम में से कोई उस वक़्त तक मोमिन नहीं हो सकता जब तक वह अपने भाई के लिए वही पसंद न करे जो अपने लिए पसंद करता है।","h6":"जो अल्लाह और आख़िरत के दिन पर ईमान रखता है, वह भली बात कहे या ख़ामोश रहे।","h7":"एक आदमी ने नबी ﷺ से कहा: मुझे नसीहत कीजिए। आप ने फ़रमाया: ग़ुस्सा मत किया करो। उसने कई बार यही दोहराया, और हर बार आप ने फ़रमाया: ग़ुस्सा मत किया करो।","h8":"जहाँ भी रहो अल्लाह से डरो, बुराई के बाद नेकी करो वह उसे मिटा देगी, और लोगों से अच्छे अख़लाक़ से पेश आओ।","h9":"अल्लाह का ख़याल रखो, वह तुम्हारी हिफ़ाज़त करेगा। अल्लाह का ख़याल रखो, तुम उसे अपने सामने पाओगे। जब माँगो तो अल्लाह से माँगो, जब मदद चाहो तो अल्लाह से मदद चाहो।","h10":"दुनिया में ऐसे रहो जैसे तुम अजनबी या मुसाफ़िर हो।","h11":"न ख़ुद नुक़सान उठाओ और न किसी को नुक़सान पहुँचाओ।","h12":"तुम में सबसे बेहतर वह है जो क़ुरआन सीखे और सिखाए।","h13":"दो कलिमे ज़बान पर हल्के, तराज़ू में भारी और रहमान को प्यारे हैं: सुब्हानल्लाहि व बिहम्दिही, सुब्हानल्लाहिल अज़ीम।","h14":"दुआ इबादत है।","h15":"तुम में सबसे अच्छे वे हैं जिनका अख़लाक़ सबसे अच्छा है।","h16":"ताक़तवर मोमिन अल्लाह के नज़दीक कमज़ोर मोमिन से बेहतर और ज़्यादा प्यारा है, हालाँकि भलाई दोनों में है।","h17":"अपने भाई के सामने तुम्हारा मुस्कुराना सदक़ा है।","h18":"आसानी करो, सख़्ती मत करो; ख़ुशख़बरी दो, लोगों को दूर मत भगाओ।","h19":"जो लोगों का शुक्र अदा नहीं करता, वह अल्लाह का शुक्र अदा नहीं करता।","h20":"तुम मोमिनों को आपस में रहम, मोहब्बत और हमदर्दी में एक जिस्म की तरह पाओगे: जब एक हिस्सा तकलीफ़ में होता है तो सारा जिस्म बेख़्वाबी और बुख़ार से उसका साथ देता है।","h21":"ज़मीन वालों पर रहम करो, आसमान वाला (अल्लाह) तुम पर रहम करेगा।","h22":"मुसलमान वह है जिसकी ज़बान और हाथ से दूसरे मुसलमान महफ़ूज़ रहें।","h23":"जो इल्म की तलाश में कोई रास्ता चलता है, अल्लाह उसके लिए जन्नत का रास्ता आसान कर देता है।","h24":"इल्म हासिल करना हर मुसलमान पर फ़र्ज़ है।","h25":"जो अल्लाह और आख़िरत के दिन पर ईमान रखता है, वह अपने पड़ोसी को तकलीफ़ न दे।","h26":"मालदारी ज़्यादा सामान से नहीं होती; असली मालदारी दिल की बेनियाज़ी है।","h27":"मोमिन का मामला भी क्या ख़ूब है: उसका हर काम उसके लिए भलाई है, और यह मोमिन के सिवा किसी को नसीब नहीं। उसे ख़ुशी मिले तो शुक्र करता है, यह उसके लिए भला है; उसे तकलीफ़ पहुँचे तो सब्र करता है, यह भी उसके लिए भला है।","h28":"अल्लाह तुम्हारी सूरतों और तुम्हारे मालों को नहीं देखता, बल्कि वह तुम्हारे दिलों और तुम्हारे आमाल को देखता है।","h29":"अल्लाह को सबसे प्यारे अमल वे हैं जो हमेशा किए जाएँ, चाहे थोड़े हों।","h30":"जो रोज़ सौ बार सुब्हानल्लाहि व बिहम्दिही कहे, उसके गुनाह माफ़ कर दिए जाते हैं चाहे समंदर के झाग जितने हों।"},"names":{"n1":"बेहद मेहरबान","n2":"निहायत रहम वाला","n3":"बादशाह","n4":"बेहद पाक","n5":"सलामती का स्रोत","n6":"अमन देने वाला","n7":"निगहबान","n8":"सबसे ज़बरदस्त","n9":"सब पर ग़ालिब","n10":"सबसे बड़ाई वाला","n11":"पैदा करने वाला","n12":"बनाने वाला","n13":"सूरत देने वाला","n14":"बहुत बख़्शने वाला","n15":"सब पर क़ाबू रखने वाला","n16":"बहुत अता करने वाला","n17":"रोज़ी देने वाला","n18":"खोलने वाला","n19":"सब कुछ जानने वाला","n20":"तंग करने वाला","n21":"फैलाने वाला","n22":"पस्त करने वाला","n23":"बुलंद करने वाला","n24":"इज़्ज़त देने वाला","n25":"ज़लील करने वाला","n26":"सब कुछ सुनने वाला","n27":"सब कुछ देखने वाला","n28":"फ़ैसला करने वाला","n29":"पूरा इंसाफ़ करने वाला","n30":"निहायत मेहरबान, बारीक बीन","n31":"पूरी ख़बर रखने वाला","n32":"बुर्दबार","n33":"अज़मत वाला","n34":"बख़्शने वाला","n35":"क़द्रदान","n36":"सबसे बुलंद","n37":"सबसे बड़ा","n38":"हिफ़ाज़त करने वाला","n39":"रोज़ी पहुँचाने वाला","n40":"हिसाब लेने वाला","n41":"जलाल वाला","n42":"बड़ा करम करने वाला","n43":"निगरानी करने वाला","n44":"दुआ क़ुबूल करने वाला","n45":"सब पर छाया हुआ","n46":"हिकमत वाला","n47":"बहुत मोहब्बत करने वाला","n48":"बुज़ुर्गी वाला","n49":"दोबारा उठाने वाला","n50":"गवाह","n51":"हक़","n52":"कारसाज़","n53":"बड़ा ताक़तवर","n54":"मज़बूत","n55":"मददगार दोस्त","n56":"तारीफ़ के लायक़","n57":"गिनने वाला","n58":"पहली बार पैदा करने वाला","n59":"दोबारा लौटाने वाला","n60":"ज़िंदगी ्यंत कृपालु), अल-मलिक (बादशाह) और अल-ग़फ़्फ़ार (बहुत क्षमा करने वाला)। हम दुआ करते समय अल्लाह को उसके नामों से पुकारते हैं: ‘और अल्लाह के सबसे अच्छे नाम हैं, तो उसे उन्हीं नामों से पुकारो’ (क़ुरआन 7:180)। सभी 99 नाम \"नाम\" टैब में देखें।","qs":[{"q":"अल्लाह के कितने सुंदर नाम प्रसिद्ध रूप से गिनाए जाते हैं?","o":["99","33","40","114"],"a":0},{"q":"अल-ग़फ़्फ़ार का क्या अर्थ है?","o":["बहुत क्षमा करने वाला","बादशाह","रचयिता","रोज़ी देने वाला"],"a":0},{"q":"अल्लाह ने अपने सुंदर नामों के बारे में हमें क्या करने को कहा है?","o":["उन्हीं नामों से उसे पुकारें","उन्हें गुप्त रखें","उन्हें सिर्फ़ एक बार पढ़ें","उन्हें दीवारों पर लिखें"],"a":0},{"q":"अल-मलिक का क्या अर्थ है?","o":["बादशाह","शिफ़ा देने वाला","न्यायाधीश","प्रकाश"],"a":0}],"w":1},{"id":"L3","w":1,"title":"ईमान के छह स्तंभ","teach":"ईमान का अर्थ है विश्वास। मुसलमान छह चीज़ों पर ईमान रखता है: अल्लाह, उसके फ़रिश्ते, उसकी किताबें, उसके रसूल, आख़िरत का दिन, और क़दर, यानी अच्छे-बुरे हर चीज़ के बारे में अल्लाह का ज्ञान और फ़ैसला। फ़रिश्ते नूर (प्रकाश) से, इंसान मिट्टी से और जिन्न धुएँ रहित आग से बनाए गए।","qs":[{"q":"ईमान के कितने स्तंभ हैं?","o":["6","5","4","7"],"a":0},{"q":"इनमें से कौन ईमान के छह स्तंभों में नहीं है?","o":["रोज़ा","फ़रिश्तों पर ईमान","आख़िरत के दिन पर ईमान","अल्लाह की किताबों पर ईमान"],"a":0},{"q":"फ़रिश्ते किससे बनाए गए?","o":["नूर (प्रकाश) से","मिट्टी से","धुएँ रहित आग से","पानी से"],"a":0},{"q":"इंसान किससे बनाए गए?","o":["मिट्टी से","नूर (प्रकाश) से","धुएँ रहित आग से","पत्थर से"],"a":0}]},{"id":"L5","w":1,"title":"इस्लाम के पाँच स्तंभ","teach":"इस्लाम पाँच स्तंभों पर खड़ा है। 1. शहादा: ईमान का एलान। 2. सलाह: दिन में पाँच बार नमाज़। 3. ज़कात: अपनी दौलत से दान देना। 4. सौम: रमज़ान में रोज़ा रखना। 5. हज: मक्का की यात्रा, जो सामर्थ्य वालों पर जीवन में एक बार ज़रूरी है।","qs":[{"q":"इस्लाम के कितने स्तंभ हैं?","o":["5","6","3","4"],"a":0},{"q":"दिन में पाँच बार नमाज़ पढ़ना कौन-सा स्तंभ है?","o":["सलाह","ज़कात","हज","सौम"],"a":0},{"q":"मुसलमान किस महीने में रोज़ा रखते हैं?","o":["रमज़ान","शव्वाल","मुहर्रम","रजब"],"a":0},{"q":"हज ज़रूरी है…","o":["जीवन में एक बार, सामर्थ्य वालों पर","हर साल","हर महीने","सिर्फ़ विद्वानों पर"],"a":0}]},{"id":"L7","w":2,"title":"शहादा पढ़ना","teach":"शहादा ईमान का वह एलान है जिससे कोई इंसान मुसलमान बनता है: ‘अश्हदु अन ला इलाह इल्लल्लाह, व अश्हदु अन्ना मुहम्मदन रसूलुल्लाह।’ इसका अर्थ है: मैं गवाही देता हूँ कि अल्लाह के सिवा कोई पूज्य नहीं, और मैं गवाही देता हूँ कि मुहम्मद अल्लाह के रसूल हैं। इसे समझ और सच्चाई के साथ कहना चाहिए।","ar":"أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","qs":[{"q":"शहादा का क्या अर्थ है?","o":["गवाही देना","रोज़ा","नमाज़","दान"],"a":0},{"q":"पहला भाग कहता है कि अल्लाह के सिवा कोई पूज्य नहीं…","o":["अल्लाह","नबी","फ़रिश्ते","काबा"],"a":0},{"q":"दूसरा भाग कहता है कि मुहम्मद…","o":["अल्लाह के रसूल हैं","बादशाह हैं","फ़रिश्ता हैं","ईश्वर हैं"],"a":0},{"q":"शहादा कहना चाहिए…","o":["समझ और सच्चाई के साथ","सिर्फ़ ऊँची आवाज़ में","सिर्फ़ समूह में","सिर्फ़ अरबी में"],"a":0}]},{"id":"L21","w":2,"title":"अल्लाह के नबी","teach":"अल्लाह ने हर क़ौम में नबी भेजे जिनका संदेश एक ही था: सिर्फ़ अल्लाह की इबादत करो। क़ुरआन में 25 नबियों के नाम हैं, जिनमें आदम, नूह, इब्राहीम, मूसा, ईसा और अंतिम नबी मुहम्मद ﷺ शामिल हैं। मूसा को तौरात, दाऊद को ज़बूर, ईसा को इंजील और मुहम्मद ﷺ को क़ुरआन मिला।","qs":[{"q":"अंतिम नबी कौन हैं?","o":["मुहम्मद ﷺ","ईसा","मूसा","इब्राहीम"],"a":0},{"q":"मूसा को कौन-सी किताब दी गई?","o":["तौरात","इंजील","ज़बूर","क़ुरआन"],"a":0},{"q":"क़ुरआन किस पर उतारा गया?","o":["मुहम्मद ﷺ","दाऊद","ईसा","नूह"],"a":0},{"q":"हर नबी का संदेश क्या था?","o":["सिर्फ़ अल्लाह की इबादत करो","शहर बसाओ","व्यापार शुरू करो","सत्ता हासिल करो"],"a":0}]},{"id":"L17","w":2,"title":"नबी ﷺ: शुरुआती वर्ष","teach":"मुहम्मद ﷺ का जन्म लगभग 570 ई. में मक्का में, हाथी के साल में हुआ। उनके पिता उनके जन्म से पहले गुज़र गए और माँ तब, जब वे लगभग छह साल के थे। उनके दादा और फिर चाचा अबू तालिब ने उन्हें पाला। वे अस-सादिक़ अल-अमीन, यानी सच्चे और अमानतदार के नाम से जाने जाते थे। 25 साल की उम्र में उन्होंने ख़दीजा से निकाह किया, अल्लाह उनसे राज़ी हो।","qs":[{"q":"नबी ﷺ का जन्म कहाँ हुआ?","o":["मक्का","मदीना","यरूशलम","ताइफ़"],"a":0},{"q":"वे किस नाम से जाने जाते थे?","o":["सच्चे और अमानतदार","सबसे धनी","सबसे ताक़तवर","कवि"],"a":0},{"q":"25 साल की उम्र में उन्होंने किससे निकाह किया?","o":["ख़दीजा","आइशा","हफ़्सा","मरयम"],"a":0},{"q":"दादा के बाद उन्हें किसने पाला?","o":["चाचा अबू तालिब ने","अबू लहब ने","अबू बक्र ने","उमर ने"],"a":0}]},{"id":"L19","w":3,"title":"वह्य और हिजरत","teach":"40 साल की उम्र में, हिरा की गुफा में, फ़रिश्ते जिब्रील पहली वह्य लाए: ‘इक़रा’ (पढ़ो!), जो सूरह अल-अलक़ की शुरुआत है। 13 साल तक नबी ﷺ ने मक्का में लोगों को अल्लाह की ओर बुलाया और कठिनाइयाँ झेलीं। 622 ई. में उन्होंने मदीना की ओर हिजरत की। यह हिजरत इस्लामी कैलेंडर की शुरुआत है।","qs":[{"q":"पहली वह्य कहाँ आई?","o":["हिरा की गुफा में","काबा में","मदीना में","तूर पहाड़ पर"],"a":0},{"q":"सबसे पहले कौन-सा शब्द उतरा?","o":["इक़रा (पढ़ो)","बिस्मिल्लाह","क़ुल (कहो)","अलहम्दुलिल्लाह"],"a":0},{"q":"हिजरत किस ओर प्रवास था?","o":["मदीना","मिस्र","यमन","बग़दाद"],"a":0},{"q":"हिजरत किसकी शुरुआत है?","o":["इस्लामी कैलेंडर की","रमज़ान की","हज की","ईद की"],"a":0}]},{"id":"L23","w":3,"title":"मदीना और मक्का की विजय","teach":"मदीना में नबी ﷺ ने पहली मस्जिद, मस्जिद-ए-नबवी, बनाई और भाईचारे तथा न्याय पर आधारित समाज खड़ा किया। 630 ई. में मक्का मुसलमानों के लिए खुल गया और नबी ﷺ ने उन लोगों को माफ़ कर दिया जिन्होंने उनका विरोध किया था। 632 ई. में 63 साल की उम्र में उनका इंतिक़ाल हुआ और वे मदीना में दफ़न हैं।","qs":[{"q":"मदीना में नबी ﷺ ने सबसे पहले क्या बनाया?","o":["मस्जिद","क़िला","बाज़ार","स्कूल"],"a":0},{"q":"मक्का में उन्होंने अपने पुराने दुश्मनों के साथ कैसा व्यवहार किया?","o":["उन्हें माफ़ कर दिया","उन्हें सज़ा दी","उन्हें नज़रअंदाज़ किया","उन्हें निकाल दिया"],"a":0},{"q":"नबी ﷺ कहाँ दफ़न हैं?","o":["मदीना","मक्का","ताइफ़","यरूशलम"],"a":0},{"q":"कौन-सी सूरह विजय और लोगों के झुंड के झुंड इस्लाम में आने की बात करती है?","o":["अन-नस्र","अल-फ़ील","अल-अस्र","क़ुरैश"],"a":0}]},{"id":"N2","title":"क़ुरआन: वह्य और संरक्षण","teach":"क़ुरआन अल्लाह का कलाम है, जो नबी ﷺ पर लगभग 23 साल में अरबी भाषा में उतारा गया। इसमें 114 सूरतें हैं। इसे नबी ﷺ के जीवनकाल में ही याद किया और लिखा गया। उनके बाद अबू बक्र ने इसे एक संग्रह में इकट्ठा करवाया, और उस्मान ने मानक पाठ की प्रतियाँ बनवाकर प्रमुख शहरों में भेजीं। अल्लाह ने इसकी हिफ़ाज़त का वादा किया है (क़ुरआन 15:9)।","qs":[{"q":"क़ुरआन में कितनी सूरतें हैं?","o":["114","99","30","60"],"a":0},{"q":"क़ुरआन लगभग कितने समय में उतारा गया?","o":["23 साल","3 साल","40 साल","1 साल"],"a":0},{"q":"क़ुरआन को एक संग्रह में किसने इकट्ठा करवाया?","o":["अबू बक्र ने","अबू लहब ने","हमज़ा ने","बिलाल ने"],"a":0},{"q":"मानक पाठ की प्रतियाँ प्रमुख शहरों में किसने भेजीं?","o":["उस्मान ने","अली ने","उमर ने","ख़ालिद ने"],"a":0}],"w":3},{"id":"L9","w":4,"title":"वुज़ू: नमाज़ के लिए धोना","teach":"वुज़ू नमाज़ से पहले की सफ़ाई है। दिल में नीयत करें और बिस्मिल्लाह कहें। फिर हाथ 3 बार धोएँ, मुँह में 3 बार पानी डालकर कुल्ला करें, नाक में पानी डालकर 3 बार झाड़ें, चेहरा 3 बार धोएँ, बाँहें कोहनियों तक 3 बार धोएँ (पहले दाहिनी, फिर बाईं), सिर का एक बार मसह करें (कानों सहित), और पैर टख़नों तक 3 बार धोएँ (पहले दायाँ, फिर बायाँ)। शौच जाने, हवा निकलने, गहरी नींद या बेहोशी से वुज़ू टूट जाता है।","qs":[{"q":"वुज़ू की शुरुआत में क्या कहते हैं?","o":["बिस्मिल्लाह","अल्लाहु अकबर","अलहम्दुलिल्लाह","सुब्हानल्लाह"],"a":0},{"q":"सिर का मसह कितनी बार किया जाता है?","o":["एक बार","तीन बार","बिल्कुल नहीं","सात बार"],"a":0},{"q":"इनमें से क्या वुज़ू तोड़ता है?","o":["गहरी नींद","रोटी खाना","चलना","पढ़ना"],"a":0},{"q":"बाँहें कहाँ तक धोई जाती हैं?","o":["कोहनियों तक","कलाइयों तक","कंधों तक","घुटनों तक"],"a":0}]},{"id":"L11","w":4,"title":"सलाह: वक़्त और रकअतें","teach":"मुसलमान दिन में पाँच बार नमाज़ पढ़ते हैं, क़िबले (मक्का में काबा की दिशा) की ओर मुँह करके। फ़ज्र (भोर) की 2 रकअतें, ज़ुहर (दोपहर) की 4, अस्र (तीसरा पहर) की 4, मग़रिब (सूर्यास्त) की 3 और इशा (रात) की 4 रकअतें होती हैं। एक रकअत खड़े होने, झुकने और सजदा करने का एक चक्र है। हर नमाज़ वक़्त पर पढ़ने की कोशिश करें।","qs":[{"q":"फ़ज्र की कितनी रकअतें हैं?","o":["2","3","4","5"],"a":0},{"q":"किस नमाज़ की 3 रकअतें हैं?","o":["मग़रिब","फ़ज्र","अस्र","इशा"],"a":0},{"q":"मुसलमान नमाज़ में किस ओर मुँह करते हैं?","o":["क़िबले की ओर, यानी काबा की तरफ़","उत्तर","पूर्व","सूरज"],"a":0},{"q":"रोज़ की नमाज़ें कितनी हैं?","o":["5","3","4","6"],"a":0}]},{"id":"L13","w":4,"title":"नमाज़ कैसे पढ़ें: चरण दर चरण","teach":"1. नीयत करें, ‘अल्लाहु अकबर’ कहें और हाथ उठाएँ। 2. खड़े होकर सूरह अल-फ़ातिहा और कोई और सूरह पढ़ें। 3. रुकू: झुकें और कहें ‘सुब्हाना रब्बियल अज़ीम’। 4. ‘समिअल्लाहु लिमन हमिदह’ कहते हुए सीधे खड़े हों। 5. सजदा: सात अंगों (नाक सहित माथा, दोनों हथेलियाँ, दोनों घुटने, दोनों पैर) पर झुकें और कहें ‘सुब्हाना रब्बियल अअला’। 6. बैठें, फिर दोबारा सजदा करें। आख़िरी रकअत में तशह्हुद के लिए बैठें, नबी ﷺ पर दरूद भेजें, और तस्लीम से ख़त्म करें: दाएँ और बाएँ ‘अस्सलामु अलैकुम व रहमतुल्लाह’। किसी से सामने सीखना बहुत मददगार होता है।","qs":[{"q":"रुकू (झुकने) में क्या कहते हैं?","o":["सुब्हाना रब्बियल अज़ीम","सुब्हाना रब्बियल अअला","बिस्मिल्लाह","अलहम्दुलिल्लाह"],"a":0},{"q":"सजदे में शरीर के कितने अंग ज़मीन को छूते हैं?","o":["7","3","5","10"],"a":0},{"q":"नमाज़ कैसे शुरू होती है?","o":["तकबीर: अल्लाहु अकबर","सलाम","रुकू","सजदा"],"a":0},{"q":"नमाज़ कैसे ख़त्म होती है?","o":["तस्लीम: अस्सलामु अलैकुम व रहमतुल्लाह","तकबीर","अल-फ़ातिहा","सजदा"],"a":0}]},{"id":"L25","w":5,"title":"रोज़ा और रमज़ान","teach":"रमज़ान इस्लामी कैलेंडर का नौवाँ महीना है। मुसलमान भोर (फ़ज्र) से सूर्यास्त (मग़रिब) तक रोज़ा रखते हैं: न खाना, न पीना। रोज़ा सब्र, शुक्र और ग़रीबों की परवाह सिखाता है। क़ुरआन पहली बार रमज़ान में उतरा, और लैलतुल-क़द्र, यानी शब-ए-क़द्र, इसकी आख़िरी दस रातों में है। महीने के बाद ईद-उल-फ़ित्र आती है।","qs":[{"q":"रोज़ाना का रोज़ा कब तक चलता है?","o":["भोर से सूर्यास्त तक","सूर्योदय से दोपहर तक","सूर्यास्त से भोर तक","दोपहर से रात तक"],"a":0},{"q":"लैलतुल-क़द्र कब होती है?","o":["रमज़ान की आख़िरी दस रातों में","मुहर्रम में","ज़ुल-हिज्जा में","रमज़ान की पहली रात"],"a":0},{"q":"रमज़ान के बाद कौन-सा त्योहार आता है?","o":["ईद-उल-फ़ित्र","ईद-उल-अज़हा","अरफ़ा","हिजरत"],"a":0},{"q":"रमज़ान इस्लामी कैलेंडर का कौन-सा महीना है?","o":["9वाँ","पहला","12वाँ","5वाँ"],"a":0}]},{"id":"L27","w":5,"title":"ज़कात और सदक़ा","teach":"ज़कात तीसरा स्तंभ है। यह उस बचत का 2.5% है जो एक चंद्र वर्ष तक एक न्यूनतम मात्रा (निसाब) से ऊपर रहे, और यह ज़रूरतमंदों तथा क़ुरआन में बताए गए दूसरे वर्गों को दी जाती है। सदक़ा स्वैच्छिक दान है: कोई भी राशि, यहाँ तक कि एक अच्छा बोल या मुस्कान भी। दान दौलत और दिल को पाक करता है।","qs":[{"q":"बचत पर ज़कात कितने प्रतिशत है?","o":["2.5%","10%","50%","1%"],"a":0},{"q":"स्वैच्छिक दान को क्या कहते हैं?","o":["सदक़ा","ज़कात","हज","सौम"],"a":0},{"q":"ज़कात किसके लिए है?","o":["ग़रीबों और ज़रूरतमंदों आदि के लिए","अमीर रिश्तेदारों के लिए","दुकानदारों के लिए","हर माँगने वाले के लिए"],"a":0},{"q":"दान किसे पाक करता है?","o":["दौलत और दिल को","सिर्फ़ शरीर को","घरों को","गाड़ियों को"],"a":0}]},{"id":"L29","w":5,"title":"हज और उमरा","teach":"हज ज़ुल-हिज्जा के महीने में मक्का की यात्रा है, जो सामर्थ्य वालों पर जीवन में एक बार ज़रूरी है। हाजी सादे सफ़ेद कपड़े (इहराम) पहनते हैं, काबा का चक्कर लगाते हैं (तवाफ़), सफ़ा और मरवा के बीच चलते हैं, और अरफ़ात के मैदान में ठहरते हैं, जो सबसे अहम दिन है। उमरा एक छोटी यात्रा है जो साल में किसी भी समय की जा सकती है।","qs":[{"q":"हज किस महीने में होता है?","o":["ज़ुल-हिज्जा","रमज़ान","रजब","मुहर्रम"],"a":0},{"q":"काबा के चक्कर लगाने को क्या कहते हैं?","o":["तवाफ़","सई","इहराम","वुज़ू"],"a":0},{"q":"हज का सबसे अहम दिन कौन-सा है?","o":["अरफ़ात में ठहरना","ईद","जुमा","सूर्योदय"],"a":0},{"q":"छोटी यात्रा कौन-सी है?","o":["उमरा","ज़कात","सलाह","सौम"],"a":0}]},{"id":"L15","w":6,"title":"अच्छे आचरण और चरित्र","teach":"मुसलमान ‘अस्सलामु अलैकुम’ (आप पर सलामती हो) कहकर अभिवादन करते हैं, और जवाब है ‘व अलैकुमुस्सलाम’। खाने से पहले ‘बिस्मिल्लाह’ और बाद में ‘अलहम्दुलिल्लाह’ कहें। सच बोलें, पड़ोसियों के साथ भलाई करें और माता-पिता का आदर करें: अल्लाह ने कहा है कि उन्हें ‘उफ़’ तक न कहो (क़ुरआन 17:23)। ग़ीबत से बचें, यानी किसी की पीठ पीछे उसकी बुराई करने से। नबी ﷺ ने फ़रमाया: ‘तुममें सबसे अच्छे वे हैं जिनका चरित्र सबसे अच्छा है’ (सहीह बुख़ारी)।","qs":[{"q":"‘अस्सलामु अलैकुम’ का जवाब क्या है?","o":["व अलैकुमुस्सलाम","बिस्मिल्लाह","सुब्हानल्लाह","अल्लाहु अकबर"],"a":0},{"q":"खाने से पहले हम क्या कहते हैं?","o":["बिस्मिल्लाह","अलहम्दुलिल्लाह","अस्तग़फ़िरुल्लाह","इंशाअल्लाह"],"a":0},{"q":"अल्लाह ने माता-पिता से कभी क्या न कहने को कहा है?","o":["‘उफ़’ (नाराज़गी का शब्द)","शुक्रिया","सलाम","स्वागत है"],"a":0},{"q":"नबी ﷺ के अनुसार सबसे अच्छे लोग वे हैं जिनका सबसे अच्छा हो…","o":["चरित्र","धन","घर","कपड़े"],"a":0}]},{"id":"L31","w":6,"title":"हलाल और हराम","teach":"हलाल का अर्थ है जायज़ और हराम का अर्थ है मना किया हुआ। अल्लाह ने हानिकारक चीज़ें मना की हैं, जैसे शराब, सूअर का मांस, जुआ, चोरी, झूठ और रिबा (ब्याज)। ज़्यादातर चीज़ें हलाल हैं जब तक अल्लाह ने उन्हें मना न किया हो। अपनी कमाई ईमानदारी से करें और समझदारी से ख़र्च करें। जब शक हो, तो किसी भरोसेमंद आलिम से पूछें।","qs":[{"q":"हलाल का क्या अर्थ है?","o":["जायज़","मना किया हुआ","नापसंदीदा","ज़रूरी"],"a":0},{"q":"इनमें से कौन-सा हराम है?","o":["रिबा (ब्याज)","ईमानदार व्यापार","दान देना","रोज़ा रखना"],"a":0},{"q":"ज़्यादातर चीज़ें हैं…","o":["हलाल, जब तक मना न हों","हराम, जब तक इजाज़त न हो","प्रतिबंधित","वैकल्पिक"],"a":0},{"q":"हमें धन कैसे कमाना चाहिए?","o":["ईमानदारी से","किसी भी तरीक़े से","धोखे से","जुए से"],"a":0}]},{"id":"L32","w":6,"title":"आख़िरत","teach":"हर इंसान मरेगा और अल्लाह के पास लौटेगा। फ़रिश्ते हमारे कर्म लिखते हैं। मौत के बाद क़ब्र का जीवन (बरज़ख़) आता है, फिर क़यामत का दिन, जब सबको उठाया जाएगा और हिसाब लिया जाएगा। नेक लोग अल्लाह की रहमत से जन्नत में जाएँगे। अल्लाह बहुत दयालु है और उन्हें माफ़ करता है जो सच्चे दिल से तौबा करते हैं।","qs":[{"q":"मौत के बाद क्या आता है?","o":["क़ब्र का जीवन, फिर क़यामत का दिन","कुछ नहीं","धरती पर दूसरा जीवन","हमेशा की नींद"],"a":0},{"q":"हमारे कर्म कौन लिखता है?","o":["फ़रिश्ते","इंसान","जिन्न","पक्षी"],"a":0},{"q":"जन्नत को अरबी में क्या कहते हैं?","o":["जन्नत","जहन्नम","बरज़ख़","क़दर"],"a":0},{"q":"अल्लाह उन्हें माफ़ करता है जो…","o":["सच्चे दिल से तौबा करते हैं","घमंड करते हैं","कभी नमाज़ नहीं पढ़ते","छिपते हैं"],"a":0}]},{"id":"N3","title":"दुआ कैसे करें","teach":"दुआ का अर्थ है अल्लाह से माँगना। नबी ﷺ ने फ़रमाया: ‘दुआ इबादत है’ (अबू दाऊद, तिर्मिज़ी)। दुआ के अच्छे आदाब: अल्लाह की प्रशंसा और नबी ﷺ पर दरूद से शुरू करें, सच्चे दिल से माँगें, यक़ीन रखें कि अल्लाह सुनता है, बार-बार माँगें, और कभी गुनाह की चीज़ न माँगें। रात का आख़िरी तिहाई, नमाज़ में सजदे की हालत और अज़ान व इक़ामत के बीच का समय ऐसे वक़्त हैं जब दुआ की ख़ास उम्मीद होती है। अल्लाह वही दे सकता है जो आपने माँगा, या कोई बुराई आपसे दूर कर सकता है, या उसका बदला आख़िरत के लिए जमा रख सकता है।","qs":[{"q":"नबी ﷺ ने फ़रमाया कि दुआ…","o":["इबादत है","सिर्फ़ बीमारों के लिए है","सिर्फ़ जुमे के लिए है","एक रिवाज है"],"a":0},{"q":"दुआ शुरू करने का अच्छा तरीक़ा है…","o":["अल्लाह की प्रशंसा से","शिकायत से","चिल्लाने से","बुराई माँगने से"],"a":0},{"q":"दुआ के लिए ख़ास उम्मीद का वक़्त कौन-सा है?","o":["रात का आख़िरी तिहाई","रात में कभी नहीं","सिर्फ़ दोपहर में","सिर्फ़ रमज़ान में"],"a":0},{"q":"अगर आपकी दुआ का जवाब तुरंत न दिखे, तो आपको…","o":["माँगते रहना चाहिए और अल्लाह पर भरोसा रखना चाहिए","माँगना छोड़ देना चाहिए","सिर्फ़ ख़ुद को दोष देना चाहिए","अल्लाह की जगह किसी और से माँगना चाहिए"],"a":0}],"w":6},{"id":"N4","title":"तौहीद के तीन भाग","teach":"विद्वान अक्सर तौहीद को तीन भागों में समझाते हैं। तौहीद अर-रुबूबिय्यह: अल्लाह ही अकेला पालनहार, रचयिता और रोज़ी देने वाला है। तौहीद अल-उलूहिय्यह: सिर्फ़ अल्लाह ही इबादत के लायक़ है। तौहीद अल-अस्मा वस-सिफ़ात: अल्लाह के नामों और गुणों पर वैसे ही ईमान रखना जैसे क़ुरआन और सुन्नत में आए हैं, उसकी तुलना उसकी रचना से किए बिना। यह इस विषय को समझाने का एक प्रचलित तरीक़ा है।","qs":[{"q":"विद्वान तौहीद को अक्सर कितने भागों में बाँटते हैं?","o":["3","2","5","7"],"a":0},{"q":"तौहीद अर-रुबूबिय्यह का अर्थ है कि सिर्फ़ अल्लाह ही…","o":["पालनहार और रचयिता है","एकमात्र नबी है","एकमात्र फ़रिश्ता है","एकमात्र शहर है"],"a":0},{"q":"तौहीद अल-उलूहिय्यह का अर्थ है कि सिर्फ़ अल्लाह ही लायक़ है…","o":["इबादत के","करों के","सेनाओं के","घर के"],"a":0},{"q":"तौहीद अल-अस्मा वस-सिफ़ात किस पर ईमान है?","o":["अल्लाह के नामों और गुणों पर","शहरों के नामों पर","सिर्फ़ फ़रिश्तों के नामों पर","महीनों के नामों पर"],"a":0}],"w":7},{"id":"N5","title":"शिर्क और ईमान को नुक़सान पहुँचाने वाली बातें","teach":"शिर्क का अर्थ है अल्लाह का साझी ठहराना। अगर इंसान इसी हालत में मरे तो यह सबसे बड़ा गुनाह है (क़ुरआन 4:48)। इसमें अल्लाह के सिवा किसी की इबादत करना या उससे दुआ माँगना शामिल है। छोटा शिर्क भी है, जैसे इबादत में दिखावा करना, जिसे रिया कहते हैं। नबी ﷺ को अपने मानने वालों के लिए इसका डर था। तौबा का दरवाज़ा खुला रहता है: अल्लाह उन्हें माफ़ करता है जो मौत से पहले सच्चे दिल से उसकी ओर लौट आते हैं।","qs":[{"q":"शिर्क का क्या अर्थ है?","o":["अल्लाह का साझी ठहराना","रोज़ा छूट जाना","देर करना","ज़्यादा खाना"],"a":0},{"q":"इबादत में दिखावा करने को क्या कहते हैं?","o":["रिया","ज़कात","सजदा","हिजरत"],"a":0},{"q":"क्या तौबा का दरवाज़ा खुला है?","o":["हाँ, मौत तक","नहीं, कभी नहीं","सिर्फ़ जुमे को","सिर्फ़ विद्वानों के लिए"],"a":0},{"q":"हमें किससे दुआ करनी चाहिए और किस पर भरोसा रखना चाहिए?","o":["सिर्फ़ अल्लाह पर","संतों पर","सूरज पर","पूर्वजों पर"],"a":0}],"w":7},{"id":"N6","title":"हदीस की श्रेणियाँ कैसे तय होती हैं","teach":"हदीस नबी ﷺ की बातों, कामों या स्वीकृतियों का बयान है। इसके दो भाग होते हैं: इस्नाद (रावियों की कड़ी) और मत्न (मूल पाठ)। विद्वानों ने हर रावी की जाँच की और हदीसों को सहीह (प्रामाणिक), हसन (अच्छी), ज़ईफ़ (कमज़ोर) या मौज़ू (गढ़ी हुई) में बाँटा। सहीह बुख़ारी और सहीह मुस्लिम सबसे भरोसेमंद किताबें हैं। अबू दाऊद, तिर्मिज़ी, नसाई और इब्न माजा के साथ मिलकर ये छह मुख्य संग्रह बनाती हैं।","qs":[{"q":"हदीस का इस्नाद है…","o":["रावियों की कड़ी","मूल पाठ","शीर्षक","किताब का आवरण"],"a":0},{"q":"हदीस का मत्न है…","o":["मूल पाठ","रावियों की कड़ी","श्रेणी","अनुवादक"],"a":0},{"q":"मौज़ू का क्या अर्थ है?","o":["गढ़ी हुई","प्रामाणिक","अच्छी","प्रसिद्ध"],"a":0},{"q":"हदीस के कितने मुख्य संग्रह हैं?","o":["6","3","10","99"],"a":0}],"w":7},{"id":"N7","title":"इस्लामी क़ानून के स्रोत","teach":"इस्लामी क़ानून (शरीअत) क्रम से स्रोतों से लिया जाता है। 1. क़ुरआन। 2. सुन्नत, यानी नबी ﷺ की शिक्षाएँ और उनका आदर्श। 3. इज्मा, यानी किसी हुक्म पर विद्वानों की सहमति। 4. क़ियास, यानी किसी ज्ञात हुक्म से तुलना करके निकाला गया निष्कर्ष। फ़िक़्ह इन हुक्मों की योग्य विद्वानों द्वारा समझ है। जब हमें कोई बात न पता हो, तो हम इल्म वालों से पूछते हैं।","qs":[{"q":"इस्लामी क़ानून का पहला स्रोत क्या है?","o":["क़ुरआन","इज्मा","क़ियास","रिवाज"],"a":0},{"q":"सुन्नत का अर्थ है…","o":["नबी ﷺ की शिक्षाएँ और आदर्श","एक शहर","एक प्रकार की जानमाज़","रोज़े का महीना"],"a":0},{"q":"इज्मा है…","o":["विद्वानों की सहमति","एक त्योहार","एक दान","एक नमाज़"],"a":0},{"q":"जब हमें कोई हुक्म न पता हो तो हम क्या करें?","o":["इल्म वालों से पूछें","अंदाज़ा लगाएँ","अनदेखा करें","ऑनलाइन किसी से भी पूछ लें"],"a":0}],"w":8},{"id":"N8","title":"चार ख़ुलफ़ा-ए-राशिदीन","teach":"नबी ﷺ के बाद मुसलमानों का नेतृत्व चार सही मार्ग पर चलने वाले ख़लीफ़ाओं (अल-ख़ुलफ़ा अर-राशिदून) ने किया: अबू बक्र अस-सिद्दीक़, उमर इब्न अल-ख़त्ताब, उस्मान इब्न अफ़्फ़ान और अली इब्न अबी तालिब, अल्लाह उन सबसे राज़ी हो। अबू बक्र ने क़ुरआन इकट्ठा करवाया, उमर न्याय के लिए जाने जाते थे, उस्मान ने मानक पाठ की प्रतियाँ बनवाईं, और अली नबी ﷺ के चचेरे भाई और दामाद थे। यह क्रम और उनके दर्जे के बारे में सुन्नी दृष्टिकोण है।","qs":[{"q":"सही मार्ग पर चलने वाले कितने ख़लीफ़ा थे?","o":["4","2","3","7"],"a":0},{"q":"पहले ख़लीफ़ा कौन थे?","o":["अबू बक्र","उमर","उस्मान","अली"],"a":0},{"q":"क़ुरआन के मानक पाठ की प्रतियाँ किसने बनवाईं?","o":["उस्मान ने","उमर ने","बिलाल ने","हमज़ा ने"],"a":0},{"q":"अली नबी ﷺ के…","o":["चचेरे भाई और दामाद थे","भाई थे","चाचा थे","शिक्षक थे"],"a":0}],"w":8},{"id":"N9","title":"फ़िक़्ह के चार मसलक","teach":"सुन्नी मुसलमान फ़िक़्ह के चार पारंपरिक मसलकों में से किसी एक का पालन करते हैं: हनफ़ी (अबू हनीफ़ा), मालिकी (मालिक इब्न अनस), शाफ़ई (इमाम शाफ़ई) और हंबली (अहमद इब्न हंबल)। वे अक़ीदे और इस्लाम के स्तंभों पर एकमत हैं, और कुछ बारीकियों में अलग हैं, जैसे इबादत के कुछ हिस्से कैसे किए जाएँ। गौण मामलों में विद्वानों के बीच मतभेद सामान्य हैं और झगड़े का कारण नहीं हैं। पूर्वी अफ़्रीका "tp_dhikr":"الذكر والدعاء","tp_community":"المجتمع","nm_title":"أسماء الله الحسنى التسعة والتسعون","nm_sub":"تعلّم الأسماء الحسنى ومعانيها.","nm_ph":"ابحث في الأسماء","nm_learned":"تم حفظها","nm_none":"لم يوجد اسم.","nm_ref":"﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾ (الأعراف 180)","nm_note":"يختلف العلماء قليلًا في عدّ الأسماء. هذه قائمة شائعة.","m_title":"المزيد","m_calm":"السكينة","m_calm_s":"تنفس ومؤقت وأصوات","m_dhikr":"التسبيح والذكر المباشر","m_dhikr_s":"عدّاد واستغفار وصلاة على النبي","m_journal":"المفكرة","m_journal_s":"اكتب ما تشعر به","m_juz":"القرآن بالأجزاء","m_juz_s":"تابع ختمتك","m_support":"ادعم المطوّر","m_support_s":"اختياري، من نحو دولار","m_lang":"اللغة","m_back":"المزيد","m_free":"مجاني للجميع","dn_title":"ادعم المطوّر","dn_text":"تطبيق حمودي تيتش مجاني للجميع وسيبقى كذلك. إن أردت مساعدتي ومساعدة أسرتي، يمكنك إرسال تبرع صغير نحو دولار واحد (حوالي 130 شلنًا كينيًا) عبر إم-بيسا. وإن لم تستطع، فادعُ لنا فقط. وهذا يعني لنا الكثير.","dn_send":"أرسل عبر إم-بيسا إلى","dn_copy":"انسخ الرقم","dn_copied":"تم نسخ الرقم","dn_note":"التبرع اختياري. لا يعتمد شيء في التطبيق عليه."},"dua_cat":{"anx":"القلق والهمّ","dis":"الضيق وثقل القلب","fgv":"المغفرة","gui":"الهداية والإيمان","prv":"الرزق والكسب الحلال","eas":"التيسير والعلم","grf":"الحزن والفقد","fea":"الخوف والحماية","hlt":"الصحة والمرض","slp":"الاستيقاظ والنوم","fod":"الطعام والشراب","hom":"البيت والسفر","fam":"الأسرة والوالدان","grt":"الشكر والحمد","suc":"النجاح في الدنيا والآخرة","pat":"الصبر والتوكل","umm":"النبي ﷺ والمسلمون","dly":"الحياة اليومية"},"dua":{"anx1":"يا الله، أستجير بك من الهمّ والحزن، ومن العجز والكسل، ومن البخل والجبن، ومن ثقل الدَّين وغلبة الرجال.","anx2":"الله يكفيني. لا معبود بحق إلا هو. عليه توكلت، وهو ربّ العرش العظيم.","anx3":"يا الله، أرجو رحمتك. لا تتركني لنفسي طرفة عين، وأصلح لي شأني كله. لا معبود بحق إلا أنت.","anx4":"لا معبود بحق إلا الله العظيم الحليم. لا معبود بحق إلا الله ربّ العرش العظيم. لا معبود بحق إلا الله ربّ السماوات وربّ الأرض وربّ العرش الكريم.","dis1":"﴿لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ﴾","dis2":"يا حيّ يا قيّوم، برحمتك أطلب الفرج والغوث.","dis3":"﴿حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ﴾","fgv1":"ربّ اغفر لي وتُب عليّ. إنك أنت التواب الرحيم.","fgv2":"يا الله، أنت ربي لا معبود بحق إلا أنت. خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت. أستجير بك من شرّ ما صنعت. أعترف بنعمتك عليّ وأعترف بذنبي، فاغفر لي، فإنه لا يغفر الذنوب إلا أنت.","fgv3":"﴿رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ﴾","fgv4":"يا الله، إنك عفوّ تحب العفو، فاعفُ عني.","fgv5":"أطلب من الله المغفرة وأرجع إليه تائبًا.","gui1":"﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ﴾","gui2":"﴿رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ﴾","gui3":"يا مقلّب القلوب، ثبّت قلبي على دينك.","gui4":"يا الله، أسألك الهدى والتقى والعفاف والغنى.","prv1":"يا الله، اكفني بحلالك عن حرامك، وأغنني بفضلك عمّن سواك.","prv2":"يا الله، أسألك علمًا نافعًا ورزقًا طيبًا وعملًا مقبولًا.","prv3":"﴿رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾","eas1":"﴿رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي﴾","eas2":"﴿رَّبِّ زِدْنِي عِلْمًا﴾","eas3":"يا الله، لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحزن إذا شئت سهلًا.","grf1":"﴿إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ﴾ يا الله، أجرني في مصيبتي وعوّضني خيرًا منها.","grf2":"يا الله، اغفر له وارحمه وعافه واعفُ عنه.","fea1":"بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء، وهو السميع العليم.","fea2":"أستجير بكلمات الله التامات من شرّ ما خلق.","fea3":"يا الله، نجعلك في نحورهم ونستجير بك من شرورهم.","hlt1":"يا الله، ربّ الناس، أذهب البأس واشفِ، أنت الشافي. لا شفاء إلا شفاؤك، شفاءً لا يترك مرضًا.","hlt2":"ضع يدك على موضع الألم وقل: بسم الله ثلاثًا، ثم قل: أعوذ بعزة الله وقدرته من شرّ ما أجد وأحاذر.","hlt3":"عند زيارة المريض قل سبع مرات: أسأل الله العظيم ربّ العرش العظيم أن يشفيك.","hlt4":"يا الله، عافني في بدني. يا الله، عافني في سمعي. يا الله، عافني في بصري. لا معبود بحق إلا أنت.","slp1":"الحمد لله الذي أحيانا بعد ما أماتنا، وإليه البعث.","slp2":"باسمك يا الله أموت وأحيا.","slp3":"يا الله، قني عذابك يوم تبعث عبادك.","fod1":"بسم الله. قلها قبل الأكل.","fod2":"الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة.","fod3":"عند الإفطار قل: ذهب الظمأ، وابتلت العروق، وثبت الأجر إن شاء الله.","hom1":"بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله. قلها عند الخروج من البيت.","hom2":"قل عند دخول البيت: بسم الله ولجنا، وبسم الله خرجنا، وعلى ربنا توكلنا.","hom3":"﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ﴾ قلها عند السفر.","fam1":"﴿رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا﴾","fam2":"﴿رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي ۖ إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ﴾","fam3":"﴿رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾","fam4":"﴿رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ﴾","grt1":"الحمد لله حمدًا كثيرًا طيبًا مباركًا.","grt2":"يا الله، ما أصبح بي أو بأحد من خلقك من نعمة فمنك وحدك لا شريك لك. فلك الحمد ولك الشكر.","grt3":"يا الله، أعني على ذكرك وشكرك وحسن عبادتك.","suc1":"﴿رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ﴾","suc2":"يا الله، أسألك الجنة وأستجير بك من النار.","suc3":"يا الله، أصلح لي ديني الذي هو حفظ أمري. وأصلح لي دنياي التي فيها معاشي. وأصلح لي آخرتي التي إليها مرجعي. واجعل الحياة زيادة لي في كل خير، واجعل الموت راحة لي من كل شرّ.","pat1":"﴿رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا﴾","pat2":"﴿أَنِّي مَغْلُوبٌ فَانتَصِرْ﴾","pat3":"﴿وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ ۚ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ﴾","umm1":"يا الله، صلّ على محمد وعلى آل محمد كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد. يا الله، بارك على محمد وعلى آل محمد كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد.","umm2":"﴿رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ﴾","dly1":"قل قبل دخول الخلاء: يا الله، أستجير بك من الخبث والخبائث.","dly2":"قل عند لبس ثوب جديد: الحمد لله الذي كساني هذا ورزقنيه من غير حول مني ولا قوة.","dly3":"قل عند نزول المطر: يا الله، اجعله مطرًا نافعًا.","dly4":"قل عند النظر في المرآة: يا الله، كما حسّنت خَلقي فحسّن خُلقي.","dly5":"قل: الحمد لله إذا عطست. ويرد عليك الآخرون: يرحمك الله. فتقول: يهديكم الله ويصلح بالكم."},"adhkar":{"am1":{"h":"آية الكرسي","en":"سورة البقرة 255. حماية طوال اليوم."},"am2":{"h":"الإخلاص والفلق والناس","en":"اقرأ كل سورة من السور القصيرة الثلاث ثلاث مرات."},"am3":{"h":"حمد الصباح","en":"أصبحنا وأصبح الملك كله لله. والحمد لله. لا معبود بحق إلا الله وحده لا شريك له. له الملك وله الحمد وهو على كل شيء قدير. (صحيح مسلم)"},"am4":{"h":"بك أصبحنا","en":"يا الله، بك أصبحنا وبك أمسينا. وبك نحيا وبك نموت، وإليك البعث. (الترمذي)"},"am5":{"h":"الرضا بالله","en":"رضيت بالله ربًّا وبالإسلام دينًا وبمحمد نبيًّا. (أبو داود)"},"am6":{"h":"سبحان الله وبحمده","en":"أنزّه الله وأحمده. (صحيح مسلم)"},"am7":{"h":"طلب المغفرة","en":"أطلب من الله المغفرة وأرجع إليه تائبًا."},"pm1":{"h":"آية الكرسي","en":"سورة البقرة 255. حماية طوال الليل."},"pm2":{"h":"الإخلاص والفلق والناس","en":"اقرأ كل سورة من السور القصيرة الثلاث ثلاث مرات."},"pm3":{"h":"حمد المساء","en":"أمسينا وأمسى الملك كله لله. والحمد لله. لا معبود بحق إلا الله وحده لا شريك له. له الملك وله الحمد وهو على كل شيء قدير. (صحيح مسلم)"},"pm4":{"h":"بك أمسينا","en":"يا الله، بك أمسينا وبك أصبحنا. وبك نحيا وبك نموت، وإليك المصير. (الترمذي)"},"pm5":{"h":"الاستعاذة","en":"أستجير بكلمات الله التامات من شرّ ما خلق. (صحيح مسلم)"},"pm6":{"h":"الرضا بالله","en":"رضيت بالله ربًّا وبالإسلام دينًا وبمحمد نبيًّا. (أبو داود)"},"pm7":{"h":"سبحان الله وبحمده","en":"أنزّه الله وأحمده. (صحيح مسلم)"},"sl1":{"h":"آية الكرسي","en":"سورة البقرة 255. من قرأها عند النوم كان عليه من الله حافظ طوال الليل. (صحيح البخاري)"},"sl2":{"h":"آخر آيتين من سورة البقرة","en":"سورة البقرة 285-286. تكفيان من قرأهما في الليل. (صحيح البخاري، صحيح مسلم)"},"sl3":{"h":"الإخلاص والفلق والناس","en":"اجمع كفّيك وانفث فيهما، واقرأ السور الثلاث، ثم امسح بيديك جسدك، مبتدئًا بالرأس والوجه. افعل ذلك ثلاث مرات. (صحيح البخاري)"},"sl4":{"h":"سورة الملك","en":"كان النبي ﷺ لا ينام حتى يقرأ الملك والسجدة. (الترمذي)"},"sl5":{"h":"سورة السجدة","en":"السورة 32، تُقرأ قبل النوم مع سورة الملك."},"sl6":{"h":"التسبيح قبل النوم","en":"سبحان الله 33 مرة، والحمد لله 33 مرة، والله أكبر 34 مرة. (صحيح البخاري)"},"sl7":{"h":"باسمك أموت وأحيا","en":"باسمك يا الله أموت وأحيا. (صحيح البخاري)"},"sl8":{"h":"الحماية يوم القيامة","en":"يا الله، قني عذابك يوم تبعث عبادك. (أبو داود)"}},"hadith":{"h1":"الأعمال بالنيات، وإنما لكل امرئ ما نوى.","h2":"بُني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدًا رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان.","h3":"الدين النصيحة. قلنا: لمن؟ قال: لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم.","h4":"من حسن إسلام المرء تركه ما لا يعنيه.","h5":"لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه.","h6":"من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت.","h7":"قال رجل للنبي ﷺ: أوصني. قال: لا تغضب. فردد الرجل ذلك مرارًا، وكل مرة يقول: لا تغضب.","h8":"اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها، وخالق الناس بخلق حسن.","h9":"احفظ الله يحفظك. احفظ الله تجده أمامك. إذا سألت فاسأل الله، وإذا استعنت فاستعن بالله.","h10":"كن في الدنيا كأنك غريب أو عابر سبيل.","h11":"لا ضرر ولا ضرار.","h12":"خيركم من تعلّم القرآن وعلّمه.","h13":"كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده، سبحان الله العظيم.","h14":"الدعاء هو العبادة.","h15":"إن من خياركم أحسنكم أخلاقًا.","h16":"المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كل خير.","h17":"تبسمك في وجه أخيك صدقة.","h18":"يسّروا ولا تعسّروا، وبشّروا ولا تنفّروا.","h19":"من لا يشكر الناس لا يشكر الله.","h20":"ترى المؤمنين في تراحمهم وتوادّهم وتعاطفهم كالجسد الواحد: إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمى.","h21":"ارحموا من في الأرض يرحمكم من في السماء (الله).","h22":"المسلم من سلم المسلمون من لسانه ويده.","h23":"من سلك طريقًا يلتمس فيه علمًا سهّل الله له به طريقًا إلى الجنة.","h24":"طلب العلم فريضة على كل مسلم.","h25":"من كان يؤمن بالله واليوم الآخر فلا يؤذِ جاره.","h26":"ليس الغنى عن كثرة المال، ولكن الغنى غنى النفس.","h27":"عجبًا لأمر المؤمن: إن أمره كله خير، وليس ذلك لأحد إلا للمؤمن. إن أصابته سراء شكر فكان خيرًا له، وإن أصابته ضراء صبر فكان خيرًا له.","h28":"إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم.","h29":"أحب الأعمال إلى الله أدومها وإن قلّ.","h30":"من قال: سبحان الله وبحمده، مئة مرة في اليوم، غُفرت ذنوبه وإن كانت مثل زبد البحر."},"names":{"n1":"ذو الرحمة الواسعة","n2":"الرحيم بعباده","n3":"المالك لكل شيء","n4":"المنزّه عن كل نقص","n5":"السالم من كل عيب","n6":"الذي يمنح الأمان","n7":"المهيمن على كل شيء","n8":"الغالب الذي لا يُغلب","n9":"الذي يجبر ما شاء","n10":"العظيم في كبريائه","n11":"الذي أوجد الخلق","n12":"الذي أنشأ الخلق من العدم","n13":"الذي صوّر الخلق كما شاء","n14":"كثير المغفرة","n15":"الغالب القاهر","n16":"كثير العطاء بلا مقابل","n17":"الذي يعطي الرزق لخلقه","n18":"الذي يفتح أبواب الخير","n19":"الذي أحاط علمه بكل شيء","n20":"الذي يمسك الرزق عمّن يشاء","n21":"الذي يوسّع الرزق لمن يشاء","n22":"الذي يخفض من يشاء","n23":"الذي يرفع من يشاء","n24":"الذي يعزّ من يشاء","n25":"الذي يُذلّ من يشاء","n26":"الذي يسمع كل شيء","n27":"الذي يرى كل شيء","n28":"الذي يفصل بين الخلق بالحق","n29":"العادل الذي لا يظلم","n30":"اللطيف بعباده العالم بدقائق الأمور","n31":"العالم بخفايا الأمور","n32":"الذي لا يعجل بالعقوبة","n33":"العظيم الجليل","n34":"الذي يستر الذنوب ويغفرها","n35":"الذي يجازي على القليل بالكثير","n36":"العالي فوق خلقه","n37":"الكبير الذي لا أكبر منه","n38":"الحافظ لكل شيء","n39":"المقتدر الذي يقوت الخلق","n40":"الكافي الذي يحاسب عباده","n41":"ذو العظمة والجلال","n42":"كثير الجود والخير","n43":"الذي يراقب كل شيء","n44":"الذي يجيب من دعاه","n45":"واسع الفضل والعلم","n46":"الذي يضع كل شيء في موضعه","n47":"الذي يحب عباده الصالحين","n48":"ذو المجد والشرف العظيم","n49":"الذي يبعث الخلق بعد الموت","n50":"المطّلع على كل شيء","n51":"الثابت الذي لا شك فيه","n52":"الذي يتولى أمور عباده","n53":"صاحب القوة الكاملة","n54":"شديد القوة الذي لا يضعف","n55":"الناصر لأوليائه","n56":"المستحق للحمد","n57":"الذي أحصى كل شيء","n58":"الذي بدأ الخلق","n59":"الذي يعيد الخلق بعد فنائه","n60":"الذي يهب الحياة","n61":"الذي يقبض الأرواح","n62":"الدائم الحياة الذي لا يموت","n63":"القائم بنفسه المقيم لغيره","n64":"الذي لا يفوته شيء","n65":"الشريف الكثير الخير","n66":"المتفرّد بالألوهية","n67":"الذي لا مثيل له","n68":"الذي يقصده الخلق في حاجاتهم","n69":"الذي لا يعجزه شيء","n70":"صاحب القدرة التامة","n71":"الذي يقدّم من يشاء","n72":"الذي يؤخّر من يشاء","n73":"الذي ليس قبله شيء","n74":"الذي ليس بعده شيء","n75":"الذي ليس فوقه شيء","n76":"الذي ليس دونه شيء","n77":"المتولي أمور خلقه","n78":"المتعالي عن كل نقص","n79":"كثير الإحسان إلى عباده","n80":"الذي يقبل توبة التائبين","n81":"الذي ينتقم من الظالمين","n82":"الذي يتجاوز عن الذنوب","n83":"شديد الرأفة بعباده","n84":"المالك لكل الملك","n85":"صاحب العظمة والإكرام","n86":"العادل في حكمه","n87":"الذي يجمع الخلق ليوم الحساب","n88":"الغني عن كل أحد","n89":"الذي يغني من يشاء","n90":"الذي يمنع ما يشاء","n91":"الذي يقدّر الضرر لحكمة","n92":"الذي يقدّر النفع لمن يشاء","n93":"منوّر السماوات والأرض","n94":"الذي يهدي من يشاء","n95":"الذي أبدع الخلق على غير مثال","n96":"الدائم الذي لا يفنى","n97":"الباقي بعد فناء الخلق","n98":"الذي يرشد الخلق إلى الخير","n99":"الذي لا يعجل على العصاة"},"course":[{"id":"L1","w":1,"title":"من هو الله؟","teach":"يؤمن المسلمون بإله واحد هو الله. هو خالق كل شيء، لا شريك له ولا ولد له، وليس كمثله شيء. وهذا الإيمان يسمى التوحيد. وكلمة الإسلام تعني الاستسلام لله بسلام، والمسلم هو من يستسلم له. الله هو الرحمن الأكثر رحمة، وهو الخالق.","qs":[{"q":"ماذا يعني التوحيد؟","o":["الإيمان بأن الله واحد","صيام رمضان","الصلاة خمس مرات","إعطاء الصدقة"],"a":0},{"q":"ماذا يعني اسم الرحمن؟","o":["واسع الرحمة","الخالق","الغفور","العلي"],"a":0},{"q":"المسلم هو من…","o":["يستسلم لله","يسكن في مكة","يتكلم العربية","وُلد في أسرة مسلمة"],"a":0},{"q":"صح أم خطأ: لله شركاء.","o":["صح","خطأ"],"a":1}]},{"id":"N1","title":"أسماء الله الحسنى","teach":"لله تسعة وتسعون اسمًا حسنى، وردت في القرآن والسنة. قال النبي ﷺ: إن لله تسعة وتسعين اسمًا، من حفظها وعمل بها دخل الجنة (صحيح البخاري، صحيح مسلم). ومنها الرحمن والملك والغفار. ندعو الله بأسمائه عندما ندعوه: ﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾ (الأعراف 180). تجد الأسماء التسعة والتسعين كلها في تبويب الأسماء.","qs":[{"q":"كم عدد أسماء الله الحسنى المشهورة؟","o":["99","33","40","114"],"a":0},{"q":"ماذا يعني اسم الغفار؟","o":["كثير المغفرة","الملك","الخالق","الرزاق"],"a":0},{"q":"ماذا أمرنا الله أن نفعل بأسمائه الحسنى؟","o":["ندعوه بها","نخفيها","نقرؤها مرة واحدة فقط","نكتبها على الجدران"],"a":0},{"q":"ماذا يعني اسم الملك؟","o":["المالك لكل شيء","الشافي","الحَكَم","النور"],"a":0}],"w":1},{"id":"L3","w":1,"title":"أركان الإيمان الستة","teach":"الإيمان هو التصديق. يؤمن المسلم بستة أشياء: الله، وملائكته، وكتبه، ورسله، واليوم الآخر، والقدر، وهو علم الله وتقديره لكل شيء، خيره وشره. خُلقت الملائكة من نور، والبشر من طين، والجن من نار لا دخان فيها.","qs":[{"q":"كم عدد أركان الإيمان؟","o":["6","5","4","7"],"a":0},{"q":"أيٌّ مما يلي ليس من أركان الإيمان الستة؟","o":["الصيام","الإيمان بالملائكة","الإيمان باليوم الآخر","الإيمان بكتب الله"],"a":0},{"q":"خُلقت الملائكة من…","o":["نور","طين","نار لا دخان فيها","ماء"],"a":0},{"q":"خُلق البشر من…","o":["طين","نور","نار لا دخان فيها","حجر"],"a":0}]},{"id":"L5","w":1,"title":"أركان الإسلام الخمسة","teach":"بُني الإسلام على خمسة أركان. 1. الشهادة: إعلان الإيمان. 2. الصلاة: خمس مرات في اليوم. 3. الزكاة: إخراج جزء من المال للفقراء. 4. الصيام: صوم رمضان. 5. الحج: قصد مكة مرة في العمر لمن استطاع.","qs":[{"q":"كم عدد أركان الإسلام؟","o":["5","6","3","4"],"a":0},{"q":"أي ركن هو الصلاة خمس مرات في اليوم؟","o":["الصلاة","الزكاة","الحج","الصيام"],"a":0},{"q":"في أي شهر يصوم المسلمون؟","o":["رمضان","شوال","محرم","رجب"],"a":0},{"q":"الحج واجب…","o":["مرة في العمر لمن استطاع","كل سنة","كل شهر","على العلماء فقط"],"a":0}]},{"id":"L7","w":2,"title":"نطق الشهادة","teach":"الشهادة هي إعلان الإيمان الذي يصير به الإنسان مسلمًا: «أشهد أن لا إله إلا الله، وأشهد أن محمدًا رسول الله». ومعناها: أعلن أنه لا معبود بحق إلا الله، وأعلن أن محمدًا رسول الله. ويجب قولها بفهم وإخلاص.","ar":"أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","qs":[{"q":"ماذا تعني الشهادة؟","o":["الإقرار والإعلان","الصيام","الصلاة","الصدقة"],"a":0},{"q":"الجزء الأول يقول: لا إله إلا…","o":["الله","النبي","الملائكة","الكعبة"],"a":0},{"q":"الجزء الثاني يقول إن محمدًا…","o":["رسول الله","ملك","مَلَك","إله"],"a":0},{"q":"تُقال الشهادة…","o":["بفهم وإخلاص","بصوت عالٍ فقط","مع جماعة فقط","بالعربية فقط"],"a":0}]},{"id":"L21","w":2,"title":"أنبياء الله","teach":"أرسل الله أنبياء إلى كل أمة برسالة واحدة: اعبدوا الله وحده. ذكر القرآن منهم 25 نبيًا، منهم آدم ونوح وإبراهيم وموسى وعيسى ومحمد ﷺ خاتم الأنبياء. أُعطي موسى التوراة، وداود الزبور، وعيسى الإنجيل، ومحمد ﷺ القرآن.","qs":[{"q":"من هو خاتم الأنبياء؟","o":["محمد ﷺ","عيسى","موسى","إبراهيم"],"a":0},{"q":"أي كتاب أُعطي لموسى؟","o":["التوراة","الإنجيل","الزبور","القرآن"],"a":0},{"q":"نزل القرآن على…","o":["محمد ﷺ","داود","عيسى","نوح"],"a":0},{"q":"ما رسالة كل نبي؟","o":["اعبدوا الله وحده","ابنوا المدن","ابدؤوا التجارة","اطلبوا السلطة"],"a":0}]},{"id":"L17","w":2,"title":"النبي ﷺ: السنوات الأولى","teach":"وُلد محمد ﷺ في مكة نحو سنة 570 م، في عام الفيل. مات أبوه قبل ولادته، وماتت أمه وهو في السادسة تقريبًا. كفله جده ثم عمه أبو طالب. عُرف بالصادق الأمين. وفي سن الخامسة والعشرين تزوج خديجة رضي الله عنها.","qs":[{"q":"أين وُلد النبي ﷺ؟","o":["مكة","المدينة","القدس","الطائف"],"a":0},{"q":"كان يُعرف بـ…","o":["الصادق الأمين","الأغنى","الأقوى","الشاعر"],"a":0},{"q":"من تزوج في سن 25؟","o":["خديجة","عائشة","حفصة","مريم"],"a":0},{"q":"من كفله بعد جده؟","o":["عمه أبو طالب","أبو لهب","أبو بكر","عمر"],"a":0}]},{"id":"L19","w":3,"title":"الوحي والهجرة","teach":"في سن الأربعين، في غار حراء، جاء الملك جبريل بأول وحي: «اقرأ»، وهي بداية سورة العلق. ودعا النبي ﷺ الناس إلى الله في مكة ثلاث عشرة سنة وواجه الأذى. وفي سنة 622 م هاجر إلى المدينة. وهذه الهجرة بداية التقويم الهجري.","qs":[{"q":"أين نزل الوحي أول مرة؟","o":["غار حراء","الكعبة","المدينة","جبل سيناء"],"a":0},{"q":"ما أول كلمة نزلت؟","o":["اقرأ","بسم الله","قل","الحمد لله"],"a":0},{"q":"الهجرة كانت إلى…","o":["المدينة","مصر","اليمن","بغداد"],"a":0},{"q":"الهجرة هي بداية…","o":["التقويم الهجري","رمضان","الحج","العيد"],"a":0}]},{"id":"L23","w":3,"title":"المدينة وفتح مكة","teach":"في المدينة بنى النبي ﷺ أول مسجد، وهو مسجد قباء، ثم المسجد النبوي، وأقام مجتمعًا قائمًا على الأخوة والعدل. وفي سنة 630 م فُتحت مكة للمسلمين، وعفا النبي ﷺ عمّن عاداه. وتوفي سنة 632 م وعمره 63 عامًا، ودُفن في المدينة.","qs":[{"q":"ما أول ما بناه النبي ﷺ في المدينة؟","o":["مسجد","قلعة","سوق","مدرسة"],"a":0},{"q":"كيف عامل أعداءه السابقين في مكة؟","o":["عفا عنهم","عاقبهم","تجاهلهم","نفاهم"],"a":0},{"q":"أين دُفن النبي ﷺ؟","o":["المدينة","مكة","الطائف","القدس"],"a":0},{"q":"أي سورة تتحدث عن النصر ودخول الناس في الإسلام جماعات؟","o":["النصر","الفيل","العصر","قريش"],"a":0}]},{"id":"N2","title":"القرآن: الوحي وحفظه","teach":"القرآن كلام الله، نزل على النبي ﷺ بالعربية في نحو 23 سنة. وله 114 سورة. حُفظ وكُتب في حياة النبي ﷺ. وبعده جمعه أبو بكر في مصحف واحد، ونسخ عثمان نسخًا من النص الموحد وأرسلها إلى المدن الكبرى. وعد الله بحفظه (الحجر 9).","qs":[{"q":"كم عدد سور القرآن؟","o":["114","99","30","60"],"a":0},{"q":"في كم من الزمن نزل القرآن تقريبًا؟","o":["23 سنة","3 سنوات","40 سنة","سنة واحدة"],"a":0},{"q":"من جمع القرآن في مصحف واحد؟","o":["أبو بكر","أبو لهب","حمزة","بلال"],"a":0},{"q":"من أرسل نسخ النص الموحد إلى المدن الكبرى؟","o":["عثمان","علي","عمر","خالد"],"a":0}],"w":3},{"id":"L9","w":4,"title":"الوضوء: الطهارة للصلاة","teach":"الوضوء هو الغسل المطلوب قبل الصلاة. انوِ بقلبك وقل بسم الله. ثم اغسل يديك 3 مرات، وتمضمض 3 مرات، واستنشق الماء واستنثر 3 مرات، واغسل وجهك 3 مرات، واغسل ذراعيك إلى المرفقين 3 مرات (اليمنى ثم اليسرى)، وامسح رأسك مرة واحدة (مع الأذنين)، واغسل قدميك إلى الكعبين 3 مرات (اليمنى ثم اليسرى). ينتقض الوضوء بقضاء الحاجة، وخروج الريح، والنوم العميق، وزوال العقل.","qs":[{"q":"ماذا تقول في بداية الوضوء؟","o":["بسم الله","الله أكبر","الحمد لله","سبحان الله"],"a":0},{"q":"كم مرة يُمسح الرأس؟","o":["مرة واحدة","ثلاث مرات","لا يُمسح","سبع مرات"],"a":0},{"q":"أيٌّ مما يلي ينقض الوضوء؟","o":["النوم العميق","أكل الخبز","المشي","القراءة"],"a":0},{"q":"تُغسل الذراعان إلى…","o":["المرفقين","الرسغين","الكتفين","الركبتين"],"a":0}]},{"id":"L11","w":4,"title":"الصلاة: الأوقات والركعات","teach":"يصلي المسلمون خمس مرات في اليوم، متجهين إلى القبلة، أي جهة الكعبة في مكة. الفجر ركعتان، والظهر 4، والعصر 4، والمغرب 3، والعشاء 4. والركعة دورة من القيام والركوع والسجود. احرص على أداء كل صلاة في وقتها.","qs":[{"q":"كم ركعة صلاة الفجر؟","o":["2","3","4","5"],"a":0},{"q":"أي صلاة ركعاتها 3؟","o":["المغرب","الفجر","العصر","العشاء"],"a":0},{"q":"إلى أي جهة يتجه المسلمون في الصلاة؟","o":["القبلة، نحو الكعبة","الشمال","الشرق","الشمس"],"a":0},{"q":"كم عدد الصلوات في اليوم؟","o":["5","3","4","6"],"a":0}]},{"id":"L13","w":4,"title":"كيف تصلي: خطوة بخطوة","teach":"1. انوِ، وقل «الله أكبر» وارفع يديك. 2. قف واقرأ الفاتحة وسورة أخرى. 3. الركوع: انحنِ وقل «سبحان ربي العظيم». 4. ارفع قائلًا «سمع الله لمن حمده». 5. السجود: اسجد على سبعة أعضاء (الجبهة مع الأنف، واليدين، والركبتين، والقدمين) وقل «سبحان ربي الأعلى». 6. اجلس ثم اسجد مرة ثانية. وفي الركعة الأخيرة اجلس للتشهد، وصلّ على النبي ﷺ، واختم بالتسليم: «السلام عليكم ورحمة الله» عن اليمين وعن اليسار. ومن المفيد أن يريك أحدهم ذلك مباشرة.","qs":[{"q":"ماذا تقول في الركوع؟","o":["سبحان ربي العظيم","سبحان ربي الأعلى","بسم الله","الحمد لله"],"a":0},{"q":"في السجود، كم عضوًا يلمس الأرض؟","o":["7","3","5","10"],"a":0},{"q":"كيف تبدأ الصلاة؟","o":["بالتكبير: الله أكبر","بالسلام","بالركوع","بالسجود"],"a":0},{"q":"كيف تنتهي الصلاة؟","o":["بالتسليم: السلام عليكم ورحمة الله","بالتكبير","بالفاتحة","بالسجود"],"a":0}]},{"id":"L25","w":5,"title":"الصيام ورمضان","teach":"رمضان هو الشهر التاسع من التقويم الهجري. يصوم المسلمون من الفجر إلى المغرب: بلا طعام ولا شراب. يعلّمنا الصيام الصبر والشكر والعطف على الفقراء. نزل القرآن أول مرة في رمضان، وليلة القدر في العشر الأواخر منه. ويأتي عيد الفطر بعد الشهر.","qs":[{"q":"متى يمتد الصيام كل يوم؟","o":["من الفجر إلى المغرب","من الشروق إلى الظهر","من المغرب إلى الفجر","من الظهر إلى الليل"],"a":0},{"q":"ليلة القدر تكون في…","o":["العشر الأواخر من رمضان","محرم","ذي الحجة","أول ليلة من رمضان"],"a":0},{"q":"أي عيد يأتي بعد رمضان؟","o":["عيد الفطر","عيد الأضحى","عرفة","الهجرة"],"a":0},{"q":"رمضان هو أي شهر في التقويم الهجري؟","o":["التاسع","الأول","الثاني عشر","الخامس"],"a":0}]},{"id":"L27","w":5,"title":"الزكاة والصدقة","teach":"الزكاة هي الركن الثالث. وهي 2.5% من المدخرات التي تبقى فوق حد أدنى (النصاب) لمدة سنة هجرية، وتُعطى للمحتاجين وللفئات الأخرى المذكورة في القرآن. والصدقة عطاء تطوعي: أي مبلغ، بل حتى كلمة طيبة أو ابتسامة. والصدقة تطهّر المال والقلب.","qs":[{"q":"كم نسبة زكاة المدخرات؟","o":["2.5%","10%","50%","1%"],"a":0},{"q":"ماذا تسمى الصدقة التطوعية؟","o":["الصدقة","الزكاة","الحج","الصيام"],"a":0},{"q":"لمن تُعطى الزكاة؟","o":["للفقراء والمساكين وغيرهم","للأقارب الأغنياء","لأصحاب المتاجر","لكل من سأل"],"a":0},{"q":"الصدقة تطهّر…","o":["المال والقلب","الجسد فقط","البيوت","السيارات"],"a":0}]},{"id":"L29","w":5,"title":"الحج والعمرة","teach":"الحج قصد مكة في شهر ذي الحجة، وهو واجب مرة في العمر لمن استطاع. يلبس الحجاج ثيابًا بيضاء بسيطة (الإحرام)، ويطوفون بالكعبة، ويسعون بين الصفا والمروة، ويقفون بصعيد عرفة، وهو أهم يوم. والعمرة حج أصغر يمكن أداؤه في أي وقت من السنة.","qs":[{"q":"في أي شهر يكون الحج؟","o":["ذو الحجة","رمضان","رجب","محرم"],"a":0},{"q":"ماذا يسمى الدوران حول الكعبة؟","o":["الطواف","السعي","الإحرام","الوضوء"],"a":0},{"q":"ما أهم يوم في الحج؟","o":["الوقوف بعرفة","العيد","الجمعة","الشروق"],"a":0},{"q":"أيهما الحج الأصغر؟","o":["العمرة","الزكاة","الصلاة","الصيام"],"a":0}]},{"id":"L15","w":6,"title":"حسن الأدب والخلق","teach":"يحيّي المسلمون بـ«السلام عليكم»، ويكون الرد «وعليكم السلام». قل «بسم الله» قبل الأكل و«الحمد لله» بعده. كن صادقًا، محسنًا إلى جيرانك، بارًّا بوالديك: فقد نهانا الله أن نقول لهما «أُفٍّ» (الإسراء 23). وابتعد عن الغيبة، وهي ذكر أحد بسوء في غيابه. قال النبي ﷺ: «إن من خياركم أحسنكم أخلاقًا» (صحيح البخاري).","qs":[{"q":"ما الرد على «السلام عليكم»؟","o":["وعليكم السلام","بسم الله","سبحان الله","الله أكبر"],"a":0},{"q":"ماذا نقول قبل الأكل؟","o":["بسم الله","الحمد لله","أستغفر الله","إن شاء الله"],"a":0},{"q":"ما الذي نهانا الله أن نقوله لوالدينا؟","o":["«أُفٍّ» (كلمة ضجر)","شكرًا","سلام","مرحبًا"],"a":0},{"q":"وفق قول النبي ﷺ، أفضل الناس أحسنهم…","o":["خلقًا","مالًا","بيوتًا","ثيابًا"],"a":0}]},{"id":"L31","w":6,"title":"الحلال والحرام","teach":"الحلال هو المباح، والحرام هو الممنوع. حرّم الله أشياء ضارة مثل الخمر ولحم الخنزير والقمار والسرقة والكذب والربا. ومعظم الأشياء حلال ما لم يحرمها الله. اكسب مالك بأمانة وأنفقه بحكمة. وإذا لم تكن متأكدًا فاسأل عالمًا موثوقًا.","qs":[{"q":"ماذا يعني الحلال؟","o":["المباح","الممنوع","المكروه","الواجب"],"a":0},{"q":"أيٌّ مما يلي حرام؟","o":["الربا","التجارة الأمينة","إعطاء الصدقة","الصيام"],"a":0},{"q":"معظم الأشياء…","o":["حلال ما لم تحرَّم","حرام ما لم تُبَح","ممنوعة","اختيارية"],"a":0},{"q":"كيف نكسب المال؟","o":["بأمانة","بأي طريقة","بالغش","بالقمار"],"a":0}]},{"id":"L32","w":6,"title":"الآخرة","teach":"كل إنسان سيموت ويرجع إلى الله. والملائكة تكتب أعمالنا. بعد الموت حياة القبر (البرزخ)، ثم يوم القيامة، حيث يُبعث الجميع ويُحاسبون. ويدخل الصالحون الجنة برحمة الله. والله أرحم الراحمين ويغفر لمن تاب بصدق.","qs":[{"q":"ماذا يأتي بعد الموت؟","o":["حياة القبر ثم يوم القيامة","لا شيء","حياة أخرى على الأرض","نوم أبدي"],"a":0},{"q":"من يكتب أعمالنا؟","o":["الملائكة","البشر","الجن","الطيور"],"a":0},{"q":"ماذا تسمى دار النعيم؟","o":["الجنة","جهنم","البرزخ","القدر"],"a":0},{"q":"يغفر الله لمن…","o":["تاب بصدق","تفاخر","لا يصلي أبدًا","اختبأ"],"a":0}]},{"id":"N3","title":"كيف تدعو","teach":"الدعاء هو أن تسأل الله. قال النبي ﷺ: «الدعاء هو العبادة» (أبو داود، الترمذي). ومن آداب الدعاء: ابدأ بحمد الله والصلاة على النبي ﷺ، وأخلص، وكن موقنًا أن الله يسمعك، وكرر الطلب، ولا تسأل شيئًا فيه إثم. ومن أوقات رجاء الإجابة: الثلث الأخير من الليل، والسجود في الصلاة، وبين الأذان والإقامة. وقد يعطيك الله ما سألت، أو يدفع عنك شرًّا، أو يدّخر لك الأجر في الآخرة.","qs":[{"q":"قال النبي ﷺ إن الدعاء…","o":["عبادة","للمرضى فقط","ليوم الجمعة فقط","عادة"],"a":0},{"q":"من الطرق الحسنة لبدء الدعاء…","o":["حمد الله","الشكوى","الصراخ","طلب الأذى"],"a":0},{"q":"أيٌّ مما يلي وقت يُرجى فيه الإجابة؟","o":["الثلث الأخير من الليل","لا يُرجى في الليل أبدًا","الظهر فقط","رمضان فقط"],"a":0},{"q":"إن لم ترَ إجابة دعائك فورًا فعليك أن…","o":["تواصل الدعاء وتثق بالله","تتوقف عن الدعاء","تلوم نفسك فقط","تسأل غير الله"],"a":0}],"w":6},{"id":"N4","title":"أقسام التوحيد الثلاثة","teach":"يشرح العلماء التوحيد غالبًا في ثلاثة أقسام. توحيد الربوبية: الله وحده الرب الخالق الرازق. توحيد الألوهية: الله وحده يستحق العبادة. توحيد الأسماء والصفات: الإيمان بأسماء الله وصفاته كما وردت في القرآن والسنة، دون تشبيهه بخلقه. وهذه إحدى طرق تنظيم الموضوع الشائعة.","qs":[{"q":"إلى كم قسم يقسّم العلماء التوحيد غالبًا؟","o":["3","2","5","7"],"a":0},{"q":"توحيد الربوبية يعني أن الله وحده…","o":["الرب والخالق","النبي الوحيد","الملك الوحيد","المدينة الوحيدة"],"a":0},{"q":"توحيد الألوهية يعني أن الله وحده يستحق…","o":["العبادة","الضرائب","الجيوش","بيتًا"],"a":0},{"q":"توحيد الأسماء والصفات هو الإيمان بـ…","o":["أسماء الله وصفاته","أسماء المدن","أسماء الملائكة فقط","أسماء الشهور"],"a":0}],"w":7},{"id":"N5","title":"الشرك وما يضر الإيمان","teach":"الشرك هو جعل شريك لله. وهو أكبر الذنوب إن مات صاحبه عليه (النساء 48). ومنه عبادة غير الله أو دعاؤه. وهناك شرك أصغر مثل الرياء، وهو إظهار العبادة ليراها الناس. وقد خافه النبي ﷺ على أمته. وباب التوبة مفتوح: يغفر الله لمن رجع إليه بصدق قبل الموت.","qs":[{"q":"ماذا يعني الشرك؟","o":["جعل شريك لله","ترك صيام يوم","التأخر","الإكثار من الأكل"],"a":0},{"q":"إظهار العبادة ليراها الناس يسمى…","o":["الرياء","الزكاة","السجود","الهجرة"],"a":0},{"q":"هل باب التوبة مفتوح؟","o":["نعم، حتى الموت","لا، أبدًا","يوم الجمعة فقط","للعلماء فقط"],"a":0},{"q":"من ندعو ونتوكل عليه؟","o":["الله وحده","الأولياء","الشمس","أجدادنا"],"a":0}],"w":7},{"id":"N6","title":"كيف يُحكم على الحديث","teach":"الحديث هو ما نُقل من أقوال النبي ﷺ وأفعاله وإقراره. وله جزءان: الإسناد (سلسلة الرواة) والمتن (النص). فحص العلماء كل راوٍ وحكموا على الأحاديث بأنها صحيحة أو حسنة أو ضعيفة أو موضوعة (مكذوبة). وصحيح البخاري وصحيح مسلم أوثق الكتب. ومعهما أبو داود والترمذي والنسائي وابن ماجه تكوّن الكتب الستة الأصلية.","qs":[{"q":"إسناد الحديث هو…","o":["سلسلة الرواة","النص","العنوان","غلاف الكتاب"],"a":0},{"q":"متن الحديث هو…","o":["النص","السلسلة","الدرجة","المترجم"],"a":0},{"q":"ماذا يعني الموضوع؟","o":["المكذوب","الصحيح","الحسن","المشهور"],"a":0},{"q":"كم عدد كتب الحديث الأصلية؟","o":["6","3","10","99"],"a":0}],"w":7},{"id":"N7","title":"مصادر التشريع الإسلامي","teach":"تؤخذ الشريعة الإسلامية من مصادر مرتبة. 1. القرآن. 2. السنة، أي تعاليم النبي ﷺ وسيرته. 3. الإجماع، وهو اتفاق العلماء على حكم. 4. القياس، وهو الحكم بمقارنة مسألة بحكم معروف. والفقه هو فهم هذه الأحكام على يد علماء مؤهلين. وإذا جهلنا شيئًا سألنا أهل العلم.","qs":[{"q":"ما أول مصدر للتشريع الإسلامي؟","o":["القرآن","الإجماع","القياس","العُرف"],"a":0},{"q":"السنة تعني…","o":["تعاليم النبي ﷺ وسيرته","مدينة","نوعًا من سجاد الصلاة","شهر الصيام"],"a":0},{"q":"الإجماع هو…","o":["اتفاق العلماء","عيد","صدقة","صلاة"],"a":0},{"q":"ماذا نفعل إذا جهلنا حكمًا؟","o":["نسأل أهل العلم","نخمّن","نتجاهله","نسأل أي شخص في الإنترنت"],"a":0}],"w":8},{"id":"N8","title":"الخلفاء الراشدون الأربعة","teach":"بعد النبي ﷺ قاد المسلمين أربعة خلفاء راشدين: أبو بكر الصديق، وعمر بن الخطاب، وعثمان بن عفان، وعلي بن أبي طالب رضي الله عنهم. جمع أبو بكر القرآن، واشتهر عمر بالعدل، ونسخ عثمان النص الموحد، وكان علي ابن عم النبي ﷺ وزوج ابنته. وهذا هو رأي أهل السنة في ترتيبهم ومكانتهم.","qs":[{"q":"كم عدد الخلفاء الراشدين؟","o":["4","2","3","7"],"a":0},{"q":"من كان الخليفة الأول؟","o":["أبو بكر","عمر","عثمان","علي"],"a":0},{"q":"من نسخ النص الموحد للقرآن؟","o":["عثمان","عمر","بلال","حمزة" للہ کے لیے، اس کی کتاب کے لیے، اس کے رسول کے لیے، مسلمانوں کے حکمرانوں کے لیے اور ان کے عام لوگوں کے لیے۔","h4":"آدمی کے اسلام کی خوبی میں سے یہ ہے کہ وہ فضول بات چھوڑ دے۔","h5":"تم میں سے کوئی شخص اس وقت تک مومن نہیں ہو سکتا جب تک اپنے بھائی کے لیے وہی پسند نہ کرے جو اپنے لیے پسند کرتا ہے۔","h6":"جو اللہ اور آخرت کے دن پر ایمان رکھتا ہے، وہ اچھی بات کہے یا خاموش رہے۔","h7":"ایک آدمی نے نبی ﷺ سے کہا: مجھے نصیحت کیجیے۔ آپ ﷺ نے فرمایا: غصہ نہ کرو۔ اس نے کئی بار یہی کہا، اور ہر بار آپ ﷺ نے فرمایا: غصہ نہ کرو۔","h8":"تم جہاں بھی ہو اللہ سے ڈرو، برائی کے بعد نیکی کرو وہ اسے مٹا دے گی، اور لوگوں سے اچھے اخلاق سے پیش آؤ۔","h9":"اللہ کا خیال رکھو، وہ تمہاری حفاظت کرے گا۔ اللہ کا خیال رکھو، تم اسے اپنے سامنے پاؤ گے۔ جب مانگو تو اللہ سے مانگو، اور جب مدد چاہو تو اللہ سے مدد چاہو۔","h10":"دنیا میں ایسے رہو جیسے تم اجنبی ہو یا مسافر۔","h11":"نہ خود نقصان اٹھانا ہے اور نہ کسی کو نقصان پہنچانا ہے۔","h12":"تم میں سب سے بہتر وہ ہے جو قرآن سیکھے اور سکھائے۔","h13":"دو کلمے زبان پر ہلکے، ترازو میں بھاری اور رحمٰن کو بہت پیارے ہیں: سبحان اللہ و بحمدہ، سبحان اللہ العظیم۔","h14":"دعا عبادت ہے۔","h15":"تم میں سب سے بہتر وہ ہیں جن کے اخلاق سب سے اچھے ہیں۔","h16":"طاقتور مومن اللہ کے نزدیک کمزور مومن سے بہتر اور زیادہ محبوب ہے، اگرچہ دونوں میں خیر ہے۔","h17":"اپنے بھائی کے سامنے تمہارا مسکرانا صدقہ ہے۔","h18":"آسانی کرو اور سختی نہ کرو، خوشخبری دو اور لوگوں کو متنفر نہ کرو۔","h19":"جو لوگوں کا شکر ادا نہیں کرتا وہ اللہ کا شکر ادا نہیں کرتا۔","h20":"تم مومنوں کو آپس کی رحمت، محبت اور شفقت میں ایک جسم کی طرح دیکھو گے: جب ایک عضو کو تکلیف ہو تو سارا جسم بے خوابی اور بخار میں اس کا ساتھ دیتا ہے۔","h21":"زمین والوں پر رحم کرو، آسمان والا (اللہ) تم پر رحم کرے گا۔","h22":"مسلمان وہ ہے جس کی زبان اور ہاتھ سے دوسرے مسلمان محفوظ رہیں۔","h23":"جو شخص علم کی تلاش میں کسی راستے پر چلتا ہے، اللہ اس کے لیے جنت کا راستہ آسان کر دیتا ہے۔","h24":"علم حاصل کرنا ہر مسلمان پر فرض ہے۔","h25":"جو اللہ اور آخرت کے دن پر ایمان رکھتا ہے وہ اپنے پڑوسی کو تکلیف نہ دے۔","h26":"مال کی کثرت سے دولت مندی نہیں ہوتی؛ اصل د ا؟","o":["23 سال","3 سال","40 سال","1 سال"],"a":0},{"q":"قرآن کو ایک جلد میں کس نے جمع کروایا؟","o":["Abu Bakr","Abu Lahab","Hamza","Bilal"],"a":0},{"q":"معیاری متن کی نقلیں بڑے شہروں میں کس نے بھیجیں؟","o":["Uthman","Ali","Umar","Khalid"],"a":0}]},{"id":"L9","w":4,"title":"وضو: نماز کے لیے دھونا","teach":"وضو نماز سے پہلے ضروری دھونے کا عمل ہے۔ دل میں نیت کریں اور Bismillah کہیں۔ پھر ہاتھ 3 بار دھوئیں، منہ میں 3 بار پانی ڈال کر کلی کریں، ناک میں پانی ڈال کر 3 بار صاف کریں، چہرہ 3 بار دھوئیں، بازو کہنیوں تک 3 بار دھوئیں (پہلے دایاں، پھر بایاں)، سر کا ایک بار مسح کریں (کانوں سمیت)، اور پاؤں ٹخنوں تک 3 بار دھوئیں (پہلے دایاں، پھر بایاں)۔ وضو ٹوٹ جاتا ہے بیت الخلا جانے، ہوا خارج ہونے، گہری نیند، یا بے ہوشی سے۔","qs":[{"q":"وضو کے آغاز میں کیا کہتے ہیں؟","o":["Bismillah","Allahu Akbar","Alhamdulillah","SubhanAllah"],"a":0},{"q":"سر کا مسح کتنی بار کیا جاتا ہے؟","o":["ایک بار","تین بار","بالکل نہیں","سات بار"],"a":0},{"q":"ان میں سے کون سی چیز وضو توڑتی ہے؟","o":["گہری نیند","روٹی کھانا","چلنا","پڑھنا"],"a":0},{"q":"بازو کہاں تک دھوئے جاتے ہیں؟","o":["کہنیوں تک","کلائیوں تک","کندھوں تک","گھٹنوں تک"],"a":0}]},{"id":"L11","w":4,"title":"Salah: اوقات اور رکعتیں","teach":"مسلمان دن میں پانچ بار نماز پڑھتے ہیں، Qibla کی طرف منہ کر کے (مکہ میں کعبہ کی سمت)۔ Fajr (صبح) کی 2 رکعتیں، Dhuhr (دوپہر) کی 4، Asr (سہ پہر) کی 4، Maghrib (غروبِ آفتاب) کی 3 اور Isha (رات) کی 4 ہیں۔ رکعت کھڑے ہونے، رکوع اور سجدے کا ایک چکر ہے۔ کوشش کریں کہ ہر نماز وقت پر پڑھیں۔","qs":[{"q":"Fajr کی کتنی رکعتیں ہیں؟","o":["2","3","4","5"],"a":0},{"q":"کس نماز کی 3 رکعتیں ہیں؟","o":["Maghrib","Fajr","Asr","Isha"],"a":0},{"q":"مسلمان نماز میں کس طرف منہ کرتے ہیں؟","o":["Qibla، کعبہ کی طرف","شمال","مشرق","سورج"],"a":0},{"q":"روزانہ کتنی نمازیں ہیں؟","o":["5","3","4","6"],"a":0}]},{"id":"L13","w":4,"title":"نماز کیسے پڑھیں: قدم بہ قدم","teach":"1۔ نیت کریں، ‘Allahu Akbar’ کہیں اور ہاتھ اٹھائیں۔ 2۔ کھڑے ہو کر Al-Fatiha اور کوئی اور سورت پڑھیں۔ 3۔ Ruku: جھکیں اور ‘Subhana Rabbiyal ‘Azim’ کہیں۔ 4۔ ‘Sami’allahu liman hamidah’ کہتے ہوئے سیدھے کھڑے ہوں۔ 5۔ Sujud: سات اعضا پر سجدہ کریں (پیشانی ناک سمیت، دونوں ہاتھ، دونوں گھٹنے، دونوں پاؤں) اور ‘Subhana Rabbiyal A’la’ کہیں۔ 6۔ بیٹھیں، پھر دوبارہ سجدہ کریں۔ آخری رکعت میں Tashahhud کے لیے بیٹھیں، نبی ﷺ پر درود بھیجیں، اور Taslim کے ساتھ ختم کریں: دائیں اور بائیں ‘As-salamu alaykum wa rahmatullah’ کہیں۔ کسی سے روبرو سیکھنا مددگار ہوتا ہے۔","qs":[{"q":"رکوع میں کیا کہتے ہیں؟","o":["Subhana Rabbiyal ‘Azim","Subhana Rabbiyal A’la","Bismillah","Alhamdulillah"],"a":0},{"q":"سجدے میں جسم کے کتنے حصے زمین کو چھوتے ہیں؟","o":["7","3","5","10"],"a":0},{"q":"نماز کا آغاز کیسے ہوتا ہے؟","o":["Takbir: Allahu Akbar","سلام","رکوع","سجدہ"],"a":0},{"q":"نماز کا اختتام کیسے ہوتا ہے؟","o":["Taslim: As-salamu alaykum wa rahmatullah","Takbir","Al-Fatiha","سجدہ"],"a":0}]},{"id":"L25","w":5,"title":"روزہ اور رمضان","teach":"Ramadan اسلامی کیلنڈر کا نواں مہینہ ہے۔ مسلمان صبح صادق (Fajr) سے غروبِ آفتاب (Maghrib) تک روزہ رکھتے ہیں: نہ کھانا، نہ پینا۔ روزہ صبر، شکر اور غریبوں کا خیال رکھنا سکھاتا ہے۔ قرآن پہلی بار رمضان میں نازل ہوا، اور Laylat al-Qadr، یعنی شبِ قدر، اس کی آخری دس راتوں میں ہے۔ مہینے کے بعد Eid al-Fitr آتی ہے۔","qs":[{"q":"روزانہ کا روزہ کب تک رہتا ہے؟","o":["صبح سے غروبِ آفتاب تک","طلوعِ آفتاب سے دوپہر تک","غروبِ آفتاب سے صبح تک","دوپہر سے رات تک"],"a":0},{"q":"Laylat al-Qadr کہاں ہے؟","o":["رمضان کی آخری دس راتوں میں","Muharram میں","Dhul Hijjah میں","رمضان کی پہلی رات میں"],"a":0},{"q":"رمضان کے بعد کون سا تہوار آتا ہے؟","o":["Eid al-Fitr","Eid al-Adha","Arafah","Hijra"],"a":0},{"q":"رمضان اسلامی کیلنڈر کا کون سا مہینہ ہے؟","o":["نواں","پہلا","بارہواں","پانچواں"],"a":0}]},{"id":"L27","w":5,"title":"Zakat اور Sadaqah","teach":"Zakat تیسرا رکن ہے۔ یہ ان بچتوں کا 2.5% ہے جو ایک قمری سال تک کم از کم مقدار (nisab) سے اوپر رہیں، اور یہ ضرورت مند لوگوں اور قرآن میں بیان کیے گئے دوسرے گروہوں کو دیا جاتا ہے۔ Sadaqah رضاکارانہ صدقہ ہے: کوئی بھی رقم، یہاں تک کہ ایک اچھی بات یا مسکراہٹ بھی۔ صدقہ مال اور دل کو پاک کرتا ہے۔","qs":[{"q":"بچتوں پر zakat کتنے فیصد ہے؟","o":["2.5%","10%","50%","1%"],"a":0},{"q":"رضاکارانہ صدقے کو کیا کہتے ہیں؟","o":["Sadaqah","Zakat","Hajj","Sawm"],"a":0},{"q":"Zakat کن کے لیے ہے؟","o":["غریب اور ضرورت مند، اور دوسرے","امیر رشتے دار","دکان دار","ہر مانگنے والا"],"a":0},{"q":"صدقہ پاک کرتا ہے…","o":["مال اور دل کو","صرف جسم کو","گھروں کو","گاڑیوں کو"],"a":0}]},{"id":"L29","w":5,"title":"Hajj اور Umrah","teach":"Hajj ذوالحجہ (Dhul Hijjah) کے مہینے میں مکہ کی زیارت ہے، جو استطاعت رکھنے والوں پر زندگی میں ایک بار فرض ہے۔ حاجی سادہ سفید لباس (ihram) پہنتے ہیں، کعبہ کے گرد چکر لگاتے ہیں (tawaf)، صفا اور مروہ کے درمیان چلتے ہیں، اور میدانِ عرفات میں ٹھہرتے ہیں، جو سب سے اہم دن ہے۔ Umrah ایک چھوٹا سفرِ زیارت ہے جو سال میں کسی بھی وقت کیا جا سکتا ہے۔","qs":[{"q":"Hajj کس مہینے میں ہوتا ہے؟","o":["Dhul Hijjah","Ramadan","Rajab","Muharram"],"a":0},{"q":"کعبہ کے گرد چکر لگانے کو کیا کہتے ہیں؟","o":["Tawaf","Sa’i","Ihram","Wudu"],"a":0},{"q":"Hajj کا سب سے اہم دن کون سا ہے؟","o":["عرفات میں ٹھہرنا","عید","جمعہ","طلوعِ آفتاب"],"a":0},{"q":"چھوٹا سفرِ زیارت کون سا ہے؟","o":["Umrah","Zakat","Salah","Sawm"],"a":0}]},{"id":"L15","w":6,"title":"اچھے اخلاق اور کردار","teach":"مسلمان ‘As-salamu alaykum’ (تم پر سلامتی ہو) کہہ کر سلام کرتے ہیں، اور جواب ہے ‘Wa alaykumus-salam’۔ کھانے سے پہلے ‘Bismillah’ اور بعد میں ‘Alhamdulillah’ کہیں۔ سچے رہیں، پڑوسیوں سے نرمی کریں، اور والدین کا احترام کریں: اللہ ہمیں حکم دیتا ہے کہ ان سے ‘اُف’ تک نہ کہیں (قرآن 17:23)۔ غیبت سے بچیں، یعنی کسی کی غیر موجودگی میں اس کی برائی کرنا۔ نبی ﷺ نے فرمایا: ‘تم میں سب سے بہتر وہ ہیں جن کے اخلاق سب سے اچھے ہیں’ (صحیح بخاری)۔","qs":[{"q":"‘As-salamu alaykum’ کا جواب کیا ہے؟","o":["Wa alaykumus-salam","Bismillah","SubhanAllah","Allahu Akbar"],"a":0},{"q":"کھانے سے پہلے ہم کیا کہتے ہیں؟","o":["Bismillah","Alhamdulillah","Astaghfirullah","Inshallah"],"a":0},{"q":"اللہ ہمیں اپنے والدین سے کیا کبھی نہ کہنے کو کہتا ہے؟","o":["‘اُف’ (ناگواری کا لفظ)","شکریہ","سلام","خوش آمدید"],"a":0},{"q":"نبی ﷺ کے مطابق سب سے بہتر لوگ وہ ہیں جن کے سب سے اچھے ہوں…","o":["اخلاق","مال","گھر","کپڑے"],"a":0}]},{"id":"L31","w":6,"title":"Halal اور haram","teach":"Halal کا مطلب جائز اور haram کا مطلب ممنوع ہے۔ اللہ نے نقصان دہ چیزوں کو حرام کیا ہے جیسے شراب، سور کا گوشت، جوا، چوری، جھوٹ اور riba (سود)۔ زیادہ تر چیزیں halal ہیں جب تک اللہ نے انہیں منع نہ کیا ہو۔ اپنا مال ایمانداری سے کمائیں اور سمجھداری سے خرچ کریں۔ جب یقین نہ ہو تو کسی قابلِ اعتماد عالم سے پوچھیں۔","qs":[{"q":"Halal کا کیا مطلب ہے؟","o":["جائز","ممنوع","ناپسندیدہ","لازمی"],"a":0},{"q":"ان میں سے کون سی چیز haram ہے؟","o":["Riba (سود)","ایماندار تجارت","صدقہ دینا","روزہ"],"a":0},{"q":"زیادہ تر چیزیں ہیں…","o":["halal جب تک منع نہ ہوں","haram جب تک اجازت نہ ہو","ممنوع","اختیاری"],"a":0},{"q":"ہمیں مال کیسے کمانا چاہیے؟","o":["ایمانداری سے","جس طرح بھی ممکن ہو","دھوکے سے","جوئے سے"],"a":0}]},{"id":"L32","w":6,"title":"آخرت","teach":"ہر شخص مرے گا اور اللہ کی طرف لوٹے گا۔ فرشتے ہمارے اعمال لکھتے ہیں۔ موت کے بعد قبر کی زندگی (barzakh) ہے، پھر قیامت کا دن، جب سب کو اٹھایا جائے گا اور حساب لیا جائے گا۔ نیک لوگ اللہ کی رحمت سے Jannah (جنت) میں داخل ہوں گے۔ اللہ بہت رحم کرنے والا ہے اور سچی توبہ کرنے والوں کو بخش دیتا ہے۔","qs":[{"q":"موت کے بعد کیا آتا ہے؟","o":["قبر کی زندگی، پھر قیامت کا دن","کچھ نہیں","زمین پر ایک اور زندگی","ہمیشہ کی نیند"],"a":0},{"q":"ہمارے اعمال کون لکھتا ہے؟","o":["فرشتے","انسان","جن","پرندے"],"a":0},{"q":"جنت کو کیا کہتے ہیں؟","o":["Jannah","Jahannam","Barzakh","Qadr"],"a":0},{"q":"اللہ ان کو بخشتا ہے جو…","o":["سچی توبہ کرتے ہیں","شیخی مارتے ہیں","کبھی نماز نہیں پڑھتے","چھپتے ہیں"],"a":0}]},{"id":"N3","w":6,"title":"دعا کیسے کریں","teach":"Dua کا مطلب ہے اللہ سے مانگنا۔ نبی ﷺ نے فرمایا: ‘دعا عبادت ہے’ (ابو داؤد، ترمذی)۔ دعا کے اچھے آداب: اللہ کی تعریف اور نبی ﷺ پر درود سے آغاز کریں، سچے دل سے مانگیں، یقین رکھیں کہ اللہ سن رہا ہے، بار بار مانگیں، اور کبھی گناہ کی چیز نہ مانگیں۔ جن اوقات میں دعا کی خاص امید ہوتی ہے ان میں رات کا آخری تہائی حصہ، نماز میں سجدے کی حالت، اور adhan اور iqama کے درمیان کا وقت شامل ہیں۔ اللہ جو مانگا وہ دے سکتا ہے، کوئی نقصان آپ سے دور رکھ سکتا ہے، یا اجر آخرت کے لیے محفوظ رکھ سکتا ہے۔","qs":[{"q":"نبی ﷺ نے فرمایا کہ دعا ہے…","o":["عبادت","صرف بیماروں کے لیے","صرف جمعہ کے لیے","ایک رسم"],"a":0},{"q":"دعا شروع کرنے کا اچھا طریقہ ہے…","o":["اللہ کی تعریف سے","شکایت سے","چیخنے سے","نقصان مانگنے سے"],"a":0},{"q":"وہ کون سا وقت ہے جب دعا کی خاص امید ہوتی ہے؟","o":["رات کا آخری تہائی حصہ","رات کو کبھی نہیں","صرف دوپہر میں","صرف رمضان میں"],"a":0},{"q":"اگر آپ کی دعا فوراً قبول ہوتی نظر نہ آئے تو آپ کو چاہیے کہ…","o":["مانگتے رہیں اور اللہ پر بھروسا رکھیں","مانگنا چھوڑ دیں","صرف اپنے آپ کو الزام دیں","اللہ کے بجائے کسی اور سے مانگیں"],"a":0}]},{"id":"N4","w":7,"title":"Tawhid کے تین حصے","teach":"علماء اکثر Tawhid کو تین حصوں میں بیان کرتے ہیں۔ Tawhid ar-Rububiyyah: صرف اللہ ہی رب، پیدا کرنے والا اور پالنے والا ہے۔ Tawhid al-Uluhiyyah: صرف اللہ ہی عبادت کے لائق ہے۔ Tawhid al-Asma was-Sifat: اللہ کے ناموں اور صفات پر ایمان رکھنا جیسا کہ قرآن اور سنت میں بیان ہوئے ہیں، بغیر اسے اس کی مخلوق سے تشبیہ دیے۔ یہ موضوع کو ترتیب دینے کا ایک عام طریقہ ہے۔","qs":[{"q":"علماء اکثر Tawhid کو کتنے حصوں میں تقسیم کرتے ہیں؟","o":["3","2","5","7"],"a":0},{"q":"Tawhid ar-Rububiyyah کا مطلب ہے کہ صرف اللہ ہی…","o":["رب اور پیدا کرنے والا ہے","واحد نبی ہے","واحد فرشتہ ہے","واحد شہر ہے"],"a":0},{"q":"Tawhid al-Uluhiyyah کا مطلب ہے کہ صرف اللہ ہی لائق ہے…","o":["عبادت کے","ٹیکس کے","فوجوں کے","گھر کے"],"a":0},{"q":"Tawhid al-Asma was-Sifat ایمان ہے…","o":["اللہ کے ناموں اور صفات پر","شہروں کے ناموں پر","صرف فرشتوں کے ناموں پر","مہینوں کے ناموں پر"],"a":0}]},{"id":"N5","w":7,"title":"Shirk اور ایمان کو نقصان پہنچانے والی چیزیں","teach":"Shirk کا مطلب ہے اللہ کا شریک ٹھہرانا۔ اگر کوئی اسی حال میں مر جائے تو یہ سب سے بڑا گناہ ہے (قرآن 4:48)۔ اس میں اللہ کے سوا کسی کی عبادت کرنا یا اسے پکارنا شامل ہے۔ چھوٹا shirk بھی ہے، جیسے عبادت میں دکھاوا کرنا، جسے riya کہتے ہیں۔ نبی ﷺ کو اپنی امت کے بارے میں اس کا خوف تھا۔ توبہ کا دروازہ کھلا رہتا ہے: اللہ ان کو بخشتا ہے جو موت سے پہلے سچے دل سے اس کی طرف لوٹ آئیں۔","qs":[{"q":"Shirk کا کیا مطلب ہے؟","o":["اللہ کا شریک ٹھہرانا","روزہ چھوڑ دینا","دیر سے آنا","بہت زیادہ کھانا"],"a":0},{"q":"عبادت میں دکھاوا کرنا کہلاتا ہے…","o":["riya","zakat","sujud","hijra"],"a":0},{"q":"کیا توبہ کا دروازہ کھلا ہے؟","o":["جی ہاں، موت تک","نہیں، کبھی نہیں","صرف جمعہ کو","صرف علماء کے لیے"],"a":0},{"q":"ہمیں کس سے دعا کرنی چاہیے اور کس پر بھروسا کرنا چاہیے؟","o":["صرف اللہ پر","بزرگوں پر","سورج پر","اپنے آباؤ اجداد پر"],"a":0}]},{"id":"N6","w":7,"title":"حدیث کی درجہ بندی کیسے ہوتی ہے","teach":"حدیث نبی ﷺ کے اقوال، افعال یا تائید کی روایت ہے۔ اس کے دو حصے ہیں: isnad (راویوں کا سلسلہ) اور matn (متن)۔ علماء نے ہر راوی کی جانچ کی اور حدیث کو sahih (مستند)، hasan (اچھی)، da’if (کمزور) یا mawdu’ (گھڑی ہوئی) درجوں میں تقسیم کیا۔ Sahih al-Bukhari اور Sahih Muslim سب سے قابلِ اعتماد کتابیں ہیں۔ Abu Dawud، At-Tirmidhi، An-Nasa’i اور Ibn Majah کے ساتھ مل کر یہ چھ بڑے مجموعے بنتے ہیں۔","qs":[{"q":"حدیث کا isnad کیا ہے؟","o":["راویوں کا سلسلہ","متن","عنوان","کتاب کا سرورق"],"a":0},{"q":"حدیث کا matn کیا ہے؟","o":["متن","سلسلہ","درجہ","مترجم"],"a":0},{"q":"Mawdu’ کا کیا مطلب ہے؟","o":["گھڑی ہوئی","مستند","اچھی","مشہور"],"a":0},{"q":"حدیث کے کتنے بڑے مجموعے ہیں؟","o":["6","3","10","99"],"a":0}]},{"id":"N7","w":8,"title":"اسلامی قانون کے ماخذ","teach":"اسلامی قانون (shariah) ترتیب سے ماخذوں سے لیا جاتا ہے۔ 1۔ قرآن۔ 2۔ Sunnah، یعنی نبی ﷺ کی تعلیمات اور نمونہ۔ 3۔ Ijma، یعنی کسی حکم پر علماء کا اتفاق۔ 4۔ Qiyas، یعنی کسی معلوم حکم سے مشابہت کی بنیاد پر استدلال۔ Fiqh ان احکام کی وہ سمجھ ہے جو اہل علماء نے حاصل کی۔ جب ہمیں کچھ معلوم نہ ہو تو ہم اہلِ علم سے پوچھتے ہیں۔","qs":[{"q":"اسلامی قانون کا پہلا ماخذ کیا ہے؟","o":["قرآن","Ijma","Qiyas","رواج"],"a":0},{"q":"Sunnah کا مطلب ہے…","o":["نبی ﷺ کی تعلیمات اور نمونہ","ایک شہر","جائے نماز کی ایک قسم","روزے کا مہینہ"],"a":0},{"q":"Ijma ہے…","o":["علماء کا اتفاق","ایک تہوار","ایک صدقہ","ایک نماز"],"a":0},{"q":"جب ہمیں کسی حکم کا علم نہ ہو تو ہم کیا کرتے ہیں؟","o":["اہلِ علم سے پوچھتے ہیں","اندازہ لگاتے ہیں","نظر انداز کرتے ہیں","آن لائن کسی سے بھی پوچھ لیتے ہیں"],"a":0}]},{"id":"N8","w":8,"title":"چار خلفائے راشدین","teach":"نبی ﷺ کے بعد مسلمانوں کی قیادت چار خلفائے راشدین (Al-Khulafa ar-Rashidun) نے کی: Abu Bakr as-Siddiq، Umar ibn al-Khattab، Uthman ibn Affan اور Ali ibn Abi Talib، اللہ ان سب سے راضی ہو۔ Abu Bakr نے قرآن جمع کروایا، Umar انصاف کے لیے مشہور تھے، Uthman نے معیاری متن کی نقلیں بنوائیں، اور Ali نبی ﷺ کے چچازاد بھائی اور داماد تھے۔ یہ ترتیب اور ان کے مقام کے بارے میں سنی نقطۂ نظر ہے۔","qs":[{"q":"خلفائے راشدین کتنے تھے؟","o":["4","2","3","7"],"a":0},{"q":"پہلا خلیفہ کون تھا؟","o":["Abu Bakr","Umar","Uthman","Ali"],"a":0},{"q":"قرآن کے معیاری متن کی نقلیں کس نے بنوائیں؟","o":["Uthman","Umar","Bilal","Hamza"],"a":0},{"q":"Ali نبی ﷺ کے کیا تھے؟","o":["چچازاد بھائی اور داماد","بھائی","چچا","استاد"],"a":0}]},{"id":"N9","w":8,"title":"فقہ کے چار مذاہب","teach":"سنی مسلمان فقہ کے چار کلاسیکی مذاہب میں سے ایک کی پیروی کرتے ہیں: Hanafi (Abu Hanifa)، Maliki (Malik ibn Anas)، Shafi’i (Imam ash-Shafi’i) اور Hanbali (Ahmad ibn Hanbal)۔ وہ عقیدے اور اسلام کے ارکان پر متفق ہیں، اور کچھ تفصیلات میں اختلاف رکھتے ہیں، مثلاً عبادت کے بعض حصے کیسے ادا کیے جائیں۔ ثانوی معاملات میں علماء کا اختلاف عام بات ہے اور جھگڑنے کی کوئی وجہ نہیں۔ مشرقی افریقہ کے بہت سے مسلمان Shafi’i مذہب کی پیروی کرتے ہیں۔","qs":[{"q":"سنی فقہ کے کتنے کلاسیکی مذاہب ہیں؟","o":["4","2","6","10"],"a":0},{"q":"کون سا مذہب Imam ash-Shafi’i کے نام پر ہے؟","o":["Shafi’i","Hanafi","Maliki","Hanbali"],"a":0},{"q":"مذاہب کس پر متفق ہیں؟","o":["عقیدے اور اسلام کے ارکان پر","ہر چھوٹی تفصیل پر","کسی چیز پر نہیں","صرف عید کی تاریخ پر"],"a":0},{"q":"ثانوی معاملات کے اختلاف کے ساتھ ہمیں کیسا برتاؤ کرنا چاہیے؟","o":["احترام کے ساتھ، جھگڑے بغیر","لڑائی سے","دوسروں کا مذاق اڑا کر","اسلام کو نظر انداز کر کے"],"a":0}]}]},"fr":{"ui":{"n_duas":"Douas","n_learn":"Apprendre","n_hadith":"Hadiths","n_names":"Noms","n_more":"Plus","streak_days":"{n} jours d'affilée","d_title":"Douas","d_sub":"Des douas pour chaque émotion et chaque moment","d_ph"
