<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f3d34"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>Hamudi Teach</title>

<style>
/* Layout: one phone-width column, brand bar on top, five bottom tabs. Night-teal with a brass accent. */
:root{
  --bg:#f2f6f3; --surface:#ffffff; --ink:#13241f; --muted:#5a6d66; --line:#d5e0da;
  --accent:#0d6b5b; --accent-ink:#ffffff; --brass:#9a6b12; --soft:#e3eee8; --warn:#a13a2a;
  --f-display:'Fraunces','Noto Sans Devanagari','Noto Naskh Arabic',Georgia,serif;
  --f-body:'Figtree','Noto Sans Devanagari','Noto Naskh Arabic',system-ui,sans-serif;
  --f-ar:'Amiri','Traditional Arabic',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1613; --surface:#12231e; --ink:#e7f1ed; --muted:#8fa79f; --line:#233e37;
  --accent:#4fc4aa; --accent-ink:#06211b; --brass:#e2b65c; --soft:#173028; --warn:#ef8b79; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1613; --surface:#12231e; --ink:#e7f1ed; --muted:#8fa79f; --line:#233e37;
  --accent:#4fc4aa; --accent-ink:#06211b; --brass:#e2b65c; --soft:#173028; --warn:#ef8b79; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:8px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:26px;line-height:1.9}
.tr{direction:ltr;text-align:left}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px;text-align:center}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--warn);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stk{display:inline-flex;align-items:center;gap:6px;cursor:default}
.stk::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brass)}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);font-weight:700}
.brand{font-family:var(--f-display);font-size:18px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;padding:0;color:var(--accent-ink)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.lock{opacity:.5}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.nav-in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;min-height:48px;min-width:0}
.nav button.on{color:var(--accent);font-weight:700}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.circle-wrap{display:grid;place-items:center;height:230px}
#bc{width:190px;height:190px;border-radius:50%;background:var(--soft);border:2px solid var(--accent);display:grid;place-items:center;transform:scale(.55);transition:transform 4s ease-in-out;text-align:center}
#bn{font-family:var(--f-display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.tap{width:min(220px,70vw);aspect-ratio:1;border-radius:50%;border:2px solid var(--accent);background:var(--soft);display:grid;place-items:center;margin:0 auto;font-family:var(--f-display);font-size:60px;font-weight:700;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tap:active{background:var(--accent);color:var(--accent-ink)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.sw{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{transform:translateX(18px)}
[dir="rtl"] .sw:checked::after{transform:translateX(-18px)}
input[type=text],input[type=number],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
select#lang{width:auto;min-height:36px;padding:4px 8px;font-size:13px}
textarea{min-height:120px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tabs .chip{flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:72px}
.menu b{font-family:var(--f-display)}
.opt{display:block;width:100%;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.ok{border-color:var(--accent);background:var(--soft)}
.opt.bad{border-color:var(--warn)}
.opt:disabled{cursor:default;color:inherit}
.fb{border-radius:12px;padding:12px 14px;background:var(--soft)}
.fb.bad{border:1px solid var(--warn)}
.num{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.numr{user-select:all;-webkit-user-select:all}
@media (prefers-reduced-motion:reduce){#bc{transition:none!important}}
</style>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DATA={"duas":[{"c":"anx","items":[{"id":"anx1","ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","tr":"Allahumma inni a’udhu bika minal-hammi wal-hazan, wal-‘ajzi wal-kasal, wal-bukhli wal-jubn, wa dala’id-dayni wa ghalabatir-rijal","src":"Sahih al-Bukhari"},{"id":"anx2","ar":"حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ","tr":"Hasbiyallahu la ilaha illa huwa, ‘alayhi tawakkaltu wa huwa Rabbul-‘arshil-‘azim","src":"Quran 9:129"},{"id":"anx3","ar":"اللَّهُمَّ رَحْمَتَكَ أَرْجُو فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَٰهَ إِلَّا أَنْتَ","tr":"Allahumma rahmataka arju fala takilni ila nafsi tarfata ‘ayn, wa aslih li sha’ni kullah, la ilaha illa ant","src":"Abu Dawud"},{"id":"anx4","ar":"لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ","tr":"La ilaha illallahul-‘Azimul-Halim, la ilaha illallahu Rabbul-‘arshil-‘azim, la ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-‘arshil-karim","src":"Sahih al-Bukhari, Sahih Muslim"}]},{"c":"dis","items":[{"id":"dis1","ar":"لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ","tr":"La ilaha illa anta subhanaka inni kuntu minaz-zalimin","src":"Quran 21:87"},{"id":"dis2","ar":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ","tr":"Ya Hayyu ya Qayyum, bi-rahmatika astaghith","src":"At-Tirmidhi"},{"id":"dis3","ar":"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","tr":"Hasbunallahu wa ni’mal-wakil","src":"Quran 3:173"}]},{"c":"fgv","items":[{"id":"fgv1","ar":"رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ","tr":"Rabbighfir li wa tub ‘alayya innaka antat-Tawwabur-Rahim","src":"Abu Dawud, At-Tirmidhi"},{"id":"fgv2","ar":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","tr":"Allahumma anta Rabbi la ilaha illa ant, khalaqtani wa ana ‘abduk, wa ana ‘ala ‘ahdika wa wa’dika mastata’t, a’udhu bika min sharri ma sana’t, abu’u laka bini’matika ‘alayya, wa abu’u bidhanbi faghfir li fa innahu la yaghfirudh-dhunuba illa ant","src":"Sahih al-Bukhari"},{"id":"fgv3","ar":"رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","tr":"Rabbana zalamna anfusana wa in lam taghfir lana wa tarhamna lanakunanna minal-khasirin","src":"Quran 7:23"},{"id":"fgv4","ar":"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","tr":"Allahumma innaka ‘afuwwun tuhibbul-‘afwa fa’fu ‘anni","src":"At-Tirmidhi, Ibn Majah"},{"id":"fgv5","ar":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ","tr":"Astaghfirullaha wa atubu ilayh","src":"Sahih al-Bukhari"}]},{"c":"gui","items":[{"id":"gui1","ar":"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","tr":"Ihdinas-siratal-mustaqim","src":"Quran 1:6"},{"id":"gui2","ar":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ","tr":"Rabbana la tuzigh qulubana ba’da idh hadaytana wa hab lana min ladunka rahmah, innaka antal-Wahhab","src":"Quran 3:8"},{"id":"gui3","ar":"يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَىٰ دِينِكَ","tr":"Ya muqallibal-qulub, thabbit qalbi ‘ala dinik","src":"At-Tirmidhi"},{"id":"gui4","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَىٰ وَالتُّقَىٰ وَالْعَفَافَ وَالْغِنَى","tr":"Allahumma inni as’alukal-huda wat-tuqa wal-‘afafa wal-ghina","src":"Sahih Muslim"}]},{"c":"prv","items":[{"id":"prv1","ar":"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ","tr":"Allahummak-fini bi-halalika ‘an haramika wa aghnini bi-fadlika ‘amman siwak","src":"At-Tirmidhi"},{"id":"prv2","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا","tr":"Allahumma inni as’aluka ‘ilman nafi’a, wa rizqan tayyiba, wa ‘amalan mutaqabbala","src":"Ibn Majah"},{"id":"prv3","ar":"رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ","tr":"Rabbi inni lima anzalta ilayya min khayrin faqir","src":"Quran 28:24"}]},{"c":"eas","items":[{"id":"eas1","ar":"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي","tr":"Rabbish-rah li sadri wa yassir li amri","src":"Quran 20:25-26"},{"id":"eas2","ar":"رَبِّ زِدْنِي عِلْمًا","tr":"Rabbi zidni ‘ilma","src":"Quran 20:114"},{"id":"eas3","ar":"اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا","tr":"Allahumma la sahla illa ma ja’altahu sahla, wa anta taj’alul-hazna idha shi’ta sahla","src":"Ibn Hibban"}]},{"c":"grf","items":[{"id":"grf1","ar":"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا","tr":"Inna lillahi wa inna ilayhi raji’un. Allahumma ajirni fi musibati wa akhlif li khayran minha","src":"Sahih Muslim"},{"id":"grf2","ar":"اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ","tr":"Allahummaghfir lahu warhamhu wa ‘afihi wa’fu ‘anhu","src":"Sahih Muslim"}]},{"c":"fea","items":[{"id":"fea1","ar":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ","tr":"Bismillahil-ladhi la yadurru ma’asmihi shay’un fil-ardi wa la fis-sama’i wa huwas-Sami’ul-‘Alim","src":"Abu Dawud, At-Tirmidhi"},{"id":"fea2","ar":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","tr":"A’udhu bikalimatillahit-tammati min sharri ma khalaq","src":"Sahih Muslim"},{"id":"fea3","ar":"اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِمْ وَنَعُوذُ بِكَ مِنْ شُرُورِهِمْ","tr":"Allahumma inna naj’aluka fi nuhurihim wa na’udhu bika min shururihim","src":"Abu Dawud"}]},{"c":"hlt","items":[{"id":"hlt1","ar":"اللَّهُمَّ رَبَّ النَّاسِ أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا","tr":"Allahumma Rabban-nas, adhhibil-ba’s, ishfi antash-Shafi, la shifa’a illa shifa’uk, shifa’an la yughadiru saqama","src":"Sahih al-Bukhari"},{"id":"hlt2","ar":"بِسْمِ اللَّهِ (ثَلَاثًا)، أَعُوذُ بِعِزَّةِ اللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ","tr":"Bismillah (3 times), a’udhu bi’izzatillahi wa qudratihi min sharri ma ajidu wa uhadhir","src":"Sahih Muslim"},{"id":"hlt3","ar":"أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ","tr":"As’alullahal-‘Azima Rabbal-‘arshil-‘azimi an yashfiyak","src":"Abu Dawud, At-Tirmidhi"},{"id":"hlt4","ar":"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ","tr":"Allahumma ‘afini fi badani, Allahumma ‘afini fi sam’i, Allahumma ‘afini fi basari, la ilaha illa ant","src":"Abu Dawud"}]},{"c":"slp","items":[{"id":"slp1","ar":"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ","tr":"Alhamdu lillahil-ladhi ahyana ba’da ma amatana wa ilayhin-nushur","src":"Sahih al-Bukhari"},{"id":"slp2","ar":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","tr":"Bismika Allahumma amutu wa ahya","src":"Sahih al-Bukhari"},{"id":"slp3","ar":"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ","tr":"Allahumma qini ‘adhabaka yawma tab’athu ‘ibadak","src":"Abu Dawud"}]},{"c":"fod","items":[{"id":"fod1","ar":"بِسْمِ اللَّهِ","tr":"Bismillah","src":"Abu Dawud, At-Tirmidhi"},{"id":"fod2","ar":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","tr":"Alhamdu lillahil-ladhi at’amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah","src":"Abu Dawud, At-Tirmidhi"},{"id":"fod3","ar":"ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ","tr":"Dhahaba az-zama’u wabtallatil-‘uruqu wa thabatal-ajru in sha’Allah","src":"Abu Dawud"}]},{"c":"hom","items":[{"id":"hom1","ar":"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","tr":"Bismillah, tawakkaltu ‘alallah, wa la hawla wa la quwwata illa billah","src":"Abu Dawud, At-Tirmidhi"},{"id":"hom2","ar":"بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا","tr":"Bismillahi walajna, wa bismillahi kharajna, wa ‘ala Rabbina tawakkalna","src":"Abu Dawud"},{"id":"hom3","ar":"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ","tr":"Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina lamunqalibun","src":"Quran 43:13-14"}]},{"c":"fam","items":[{"id":"fam1","ar":"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا","tr":"Rabbana hab lana min azwajina wa dhurriyyatina qurrata a’yunin waj’alna lil-muttaqina imama","src":"Quran 25:74"},{"id":"fam2","ar":"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي ۖ إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ","tr":"Rabbi awzi’ni an ashkura ni’matakal-lati an’amta ‘alayya wa ‘ala walidayya wa an a’mala salihan tardahu wa aslih li fi dhurriyyati, inni tubtu ilayka wa inni minal-muslimin","src":"Quran 46:15"},{"id":"fam3","ar":"رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","tr":"Rabbir-hamhuma kama rabbayani saghira","src":"Quran 17:24"},{"id":"fam4","ar":"رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ","tr":"Rabbanaghfir li wa liwalidayya wa lil-mu’minina yawma yaqumul-hisab","src":"Quran 14:41"}]},{"c":"grt","items":[{"id":"grt1","ar":"الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ","tr":"Alhamdu lillahi hamdan kathiran tayyiban mubarakan fih","src":"Sahih al-Bukhari"},{"id":"grt2","ar":"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ","tr":"Allahumma ma asbaha bi min ni’matin aw bi-ahadin min khalqika faminka wahdaka la sharika lak, falakal-hamdu wa lakash-shukr","src":"Abu Dawud"},{"id":"grt3","ar":"اللَّهُمَّ أَعِنِّي عَلَىٰ ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ","tr":"Allahumma a’inni ‘ala dhikrika wa shukrika wa husni ‘ibadatik","src":"Abu Dawud, An-Nasa’i"}]},{"c":"suc","items":[{"id":"suc1","ar":"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","tr":"Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina ‘adhaban-nar","src":"Quran 2:201"},{"id":"suc2","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ","tr":"Allahumma inni as’alukal-jannata wa a’udhu bika minan-nar","src":"Abu Dawud, Ibn Majah"},{"id":"suc3","ar":"اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ","tr":"Allahumma aslih li dini alladhi huwa ‘ismatu amri, wa aslih li dunyaya allati fiha ma’ashi, wa aslih li akhirati allati fiha ma’adi, waj’alil-hayata ziyadatan li fi kulli khayr, waj’alil-mawta rahatan li min kulli sharr","src":"Sahih Muslim"}]},{"c":"pat","items":[{"id":"pat1","ar":"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ","tr":"Rabbana afrigh ‘alayna sabran wa thabbit aqdamana wansurna ‘alal-qawmil-kafirin","src":"Quran 2:250"},{"id":"pat2","ar":"رَبِّ أَنِّي مَغْلُوبٌ فَانتَصِرْ","tr":"Rabbi anni maghlubun fantasir","src":"Quran 54:10"},{"id":"pat3","ar":"وَأُفَوِّضُ أَمْرِي إِلَى اللَّهِ ۚ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ","tr":"Wa ufawwidu amri ilallah, innallaha basirun bil-‘ibad","src":"Quran 40:44"}]},{"c":"umm","items":[{"id":"umm1","ar":"اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ","tr":"Allahumma salli ‘ala Muhammadin wa ‘ala ali Muhammad, kama sallayta ‘ala Ibrahima wa ‘ala ali Ibrahim, innaka Hamidun Majid. Allahumma barik ‘ala Muhammadin wa ‘ala ali Muhammad, kama barakta ‘ala Ibrahima wa ‘ala ali Ibrahim, innaka Hamidun Majid","src":"Sahih al-Bukhari, Sahih Muslim"},{"id":"umm2","ar":"رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ","tr":"Rabbanaghfir lana wa li-ikhwaninal-ladhina sabaquna bil-iman, wa la taj’al fi qulubina ghillan lilladhina amanu, Rabbana innaka Ra’ufun Rahim","src":"Quran 59:10"}]},{"c":"dly","items":[{"id":"dly1","ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ","tr":"Allahumma inni a’udhu bika minal-khubuthi wal-khaba’ith","src":"Sahih al-Bukhari, Sahih Muslim"},{"id":"dly2","ar":"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ","tr":"Alhamdu lillahil-ladhi kasani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah","src":"Abu Dawud, At-Tirmidhi"},{"id":"dly3","ar":"اللَّهُمَّ صَيِّبًا نَافِعًا","tr":"Allahumma sayyiban nafi’a","src":"Sahih al-Bukhari"},{"id":"dly4","ar":"اللَّهُمَّ أَنْتَ حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي","tr":"Allahumma anta hassanta khalqi fahassin khuluqi","src":"Ahmad"},{"id":"dly5","ar":"الْحَمْدُ لِلَّهِ","tr":"Alhamdulillah","src":"Sahih al-Bukhari"}]}],"adhkar":{"morning":[{"id":"am1","n":"1×","ar":"@KURSI","link":"https://quran.com/2/255"},{"id":"am2","n":"3×","ar":"@QULS"},{"id":"am3","n":"1×","ar":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ و ِ، وَحَجِّ الْبَيْتِ، وَصَوْمِ رَمَضَانَ","src":"Sahih al-Bukhari, Sahih Muslim · Forty Hadith 3"},{"id":"h3","tp":"community","ar":"الدِّينُ النَّصِيحَةُ. قُلْنَا: لِمَنْ؟ قَالَ: لِلَّهِ وَلِكِتَابِهِ وَلِرَسُولِهِ وَلِأَئِمَّةِ الْمُسْلِمِينَ وَعَامَّتِهِمْ","src":"Sahih Muslim · Forty Hadith 7"},{"id":"h4","tp":"character","ar":"مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ","src":"At-Tirmidhi · Forty Hadith 12"},{"id":"h5","tp":"community","ar":"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّىٰ يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ","src":"Sahih al-Bukhari, Sahih Muslim · Forty Hadith 13"},{"id":"h6","tp":"character","ar":"مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الْآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ","src":"Sahih al-Bukhari, Sahih Muslim · Forty Hadith 15"},{"id":"h7","tp":"character","ar":"أَنَّ رَجُلًا قَالَ لِلنَّبِيِّ ﷺ: أَوْصِنِي، قَالَ: لَا تَغْضَبْ. فَرَدَّدَ مِرَارًا، قَالَ: لَا تَغْضَبْ","src":"Sahih al-Bukhari · Forty Hadith 16"},{"id":"h8","tp":"character","ar":"اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ","src":"At-Tirmidhi · Forty Hadith 18"},{"id":"h9","tp":"faith","ar":"احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ، إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ، وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللَّهِ","src":"At-Tirmidhi · Forty Hadith 19"},{"id":"h10","tp":"faith","ar":"كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ","src":"Sahih al-Bukhari · Forty Hadith 40"},{"id":"h11","tp":"community","ar":"لَا ضَرَرَ وَلَا ضِرَارَ","src":"Ibn Majah · Forty Hadith 32"},{"id":"h12","tp":"knowledge","ar":"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ","src":"Sahih al-Bukhari"},{"id":"h13","tp":"dhikr","ar":"كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَٰنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ","src":"Sahih al-Bukhari, Sahih Muslim"},{"id":"h14","tp":"dhikr","ar":"الدُّعَاءُ هُوَ الْعِبَ _s":"Breathing, timer and sounds","m_dhikr":"Tasbih and live dhikr","m_dhikr_s":"Counter, Istighfar and Salawat","m_journal":"Journal","m_journal_s":"Write how you feel","m_juz":"Quran by juz","m_juz_s":"Track your khatmah","m_support":"Support the developer","m_support_s":"Optional, from about $1","m_lang":"Language","m_back":"More","m_free":"Free for everyone","dn_title":"Support the developer","dn_text":"Hamudi Teach is free for everyone and always will be. If you would like to help me and my family, you can send a small donation of about $1 (around KES 130) by M-Pesa. If you cannot, please just make dua for us. That means a lot.","dn_send":"Send by M-Pesa to","dn_copy":"Copy number","dn_copied":"Number copied","dn_note":"Giving is optional. Nothing in the app depends on it."},"dua_cat":{"anx":"Anxiety and worry","dis":"Distress and a heavy heart","fgv":"Forgiveness","gui":"Guidance and faith","prv":"Provision and halal income","eas":"Ease and knowledge","grf":"Grief and loss","fea":"Fear and protection","hlt":"Health and sickness","slp":"Waking and sleeping","fod":"Food and drink","hom":"Home and travel","fam":"Family and parents","grt":"Gratitude and praise","suc":"Success in this life and the next","pat":"Patience and trust","umm":"The Prophet ﷺ and the Muslims","dly":"Daily life"},"dua":{"anx1":"O Allah, I seek refuge in You from worry and grief, weakness and laziness, miserliness and cowardice, the burden of debt and being overpowered by men.","anx2":"Allah is enough for me. There is no god but Him. I rely on Him, and He is the Lord of the Mighty Throne.","anx3":"O Allah, I hope for Your mercy. Do not leave me to myself even for a blink of an eye, and fix all my affairs. There is no god but You.","anx4":"There is no god but Allah, the Mighty, the Forbearing. There is no god but Allah, Lord of the Mighty Throne. There is no god but Allah, Lord of the heavens, Lord of the earth and Lord of the noble Throne.","dis1":"There is no god but You, glory be to You. Indeed I have been among the wrongdoers.","dis2":"O Ever-Living, O Sustainer, I seek relief through Your mercy.","dis3":"Allah is enough for us, and He is the best protector.","fgv1":"My Lord, forgive me and accept my repentance. You are the Accepting of repentance, the Merciful.","fgv2":"O Allah, You are my Lord. There is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil I have done. I admit Your favour upon me and I admit my sin, so forgive me, for none forgives sins except You.","fgv3":"Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we will surely be among the losers.","fgv4":"O Allah, You are the Pardoner and You love to pardon, so pardon me.","fgv5":"I ask Allah for forgiveness and I turn to Him in repentance.","gui1":"Guide us to the straight path.","gui2":"Our Lord, do not let our hearts deviate after You have guided us, and grant us mercy from Yourself. You are the Giver.","gui3":"O Turner of hearts, keep my heart firm on Your religion.","gui4":"O Allah, I ask You for guidance, piety, chastity and self-sufficiency.","prv1":"O Allah, make what is lawful enough for me so I stay away from what is forbidden, and enrich me by Your favour so I need no one but You.","prv2":"O Allah, I ask You for beneficial knowledge, good provision and accepted deeds.","prv3":"My Lord, I am in need of whatever good You send down to me.","eas1":"My Lord, expand my chest for me and make my task easy for me.","eas2":"My Lord, increase me in knowledge.","eas3":"O Allah, nothing is easy except what You make easy, and You can make the difficult easy if You wish.","grf1":"We belong to Allah and to Him we return. O Allah, reward me in my affliction and replace it with something better.","grf2":"O Allah, forgive him, have mercy on him, give him well-being and pardon him.","fea1":"In the name of Allah, with whose name nothing on earth or in heaven can cause harm. He is the All-Hearing, the All-Knowing.","fea2":"I seek refuge in the perfect words of Allah from the evil of what He created.","fea3":"O Allah, we put You before them and seek refuge in You from their evil.","hlt1":"O Allah, Lord of the people, remove the harm and heal. You are the Healer. There is no healing except Your healing, a healing that leaves no illness.","hlt2":"Place your hand on the place of pain, say Bismillah three times, then say: I seek refuge in Allah’s might and power from the evil of what I feel and fear.","hlt3":"When visiting the sick, say seven times: I ask Allah the Mighty, Lord of the Mighty Throne, to heal you.","hlt4":"O Allah, grant me well-being in my body. O Allah, grant me well-being in my hearing. O Allah, grant me well-being in my sight. There is no god but You.","slp1":"Praise be to Allah who gave us life after causing us to die, and to Him is the resurrection.","slp2":"In Your name, O Allah, I die and I live.","slp3":"O Allah, protect me from Your punishment on the day You raise Your servants.","fod1":"In the name of Allah. Say it before eating.","fod2":"Praise be to Allah who fed me this and provided it for me without any power or might from myself.","fod3":"When breaking a fast, say: The thirst has gone, the veins are moistened, and the reward is confirmed, if Allah wills.","hom1":"In the name of Allah, I rely on Allah, and there is no power or might except with Allah. Say it when leaving home.","hom2":"Say when entering home: In the name of Allah we enter, in the name of Allah we leave, and upon our Lord we rely.","hom3":"Glory to Him who has subjected this to us, and we could not have done it ourselves. And to our Lord we will return. Say it when travelling.","fam1":"Our Lord, grant us from our spouses and offspring comfort to our eyes, and make us leaders for the righteous.","fam2":"My Lord, inspire me to be thankful for Your favour which You gave me and my parents, and to do good that pleases You, and make my children righteous. I turn to You in repentance and I am among those who submit.","fam3":"My Lord, have mercy on them both as they raised me when I was small.","fam4":"Our Lord, forgive me, my parents and the believers on the Day the account is established.","grt1":"Praise be to Allah, abundant, good and blessed praise.","grt2":"O Allah, whatever blessing I or any of Your creation have this morning is from You alone, You have no partner. So all praise and thanks are Yours.","grt3":"O Allah, help me to remember You, to thank You, and to worship You well.","suc1":"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","suc2":"O Allah, I ask You for Paradise and I seek refuge in You from the Fire.","suc3":"O Allah, set right my religion, which is the safeguard of my affairs. Set right my worldly life, in which is my livelihood. Set right my Hereafter, to which I return. Make life an increase for me in every good, and make death a rest for me from every evil.","pat1":"Our Lord, pour patience upon us, make our feet firm, and help us.","pat2":"My Lord, I am overcome, so help me.","pat3":"I entrust my affair to Allah. Indeed, Allah is Seeing of His servants.","umm1":"O Allah, send blessings on Muhammad and the family of Muhammad, as You sent blessings on Ibrahim and the family of Ibrahim. You are Praiseworthy and Glorious. O Allah, bless Muhammad and the family of Muhammad, as You blessed Ibrahim and the family of Ibrahim. You are Praiseworthy and Glorious.","umm2":"Our Lord, forgive us and our brothers who came before us in faith, and do not put any bitterness in our hearts toward those who believe. Our Lord, You are Kind and Merciful.","dly1":"Say before entering the toilet: O Allah, I seek refuge in You from evil and evil-doers.","dly2":"Say when wearing new clothes: Praise be to Allah who clothed me with this and provided it for me without any power or might from myself.","dly3":"Say when it rains: O Allah, make it a beneficial rain.","dly4":"Say when looking in the mirror: O Allah, You made my body beautiful, so make my character beautiful.","dly5":"Say Alhamdulillah when you sneeze. Others reply: Yarhamukallah (may Allah have mercy on you). You answer: Yahdikumullahu wa yuslihu balakum (may Allah guide you and set your affairs right)."},"adhkar":{"am1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Protection through the day."},"am2":{"h":"Al-Ikhlas, Al-Falaq and An-Nas","en":"Recite each of the three short surahs three times."},"am3":{"h":"Morning praise","en":"We have reached the morning and the whole kingdom belongs to Allah. Praise is for Allah. None has the right to be worshipped but Allah alone, who has no partner. His is the kingdom and His is the praise, and He has power over everything. (Sahih Muslim)"},"am4":{"h":"By You we begin the day","en":"O Allah, by You we reach the morning and by You we reach the evening. By You we live and die, and to You is the resurrection. (At-Tirmidhi)"},"am5":{"h":"Content with Allah","en":"I am pleased with Allah as my Lord, Islam as my religion and Muhammad as my Prophet. (Abu Dawud)"},"am6":{"h":"SubhanAllah wa bihamdih","en":"Glory and praise to Allah. (Sahih Muslim)"},"am7":{"h":"Seeking forgiveness","en":"I ask Allah for forgiveness and I turn to Him in repentance."},"pm1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Protection through the night."},"pm2":{"h":"Al-Ikhlas, Al-Falaq and An-Nas","en":"Recite each of the three short surahs three times."},"pm3":{"h":"Evening praise","en":"We have reached the evening and the whole kingdom belongs to Allah. Praise is for Allah. None has the right to be worshipped but Allah alone, who has no partner. His is the kingdom and His is the praise, and He has power over everything. (Sahih Muslim)"},"pm4":{"h":"By You we begin the night","en":"O Allah, by You we reach the evening and by You we reach the morning. By You we live and die, and to You is the final return. (At-Tirmidhi)"},"pm5":{"h":"Seeking refuge","en":"I seek refuge in the perfect words of Allah from the evil of what He created. (Sahih Muslim)"},"pm6":{"h":"Content with Allah","en":"I am pleased with Allah as my Lord, Islam as my religion and Muhammad as my Prophet. (Abu Dawud)"},"pm7":{"h":"SubhanAllah wa bihamdih","en":"Glory and praise to Allah. (Sahih Muslim)"},"sl1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Whoever recites it at bedtime has a guard from Allah through the night. (Sahih al-Bukhari)"},"sl2":{"h":"Last two verses of Al-Baqarah","en":"Quran 2:285-286. These two verses are enough for the one who recites them at night. (Sahih al-Bukhari, Sahih Muslim)"},"sl3":{"h":"Al-Ikhlas, Al-Falaq and An-Nas","en":"Cup your hands, blow into them, recite the three surahs, then wipe your hands over your body, starting with the head and face. Do this three times. (Sahih al-Bukhari)"},"sl4":{"h":"Surah Al-Mulk","en":"The Prophet ﷺ would not sleep until he had recited Al-Mulk and As-Sajdah. (At-Tirmidhi)"},"sl5":{"h":"Surah As-Sajdah","en":"Surah 32, recited before sleep along with Al-Mulk."},"sl6":{"h":"Tasbih before sleep","en":"SubhanAllah 33 times, Alhamdulillah 33 times, Allahu Akbar 34 times. (Sahih al-Bukhari)"},"sl7":{"h":"In Your name I die and live","en":"In Your name, O Allah, I die and I live. (Sahih al-Bukhari)"},"sl8":{"h":"Protection on the Day of Judgment","en":"O Allah, protect me from Your punishment on the day You raise Your servants. (Abu Dawud)"}},"hadith":{"h1":"Actions are only by intentions, and each person will get only what they intended.","h2":"Islam is built on five: the testimony that there is no god but Allah and that Muhammad is the Messenger of Allah, establishing the prayer, paying zakat, performing Hajj to the House, and fasting Ramadan.","h3":"The religion is sincere advice. We asked: For whom? He said: For Allah, His Book, His Messenger, the leaders of the Muslims and their common people.","h4":"Part of the excellence of a person’s Islam is leaving what does not concern him.","h5":"None of you truly believes until he loves for his brother what he loves for himself.","h6":"Whoever believes in Allah and the Last Day, let him speak good or keep silent.","h7":"A man said to the Prophet ﷺ: Advise me. He said: Do not become angry. The man repeated it several times, and each time he said: Do not become angry.","h8":"Fear Allah wherever you are, follow a bad deed with a good one and it will wipe it out, and treat people with good character.","h9":"Be mindful of Allah and He will protect you. Be mindful of Allah and you will find Him before you. If you ask, ask Allah; if you seek help, seek help from Allah.","h10":"Be in this world as if you were a stranger or a traveller.","h11":"There should be neither harm nor reciprocating harm.","h12":"The best of you are those who learn the Quran and teach it.","h13":"There are two phrases light on the tongue, heavy on the scale, and beloved to the Most Merciful: SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.","h14":"Dua is worship.","h15":"Among the best of you are those with the best character.","h16":"The strong believer is better and more beloved to Allah than the weak believer, though there is good in both.","h17":"Your smile in the face of your brother is charity.","h18":"Make things easy and do not make them hard; give good news and do not drive people away.","h19":"Whoever does not thank people does not thank Allah.","h20":"You see the believers in their mercy, love and compassion for each other like one body: when one part complains, the whole body responds with sleeplessness and fever.","h21":"Show mercy to those on the earth, and the One in the heavens (Allah) will show mercy to you.","h22":"A Muslim is one from whose tongue and hand the Muslims are safe.","h23":"Whoever travels a path seeking knowledge, Allah makes easy for him a path to Paradise.","h24":"Seeking knowledge is an obligation upon every Muslim.","h25":"Whoever believes in Allah and the Last Day, let him not harm his neighbour.","h26":"Wealth is not having many possessions; true wealth is the richness of the soul.","h27":"How wonderful is the affair of the believer: all of it is good for him, and that is for no one but the believer. If something good happens to him he is thankful, and that is good for him; if something bad happens to him he is patient, and that is good for him.","h28":"Allah does not look at your appearance or your wealth, but He looks at your hearts and your deeds.","h29":"The deeds most beloved to Allah are the most regular, even if small.","h30":"Whoever says SubhanAllahi wa bihamdihi a hundred times a day, his sins are forgiven even if they are like the foam of the sea."},"names":{"n1":"The Most Gracious","n2":"The Most Merciful","n3":"The King","n4":"The Most Holy","n5":"The Source of Peace","n6":"The Giver of Security","n7":"The Guardian","n8":"The Almighty","n9":"The Compeller","n10":"The Supreme","n11":"The Creator","n12":"The Maker","n13":"The Fashioner","n14":"The Oft-Forgiving","n15":"The Subduer","n16":"The Giver of Gifts","n17":"The Provider","n18":"The Opener","n19":"The All-Knowing","n20":"The Withholder","n21":"The Extender","n22":"The Abaser","n23":"The Exalter","n24":"The Honourer","n25":"The Humiliator","n26":"The All-Hearing","n27":"The All-Seeing","n28":"The Judge","n29":"The Utterly Just","n30":"The Most Gentle, the Subtle","n31":"The All-Aware","n32":"The Forbearing","n33":"The Magnificent","n34":"The Forgiving","n35":"The Most Appreciative","n36":"The Most High","n37":"The Most Great","n38":"The Preserver","n39":"The Nourisher","n40":"The Reckoner","n41":"The Majestic","n42":"The Most Generous","n43":"The Watchful","n44":"The Responsive","n45":"The All-Encompassing","n46":"The All-Wise","n47":"The Most Loving","n48":"The Glorious","n49":"The Resurrector","n50":"The Witness","n51":"The Truth","n52":"The Trustee","n53":"The All-Strong","n54":"The Firm","n55":"The Protecting Friend","n56":"The Praiseworthy","n57":"The Counter","n58":"The Initiator","n59":"The Restorer","n60":"The Giver of Life","n61":"The Taker of Life","n62":"The Ever-Living","n63":"The Sustainer","n64":"The Finder","n65":"The Noble","n66":"The One","n67":"The Unique","n68":"The Eternal Refuge","n69":"The Able","n70":"The Powerful","n71":"The Expediter","n72":"The Delayer","n73":"The First","n74":"The Last","n75":"The Manifest","n76":"The Hidden","n77":"The Governor","n78":"The Most Exalted","n79":"The Source of Goodness","n80":"The Accepter of Repentance","n81":"The Avenger","n82":"The Pardoner","n83":"The Most Kind","n84":"Owner of All Sovereignty","n85":"Lord of Majesty and Generosity","n86":"The Equitable","n87":"The Gatherer","n88":"The Self-Sufficient","n89":"The Enricher","n90":"The Preventer","n91":"The Distresser","n92":"The Benefactor","n93":"The Light","n94":"The Guide","n95":"The Incomparable Originator","n96":"The Everlasting","n97":"The Inheritor","n98":"The Guide to the Right Path","n99":"The Most Patient"},"course":[{"id":"L1","w":1,"title":"Who is Allah?","teach":"Muslims believe in one God, Allah. He created everything, has no partner and no children, and nothing is like Him. This belief is called Tawhid. The word Islam means peaceful submission to Allah, and a Muslim is someone who submits to Him. Allah is Ar-Rahman, the Most Merciful, and Al-Khaliq, the Creator.","qs":[{"q":"What does Tawhid mean?","o":["Belief that Allah is One","Fasting in Ramadan","Praying five times","Giving charity"],"a":0},{"q":"What does the name Ar-Rahman mean?","o":["The Most Merciful","The Creator","The Forgiving","The Most High"],"a":0},{"q":"A Muslim is someone who…","o":["submits to Allah","lives in Makkah","speaks Arabic","was born in a Muslim family"],"a":0},{"q":"True or false: Allah has partners.","o":["True","False"],"a":1}]},{"id":"N1","title":"The Beautiful Names of Allah","teach":"Allah has 99 beautiful names (Al-Asma’ul-Husna), found in the Quran and the Sunnah. The Prophet ﷺ said that Allah has ninety-nine names, and whoever learns them and lives by them will enter Paradise (Sahih al-Bukhari, Sahih Muslim). Examples are Ar-Rahman (the Most Gracious), Al-Malik (the King) and Al-Ghaffar (the Oft-Forgiving). We call on Allah by His names when we make dua: ‘And to Allah belong the best names, so call on Him by them’ (Quran 7:180). See all 99 in the Names tab.","qs":[{"q":"How many beautiful names of Allah are famously listed?","o":["99","33","40","114"],"a":0},{"q":"What does Al-Ghaffar mean?","o":["The Oft-Forgiving","The King","The Creator","The Provider"],"a":0},{"q":"What does Allah tell us to do with His beautiful names?","o":["Call on Him by them","Keep them secret","Only read them once","Write them on walls"],"a":0},{"q":"What does Al-Malik mean?","o":["The King","The Healer","The Judge","The Light"],"a":0}],"w":1},{"id":"L3","w":1,"title":"The six pillars of Iman","teach":"Iman means faith. A Muslim believes in six things: Allah, His angels, His books, His messengers, the Last Day, and Qadr, which is Allah’s knowledge and decree of all things, good and bad. Angels were created from light, humans from clay, and jinn from smokeless fire.","qs":[{"q":"How many pillars of Iman are there?","o":["6","5","4","7"],"a":0},{"q":"Which of these is NOT one of the six pillars of Iman?","o":["Fasting","Belief in angels","Belief in the Last Day","Belief in Allah’s books"],"a":0},{"q":"Angels were created from…","o":["Light","Clay","Smokeless fire","Water"],"a":0},{"q":"Humans were created from…","o":["Clay","Light","Smokeless fire","Stone"],"a":0}]},{"id":"L5","w":1,"title":"The five pillars of Islam","teach":"Islam is built on five pillars. 1. Shahada: declaring faith. 2. Salah: praying five times a day. 3. Zakat: giving charity from your wealth. 4. Sawm: fasting in Ramadan. 5. Hajj: the pilgrimage to Makkah, once in a lifetime for those who are able.","qs":[{"q":"How many pillars of Islam are there?","o":["5","6","3","4"],"a":0},{"q":"Which pillar is praying five times a day?","o":["Salah","Zakat","Hajj","Sawm"],"a":0},{"q":"In which month do Muslims fast?","o":["Ramadan","Shawwal","Muharram","Rajab"],"a":0},{"q":"Hajj is required…","o":["once in a lifetime, for those who are able","every year","every month","only for scholars"],"a":0}]},{"id":"L7","w":2,"title":"Saying the Shahada","teach":"The Shahada is the declaration of faith that makes someone a Muslim: ‘Ash-hadu an la ilaha illallah, wa ash-hadu anna Muhammadan rasulullah.’ It means: I bear witness that there is no god but Allah, and I bear witness that Muhammad is the Messenger of Allah. It must be said with understanding and sincerity.","ar":"أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","qs":[{"q":"What does Shahada mean?","o":["Bearing witness","Fasting","Prayer","Charity"],"a":0},{"q":"The first part says there is no god but…","o":["Allah","The Prophet","The angels","The Kaaba"],"a":0},{"q":"The second part says Muhammad is…","o":["The Messenger of Allah","A king","An angel","A god"],"a":0},{"q":"The Shahada should be said with…","o":["understanding and sincerity","a loud voice only","a group only","Arabic only"],"a":0}]},{"id":"L21","w":2,"title":"The prophets of Allah","teach":"Allah sent prophets to every nation with the same message: worship Allah alone. The Quran names 25 of them, including Adam, Nuh (Noah), Ibrahim (Abraham), Musa (Moses), Isa (Jesus) and Muhammad ﷺ, the final prophet. Musa received the Tawrat, Dawud the Zabur, Isa the Injil, and Muhammad ﷺ the Quran.","qs":[{"q":"Who is the final prophet?","o":["Muhammad ﷺ","Isa","Musa","Ibrahim"],"a":0},{"q":"Which book was given to Musa?","o":["The Tawrat","The Injil","The Zabur","The Quran"],"a":0},{"q":"The Quran was revealed to…","o":["Muhammad ﷺ","Dawud","Isa","Nuh"],"a":0},{"q":"What was the message of every prophet?","o":["Worship Allah alone","Build cities","Start trade","Gain power"],"a":0}]},{"id":"L17","w":2,"title":"The Prophet ﷺ: early years","teach":"Muhammad ﷺ was born in Makkah around 570 CE, in the Year of the Elephant. His father died before his birth and his mother when he was about six. His grandfather, and then his uncle Abu Talib, raised him. He was known as As-Sadiq Al-Amin, the truthful and trustworthy. At 25 he married Khadijah, may Allah be pleased with her.","qs":[{"q":"Where was the Prophet ﷺ born?","o":["Makkah","Madinah","Jerusalem","Taif"],"a":0},{"q":"He was known as…","o":["the truthful and trustworthy","the wealthiest","the strongest","the poet"],"a":0},{"q":"Who did he marry at 25?","o":["Khadijah","Aisha","Hafsah","Maryam"],"a":0},{"q":"Who raised him after his grandfather?","o":["His uncle Abu Talib","Abu Lahab","Abu Bakr","Umar"],"a":0}]},{"id":"L19","w":3,"title":"Revelation and the Hijra","teach":"At the age of 40, in the Cave of Hira, the angel Jibril brought the first revelation: ‘Iqra’ (Read!), the start of Surah Al-Alaq. For 13 years the Prophet ﷺ called people to Allah in Makkah and faced hardship. In 622 CE he migrated to Madinah. This Hijra marks the start of the Islamic calendar.","qs":[{"q":"Where did the first revelation come?","o":["The Cave of Hira","The Kaaba","Madinah","Mount Sinai"],"a":0},{"q":"What was the first word revealed?","o":["Iqra (Read)","Bismillah","Qul (Say)","Alhamdulillah"],"a":0},{"q":"The Hijra was the migration to…","o":["Madinah","Egypt","Yemen","Baghdad"],"a":0},{"q":"The Hijra marks the start of…","o":["the Islamic calendar","Ramadan","Hajj","Eid"],"a":0}]},{"id":"L23","w":3,"title":"Madinah and the conquest of Makkah","teach":"In Madinah the Prophet ﷺ built the first mosque, Masjid an-Nabawi, and created a community based on brotherhood and justice. In 630 CE Makkah was opened to the Muslims, and the Prophet ﷺ forgave the people who had opposed him. He passed away in 632 CE at the age of 63 and is buried in Madinah.","qs":[{"q":"What did the Prophet ﷺ build first in Madinah?","o":["A mosque","A castle","A market","A school"],"a":0},{"q":"How did he treat his former enemies in Makkah?","o":["He forgave them","He punished them","He ignored them","He sent them away"],"a":0},{"q":"Where is the Prophet ﷺ buried?","o":["Madinah","Makkah","Taif","Jerusalem"],"a":0},{"q":"Which surah speaks of victory and people entering Islam in crowds?","o":["An-Nasr","Al-Fil","Al-Asr","Quraysh"],"a":0}]},{"id":"N2","title":"The Quran: revelation and preservation","teach":"The Quran is the word of Allah, revealed to the Prophet ﷺ in Arabic over about 23 years. It has 114 surahs. It was memorised and written down during the Prophet’s ﷺ lifetime. After him, Abu Bakr had it collected into one volume, and Uthman made copies of the standard text and sent them to the main cities. Allah promised to protect it (Quran 15:9).","qs":[{"q":"How many surahs does the Quran have?","o":["114","99","30","60"],"a":0},{"q":"About how long was the Quran revealed over?","o":["23 years","3 years","40 years","1 year"],"a":0},{"q":"Who had the Quran collected into one volume?","o":["Abu Bakr","Abu Lahab","Hamza","Bilal"],"a":0},{"q":"Who sent copies of the standard text to the main cities?","o":["Uthman","Ali","Umar","Khalid"],"a":0}],"w":3},{"id":"L9","w":4,"title":"Wudu: washing for prayer","teach":"Wudu is the washing needed before prayer. Make the intention in your heart and say Bismillah. Then wash your hands 3 times, rinse your mouth 3 times, sniff water into the nose and blow it out 3 times, wash your face 3 times, wash your arms to the elbows 3 times (right, then left), wipe your head once (with the ears), and wash your feet to the ankles 3 times (right, then left). Wudu is broken by using the toilet, passing wind, deep sleep, or losing consciousness.","qs":[{"q":"What do you say at the start of wudu?","o":["Bismillah","Allahu Akbar","Alhamdulillah","SubhanAllah"],"a":0},{"q":"How many times is the head wiped?","o":["Once","Three times","Not at all","Seven times"],"a":0},{"q":"Which of these breaks wudu?","o":["Deep sleep","Eating bread","Walking","Reading"],"a":0},{"q":"The arms are washed up to the…","o":["Elbows","Wrists","Shoulders","Knees"],"a":0}]},{"id":"L11","w":4,"title":"Salah: times and rakats","teach":"Muslims pray five times a day, facing the Qibla (the direction of the Kaaba in Makkah). Fajr (dawn) has 2 rakats, Dhuhr (midday) 4, Asr (afternoon) 4, Maghrib (sunset) 3, and Isha (night) 4. A rakah is one cycle of standing, bowing and prostrating. Try to pray each prayer on time.","qs":[{"q":"How many rakats is Fajr?","o":["2","3","4","5"],"a":0},{"q":"Which prayer has 3 rakats?","o":["Maghrib","Fajr","Asr","Isha"],"a":0},{"q":"Which direction do Muslims face in prayer?","o":["The Qibla, towards the Kaaba","North","East","The sun"],"a":0},{"q":"How many daily prayers are there?","o":["5","3","4","6"],"a":0}]},{"id":"L13","w":4,"title":"How to pray: step by step","teach":"1. Make the intention, say ‘Allahu Akbar’ and raise your hands. 2. Stand and recite Al-Fatiha and another surah. 3. Ruku: bow and say ‘Subhana Rabbiyal ‘Azim’. 4. Stand up saying ‘Sami’allahu liman hamidah’. 5. Sujud: prostrate on seven parts (forehead with nose, both hands, both knees, both feet) and say ‘Subhana Rabbiyal A’la’. 6. Sit, then prostrate again. In the last rakah, sit for the Tashahhud, send blessings on the Prophet ﷺ, and finish with the Taslim: ‘As-salamu alaykum wa rahmatullah’ to the right and left. It helps to have someone show you in person.","qs":[{"q":"What do you say in ruku (bowing)?","o":["Subhana Rabbiyal ‘Azim","Subhana Rabbiyal A’la","Bismillah","Alhamdulillah"],"a":0},{"q":"In sujud, how many body parts touch the ground?","o":["7","3","5","10"],"a":0},{"q":"How does the prayer begin?","o":["Takbir: Allahu Akbar","Salam","Ruku","Sujud"],"a":0},{"q":"How does the prayer end?","o":["Taslim: As-salamu alaykum wa rahmatullah","Takbir","Al-Fatiha","Sujud"],"a":0}]},{"id":"L25","w":5,"title":"Fasting and Ramadan","teach":"Ramadan is the ninth month of the Islamic calendar. Muslims fast from dawn (Fajr) until sunset (Maghrib): no food, no drink. Fasting teaches patience, thankfulness and care for the poor. The Quran was first revealed in Ramadan, and Laylat al-Qadr, the Night of Power, is in its last ten nights. Eid al-Fitr comes after the month.","qs":[{"q":"When does the daily fast last?","o":["From dawn to sunset","From sunrise to noon","From sunset to dawn","From noon to night"],"a":0},{"q":"Laylat al-Qadr is in…","o":["the last ten nights of Ramadan","Muharram","Dhul Hijjah","the first night of Ramadan"],"a":0},{"q":"Which festival comes after Ramadan?","o":["Eid al-Fitr","Eid al-Adha","Arafah","Hijra"],"a":0},{"q":"Ramadan is which month of the Islamic calendar?","o":["The 9th","The 1st","The 12th","The 5th"],"a":0}]},{"id":"L27","w":5,"title":"Zakat and Sadaqah","teach":"Zakat is the third pillar. It is 2.5% of savings that stay above a minimum amount (nisab) for one lunar year, given to people in need and the other groups listed in the Quran. Sadaqah is voluntary charity: any amount, or even a kind word or a smile. Charity purifies wealth and the heart.","qs":[{"q":"What percent is zakat on savings?","o":["2.5%","10%","50%","1%"],"a":0},{"q":"What is voluntary charity called?","o":["Sadaqah","Zakat","Hajj","Sawm"],"a":0},{"q":"Who is zakat for?","o":["The poor and needy, among others","Rich relatives","Shop owners","Anyone who asks"],"a":0},{"q":"Charity purifies…","o":["wealth and the heart","only the body","houses","cars"],"a":0}]},{"id":"L29","w":5,"title":"Hajj and Umrah","teach":"Hajj is the pilgrimage to Makkah in the month of Dhul Hijjah, required once in a lifetime for those who are able. Pilgrims wear simple white clothes (ihram), circle the Kaaba (tawaf), walk between Safa and Marwah, and stand on the Plain of Arafah, the most important day. Umrah is a smaller pilgrimage that can be done at any time of the year.","qs":[{"q":"In which month is Hajj?","o":["Dhul Hijjah","Ramadan","Rajab","Muharram"],"a":0},{"q":"What is circling the Kaaba called?","o":["Tawaf","Sa’i","Ihram","Wudu"],"a":0},{"q":"What is the most important day of Hajj?","o":["Standing at Arafah","Eid","Friday","Sunrise"],"a":0},{"q":"Which is the smaller pilgrimage?","o":["Umrah","Zakat","Salah","Sawm"],"a":0}]},{"id":"L15","w":6,"title":"Good manners and character","teach":"Muslims greet with ‘As-salamu alaykum’ (peace be upon you), and the reply is ‘Wa alaykumus-salam’. Say ‘Bismillah’ before eating and ‘Alhamdulillah’ after. Be truthful, kind to your neighbours, and respectful to your parents: Allah tells us not even to say ‘uff’ to them (Quran 17:23). Avoid backbiting, which means speaking badly about someone when they are not there. The Prophet ﷺ said: ‘The best of you are those with the best character’ (Sahih al-Bukhari).","qs":[{"q":"What is the reply to ‘As-salamu alaykum’?","o":["Wa alaykumus-salam","Bismillah","SubhanAllah","Allahu Akbar"],"a":0},{"q":"What do we say before eating?","o":["Bismillah","Alhamdulillah","Astaghfirullah","Inshallah"],"a":0},{"q":"What does Allah tell us never to say to our parents?","o":["‘Uff’ (a word of annoyance)","Thank you","Peace","Welcome"],"a":0},{"q":"According to the Prophet ﷺ, the best people are those with the best…","o":["character","wealth","houses","clothes"],"a":0}]},{"id":"L31","w":6,"title":"Halal and haram","teach":"Halal means permitted and haram means forbidden. Allah forbade harmful things such as alcohol, pork, gambling, stealing, lying and riba (interest). Most things are halal unless Allah has forbidden them. Earn your money honestly and spend it wisely. When you are unsure, ask a trusted scholar.","qs":[{"q":"What does halal mean?","o":["Permitted","Forbidden","Disliked","Required"],"a":0},{"q":"Which of these is haram?","o":["Riba (interest)","Honest trade","Giving charity","Fasting"],"a":0},{"q":"Most things are…","o":["halal unless forbidden","haram unless allowed","banned","optional"],"a":0},{"q":"How should we earn money?","o":["Honestly","By any way possible","By cheating","By gambling"],"a":0}]},{"id":"L32","w":6,"title":"The Hereafter","teach":"Every person will die and return to Allah. Angels record our deeds. After death comes the life of the grave (barzakh), then the Day of Judgment, when everyone is raised and held to account. The righteous will enter Jannah (Paradise) by Allah’s mercy. Allah is Most Merciful and forgives those who sincerely repent.","qs":[{"q":"What comes after death?","o":["The life of the grave, then the Day of Judgment","Nothing","Another life on earth","Sleep forever"],"a":0},{"q":"Who records our deeds?","o":["Angels","Humans","Jinn","Birds"],"a":0},{"q":"What is Paradise called?","o":["Jannah","Jahannam","Barzakh","Qadr"],"a":0},{"q":"Allah forgives those who…","o":["sincerely repent","boast","never pray","hide"],"a":0}]},{"id":"N3","title":"How to make dua","teach":"Dua means asking Allah. The Prophet ﷺ said: ‘Dua is worship’ (Abu Dawud, At-Tirmidhi). Good manners of dua: begin by praising Allah and sending blessings on the Prophet ﷺ, be sincere, be sure that Allah hears you, ask again and again, and never ask for something sinful. Times when dua is especially hopeful include the last third of the night, while prostrating in prayer, and between the adhan and the iqama. Allah may give what you asked, keep a harm away from you, or store the reward for the Hereafter.","qs":[{"q":"The Prophet ﷺ said dua is…","o":["worship","only for the sick","only for Fridays","a custom"],"a":0},{"q":"A good way to begin a dua is…","o":["by praising Allah","by complaining","by shouting","by asking for harm"],"a":0},{"q":"Which is a time when dua is especially hopeful?","o":["The last third of the night","Never at night","Only at noon","Only in Ramadan"],"a":0},{"q":"If you do not see your dua answered right away, you should…","o":["keep asking and trust Allah","stop asking","blame yourself only","ask someone else instead of Allah"],"a":0}],"w":6},{"id":"N4","title":"Three parts of Tawhid","teach":"Scholars often explain Tawhid in three parts. Tawhid ar-Rububiyyah: Allah alone is the Lord, Creator and Sustainer. Tawhid al-Uluhiyyah: Allah alone deserves worship. Tawhid al-Asma was-Sifat: believing in Allah’s names and attributes as the Quran and Sunnah describe them, without comparing Him to His creation. This is one common way of organising the topic.","qs":[{"q":"Into how many parts do scholars often divide Tawhid?","o":["3","2","5","7"],"a":0},{"q":"Tawhid ar-Rububiyyah means that Allah alone is…","o":["the Lord and Creator","the only prophet","the only angel","the only city"],"a":0},{"q":"Tawhid al-Uluhiyyah means that Allah alone deserves…","o":["worship","taxes","armies","a house"],"a":0},{"q":"Tawhid al-Asma was-Sifat is belief in…","o":["Allah’s names and attributes","the names of cities","the names of angels only","the names of months"],"a":0}],"w":7},{"id":"N5","title":"Shirk and what harms faith","teach":"Shirk means giving a partner to Allah. It is the greatest sin if a person dies on it (Quran 4:48). It includes worshipping or praying to anyone besides Allah. There is also minor shirk, such as showing off in worship, called riya. The Prophet ﷺ feared this for his followers. The door of repentance stays open: Allah forgives those who sincerely turn back to Him before death.","qs":[{"q":"What does shirk mean?","o":["Giving a partner to Allah","Missing a fast","Being late","Eating too much"],"a":0},{"q":"Showing off in worship is called…","o":["riya","zakat","sujud","hijra"],"a":0},{"q":"Is the door of repentance open?","o":["Yes, until death","No, never","Only on Fridays","Only for scholars"],"a":0},{"q":"Who should we pray to and rely on?","o":["Allah alone","Saints","The sun","Our ancestors"],"a":0}],"w":7},{"id":"N6","title":"How hadith are graded","teach":"A hadith is a report of the words, actions or approvals of the Prophet ﷺ. It has two parts: the isnad (the chain of narrators) and the matn (the text). Scholars checked every narrator and graded hadith as sahih (authentic), hasan (good), da’if (weak) or mawdu’ (fabricated). Sahih al-Bukhari and Sahih Muslim are the most trusted books. With Abu Dawud, At-Tirmidhi, An-Nasa’i and Ibn Majah, they make up the six main collections.","qs":[{"q":"The isnad of a hadith is…","o":["the chain of narrators","the text","the title","the book cover"],"a":0},{"q":"The matn of a hadith is…","o":["the text","the chain","the grade","the translator"],"a":0},{"q":"What does mawdu’ mean?","o":["Fabricated","Authentic","Good","Famous"],"a":0},{"q":"How many main hadith collections are there?","o":["6","3","10","99"],"a":0}],"w":7},{"id":"N7","title":"Sources of Islamic law","teach":"Islamic law (shariah) is taken from sources in order. 1. The Quran. 2. The Sunnah, the teachings and example of the Prophet ﷺ. 3. Ijma, the agreement of scholars on a ruling. 4. Qiyas, reasoning by comparison with a known ruling. Fiqh is the understanding of these rulings by qualified scholars. When we do not know something, we ask people of knowledge.","qs":[{"q":"What is the first source of Islamic law?","o":["The Quran","Ijma","Qiyas","Custom"],"a":0},{"q":"The Sunnah means…","o":["The teachings and example of the Prophet ﷺ","A city","A kind of prayer rug","The month of fasting"],"a":0},{"q":"Ijma is…","o":["the agreement of scholars","a festival","a charity","a prayer"],"a":0},{"q":"What do we do when we do not know a ruling?","o":["Ask people of knowledge","Guess","Ignore it","Ask anyone online"],"a":0}],"w":8},{"id":"N8","title":"The four rightly guided caliphs","teach":"After the Prophet ﷺ, the Muslims were led by four rightly guided caliphs (Al-Khulafa ar-Rashidun): Abu Bakr as-Siddiq, Umar ibn al-Khattab, Uthman ibn Affan and Ali ibn Abi Talib, may Allah be pleased with them. Abu Bakr had the Quran collected, Umar was known for justice, Uthman copied the standard text, and Ali was the Prophet’s ﷺ cousin and son-in-law. This is the Sunni view of the order and their status.","qs":[{"q":"How many rightly guided caliphs were there?","o":["4","2","3","7"],"a":0},{"q":"Who was the first caliph?","o":["Abu Bakr","Umar","Uthman","Ali"],"a":0},{"q":"Who made copies of the standard text of the Quran?","o":["Uthman","Umar","Bilal","Hamza"],"a":0},{"q":"Ali was the Prophet’s ﷺ…","o":["cousin and son-in-law","brother","uncle","teacher"],"a":0}],"w":8},{"id":"N9","title":"The four schools of fiqh","teach":"Sunni Muslims follow one of four classical schools of fiqh: Hanafi (Abu Hanifa), Maliki (Malik ibn Anas), Shafi’i (Imam ash-Shafi’i) and Hanbali (Ahmad ibn Hanbal). They agree on belief and on the pillars of Islam, and differ on some details, for example in how some parts of worship are done. Differences between scholars on secondary matters are normal and are no reason to quarrel. Many Muslims in East Africa follow the Shafi’i school.","qs":[{"q":"How many classical Sunni schools of fiqh are there?","o":["4","2","6","10"],"a":0},{"q":"Which school is named after Imam ash-Shafi’i?","o":["Shafi’i","Hanafi","Maliki","Hanbali"],"a":0},{"q":"The schools agree on…","o":["belief and the pillars of Islam","every small detail","nothing","only the date of Eid"],"a":0},{"q":"How should we treat differences on secondary matters?","o":["With respect, without quarrelling","By fighting","By mocking others","By ignoring Islam"],"a":0}],"w":8}]},"so":{"ui":{"n_duas":"Duco","n_learn":"Baro","n_hadith":"Xadiis","n_names":"Magacyo","n_more":"Wax kale","streak_days":"{n} maalmood oo isku xigta","d_title":"Duco","d_sub":"Duco xaalad kasta iyo wakhti kasta","d_ph":"Sidee dareemaysaa?","d_none":"Ma jirto duco ku habboon. Isku day dareen sida cabsi ama murugo.","d_adhkar":"Axdhaarta maalinlaha ah","d_morning":"Subax","d_evening":"Fiidkii","d_sleep":"Hortii hurdo","d_done":"la dhammeeyay","d_cats":"Ku raadi dareen","d_note":"Ku hubi Carabiga mushaf la daabacay ama il la isku halleyn karo.","d_count":"duco","l_title":"Baro Islaamka","l_sub":"Waddo 8 toddobaad ah oo ka bilaabata bilowga ilaa heer sare.","l_week":"Toddobaadka","l_xp":"XP","l_done":"cashar la dhammeeyay","l_start":"Bilow","l_review":"Dib u eeg","l_locked":"Dhammee casharka ka horeeya si aad tan u furto.","l_quiz":"Bilow imtixaanka","l_check":"Hubi","l_continue":"Sii wad","l_correct":"Sax!","l_wrong":"Maaha sax. Jawaabtu waa:","l_complete":"Casharka waa dhammaaday","l_earned":"XP la helay","l_back":"Ku noqo casharrada","l_q":"Su'aal","l_of":"ee","l_beg":"Bilow","l_int":"Dhexe","l_adv":"Sare","l_read":"Ka akhri quran.com","l_next":"Casharka xiga","l_perfect":"Dhibcaha oo dhan!","l_review_note":"Dib u eegistu XP dheeraad ah ma keento.","l_lesson":"Cashar","h_title":"Xadiis","h_sub":"Hadallada saxda ah ee Nabiga ﷺ","h_ph":"Raadi xadiis","h_all":"Dhammaan","h_none":"Xadiis lama helin.","h_books":"Akhri ururada oo dhan","h_books_s":"Wuxuu furaa sunnah.com oo leh Carabi iyo Ingiriis.","h_note":"Ku hubi erayada buuggii oo dhan ka hor intaadan soo xigan.","tp_faith":"Iimaan","tp_character":"Akhlaaq","tp_knowledge":"Aqoon","tp_dhikr":"Dhikr iyo duco","tp_community":"Bulsho","nm_title":"99-ka Magac ee Allaah","nm_sub":"Baro magacyada quruxda badan iyo macnahooda.","nm_ph":"Raadi magacyo","nm_learned":"la bartay","nm_none":"Magac lama helin.","nm_ref":"‘Allaah waxaa u sugnaaday magacyada ugu wanaagsan, ee ku barya iyaga.’ (Quraanka 7:180)","nm_note":"Culimadu magacyada si yar ayay u kala liisteeyaan. Kani waa liis caan ah.","m_title":"Wax kale","m_calm":"Degganaan","m_calm_s":"Neefsasho, saacad iyo codad","m_dhikr":"Tasbiix iyo dhikr toos ah","m_dhikr_s":"Tiriye, Istighfaar iyo Salawaat","m_journal":"Buug-yare","m_journal_s":"Qor sida aad dareemayso","m_juz":"Quraanka juz-ka","m_juz_s":"La soco khatmadaada","m_support":"Caawi horumariyaha","m_support_s":"Ikhtiyaari, ilaa $1 hor","m_lang":"Luqad","m_back":"Wax kale","m_free":"Dhammaan bilaash","dn_title":"Caawi horumariyaha","dn_text":"Hamudi Teach waa bilaash qof walba, weligiina sidaas ayuu ahaan doonaa. Haddii aad rabto inaad i caawiso aniga iyo qoyskayga, waxaad u diri kartaa tabaruc yar oo qiyaastii $1 ah (qiyaastii KES 130) adigoo M-Pesa isticmaalaya. Haddii aadan awoodin, fadlan noo duceey. Taasi aad bay u weyn tahay.","dn_send":"Ku dir M-Pesa lambarkan","dn_copy":"Koobiyee lambarka","dn_copied":"Lambarka waa la koobiyeeyay","dn_note":"Bixintu waa ikhtiyaari. Waxba kuma xirna app-ka."},"dua_cat":{"anx":"Welwel iyo walaac","dis":"Dhibaato iyo qalbi culus","fgv":"Cafis","gui":"Hanuun iyo iimaan","prv":"Rizqi iyo dakhli xalaal ah","eas":"Fudeyd iyo aqoon","grf":"Murugo iyo luminta","fea":"Cabsi iyo ilaalin","hlt":"Caafimaad iyo cudur","slp":"Toosid iyo hurdo","fod":"Cunto iyo cabitaan","hom":"Guri iyo safar","fam":"Qoys iyo waalidiin","grt":"Mahadnaq iyo ammaan","suc":"Guul adduunka iyo aakhiro","pat":"Samir iyo tawakul","umm":"Nabiga ﷺ iyo Muslimiinta","dly":"Nolol maalmeed"},"dua":{"anx1":"Allaahayow, waxaan kugu magan galayaa welwelka iyo murugada, daciifnimada iyo caajiska, bakhaylnimada iyo gabood-fallada, culayska deynta iyo ka adkaanshaha dadka.","anx2":"Allaah ayaa igu filan. Ilaah mooyaane ma jiro isaga. Isaga ayaan ku tawakulay, wuuna Rabbiga Carshiga weyn.","anx3":"Allaahayow, naxariistaada ayaan rajaynayaa. Ha ii dayn naftayda in indho-qabsi oo kaliya ah, oo ii wanaaji arrimahayga oo dhan. Ilaah mooyaane ma jiro adiga.","anx4":"Ilaah mooyaane ma jiro Allaah, Isagoo Weyn oo Xalimo badan. Ilaah mooyaane ma jiro Allaah, Rabbiga Carshiga weyn. Ilaah mooyaane ma jiro Allaah, Rabbiga samooyinka, Rabbiga dhulka iyo Rabbiga Carshiga sharafta leh.","dis1":"Ilaah mooyaane ma jiro adiga, waad nafisan tahay. Runtii waxaan ka mid ahaa daalimiinta.","dis2":"Ina Nool, ina Qaa'imow, naxariistaada ayaan gargaar ku weydiisanayaa.","dis3":"Allaah ayaa nagu filan, wuuna Wakiilka ugu wanaagsan.","fgv1":"Rabbigayow, i cafi oo toobadayda i aqbal. Adigu waxaad tahay Toobad-aqbale, Naxariis badane.","fgv2":"Allaahayow, adigu waxaad tahay Rabbigayga. Ilaah mooyaane ma jiro adiga. Waad i abuurtay, anna waxaan ahay addoonkaaga, waxaanan ku sugan ahay axdigaaga iyo ballankaaga intii karaankayga ah. Waxaan kugu magan galayaa sharka wixii aan sameeyay. Waxaan qiranayaa nicmadaada i saarneyd, waxaanan qiranayaa dembigayga, haddaba i cafi, waayo dembiyada ma cafiyo adiga mooyaane.","fgv3":"Rabbigayagow, nafahayaga ayaan dulminey. Haddii aadan na cafin oo aadan na naxariisan, hubaal waxaan noqonaynaa kuwa khasaaray.","fgv4":"Allaahayow, adigu waxaad tahay Cafiye, waxaadna jeceshahay cafiska, haddaba i cafi.","fgv5":"Waxaan Allaah ka weydiisanayaa dambi-dhaaf, wuxuuna ku toobad keenayaa.","gui1":"Na hanuuni jidka toosan.","gui2":"Rabbigayagow, ha leexin quluubtayada markaad na hanuuniso dabadeed, oo na sii naxariis adiga agtaada. Adigu waxaad tahay Deeqsi.","gui3":"Ina Rogaha quluubtow, qalbigayga ku adkee diintaada.","gui4":"Allaahayow, waxaan ku weydiisanayaa hanuun, taqwo, nadiifnimo iyo isku filnaansho.","prv1":"Allaahayow, xalaashaada igu filnaysii si aan xaaraanta uga fogaado, oo fadligaaga igu hodmi si aanan qof kale u baahnaan adiga mooyaane.","prv2":"Allaahayow, waxaan ku weydiisanayaa aqoon faa'iido leh, rizqi wanaagsan iyo camal la aqbalay.","prv3":"Rabbigayow, anigu waxaan aad ugu baahanahay wanaag kasta oo aad ii soo dejiso.","eas1":"Rabbigayow, i furfur laabtayda oo ii fududee arrinkayga.","eas2":"Rabbigayow, aqoon iigu kordhi.","eas3":"Allaahayow, waxba ma fududa wixii aad fududayso mooyaane, adiguna waxaad fududayn kartaa wixii dhib ah haddii aad doonto.","grf1":"Allaah ayaan leenahay, isagana ayaan u noqonaynaa. Allaahayow, ii abaal mari belaayadayda oo ku bedel wax ka wanaagsan.","grf2":"Allaahayow, isaga cafi, isaga naxariiso, isaga caafimaad sii oo isaga cafi.","fea1":"Magaca Allaah, kan magaciisa waxba dhulka iyo samada ku dhibi karin. Isagu waa Maqle oo Ogaal.","fea2":"Waxaan ku magan galayaa erayada kaamilka ah ee Allaah sharka wixii uu abuuray.","fea3":"Allaahayow, adigaa naga horraysiinay iyaga, waxaana kugu magan galnay sharkooda.","hlt1":"Allaahayow, Rabbiga dadka, dhibka ka qaad oo bogsii. Adigu waxaad tahay Bogsiiye. Bogsiin ma jiro bogsiintaada mooyaane, bogsiin aan cudur reebin.","hlt2":"Gacantaada saar meesha xanuunka, dheh Bismillah saddex jeer, kadibna dheh: Waxaan ku magan galayaa Allaah xooggiisa iyo awooddiisa sharka wixii aan dareemayo oo aan ka cabsanayo.","hlt3":"Marka aad bukaan booqanayso, toddoba jeer dheh: Waxaan Allaah Weyn, Rabbiga Carshiga weyn, ka weydiisanayaa inuu ku bogsiiyo.","hlt4":"Allaahayow, jidhkayga caafimaad ii sii. Allaahayow, maqalkayga caafimaad ii sii. Allaahayow, aragtidayda caafimaad ii sii. Ilaah mooyaane ma jiro adiga.","slp1":"Mahad waxaa leh Allaah kan na nooleeyay markuu na dhimiyay dabadeed, isagaana loo kicinayaa.","slp2":"Magacaaga, Allaahayow, ayaan ku dhimanayaa oo ku noolaanayaa.","slp3":"Allaahayow, iga ilaali cadaabkaaga maalinta aad addoommadaada kicinayso.","fod1":"Magaca Allaah. Dheh hortii cunto.","fod2":"Mahad waxaa leh Allaah kan i quudiyay kan oo ii arzaaqay anigoon awood iyo xoog lahayn.","fod3":"Marka aad afurto, dheh: Haraadkii wuu tagay, xididdadii way qoyoobeen, ajarkiina wuu sugnaaday, haddii Allaah doono.","hom1":"Magaca Allaah, Allaah ayaan tawakulay, awood iyo xoog ma jiro Allaah mooyaane. Dheh marka aad guriga ka baxayso.","hom2":"Dheh marka aad guriga gelayso: Magaca Allaah ayaan ku galnay, magaca Allaah ayaan ku baxnay, Rabbigayagana ayaan tawakulnay.","hom3":"Nafisan kan tan noo hoosaadiyay, innagu ma awoodi lahayn. Rabbigayagana waan ku noqonaynaa. Dheh marka aad safraysid.","fam1":"Rabbigayagow, naga sii xaasaskayaga iyo faracayaga wax indhaha ina qaboojiya, oo na yeel hoggaamiyeyaal kuwa taqwada leh.","fam2":"Rabbigayow, ii hanuuni inaan ku mahadiyo nicmadaada aad i siisay aniga iyo waalidkayga, iyo inaan sameeyo wanaag ku raali galiya, oo carruurtayda iigu wanaajii. Waan kuu toobad keenay, waxaanan ka mid ahay Muslimiinta.","fam3":"Rabbigayow, labadooda naxariiso sidii ay i trabiyeen anigoo yar.","fam4":"Rabbigayagow, i cafi aniga, waalidkayga iyo mu'miniinta maalinta xisaabta la taagayo.","grt1":"Mahad waxaa leh Allaah, mahad badan oo wanaagsan oo barakaysan.","grt2":"Allaahayow, nicmo kasta oo aniga ama makhluuq kaaga mid ah subaxdan haysto adiga keliya ayay kaa timid, shuraako ma lihid. Haddaba mahad iyo bogaadin adigaa leh.","grt3":"Allaahayow, iga caawi inaan ku xasuusto, ku mahadiyo oo si wanaagsan kuu caabudo.","suc1":"Rabbigayagow, nagu sii wanaag adduunka iyo wanaag aakhiro, oo naga ilaali cadaabka Naarta.","suc2":"Allaahayow, waxaan ku weydiisanayaa Jannada, waxaanan kugu magan galayaa Naarta.","suc3":"Allaahayow, iigu wanaaji diinteyda oo ah ilaalada arrimahayga. Iigu wanaaji adduunkayga oo ah meesha ay ku jirto nolosheyda. Iigu wanaaji aakhirtayda oo aan ku noqonayo. Nolosha ka dhig kordhin wanaag kasta, dhimashadana ka dhig nasasho sharka oo dhan.","pat1":"Rabbigayagow, nagu daadi samir, cagahayaga ku adkee, oo na gargaar.","pat2":"Rabbigayow, waa i adkaaday, haddaba i gargaar.","pat3":"Arrinkayga waxaan u dhiibayaa Allaah. Runtii, Allaah waa Arka addoommadiisa.","umm1":"Allaahayow, u salaadi Muxammad iyo ehelka Muxammad, sidaad u salaadday Ibraahiim iyo ehelka Ibraahiim. Adigu waxaad tahay Ammaan-mudane Sharaf badane. Allaahayow, u barakee Muxammad iyo ehelka Muxammad, sidaad u barakaysay Ibraahiim iyo ehelka Ibraahiim. Adigu waxaad tahay Ammaan-mudane Sharaf badane.","umm2":"Rabbigayagow, na cafi annaga iyo walaalahayaga na soo mudnaaday iimaanka, oo ha yeelin quluubtayada nacayb kuwa rumeeyay. Rabbigayagow, adigu waxaad tahay Roon oo Naxariis badane.","dly1":"Dheh hortii aad musqusha gelayso: Allaahayow, waxaan kugu magan galayaa sharka iyo shayaadiinta.","dly2":"Dheh marka aad dhar cusub xidhanayso: Mahad waxaa leh Allaah kan igu huwiyay kan oo ii arzaaqay anigoon awood iyo xoog lahayn.","dly3":"Dheh marka roob da'o: Allaahayow, ka dhig roob faa'iido leh.","dly4":"Dheh marka aad muraayadda eegto: Allaahayow, jidhkayga waad qurxisay, haddaba akhlaaqdayda qurxi.","dly5":"Dheh Alhamdulillah marka aad hindhisto. Dadka kale way ku jawaabaan: Yarhamukallah (Allaah ha ku naxariisto). Adna waxaad ugu jawaabtaa: Yahdikumullahu wa yuslihu balakum (Allaah ha idin hanuuniyo oo arrimahaaga ha idiin wanaajiyo)."},"adhkar":{"am1":{"h":"Aayadul Kursi","en":"Quraanka 2:255. Ilaalin maalinta oo dhan."},"am2":{"h":"Al-Ikhlaas, Al-Falaq iyo An-Naas","en":"Akhri mid walba saddexdan suurad ee gaagaaban saddex jeer."},"am3":{"h":"Mahadinta subaxda","en":"Subaxa waan nimid, boqortooyada oo dhanna waxay leedahay Allaah. Mahad waxaa leh Allaah. Cibaadaysi toosan ma leh qof Allaah mooyaane, isagoo keliya oo aan shuraako lahayn. Isagaa leh boqortooyada, isagaa leh mahadda, wuxuuna karaa wax kasta. (Sahiix Muslim)"},"am4":{"h":"Adigaan ku bilownay maalinta","en":"Allaahayow, adigaan ku nimid subaxda, adigaan ku nimid fiidka. Adigaan ku nool nahay oo ku dhimanaynaa, adigaana loo kicinayaa. (At-Tirmidhi)"},"am5":{"h":"Ku raalli ahaanshaha Allaah","en":"Waan ku raalli ahay Allaah inuu yahay Rabbigayga, Islaamka inuu yahay diinteyda iyo Muxammad inuu yahay Nabigayga. (Abu Daawuud)"},"am6":{"h":"SubhanAllah wa bihamdih","en":"Allaah waa nafisan yahay, mahadna waa leeyahay. (Sahiix Muslim)"},"am7":{"h":"Weydiisashada dambi-dhaaf","en":"Waxaan Allaah ka weydiisanayaa dambi-dhaaf, wuxuuna ku toobad keenayaa."},"pm1":{"h":"Aayadul Kursi","en":"Quraanka 2:255. Ilaalin habeenka oo dhan."},"pm2":{"h":"Al-Ikhlaas, Al-Falaq iyo An-Naas","en":"Akhri mid walba saddexdan suurad ee gaagaaban saddex jeer."},"pm3":{"h":"Mahadinta fiidka","en":"Fiidka waan nimid, boqortooyada oo dhanna waxay leedahay Allaah. Mahad waxaa leh Allaah. Cibaadaysi toosan ma leh qof Allaah mooyaane, isagoo keliya oo aan shuraako lahayn. Isagaa leh boqortooyada, isagaa leh mahadda, wuxuuna karaa wax kasta. (Sahiix Muslim)"},"pm4":{"h":"Adigaan ku bilownay habeenka","en":"Allaahayow, adigaan ku nimid fiidka, adigaan ku nimid subaxda. Adigaan ku nool nahay oo ku dhimanaynaa, adigaana ah meesha ugu dambeysa ee loo noqonayo. (At-Tirmidhi)"},"pm5":{"h":"Magan gelid","en":"Waxaan ku magan galayaa erayada kaamilka ah ee Allaah sharka wixii uu abuuray. (Sahiix Muslim)"},"pm6":{"h":"Ku raalli ahaanshaha Allaah","en":"Waan ku raalli ahay Allaah inuu yahay Rabbigayga, Islaamka inuu yahay diinteyda iyo Muxammad inuu yahay Nabigayga. (Abu Daawuud)"},"pm7":{"h":"SubhanAllah wa bihamdih","en":"Allaah waa nafisan yahay, mahadna waa leeyahay. (Sahiix Muslim)"},"sl1":{"h":"Aayadul Kursi","en":"Quraanka 2:255. Ruuxii akhriya hurdada horteeda, waxaa la socda ilaaliye Allaah ka yimid habeenka oo dhan. (Sahiix al-Bukhaari)"},"sl2":{"h":"Labada aayadood ee u dambeeya Al-Baqarah","en":"Quraanka 2:285-286. Labadan aayadood waxay ku filan yihiin ruuxa habeenkii akhriya. (Sahiix al-Bukhaari, Sahiix Muslim)"},"sl3":{"h":"Al-Ikhlaas, Al-Falaq iyo An-Naas","en":"Gacmahaaga isku soo ururi, ku afuuf, akhri saddexda suurad, kadibna gacmahaaga ku mari jidhkaaga, adigoo ka bilaabaya madaxa iyo wajiga. Saddex jeer sidaas yeel. (Sahiix al-Bukhaari)"},"sl4":{"h":"Suuradda Al-Mulk","en":"Nabigu ﷺ ma seexan jirin ilaa uu akhriyo Al-Mulk iyo As-Sajdah. (At-Tirmidhi)"},"sl5":{"h":"Suuradda As-Sajdah","en":"Suuradda 32, la akhriyo hortii hurdo iyadoo la socota Al-Mulk."},"sl6":{"h":"Tasbiix hortii hurdo","en":"SubhanAllah 33 jeer, Alhamdulillah 33 jeer, Allahu Akbar 34 jeer. (Sahiix al-Bukhaari)"},"sl7":{"h":"Magacaaga ayaan ku dhimanayaa oo ku noolaanayaa","en":"Magacaaga, Allaahayow, ayaan ku dhimanayaa oo ku noolaanayaa. (Sahiix al-Bukhaari)"},"sl8":{"h":"Ilaalin Maalinta Qiyaamaha","en":"Allaahayow, iga ilaali cadaabkaaga maalinta aad addoommadaada kicinayso. (Abu Daawuud)"}},"hadith":{"h1":"Camalladu waxay ku xiran yihiin niyadaha, qof walbana wuxuu helayaa wixii uu niyeystay.","h2":"Islaamku wuxuu ku dhisan yahay shan: marag-furka in Ilaah aan Allaah ahayn aanu jirin iyo in Muxammad yahay Rasuulka Allaah, tuurista salaadda, bixinta sakada, xajka Guriga, iyo soonka Ramadaan.","h3":"Diintu waa naseexo. Waxaan nidhi: Yaa loo naseexeeyaa? Wuxuu yidhi: Allaah, Kitaabkiisa, Rasuulkiisa, hoggaamiyeyaasha Muslimiinta iyo dadkooda caadiga ah.","h4":"Qurxinta Islaamka qofka waxaa ka mid ah inuu ka tago wixii aan khuseyn.","h5":"Midkiinna runtii ma rumaysna ilaa uu walaalkiis u jeclaado wixii uu naftiisa u jecel yahay.","h6":"Ruuxii rumeeya Allaah iyo Maalinta Dambe, ha ku hadlo wanaag ama ha aamusnaado.","h7":"Nin ayaa Nabiga ﷺ ku yidhi: Waano i sii. Wuxuu yidhi: Ha cadhoon. Ninkii wuu ku celceliyay dhawr jeer, mar kasta wuxuu odhan jiray: Ha cadhoon.","h8":"Allaah ka cabso meel kasta oo aad joogto, falka xun wanaag ku raaci wuuna tirtiri doonaa, dadkana la dhaqan akhlaaq wanaagsan.","h9":"Allaah ilaali wuu ku ilaalin doonaa. Allaah ilaali waxaad hortaada ka heli doontaa. Haddii aad wax weydiisato, Allaah weydiiso; haddii aad gargaar doonto, Allaah ka gargaar doon.","h10":"Adduunka ku noqo sidii shisheeye ama socotle.","h11":"Waa inaan dhib la gaarsiin, dhib-celin dhib ahna la samayn.","h12":"Kuwa idiinka khayr badan waa kuwa barta Quraanka oo bara.","h13":"Waxaa jira laba weedh oo ilaaha ku fudud, miisaanka ku culus, Naxariis-badanaha u jecel: SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.","h14":"Ducadu waa cibaado.","h15":"Kuwa idiinka khayr badan waa kuwa akhlaaqda ugu wanaagsan.","h16":"Mu'minka xoogga badan wuu ka wanaagsan yahay oo Allaah ayuu ugu jecel yahay mu'minka daciifka ah, in kasta oo labadaba wanaag ku jiro.","h17":"Dhoola-cadayntaada wejiga walaalkaa waa sadaqo.","h18":"Fududeeya, ha adkeynina; bishaareeya, hana cararsiinina.","h19":"Ruuxii aan dadka mahadin, Allaah ma mahadiyo.","h20":"Mu'miniinta waxaad ku aragtaa naxariistooda, jacaylkooda iyo gaarsiisnimadooda midba midka kale sida jidh keliya: marka qayb ka cabato, jidhka oo dhan wuxuu ku jawaabaa hurdo-la'aan iyo qandho.","h21":"Dadka dhulka ku jira naxariista, kan samada ku jira (Allaah) ayaa idin naxariisan doona.","h22":"Muslimku waa kan Muslimiintu ka nabad gelaan carrabkiisa iyo gacantiisa.","h23":"Ruuxii u socda jid uu aqoon ku doonayo, Allaah wuxuu u fududeeyaa jid ku geeya Jannada.","h24":"Baridda aqoonta
