asbih et dhikr en direct","m_dhikr_s":"Compteur, Istighfar et Salawat","m_journal":"Journal","m_journal_s":"Écrivez ce que vous ressentez","m_juz":"Coran par juz","m_juz_s":"Suivez votre khatmah","m_support":"Soutenir le développeur","m_support_s":"Facultatif, à partir d'environ 1 $","m_lang":"Langue","m_back":"Plus","m_free":"Gratuit pour tous","dn_title":"Soutenir le développeur","dn_text":"Hamudi Teach est gratuit pour tous, et le restera toujours. Si vous souhaitez nous aider, ma famille et moi, vous pouvez envoyer un petit don d'environ 1 $ (environ 130 KES) par M-Pesa. Si vous ne le pouvez pas, faites simplement une doua pour nous. Cela compte beaucoup.","dn_send":"Envoyer par M-Pesa au","dn_copy":"Copier le numéro","dn_copied":"Numéro copié","dn_note":"Donner est facultatif. Rien dans l'application n'en dépend."},"dua_cat":{"anx":"Anxiété et soucis","dis":"Détresse et cœur lourd","fgv":"Pardon","gui":"Guidance et foi","prv":"Subsistance et revenu licite","eas":"Facilité et savoir","grf":"Deuil et perte","fea":"Peur et protection","hlt":"Santé et maladie","slp":"Réveil et sommeil","fod":"Nourriture et boisson","hom":"Maison et voyage","fam":"Famille et parents","grt":"Gratitude et louange","suc":"Réussite ici-bas et dans l'au-delà","pat":"Patience et confiance en Allah","umm":"Le Prophète ﷺ et les musulmans","dly":"Vie quotidienne"},"dua":{"anx1":"Ô Allah, je cherche refuge auprès de Toi contre le souci et le chagrin, la faiblesse et la paresse, l'avarice et la lâcheté, le poids des dettes et la domination des hommes.","anx2":"Allah me suffit. Il n'y a de dieu que Lui. En Lui je place ma confiance, et Il est le Seigneur du Trône immense.","anx3":"Ô Allah, j'espère Ta miséricorde. Ne me laisse pas à moi-même, ne serait-ce que le temps d'un clin d'œil, et arrange toutes mes affaires. Il n'y a de dieu que Toi.","anx4":"Il n'y a de dieu qu'Allah, le Très Grand, le Très Indulgent. Il n'y a de dieu qu'Allah, Seigneur du Trône immense. Il n'y a de dieu qu'Allah, Seigneur des cieux, Seigneur de la terre et Seigneur du noble Trône.","dis1":"Il n'y a de dieu que Toi, gloire à Toi. J'ai certes été parmi les injustes.","dis2":"Ô Vivant, ô Subsistant par Lui-même, par Ta miséricorde je demande secours.","dis3":"Allah nous suffit, et Il est le meilleur garant.","fgv1":"Mon Seigneur, pardonne-moi et accepte mon repentir. Tu es Celui qui accepte le repentir, le Miséricordieux.","fgv2":"Ô Allah, Tu es mon Seigneur. Il n'y a de dieu que Toi. Tu m'as créé et je suis Ton serviteur, et je tiens Ton pacte et Ta promesse autant que je le peux. Je cherche refuge auprès de Toi contre le mal que j'ai commis. Je reconnais Ton bienfait envers moi et je reconnais mon péché, alors pardonne-moi, car nul ne pardonne les péchés en dehors de Toi.","fgv3":"Notre Seigneur, nous nous sommes fait du tort à nous-mêmes. Si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons certainement parmi les perdants.","fgv4":"Ô Allah, Tu es Celui qui efface les fautes et Tu aimes les effacer, alors efface les miennes.","fgv5":"Je demande pardon à Allah et je reviens à Lui en repentir.","gui1":"Guide-nous vers le droit chemin.","gui2":"Notre Seigneur, ne laisse pas dévier nos cœurs après que Tu nous as guidés, et accorde-nous une miséricorde venant de Toi. Tu es le Grand Donateur.","gui3":"Ô Celui qui fait tourner les cœurs, affermis mon cœur dans Ta religion.","gui4":"Ô Allah, je Te demande la guidance, la piété, la chasteté et l'indépendance à l'égard des gens.","prv1":"Ô Allah, rends-moi suffisant ce qui est licite afin que je m'éloigne de ce qui est interdit, et enrichis-moi par Ta grâce afin que je n'aie besoin que de Toi.","prv2":"Ô Allah, je Te demande un savoir utile, une bonne subsistance et des actes acceptés.","prv3":"Mon Seigneur, j'ai grand besoin du bien que Tu feras descendre sur moi.","eas1":"Mon Seigneur, ouvre-moi la poitrine et facilite-moi ma mission.","eas2":"Mon Seigneur, augmente mon savoir.","eas3":"Ô Allah, rien n'est facile sauf ce que Tu rends facile, et Tu peux rendre facile ce qui est difficile si Tu le veux.","grf1":"Nous appartenons à Allah et c'est à Lui que nous retournons. Ô Allah, récompense-moi dans mon épreuve et remplace-la par quelque chose de meilleur.","grf2":"Ô Allah, pardonne-lui, fais-lui miséricorde, accorde-lui le bien-être et efface ses fautes.","fea1":"Au nom d'Allah, avec le nom de qui rien sur terre ni au ciel ne peut nuire. Il est l'Audient, l'Omniscient.","fea2":"Je cherche refuge dans les paroles parfaites d'Allah contre le mal de ce qu'Il a créé.","fea3":"Ô Allah, nous Te plaçons devant eux et nous cherchons refuge auprès de Toi contre leur mal.","hlt1":"Ô Allah, Seigneur des hommes, éloigne le mal et guéris. Tu es le Guérisseur. Il n'y a de guérison que la Tienne, une guérison qui ne laisse aucune maladie.","hlt2":"Posez la main à l'endroit de la douleur, dites trois fois Bismillah, puis dites : Je cherche refuge dans la puissance et la force d'Allah contre le mal de ce que je ressens et de ce que je crains.","hlt3":"En rendant visite à un malade, dites sept fois : Je demande à Allah le Très Grand, Seigneur du Trône immense, de te guérir.","hlt4":"Ô Allah, accorde-moi la santé dans mon corps. Ô Allah, accorde-moi la santé dans mon ouïe. Ô Allah, accorde-moi la santé dans ma vue. Il n'y a de dieu que Toi.","slp1":"Louange à Allah qui nous a rendu la vie après nous avoir fait mourir, et c'est vers Lui que sera la résurrection.","slp2":"En Ton nom, ô Allah, je meurs et je vis.","slp3":"Ô Allah, préserve-moi de Ton châtiment le jour où Tu ressusciteras Tes serviteurs.","fod1":"Au nom d'Allah. À dire avant de manger.","fod2":"Louange à Allah qui m'a nourri de ceci et me l'a accordé sans aucune force ni puissance de ma part.","fod3":"En rompant le jeûne, dites : La soif est partie, les veines sont humectées et la récompense est confirmée, si Allah le veut.","hom1":"Au nom d'Allah, je place ma confiance en Allah, et il n'y a de force ni de puissance qu'en Allah. À dire en sortant de chez soi.","hom2":"En entrant chez soi, dites : Au nom d'Allah nous entrons, au nom d'Allah nous sortons, et en notre Seigneur nous plaçons notre confiance.","hom3":"Gloire à Celui qui nous a soumis cela, car nous n'aurions pas pu le faire par nous-mêmes. Et c'est vers notre Seigneur que nous retournerons. À dire en voyage.","fam1":"Notre Seigneur, accorde-nous, en nos épouses et nos descendants, la joie des yeux, et fais de nous des guides pour les pieux.","fam2":"Mon Seigneur, inspire-moi de remercier Ton bienfait dont Tu m'as comblé, moi et mes parents, et de faire le bien qui Te plaît, et rends mes enfants vertueux. Je reviens à Toi en repentir et je suis parmi les soumis.","fam3":"Mon Seigneur, fais-leur miséricorde à tous deux, comme ils m'ont élevé quand j'étais petit.","fam4":"Notre Seigneur, pardonne-moi, ainsi qu'à mes parents et aux croyants, le jour où le compte sera établi.","grt1":"Louange à Allah, une louange abondante, bonne et bénie.","grt2":"Ô Allah, tout bienfait dont je jouis ce matin, moi ou l'une de Tes créatures, vient de Toi seul, Tu n'as pas d'associé. À Toi donc la louange et la gratitude.","grt3":"Ô Allah, aide-moi à T'invoquer, à Te remercier et à bien T'adorer.","suc1":"Notre Seigneur, accorde-nous une belle part ici-bas et une belle part dans l'au-delà, et protège-nous du châtiment du Feu.","suc2":"Ô Allah, je Te demande le Paradis et je cherche refuge auprès de Toi contre le Feu.","suc3":"Ô Allah, rends ma religion droite, car elle est la sauvegarde de mes affaires. Rends droite ma vie d'ici-bas, où se trouve ma subsistance. Rends droite ma vie future, vers laquelle je retourne. Fais de la vie un surcroît pour moi dans tout bien, et fais de la mort un repos pour moi loin de tout mal.","pat1":"Notre Seigneur, déverse sur nous la patience, affermis nos pas et donne-nous la victoire.","pat2":"Mon Seigneur, je suis vaincu, viens donc à mon secours.","pat3":"Je remets mon affaire à Allah. Allah observe certes Ses serviteurs.","umm1":"Ô Allah, prie sur Muhammad et sur la famille de Muhammad, comme Tu as prié sur Ibrahim et sur la famille d'Ibrahim. Tu es digne de louange et de gloire. Ô Allah, bénis Muhammad et la famille de Muhammad, comme Tu as béni Ibrahim et la famille d'Ibrahim. Tu es digne de louange et de gloire.","umm2":"Notre Seigneur, pardonne-nous ainsi qu'à nos frères qui nous ont devancés dans la foi, et ne mets dans nos cœurs aucune rancune envers ceux qui croient. Notre Seigneur, Tu es Compatissant et Miséricordieux.","dly1":"À dire avant d'entrer aux toilettes : Ô Allah, je cherche refuge auprès de Toi contre le mal et les êtres malfaisants.","dly2":"À dire en mettant un vêtement neuf : Louange à Allah qui m'a vêtu de ceci et me l'a accordé sans aucune force ni puissance de ma part.","dly3":"À dire quand il pleut : Ô Allah, fais-en une pluie bénéfique.","dly4":"À dire en se regardant dans le miroir : Ô Allah, Tu as embelli ma création, alors embellis mon caractère.","dly5":"Dites Alhamdulillah quand vous éternuez. Les autres répondent : Yarhamukallah (qu'Allah te fasse miséricorde). Vous répondez : Yahdikumullahu wa yuslihu balakum (qu'Allah vous guide et arrange vos affaires)."},"adhkar":{"am1":{"h":"Ayat al-Kursi","en":"Coran 2:255. Protection pendant la journée."},"am2":{"h":"Al-Ikhlas, Al-Falaq et An-Nas","en":"Récitez chacune des trois courtes sourates trois fois."},"am3":{"h":"Louange du matin","en":"Nous voici au matin et toute la royauté appartient à Allah. La louange est à Allah. Nul n'a le droit d'être adoré sauf Allah seul, qui n'a pas d'associé. À Lui la royauté et à Lui la louange, et Il est capable de tout. (Sahih Muslim)"},"am4":{"h":"Par Toi nous commençons la journée","en":"Ô Allah, par Toi nous atteignons le matin et par Toi nous atteignons le soir. Par Toi nous vivons et mourons, et vers Toi est la résurrection. (At-Tirmidhi)"},"am5":{"h":"Satisfait d'Allah","en":"Je suis satisfait d'Allah comme Seigneur, de l'islam comme religion et de Muhammad comme Prophète. (Abu Dawud)"},"am6":{"h":"SubhanAllah wa bihamdih","en":"Gloire et louange à Allah. (Sahih Muslim)"},"am7":{"h":"Demander pardon","en":"Je demande pardon à Allah et je reviens à Lui en repentir."},"pm1":{"h":"Ayat al-Kursi","en":"Coran 2:255. Protection pendant la nuit."},"pm2":{"h":"Al-Ikhlas, Al-Falaq et An-Nas","en":"Récitez chacune des trois courtes sourates trois fois."},"pm3":{"h":"Louange du soir","en":"Nous voici au soir et toute la royauté appartient à Allah. La louange est à Allah. Nul n'a le droit d'être adoré sauf Allah seul, qui n'a pas d'associé. À Lui la royauté et à Lui la louange, et Il est capable de tout. (Sahih Muslim)"},"pm4":{"h":"Par Toi nous commençons la nuit","en":"Ô Allah, par Toi nous atteignons le soir et par Toi nous atteignons le matin. Par Toi nous vivons et mourons, et vers Toi est le retour final. (At-Tirmidhi)"},"pm5":{"h":"Chercher refuge","en":"Je cherche refuge dans les paroles parfaites d'Allah contre le mal de ce qu'Il a créé. (Sahih Muslim)"},"pm6":{"h":"Satisfait d'Allah","en":"Je suis satisfait d'Allah comme Seigneur, de l'islam comme religion et de Muhammad comme Prophète. (Abu Dawud)"},"pm7":{"h":"SubhanAllah wa bihamdih","en":"Gloire et louange à Allah. (Sahih Muslim)"},"sl1":{"h":"Ayat al-Kursi","en":"Coran 2:255. Celui qui la récite au moment du coucher a un gardien envoyé par Allah pendant la nuit. (Sahih al-Bukhari)"},"sl2":{"h":"Les deux derniers versets d'Al-Baqarah","en":"Coran 2:285-286. Ces deux versets suffisent à celui qui les récite la nuit. (Sahih al-Bukhari, Sahih Muslim)"},"sl3":{"h":"Al-Ikhlas, Al-Falaq et An-Nas","en":"Joignez les mains en coupe, soufflez dedans, récitez les trois sourates, puis passez les mains sur votre corps, en commençant par la tête et le visage. Faites-le trois fois. (Sahih al-Bukhari)"},"sl4":{"h":"Sourate Al-Mulk","en":"Le Prophète ﷺ ne dormait pas avant d'avoir récité Al-Mulk et As-Sajdah. (At-Tirmidhi)"},"sl5":{"h":"Sourate As-Sajdah","en":"Sourate 32, récitée avant de dormir avec Al-Mulk."},"sl6":{"h":"Tasbih avant de dormir","en":"SubhanAllah 33 fois, Alhamdulillah 33 fois, Allahu Akbar 34 fois. (Sahih al-Bukhari)"},"sl7":{"h":"En Ton nom je meurs et je vis","en":"En Ton nom, ô Allah, je meurs et je vis. (Sahih al-Bukhari)"},"sl8":{"h":"Protection le Jour du Jugement","en":"Ô Allah, préserve-moi de Ton châtiment le jour où Tu ressusciteras Tes serviteurs. (Abu Dawud)"}},"hadith":{"h1":"Les actes ne valent que par les intentions, et chacun n'obtient que ce qu'il a eu l'intention de faire.","h2":"L'islam est bâti sur cinq piliers : le témoignage qu'il n'y a de dieu qu'Allah et que Muhammad est le Messager d'Allah, l'accomplissement de la prière, le versement de la zakat, le pèlerinage à la Maison et le jeûne du Ramadan.","h3":"La religion est le conseil sincère. Nous avons demandé : Pour qui ? Il a dit : Pour Allah, Son Livre, Son Messager, les dirigeants des musulmans et leurs gens du commun.","h4":"Fait partie de la beauté de l'islam d'une personne le fait de délaisser ce qui ne la concerne pas.","h5":"Aucun de vous ne croit vraiment tant qu'il n'aime pas pour son frère ce qu'il aime pour lui-même.","h6":"Que celui qui croit en Allah et au Jour dernier dise du bien ou se taise.","h7":"Un homme dit au Prophète ﷺ : Donne-moi un conseil. Il dit : Ne te mets pas en colère. L'homme répéta sa demande plusieurs fois, et chaque fois il dit : Ne te mets pas en colère.","h8":"Crains Allah où que tu sois, fais suivre une mauvaise action d'une bonne et elle l'effacera, et sois de bon caractère avec les gens.","h9":"Veille sur Allah et Il veillera sur toi. Veille sur Allah et tu Le trouveras devant toi. Si tu demandes, demande à Allah ; si tu cherches de l'aide, cherche-la auprès d'Allah.","h10":"Sois en ce monde comme un étranger ou comme un voyageur.","h11":"Il ne faut ni causer de tort, ni rendre un tort par un autre tort.","h12":"Les meilleurs d'entre vous sont ceux qui apprennent le Coran et l'enseignent.","h13":"Il y a deux paroles légères sur la langue, lourdes dans la balance et aimées du Tout Miséricordieux : SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.","h14":"La doua est une adoration.","h15":"Parmi les meilleurs d'entre vous figurent ceux qui ont le meilleur caractère.","h16":"Le croyant fort est meilleur et plus aimé d'Allah que le croyant faible, bien qu'il y ait du bien en chacun.","h17":"Ton sourire au visage de ton frère est une aumône.","h18":"Facilitez et ne rendez pas les choses difficiles ; annoncez de bonnes nouvelles et ne faites pas fuir les gens.","h19":"Celui qui ne remercie pas les gens ne remercie pas Allah.","h20":"Tu vois les croyants, dans leur miséricorde, leur affection et leur compassion les uns envers les autres, comme un seul corps : quand un membre souffre, tout le corps réagit par l'insomnie et la fièvre.","h21":"Soyez miséricordieux envers ceux qui sont sur terre, et Celui qui est au ciel (Allah) sera miséricordieux envers vous.","h22":"Le musulman est celui dont les musulmans sont à l'abri de la langue et de la main.","h23":"Celui qui emprunte un chemin à la recherche du savoir, Allah lui facilite un chemin vers le Paradis.","h24":"La recherche du savoir est une obligation pour tout musulman.","h25":"Que celui qui croit en Allah et au Jour dernier ne fasse pas de tort à son voisin.","h26":"La richesse n'est pas d'avoir beaucoup de biens ; la vraie richesse est la richesse de l'âme.","h27":"Comme l'affaire du croyant est étonnante : tout est un bien pour lui, et cela n'est le cas que pour le croyant. S'il lui arrive du bien, il remercie, et c'est un bien pour lui ; s'il lui arrive du mal, il patiente, et c'est un bien pour lui.","h28":"Allah ne regarde ni vos apparences ni vos richesses, mais Il regarde vos cœurs et vos actes.","h29":"Les actes les plus aimés d'Allah sont les plus réguliers, même s'ils sont petits.","h30":"Celui qui dit SubhanAllahi wa bihamdihi cent fois par jour, ses péchés lui sont pardonnés, même s'ils sont comme l'écume de la mer."},"names":{"n1":"Le Tout Miséricordieux","n2":"Le Très Miséricordieux","n3":"Le Roi","n4":"Le Très Saint","n5":"La Source de paix","n6":"Celui qui accorde la sécurité","n7":"Le Gardien","n8":"Le Tout-Puissant","n9":"Le Contraignant","n10":"Le Suprême","n11":"Le Créateur","n12":"Le Producteur","n13":"Le Modeleur","n14":"Le Grand Pardonneur","n15":"Le Dominateur","n16":"Le Grand Donateur","n17":"Le Pourvoyeur","n18":"Celui qui ouvre","n19":"L'Omniscient","n20":"Celui qui retient","n21":"Celui qui étend","n22":"Celui qui abaisse","n23":"Celui qui élève","n24":"Celui qui honore","n25":"Celui qui humilie","n26":"L'Audient","n27":"Le Clairvoyant","n28":"Le Juge","n29":"Le Parfaitement Juste","n30":"Le Très Doux, le Subtil","n31":"Le Parfaitement Informé","n32":"Le Très Indulgent","n33":"Le Magnifique","n34":"Le Pardonneur","n35":"Le Très Reconnaissant","n36":"Le Très Haut","n37":"Le Très Grand","n38":"Le Préservateur","n39":"Celui qui nourrit","n40":"Celui qui compte","n41":"Le Majestueux","n42":"Le Très Généreux","n43":"Le Vigilant","n44":"Celui qui exauce","n45":"Celui dont la science embrasse tout","n46":"Le Sage","n47":"Le Très Aimant","n48":"Le Glorieux","n49":"Celui qui ressuscite","n50":"Le Témoin","n51":"La Vérité","n52":"Le Garant","n53":"Le Très Fort","n54":"L'Inébranlable","n55":"Le Protecteur","n56":"Le Digne de louange","n57":"Celui qui dénombre","n58":"Celui qui commence la création","n59":"Celui qui ramène à la vie","n60":"Celui qui donne la vie","n61":"Celui qui donne la mort","n62":"Le Vivant","n63":"Celui qui subsiste par Lui-même","n64":"Celui qui trouve tout","n65":"Le Noble","n66":"L'Unique","n67":"Le Seul","n68":"Le Refuge éternel","n69":"Le Capable","n70":"Le Puissant","n71":"Celui qui avance","n72":"Celui qui retarde","n73":"Le Premier","n74":"Le Dernier","n75":"L'Apparent","n76":"Le Caché","n77":"Le Maître","n78":"Le Très Élevé","n79":"La Source de bonté","n80":"Celui qui accepte le repentir","n81":"Celui qui se venge des injustes","n82":"Celui qui efface les fautes","n83":"Le Très Bienveillant","n84":"Le Maître de toute royauté","n85":"Le Seigneur de majesté et de générosité","n86":"L'Équitable","n87":"Celui qui rassemble","n88":"Celui qui se suffit à Lui-même","n89":"Celui qui enrichit","n90":"Celui qui empêche","n91":"Celui qui éprouve","n92":"Celui qui accorde le bien","n93":"La Lumière","n94":"Le Guide","n95":"Le Créateur sans précédent","n96":"Le Éternel","n97":"L'Héritier","n98":"Celui qui guide vers le droit chemin","n99":"Le Très Patient"},"course":[{"id":"L1","w":1,"title":"Qui est Allah ?","teach":"Les musulmans croient en un seul Dieu, Allah. Il a tout créé, Il n'a ni associé ni enfant, et rien ne Lui ressemble. Cette croyance s'appelle le Tawhid. Le mot islam signifie la soumission paisible à Allah, et un musulman est celui qui se soumet à Lui. Allah est Ar-Rahman, le Tout Miséricordieux, et Al-Khaliq, le Créateur.","qs":[{"q":"Que signifie Tawhid ?","o":["La croyance qu'Allah est Unique","Jeûner pendant le Ramadan","Prier cinq fois par jour","Donner la charité"],"a":0},{"q":"Que signifie le nom Ar-Rahman ?","o":["Le Tout Miséricordieux","Le Créateur","Le Pardonneur","Le Très Haut"],"a":0},{"q":"Un musulman est quelqu'un qui…","o":["se soumet à Allah","vit à La Mecque","parle arabe","est né dans une famille musulmane"],"a":0},{"q":"Vrai ou faux : Allah a des associés.","o":["Vrai","Faux"],"a":1}]},{"id":"N1","title":"Les beaux noms d'Allah","teach":"Allah a 99 beaux noms (Al-Asma'ul-Husna), que l'on trouve dans le Coran et la Sunna. Le Prophète ﷺ a dit qu'Allah a quatre-vingt-dix-neuf noms, et que celui qui les apprend et les applique entrera au Paradis (Sahih al-Bukhari, Sahih Muslim). Par exemple : Ar-Rahman (le Tout Miséricordieux), Al-Malik (le Roi) et Al-Ghaffar (le Grand Pardonneur). Nous invoquons Allah par Ses noms quand nous faisons la doua : « C'est à Allah qu'appartiennent les noms les plus beaux. Invoquez-Le par ces noms » (Coran 7:180). Retrouvez les 99 dans l'onglet Noms.","qs":[{"q":"Combien de beaux noms d'Allah sont connus dans la liste célèbre ?","o":["99","33","40","114"],"a":0},{"q":"Que signifie Al-Ghaffar ?","o":["Le Grand Pardonneur","Le Roi","Le Créateur","Le Pourvoyeur"],"a":0},{"q":"Qu'Allah nous demande-t-Il de faire avec Ses beaux noms ?","o":["L'invoquer par ces noms","Les garder secrets","Les lire une seule fois","Les écrire sur les murs"],"a":0},{"q":"Que signifie Al-Malik ?","o":["Le Roi","Le Guérisseur","Le Juge","La Lumière"],"a":0}],"w":1},{"id":"L3","w":1,"title":"Les six piliers de l'Iman","teach":"Iman signifie foi. Un musulman croit en six choses : Allah, Ses anges, Ses livres, Ses messagers, le Jour dernier, et le Qadr, c'est-à-dire la science et le décret d'Allah sur toute chose, bonne ou mauvaise. Les anges ont été créés de lumière, les humains d'argile et les djinns de feu sans fumée.","qs":[{"q":"Combien y a-t-il de piliers de l'Iman ?","o":["6","5","4","7"],"a":0},{"q":"Lequel de ces éléments n'est PAS l'un des six piliers de l'Iman ?","o":["Le jeûne","La croyance aux anges","La croyance au Jour dernier","La croyance aux livres d'Allah"],"a":0},{"q":"Les anges ont été créés à partir…","o":["de lumière","d'argile","de feu sans fumée","d'eau"],"a":0},{"q":"Les humains ont été créés à partir…","o":["d'argile","de lumière","de feu sans fumée","de pierre"],"a":0}]},{"id":"L5","w":1,"title":"Les cinq piliers de l'islam","teach":"L'islam est bâti sur cinq piliers. 1. La Shahada : le témoignage de foi. 2. La Salat : la prière, cinq fois par jour. 3. La zakat : donner une part de ses biens en charité. 4. Le Sawm : le jeûne du Ramadan. 5. Le hajj : le pèlerinage à La Mecque, une fois dans la vie pour celui qui en est capable.","qs":[{"q":"Combien y a-t-il de piliers de l'islam ?","o":["5","6","3","4"],"a":0},{"q":"Quel pilier consiste à prier cinq fois par jour ?","o":["La Salat","La zakat","Le hajj","Le Sawm"],"a":0},{"q":"Pendant quel mois les musulmans jeûnent-ils ?","o":["Ramadan","Shawwal","Muharram","Rajab"],"a":0},{"q":"Le hajj est obligatoire…","o":["une fois dans la vie, pour celui qui en est capable","chaque année","chaque mois","seulement pour les savants"],"a":0}]},{"id":"L7","w":2,"title":"Prononcer la Shahada","teach":"La Shahada est le témoignage de foi qui fait d'une personne un musulman : « Ash-hadu an la ilaha illallah, wa ash-hadu anna Muhammadan rasulullah. » Cela signifie : J'atteste qu'il n'y a de dieu qu'Allah, et j'atteste que Muhammad est le Messager d'Allah. Il faut la prononcer avec compréhension et sincérité.","ar":"أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","qs":[{"q":"Que signifie Shahada ?","o":["Témoigner","Jeûner","La prière","La charité"],"a":0},{"q":"La première partie dit qu'il n'y a de dieu que…","o":["Allah","Le Prophète","Les anges","La Kaaba"],"a":0},{"q":"La deuxième partie dit que Muhammad est…","o":["Le Messager d'Allah","Un roi","Un ange","Un dieu"],"a":0},{"q":"La Shahada doit être prononcée avec…","o":["compréhension et sincérité","une voix forte seulement","un groupe seulement","l'arabe seulement"],"a":0}]},{"id":"L21","w":2,"title":"Les prophètes d'Allah","teach":"Allah a envoyé des prophètes à chaque peuple avec le même message : adorer Allah seul. Le Coran en nomme 25, dont Adam, Nuh (Noé), Ibrahim (Abraham), Musa (Moïse), Isa (Jésus) et Muhammad ﷺ, le dernier prophète. Musa a reçu la Tawrat, Dawud le Zabur, Isa l'Injil, et Muhammad ﷺ le Coran.","qs":[{"q":"Qui est le dernier prophète ?","o":["Muhammad ﷺ","Isa","Musa","Ibrahim"],"a":0},{"q":"Quel livre a été donné à Musa ?","o":["La Tawrat","L'Injil","Le Zabur","Le Coran"],"a":0},{"q":"Le Coran a été révélé à…","o":["Muhammad ﷺ","Dawud","Isa","Nuh"],"a":0},{"q":"Quel était le message de chaque prophète ?","o":["Adorer Allah seul","Bâtir des villes","Lancer le commerce","Gagner le pouvoir"],"a":0}]},{"id":"L17","w":2,"title":"Le Prophète ﷺ : les premières années","teach":"Muhammad ﷺ est né à La Mecque vers 570, l'année de l'Éléphant. Son père est mort avant sa naissance et sa mère quand il avait environ six ans. Son grand-père, puis son oncle Abu Talib, l'ont élevé. On l'appelait As-Sadiq Al-Amin, le véridique et digne de confiance. À 25 ans, il a épousé Khadija, qu'Allah l'agrée.","qs":[{"q":"Où le Prophète ﷺ est-il né ?","o":["La Mecque","Médine","Jérusalem","Taïf"],"a":0},{"q":"On l'appelait…","o":["le véridique et digne de confiance","le plus riche","le plus fort","le poète"],"a":0},{"q":"Qui a-t-il épousé à 25 ans ?","o":["Khadija","Aïcha","Hafsa","Maryam"],"a":0},{"q":"Qui l'a élevé après son grand-père ?","o":["Son oncle Abu Talib","Abu Lahab","Abu Bakr","Umar"],"a":0}]},{"id":"L19","w":3,"title":"La révélation et l'Hégire","teach":"À l'âge de 40 ans, dans la grotte de Hira, l'ange Jibril a apporté la première révélation : « Iqra' » (Lis !), le début de la sourate Al-Alaq. Pendant 13 ans, le Prophète ﷺ a appelé les gens à Allah à La Mecque et a subi des épreuves. En 622, il a émigré à Médine. Cette Hégire marque le début du calendrier islamique.","qs":[{"q":"Où la première révélation est-elle venue ?","o":["La grotte de Hira","La Kaaba","Médine","Le mont Sinaï"],"a":0},{"q":"Quel est le premier mot révélé ?","o":["Iqra (Lis)","Bismillah","Qul (Dis)","Alhamdulillah"],"a":0},{"q":"L'Hégire fut l'émigration vers…","o":["Médine","l'Égypte","le Yémen","Bagdad"],"a":0},{"q":"L'Hégire marque le début…","o":["du calendrier islamique","du Ramadan","du hajj","de l'Aïd"],"a":0}]},{"id":"L23","w":3,"title":"Médine et la conquête de La Mecque","teach":"À Médine, le Prophète ﷺ a bâti la première mosquée, Masjid an-Nabawi, et a créé une communauté fondée sur la fraternité et la justice. En 630, La Mecque s'est ouverte aux musulmans, et le Prophète ﷺ a pardonné à ceux qui l'avaient combattu. Il est décédé en 632, à l'âge de 63 ans, et il est enterré à Médine.","qs":[{"q":"Que le Prophète ﷺ a-t-il construit en premier à Médine ?","o":["Une mosquée","Un château","Un marché","Une école"],"a":0},{"q":"Comment a-t-il traité ses anciens ennemis de La Mecque ?","o":["Il leur a pardonné","Il les a punis","Il les a ignorés","Il les a chassés"],"a":0},{"q":"Où le Prophète ﷺ est-il enterré ?","o":["Médine","La Mecque","Taïf","Jérusalem"],"a":0},{"q":"Quelle sourate parle de la victoire et des gens qui entrent en foule dans l'islam ?","o":["An-Nasr","Al-Fil","Al-Asr","Quraysh"],"a":0}]},{"id":"N2","title":"Le Coran : révélation et préservation","teach":"Le Coran est la parole d'Allah, révélée en arabe au Prophète ﷺ pendant environ 23 ans. Il compte 114 sourates. Il a été mémorisé et mis par écrit du vivant du Prophète ﷺ. Après lui, Abu Bakr l'a fait réunir en un seul volume, et Uthman a fait faire des copies du texte de référence et les a envoyées dans les grandes villes. Allah a promis de le protéger (Coran 15:9).","qs":[{"q":"Combien de sourates le Coran compte-t-il ?","o":["114","99","30","60"],"a":0},{"q":"Sur combien de temps environ le Coran a-t-il été révélé ?","o":["23 ans","3 ans","40 ans","1 an"],"a":0},{"q":"Qui a fait réunir le Coran en un seul volume ?","o":["Abu Bakr","Abu Lahab","Hamza","Bilal"],"a":0},{"q":"Qui a envoyé des copies du texte de référence dans les grandes villes ?","o":["Uthman","Ali","Umar","Khalid"],"a":0}],"w":3},{"id":"L9","w":4,"title":"Le wudu : l'ablution pour la prière","teach":"Le wudu est l'ablution nécessaire avant la prière. Faites l'intention dans votre cœur et dites Bismillah. Lavez ensuite les mains 3 fois, rincez la bouche 3 fois, aspirez de l'eau par le nez et expulsez-la 3 fois, lavez le visage 3 fois, lavez les bras jusqu'aux coudes 3 fois (le droit, puis le gauche), passez la main sur la tête une fois (avec les oreilles), et lavez les pieds jusqu'aux chevilles 3 fois (le droit, puis le gauche). Le wudu est annulé par le fait d'aller aux toilettes, de lâcher un vent, par un sommeil profond ou par la perte de conscience.","qs":[{"q":"Que dit-on au début du wudu ?","o":["Bismillah","Allahu Akbar","Alhamdulillah","SubhanAllah"],"a":0},{"q":"Combien de fois passe-t-on la main sur la tête ?","o":["Une fois","Trois fois","Pas du tout","Sept fois"],"a":0},{"q":"Lequel de ces éléments annule le wudu ?","o":["Un sommeil profond","Manger du pain","Marcher","Lire"],"a":0},{"q":"Les bras sont lavés jusqu'aux…","o":["Coudes","Poignets","Épaules","Genoux"],"a":0}]},{"id":"L11","w":4,"title":"La prière : horaires et rakats","teach":"Les musulmans prient cinq fois par jour, face à la Qibla (la direction de la Kaaba à La Mecque). Fajr (l'aube) compte 2 rakats, Dhuhr (midi) 4, Asr (l'après-midi) 4, Maghrib (le coucher du soleil) 3, et Isha (la nuit) 4. Une rakat est un cycle composé de la station debout, de l'inclinaison et de la prosternation. Efforcez-vous de faire chaque prière à son heure.","qs":[{"q":"Combien de rakats compte Fajr ?","o":["2","3","4","5"],"a":0},{"q":"Quelle prière compte 3 rakats ?","o":["Maghrib","Fajr","Asr","Isha"],"a":0},{"q":"Dans quelle direction les musulmans se tournent-ils pour prier ?","o":["La Qibla, vers la Kaaba","Le nord","L'est","Le soleil"],"a":0},{"q":"Combien y a-t-il de prières par jour ?","o":["5","3","4","6"],"a":0}]},{"id":"L13","w":4,"title":"Comment prier : étape par étape","teach":"1. Faites l'intention, dites « Allahu Akbar » et levez les mains. 2. Tenez-vous debout et récitez Al-Fatiha et une autre sourate. 3. Ruku : inclinez-vous et dites « Subhana Rabbiyal 'Azim ». 4. Redressez-vous en disant « Sami'allahu liman hamidah ». 5. Sujud : prosternez-vous sur sept parties (le front avec le nez, les deux mains, les deux genoux, les deux pieds) et dites « Subhana Rabbiyal A'la ». 6. Asseyez-vous, puis prosternez-vous de nouveau. À la dernière rakat, asseyez-vous pour le Tashahhud, priez sur le Prophète ﷺ, et terminez par le Taslim : « As-salamu alaykum wa rahmatullah » à droite puis à gauche. Il est utile que quelqu'un vous montre en personne.","qs":[{"q":"Que dit-on pendant le ruku (l'inclinaison) ?","o":["Subhana Rabbiyal 'Azim","Subhana Rabbiyal A'la","Bismillah","Alhamdulillah"],"a":0},{"q":"Pendant le sujud, combien de parties du corps touchent le sol ?","o":["7","3","5","10"],"a":0},{"q":"Comment la prière commence-t-elle ?","o":["Le Takbir : Allahu Akbar","Le Salam","Le Ruku","Le Sujud"],"a":0},{"q":"Comment la prière se termine-t-elle ?","o":["Le Taslim : As-salamu alaykum wa rahmatullah","Le Takbir","Al-Fatiha","Le Sujud"],"a":0}]},{"id":"L25","w":5,"title":"Le jeûne et le Ramadan","teach":"Le Ramadan est le neuvième mois du calendrier islamique. Les musulmans jeûnent de l'aube (Fajr) jusqu'au coucher du soleil (Maghrib) : ni nourriture ni boisson. Le jeûne enseigne la patience, la gratitude et l'attention envers les pauvres. Le Coran a commencé à être révélé pendant le Ramadan, et Laylat al-Qadr, la Nuit du Destin, se trouve dans ses dix dernières nuits. L'Aïd al-Fitr vient après ce mois.","qs":[{"q":"Combien de temps dure le jeûne chaque jour ?","o":["De l'aube au coucher du soleil","Du lever du soleil à midi","Du coucher du soleil à l'aube","De midi à la nuit"],"a":0},{"q":"Laylat al-Qadr se trouve dans…","o":["les dix dernières nuits du Ramadan","Muharram","Dhul Hijja","la première nuit du Ramadan"],"a":0},{"q":"Quelle fête vient après le Ramadan ?","o":["L'Aïd al-Fitr","L'Aïd al-Adha","Arafat","L'Hégire"],"a":0},{"q":"Le Ramadan est quel mois du calendrier islamique ?","o":["Le 9e","Le 1er","Le 12e","Le 5e"],"a":0}]},{"id":"L27","w":5,"title":"La zakat et la sadaqa","teach":"La zakat est le troisième pilier. Elle représente 2,5 % des économies qui restent au-dessus d'un montant minimum (le nisab) pendant une année lunaire, donnés aux personnes dans le besoin et aux autres catégories citées dans le Coran. La sadaqa est la charité volontaire : n'importe quel montant, ou même une bonne parole ou un sourire. La charité purifie les biens et le cœur.","qs":[{"q":"Quel pourcentage des économies représente la zakat ?","o":["2,5 %","10 %","50 %","1 %"],"a":0},{"q":"Comment appelle-t-on la charité volontaire ?","o":["La sadaqa","La zakat","Le hajj","Le Sawm"],"a":0},{"q":"À qui la zakat est-elle destinée ?","o":["Aux pauvres et aux nécessiteux, entre autres","Aux proches riches","Aux commerçants","À quiconque demande"],"a":0},{"q":"La charité purifie…","o":["les biens et le cœur","seulement le corps","les maisons","les voitures"],"a":0}]},{"id":"L29","w":5,"title":"Le hajj et la omra","teach":"Le hajj est le pèlerinage à La Mecque pendant le mois de Dhul Hijja, obligatoire une fois dans la vie pour celui qui en est capable. Les pèlerins portent de simples vêtements blancs (l'ihram), tournent autour de la Kaaba (le tawaf), marchent entre Safa et Marwa, et se tiennent dans la plaine d'Arafat, le jour le plus important. La omra est un pèlerinage plus petit qui peut se faire à n'importe quel moment de l'année.","qs":[{"q":"Pendant quel mois a lieu le hajj ?","o":["Dhul Hijja","Ramadan","Rajab","Muharram"],"a":0},{"q":"Comment appelle-t-on le fait de tourner autour de la Kaaba ?","o":["Le tawaf","Le sa'i","L'ihram","Le wudu"],"a":0},{"q":"Quel est le jour le plus important du hajj ?","o":["La station à Arafat","L'Aïd","Le vendredi","Le lever du soleil"],"a":0},{"q":"Quel est le petit pèlerinage ?","o":["La omra","La zakat","La Salat","Le Sawm"],"a":0}]},{"id":"L15","w":6,"title":"Les bonnes manières et le caractère","teach":"Les musulmans se saluent par « As-salamu alaykum » (que la paix soit sur vous), et la réponse est « Wa alaykumus-salam ». Dites « Bismillah » avant de manger et « Alhamdulillah » après. Soyez véridique, bon envers vos voisins et respectueux envers vos parents : Allah nous demande de ne même pas leur dire « uff » (Coran 17:23). Évitez la médisance, c'est-à-dire parler en mal de quelqu'un en son absence. Le Prophète ﷺ a dit : « Les meilleurs d'entre vous sont ceux qui ont le meilleur caractère » (Sahih al-Bukhari).","qs":[{"q":"Quelle est la réponse à « As-salamu alaykum » ?","o":["Wa alaykumus-salam","Bismillah","SubhanAllah","Allahu Akbar"],"a":0},{"q":"Que dit-on avant de manger ?","o":["Bismillah","Alhamdulillah","Astaghfirullah","Inshallah"],"a":0},{"q":"Que nous demande Allah de ne jamais dire à nos parents ?","o":["« Uff » (un mot d'agacement)","Merci","Paix","Bienvenue"],"a":0},{"q":"Selon le Prophète ﷺ, les meilleurs sont ceux qui ont le meilleur…","o":["caractère","argent","maison","habit"],"a":0}]},{"id":"L31","w":6,"title":"Halal et haram","teach":"Halal signifie permis et haram signifie interdit. Allah a interdit des choses nuisibles comme l'alcool, le porc, les jeux de hasard, le vol, le mensonge et le riba (l'intérêt). La plupart des choses sont halal, sauf si Allah les a interdites. Gagnez votre argent honnêtement et dépensez-le avec sagesse. Quand vous avez un doute, demandez à un savant de confiance.","qs":[{"q":"Que signifie halal ?","o":["Permis","Interdit","Détesté","Obligatoire"],"a":0},{"q":"Lequel de ces éléments est haram ?","o":["Le riba (l'intérêt)","Le commerce honnête","Donner la charité","Jeûner"],"a":0},{"q":"La plupart des choses sont…","o":["halal sauf si elles sont interdites","haram sauf si elles sont permises","interdites","facultatives"],"a":0},{"q":"Comment devons-nous gagner notre argent ?","o":["Honnêtement","Par tous les moyens","En trichant","En jouant aux jeux de hasard"],"a":0}]},{"id":"L32","w":6,"title":"L'au-delà","teach":"Chaque personne mourra et retournera à Allah. Des anges enregistrent nos actes. Après la mort vient la vie de la tombe (le barzakh), puis le Jour du Jugement, où tous seront ressuscités et devront rendre des comptes. Les gens vertueux entreront au Jannah (Paradis) par la miséricorde d'Allah. Allah est le Très Miséricordieux et pardonne à ceux qui se repentent sincèrement.","qs":[{"q":"Que vient-il après la mort ?","o":["La vie de la tombe, puis le Jour du Jugement","Rien","Une autre vie sur terre","Un sommeil éternel"],"a":0},{"q":"Qui enregistre nos actes ?","o":["Les anges","Les humains","Les djinns","Les oiseaux"],"a":0},{"q":"Comment appelle-t-on le Paradis ?","o":["Jannah","Jahannam","Barzakh","Qadr"],"a":0},{"q":"Allah pardonne à ceux qui…","o":["se repentent sincèrement","se vantent","ne prient jamais","se cachent"],"a":0}]},{"id":"N3","title":"Comment faire la doua","teach":"Doua signifie demander à Allah. Le Prophète ﷺ a dit : « La doua est une adoration » (Abu Dawud, At-Tirmidhi). Les bonnes manières de la doua : commencer par louer Allah et prier sur le Prophète ﷺ, être sincère, être certain qu'Allah vous entend, demander encore et encore, et ne jamais demander quelque chose de pécheur. Parmi les moments où la doua est particulièrement porteuse d'espoir : le dernier tiers de la nuit, pendant la prosternation dans la prière, et entre l'adhan et l'iqama. Allah peut donner ce que vous avez demandé, écarter de vous un mal, ou garder la récompense pour l'au-delà.","qs":[{"q":"Le Prophète ﷺ a dit que la doua est…","o":["une adoration","seulement pour les malades","seulement pour le vendredi","une coutume"],"a":0},{"q":"Une bonne façon de commencer une doua est…","o":["de louer Allah","de se plaindre","de crier","de demander du mal"],"a":0},{"q":"Quel est un moment où la doua est particulièrement porteuse d'espoir ?","o":["Le dernier tiers de la nuit","Jamais la nuit","Seulement à midi","Seulement pendant le Ramadan"],"a":0},{"q":"Si vous ne voyez pas votre doua exaucée tout de suite, vous devez…","o":["continuer à demander et faire confiance à Allah","arrêter de demander","seulement vous en blâmer","demander à quelqu'un d'autre qu'Allah"],"a":0}],"w":6},{"id":"N4","title":"Les trois parties du Tawhid","teach":"Les savants expliquent souvent le Tawhid en trois parties. Tawhid ar-Rububiyyah : Allah seul est le Seigneur, le Créateur et Celui qui pourvoit à tout. Tawhid al-Uluhiyyah : Allah seul mérite d'être adoré. Tawhid al-Asma was-Sifat : croire aux noms et aux attributs d'Allah tels que le Coran et la Sunna les décrivent, sans Le comparer à Sa création. C'est une façon courante d'organiser ce sujet.","qs":[{"q":"En combien de parties les savants divisent-ils souvent le Tawhid ?","o":["3","2","5","7"],"a":0},{"q":"Tawhid ar-Rububiyyah signifie qu'Allah seul est…","o":["le Seigneur et le Créateur","le seul prophète","le seul ange","la seule ville"],"a":0},{"q":"Tawhid al-Uluhiyyah signifie qu'Allah seul mérite…","o":["l'adoration","les impôts","les armées","une maison"],"a":0},{"q":"Tawhid al-Asma was-Sifat est la croyance aux…","o":["noms et attributs d'Allah","noms des villes","noms des anges seulement","noms des mois"],"a":0}],"w":7},{"id":"N5","title":"Le shirk et ce qui nuit à la foi","teach":"Le shirk consiste à donner un associé à Allah. C'est le plus grand péché si une personne meurt en l'ayant commis (Coran 4:48). Il comprend le fait d'adorer ou d'invoquer quelqu'un d'autre qu'Allah. Il existe aussi un shirk mineur, comme le fait de se montrer dans l'adoration, appelé riya. Le Prophète ﷺ le craignait pour ses disciples. La porte du repentir reste ouverte : Allah pardonne à ceux qui reviennent sincèrement à Lui avant la mort.","qs":[{"q":"Que signifie shirk ?","o":["Donner un associé à Allah","Manquer un jeûne","Être en retard","Trop manger"],"a":0},{"q":"Se montrer dans l'adoration s'appelle…","o":["le riya","la zakat","le sujud","l'Hégire"],"a":0},{"q":"La porte du repentir est-elle ouverte ?","o":["Oui, jusqu'à la mort","Non, jamais","Seulement le vendredi","Seulement pour les savants"],"a":0},{"q":"Qui devons-nous invoquer et en qui devons-nous placer notre confiance ?","o":["Allah seul","Les saints","Le soleil","Nos ancêtres"],"a":0}],"w":7},{"id":"N6","title":"Comment les hadiths sont classés","teach":"Un hadith est un récit des paroles, des actes ou des approbations du Prophète ﷺ. Il comprend deux parties : l'isnad (la chaîne des rapporteurs) et le matn (le texte). Les savants ont vérifié chaque rapporteur et classé les hadiths en sahih (authentique), hasan (bon), da'if (faible) ou mawdu' (fabriqué). Sahih al-Bukhari et Sahih Muslim sont les livres les plus fiables. Avec Abu Dawud, At-Tirmidhi, An-Nasa'i et Ibn Majah, ils forment les six grands recueils.","qs":[{"q":"L'isnad d'un hadith est…","o":["la chaîne des rapporteurs","le texte","le titre","la couverture du livre"],"a":0},{"q":"Le matn d'un hadith est…","o":["le texte","la chaîne","le classement","le traducteur"],"a":0},{"q":"Que signifie mawdu' ?","o":["Fabriqué","Authentique","Bon","Célèbre"],"a":0},{"q":"Combien y a-t-il de grands recueils de hadiths ?","o":["6","3","10","99"],"a":0}],"w":7},{"id":"N7","title":"Les sources du droit islamique","teach":"Le droit islamique (la charia) est tiré de sources, par ordre. 1. Le Coran. 2. La Sunna, les enseignements et l'exemple du Prophète ﷺ. 3. L'ijma, le consensus des savants sur une règle. 4. Le qiyas, le raisonnement par analogie avec une règle connue. Le fiqh est la compréhension de ces règles par des savants qualifiés. Quand nous ne savons pas quelque chose, nous interrogeons les gens de science.","qs":[{"q":"Quelle est la première source du droit islamique ?","o":["Le Coran","L'ijma","Le qiyas","La coutume"],"a":0},{"q":"La Sunna désigne…","o":["Les enseignements et l'exemple du Prophète ﷺ","Une ville","Un type de tapis de prière","Le mois du jeûne"],"a":0},{"q":"L'ijma est…","o":["le consensus des savants","une fête","une charité","une prière"],"a":0},{"q":"Que faisons-nous quand nous ne connaissons pas une règle ?","o":["Interroger les gens de science","Deviner","L'ignorer","Demander à n'importe qui sur Internet"],"a":0}],"w":8},{"id":"N8","title":"Les quatre califes bien guidés","teach":"Après le Prophète ﷺ, les musulmans ont été dirigés par quatre califes bien guidés (Al-Khulafa ar-Rashidun) : Abu Bakr as-Siddiq, Umar ibn al-Khattab, Uthman ibn Affan et Ali ibn Abi Talib, qu'Allah les agrée. Abu Bakr a fait réunir le Coran, Umar était connu pour sa justice, Uthman a fait copier le texte de référence, et Ali était le cousin et le gendre du Prophète ﷺ. C'est la vision sunnite de leur ordre et de leur statut.","qs":[{"q":"Combien y a-t-il eu de califes bien guidés ?","o":["4","2","3","7"],"a":0},{"q":"Qui fut le premier calife ?","o":["Abu Bakr","Umar","Uthman","Ali"],"a":0},{"q":"Qui a fait faire des copies du texte de référence du Coran ?","o":["Uthman","Umar","Bilal","Hamza"],"a":0},{"q":"Ali était, pour le Prophète ﷺ…","o":["un cousin et un gendre","un frère","un oncle","un maître"],"a":0}],"w":8},{"id":"N9","title":"Les quatre écoles de fiqh","teach":"Les musulmans sunnites suivent l'une des quatre écoles classiques de fiqh : hanafite (Abu Hanifa), malikite (Malik ibn Anas), chafiite (l'imam ash-Shafi'i) et hanbalite (Ahmad ibn Hanbal). Elles s'accordent sur la croyance et sur les piliers de l'islam, et diffèrent sur certains détails, par exemple sur la façon d'accomplir certaines parties du culte. Les divergences entre savants sur des questions secondaires sont normales et ne sont pas une raison de se disputer. Beaucoup de musulmans d'Afrique de l'Est suivent l'école chafiite.","qs":[{"q":"Combien y a-t-il d'écoles classiques sunnites de fiqh ?","o":["4","2","6","10"],"a":0},{"q":"Quelle école porte le nom de l'imam ash-Shafi'i ?","o":["Chafiite","Hanafite","Malikite","Hanbalite"],"a":0},{"q":"Les écoles s'accordent sur…","o":["la croyance et les piliers de l'islam","chaque petit détail","rien","seulement la date de l'Aïd"],"a":0},{"q":"Comment devons-nous traiter les divergences sur les questions secondaires ?","o":["Avec respect, sans se disputer","En se battant","En se moquant des autres","En ignorant l'islam"],"a":0}],"w":8}]},"id":{"ui":{"n_duas":"Doa","n_learn":"Belajar","n_hadith":"Hadis","n_names":"Nama","n_more":"Lainnya","streak_days":"{n} hari beruntun","d_title":"Doa","d_sub":"Doa untuk setiap perasaan dan keadaan","d_ph":"Bagaimana perasaanmu?","d_none":"Tidak ada doa yang cocok. Coba tulis perasaan, seperti takut atau sedih.","d_adhkar":"Zikir harian","d_morning":"Pagi","d_evening":"Petang","d_sleep":"Sebelum tidur","d_done":"selesai","d_cats":"Cari berdasarkan perasaan","d
