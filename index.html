 pengembang","dn_text":"Hamudi Teach gratis untuk semua orang dan akan selalu begitu. Jika ingin membantu saya dan keluarga, kamu bisa mengirim donasi kecil sekitar $1 (sekitar KES 130) lewat M-Pesa. Jika tidak bisa, doakan kami saja. Itu sangat berarti.","dn_send":"Kirim lewat M-Pesa ke","dn_copy":"Salin nomor","dn_copied":"Nomor disalin","dn_note":"Memberi itu opsional. Tidak ada fitur aplikasi yang bergantung padanya."},"dua_cat":{"anx":"Cemas dan khawatir","dis":"Gelisah dan hati yang berat","fgv":"Ampunan","gui":"Petunjuk dan iman","prv":"Rezeki dan penghasilan halal","eas":"Kemudahan dan ilmu","grf":"Duka dan kehilangan","fea":"Takut dan perlindungan","hlt":"Kesehatan dan sakit","slp":"Bangun dan tidur","fod":"Makan dan minum","hom":"Rumah dan perjalanan","fam":"Keluarga dan orang tua","grt":"Syukur dan pujian","suc":"Sukses di dunia dan akhirat","pat":"Sabar dan tawakal","umm":"Nabi ﷺ dan kaum Muslimin","dly":"Kehidupan sehari-hari"},"dua":{"anx1":"Ya Allah, aku berlindung kepada-Mu dari rasa cemas dan sedih, lemah dan malas, kikir dan pengecut, beban utang dan tekanan orang lain.","anx2":"Cukuplah Allah bagiku. Tiada tuhan selain Dia. Kepada-Nya aku bertawakal, dan Dia Tuhan Arasy yang agung.","anx3":"Ya Allah, rahmat-Mu yang aku harapkan. Jangan serahkan aku kepada diriku sendiri walau sekejap mata, dan perbaikilah semua urusanku. Tiada tuhan selain Engkau.","anx4":"Tiada tuhan selain Allah Yang Mahaagung lagi Mahapenyantun. Tiada tuhan selain Allah, Tuhan Arasy yang agung. Tiada tuhan selain Allah, Tuhan langit, Tuhan bumi, dan Tuhan Arasy yang mulia.","dis1":"Tiada tuhan selain Engkau, Mahasuci Engkau. Sungguh, aku termasuk orang-orang yang zalim.","dis2":"Wahai Yang Mahahidup, wahai Yang Maha Berdiri Sendiri, dengan rahmat-Mu aku memohon pertolongan.","dis3":"Cukuplah Allah bagi kami, dan Dia sebaik-baik pelindung.","fgv1":"Ya Tuhanku, ampunilah aku dan terimalah tobatku. Engkaulah Maha Penerima tobat lagi Maha Penyayang.","fgv2":"Ya Allah, Engkau Tuhanku. Tiada tuhan selain Engkau. Engkau menciptakanku dan aku hamba-Mu, dan aku menepati janji dan perjanjian-Mu semampuku. Aku berlindung kepada-Mu dari keburukan yang telah kuperbuat. Aku mengakui nikmat-Mu atasku dan aku mengakui dosaku, maka ampunilah aku, karena tidak ada yang mengampuni dosa selain Engkau.","fgv3":"Ya Tuhan kami, kami telah menzalimi diri kami sendiri. Jika Engkau tidak mengampuni kami dan tidak merahmati kami, pastilah kami termasuk orang-orang yang rugi.","fgv4":"Ya Allah, Engkau Maha Pemaaf dan menyukai maaf, maka maafkanlah aku.","fgv5":"Aku memohon ampun kepada Allah dan bertobat kepada-Nya.","gui1":"Tunjukilah kami jalan yang lurus.","gui2":"Ya Tuhan kami, janganlah Engkau condongkan hati kami setelah Engkau beri kami petunjuk, dan karuniakanlah kepada kami rahmat dari sisi-Mu. Sungguh, Engkaulah Maha Pemberi.","gui3":"Wahai Yang membolak-balikkan hati, teguhkanlah hatiku di atas agama-Mu.","gui4":"Ya Allah, aku memohon kepada-Mu petunjuk, ketakwaan, kesucian diri, dan kecukupan.","prv1":"Ya Allah, cukupkanlah aku dengan yang halal agar aku menjauhi yang haram, dan kayakanlah aku dengan karunia-Mu sehingga aku tidak butuh selain Engkau.","prv2":"Ya Allah, aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang baik, dan amal yang diterima.","prv3":"Ya Tuhanku, sungguh aku membutuhkan kebaikan apa pun yang Engkau turunkan kepadaku.","eas1":"Ya Tuhanku, lapangkanlah dadaku dan mudahkanlah urusanku.","eas2":"Ya Tuhanku, tambahkanlah ilmu kepadaku.","eas3":"Ya Allah, tidak ada yang mudah kecuali yang Engkau mudahkan, dan Engkau dapat membuat yang sulit menjadi mudah jika Engkau menghendaki.","grf1":"Sesungguhnya kami milik Allah dan kepada-Nya kami kembali. Ya Allah, berilah aku pahala dalam musibahku dan gantilah dengan yang lebih baik.","grf2":"Ya Allah, ampunilah dia, rahmatilah dia, selamatkanlah dia, dan maafkanlah dia.","fea1":"Dengan nama Allah, yang bersama nama-Nya tidak ada sesuatu pun di bumi maupun di langit yang dapat membahayakan. Dialah Maha Mendengar lagi Maha Mengetahui.","fea2":"Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari keburukan makhluk-Nya.","fea3":"Ya Allah, kami menjadikan Engkau di hadapan mereka dan kami berlindung kepada-Mu dari keburukan mereka.","hlt1":"Ya Allah, Tuhan manusia, hilangkanlah penyakit ini dan sembuhkanlah. Engkaulah Maha Penyembuh. Tidak ada kesembuhan selain kesembuhan dari-Mu, kesembuhan yang tidak meninggalkan penyakit.","hlt2":"Letakkan tanganmu di bagian yang sakit, ucapkan Bismillah tiga kali, lalu ucapkan: Aku berlindung kepada Allah dengan kekuasaan dan kekuatan-Nya dari keburukan apa yang kurasakan dan kutakutkan.","hlt3":"Saat menjenguk orang sakit, ucapkan tujuh kali: Aku memohon kepada Allah Yang Mahaagung, Tuhan Arasy yang agung, agar menyembuhkanmu.","hlt4":"Ya Allah, berilah kesehatan pada badanku. Ya Allah, berilah kesehatan pada pendengaranku. Ya Allah, berilah kesehatan pada penglihatanku. Tiada tuhan selain Engkau.","slp1":"Segala puji bagi Allah yang telah menghidupkan kami setelah mematikan kami, dan kepada-Nya kami dibangkitkan.","slp2":"Dengan nama-Mu, ya Allah, aku mati dan aku hidup.","slp3":"Ya Allah, lindungilah aku dari azab-Mu pada hari Engkau membangkitkan hamba-hamba-Mu.","fod1":"Dengan nama Allah. Ucapkan sebelum makan.","fod2":"Segala puji bagi Allah yang telah memberiku makan ini dan merezekikannya kepadaku tanpa daya dan kekuatan dariku.","fod3":"Saat berbuka puasa, ucapkan: Telah hilang dahaga, urat-urat telah basah, dan pahala telah tetap, insyaallah.","hom1":"Dengan nama Allah, aku bertawakal kepada Allah, tiada daya dan kekuatan kecuali dengan pertolongan Allah. Ucapkan saat keluar rumah.","hom2":"Ucapkan saat masuk rumah: Dengan nama Allah kami masuk, dengan nama Allah kami keluar, dan kepada Tuhan kami, kami bertawakal.","hom3":"Mahasuci Allah yang telah menundukkan ini bagi kami, padahal kami tidak mampu menguasainya. Dan kepada Tuhan kami, kami akan kembali. Ucapkan saat bepergian.","fam1":"Ya Tuhan kami, anugerahkanlah kepada kami pasangan dan keturunan yang menjadi penyejuk hati kami, dan jadikanlah kami pemimpin bagi orang-orang yang bertakwa.","fam2":"Ya Tuhanku, berilah aku ilham untuk bersyukur atas nikmat-Mu yang telah Engkau berikan kepadaku dan kepada kedua orang tuaku, dan agar aku berbuat kebaikan yang Engkau ridai, dan jadikanlah anak-cucuku orang yang saleh. Aku bertobat kepada-Mu dan aku termasuk orang-orang yang berserah diri.","fam3":"Ya Tuhanku, sayangilah keduanya sebagaimana mereka berdua telah mendidikku waktu kecil.","fam4":"Ya Tuhan kami, ampunilah aku, kedua orang tuaku, dan orang-orang mukmin pada hari diadakan perhitungan.","grt1":"Segala puji bagi Allah, pujian yang banyak, baik, dan penuh berkah.","grt2":"Ya Allah, nikmat apa pun yang ada padaku atau pada salah satu makhluk-Mu pagi ini, semuanya dari-Mu semata, tiada sekutu bagi-Mu. Maka bagi-Mu segala puji dan syukur.","grt3":"Ya Allah, tolonglah aku untuk mengingat-Mu, bersyukur kepada-Mu, dan beribadah kepada-Mu dengan baik.","suc1":"Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan lindungilah kami dari azab neraka.","suc2":"Ya Allah, aku memohon surga kepada-Mu dan aku berlindung kepada-Mu dari neraka.","suc3":"Ya Allah, perbaikilah agamaku yang menjadi penjaga urusanku. Perbaikilah duniaku yang menjadi tempat penghidupanku. Perbaikilah akhiratku yang menjadi tempat kembaliku. Jadikanlah hidup ini tambahan bagiku dalam segala kebaikan, dan jadikanlah kematian sebagai istirahat bagiku dari segala keburukan.","pat1":"Ya Tuhan kami, limpahkanlah kesabaran kepada kami, teguhkanlah pijakan kami, dan tolonglah kami.","pat2":"Ya Tuhanku, aku telah dikalahkan, maka tolonglah aku.","pat3":"Aku serahkan urusanku kepada Allah. Sungguh, Allah Maha Melihat hamba-hamba-Nya.","umm1":"Ya Allah, limpahkanlah selawat kepada Muhammad dan keluarga Muhammad, sebagaimana Engkau telah melimpahkan selawat kepada Ibrahim dan keluarga Ibrahim. Sungguh, Engkau Maha Terpuji lagi Maha Mulia. Ya Allah, berkahilah Muhammad dan keluarga Muhammad, sebagaimana Engkau telah memberkahi Ibrahim dan keluarga Ibrahim. Sungguh, Engkau Maha Terpuji lagi Maha Mulia.","umm2":"Ya Tuhan kami, ampunilah kami dan saudara-saudara kami yang telah beriman lebih dahulu dari kami, dan janganlah Engkau jadikan kedengkian dalam hati kami terhadap orang-orang yang beriman. Ya Tuhan kami, sungguh Engkau Maha Penyantun lagi Maha Penyayang.","dly1":"Ucapkan sebelum masuk kamar kecil: Ya Allah, aku berlindung kepada-Mu dari setan laki-laki dan setan perempuan.","dly2":"Ucapkan saat memakai pakaian baru: Segala puji bagi Allah yang telah memakaikan ini kepadaku dan merezekikannya kepadaku tanpa daya dan kekuatan dariku.","dly3":"Ucapkan saat hujan: Ya Allah, jadikanlah hujan yang bermanfaat.","dly4":"Ucapkan saat bercermin: Ya Allah, Engkau telah memperindah rupaku, maka perindahlah akhlakku.","dly5":"Ucapkan Alhamdulillah saat bersin. Orang lain menjawab: Yarhamukallah (semoga Allah merahmatimu). Kamu membalas: Yahdikumullahu wa yuslihu balakum (semoga Allah memberimu petunjuk dan memperbaiki urusanmu)."},"adhkar":{"am1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Perlindungan sepanjang hari."},"am2":{"h":"Al-Ikhlas, Al-Falaq, dan An-Nas","en":"Bacalah ketiga surah pendek ini, masing-masing tiga kali."},"am3":{"h":"Pujian di pagi hari","en":"Kami memasuki pagi dan seluruh kerajaan adalah milik Allah. Segala puji bagi Allah. Tiada yang berhak disembah selain Allah semata, yang tiada sekutu bagi-Nya. Milik-Nya kerajaan dan milik-Nya segala puji, dan Dia Mahakuasa atas segala sesuatu. (Sahih Muslim)"},"am4":{"h":"Dengan-Mu kami memulai hari","en":"Ya Allah, dengan-Mu kami memasuki pagi dan dengan-Mu kami memasuki petang. Dengan-Mu kami hidup dan mati, dan kepada-Mu kebangkitan. (At-Tirmidhi)"},"am5":{"h":"Rida kepada Allah","en":"Aku rida Allah sebagai Tuhanku, Islam sebagai agamaku, dan Muhammad sebagai Nabiku. (Abu Dawud)"},"am6":{"h":"SubhanAllah wa bihamdih","en":"Mahasuci Allah dan segala puji bagi-Nya. (Sahih Muslim)"},"am7":{"h":"Memohon ampun","en":"Aku memohon ampun kepada Allah dan bertobat kepada-Nya."},"pm1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Perlindungan sepanjang malam."},"pm2":{"h":"Al-Ikhlas, Al-Falaq, dan An-Nas","en":"Bacalah ketiga surah pendek ini, masing-masing tiga kali."},"pm3":{"h":"Pujian di petang hari","en":"Kami memasuki petang dan seluruh kerajaan adalah milik Allah. Segala puji bagi Allah. Tiada yang berhak disembah selain Allah semata, yang tiada sekutu bagi-Nya. Milik-Nya kerajaan dan milik-Nya segala puji, dan Dia Mahakuasa atas segala sesuatu. (Sahih Muslim)"},"pm4":{"h":"Dengan-Mu kami memulai malam","en":"Ya Allah, dengan-Mu kami memasuki petang dan dengan-Mu kami memasuki pagi. Dengan-Mu kami hidup dan mati, dan kepada-Mu tempat kembali. (At-Tirmidhi)"},"pm5":{"h":"Memohon perlindungan","en":"Aku berlindung dengan kalimat-kalimat Allah yang sempurna dari keburukan makhluk-Nya. (Sahih Muslim)"},"pm6":{"h":"Rida kepada Allah","en":"Aku rida Allah sebagai Tuhanku, Islam sebagai agamaku, dan Muhammad sebagai Nabiku. (Abu Dawud)"},"pm7":{"h":"SubhanAllah wa bihamdih","en":"Mahasuci Allah dan segala puji bagi-Nya. (Sahih Muslim)"},"sl1":{"h":"Ayat al-Kursi","en":"Quran 2:255. Siapa yang membacanya saat hendak tidur, ia mendapat penjaga dari Allah sepanjang malam. (Sahih al-Bukhari)"},"sl2":{"h":"Dua ayat terakhir Al-Baqarah","en":"Quran 2:285-286. Dua ayat ini mencukupi orang yang membacanya di malam hari. (Sahih al-Bukhari, Sahih Muslim)"},"sl3":{"h":"Al-Ikhlas, Al-Falaq, dan An-Nas","en":"Tangkupkan kedua telapak tangan, tiupkan, bacalah ketiga surah itu, lalu usapkan tangan ke seluruh tubuh, dimulai dari kepala dan wajah. Lakukan tiga kali. (Sahih al-Bukhari)"},"sl4":{"h":"Surah Al-Mulk","en":"Nabi ﷺ tidak tidur sebelum membaca Al-Mulk dan As-Sajdah. (At-Tirmidhi)"},"sl5":{"h":"Surah As-Sajdah","en":"Surah 32, dibaca sebelum tidur bersama Al-Mulk."},"sl6":{"h":"Tasbih sebelum tidur","en":"SubhanAllah 33 kali, Alhamdulillah 33 kali, Allahu Akbar 34 kali. (Sahih al-Bukhari)"},"sl7":{"h":"Dengan nama-Mu aku mati dan hidup","en":"Dengan nama-Mu, ya Allah, aku mati dan aku hidup. (Sahih al-Bukhari)"},"sl8":{"h":"Perlindungan di Hari Kiamat","en":"Ya Allah, lindungilah aku dari azab-Mu pada hari Engkau membangkitkan hamba-hamba-Mu. (Abu Dawud)"}},"hadith":{"h1":"Sesungguhnya amal itu tergantung niatnya, dan setiap orang hanya mendapat apa yang ia niatkan.","h2":"Islam dibangun di atas lima: bersaksi bahwa tiada tuhan selain Allah dan bahwa Muhammad adalah Rasulullah, menegakkan shalat, menunaikan zakat, haji ke Baitullah, dan puasa Ramadan.","h3":"Agama itu nasihat. Kami bertanya: Untuk siapa? Beliau menjawab: Untuk Allah, Kitab-Nya, Rasul-Nya, para pemimpin kaum Muslimin, dan orang awam mereka.","h4":"Di antara tanda baiknya keislaman seseorang adalah meninggalkan apa yang tidak bermanfaat baginya.","h5":"Tidak sempurna iman salah seorang dari kalian hingga ia mencintai untuk saudaranya apa yang ia cintai untuk dirinya sendiri.","h6":"Siapa yang beriman kepada Allah dan hari akhir, hendaklah ia berkata baik atau diam.","h7":"Seorang laki-laki berkata kepada Nabi ﷺ: Berilah aku wasiat. Beliau bersabda: Jangan marah. Laki-laki itu mengulanginya beberapa kali, dan setiap kali beliau bersabda: Jangan marah.","h8":"Bertakwalah kepada Allah di mana pun engkau berada, iringilah keburukan dengan kebaikan niscaya kebaikan itu menghapusnya, dan bergaullah dengan manusia dengan akhlak yang baik.","h9":"Jagalah Allah, niscaya Dia menjagamu. Jagalah Allah, niscaya engkau mendapati-Nya di hadapanmu. Jika engkau meminta, mintalah kepada Allah; jika engkau memohon pertolongan, mohonlah kepada Allah.","h10":"Jadilah engkau di dunia ini seakan-akan orang asing atau seorang musafir.","h11":"Tidak boleh membahayakan diri sendiri dan tidak boleh membalas bahaya dengan bahaya.","h12":"Sebaik-baik kalian adalah orang yang belajar Al-Quran dan mengajarkannya.","h13":"Ada dua kalimat yang ringan di lisan, berat di timbangan, dan disukai oleh Yang Maha Pengasih: SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.","h14":"Doa adalah ibadah.","h15":"Di antara orang terbaik kalian adalah yang paling baik akhlaknya.","h16":"Mukmin yang kuat lebih baik dan lebih dicintai Allah daripada mukmin yang lemah, meskipun pada keduanya ada kebaikan.","h17":"Senyumanmu di hadapan saudaramu adalah sedekah.","h18":"Permudahlah dan jangan mempersulit; berilah kabar gembira dan jangan membuat orang lari.","h19":"Siapa yang tidak berterima kasih kepada manusia, berarti ia tidak bersyukur kepada Allah.","h20":"Engkau melihat orang-orang beriman dalam kasih sayang, cinta, dan kelembutan mereka satu sama lain bagaikan satu tubuh: bila satu anggota mengeluh sakit, seluruh tubuh ikut merasakannya dengan tidak bisa tidur dan demam.","h21":"Sayangilah yang ada di bumi, niscaya Yang di langit (Allah) akan menyayangimu.","h22":"Muslim adalah orang yang kaum Muslimin selamat dari lisan dan tangannya.","h23":"Siapa yang menempuh jalan untuk mencari ilmu, Allah mudahkan baginya jalan menuju surga.","h24":"Menuntut ilmu adalah kewajiban bagi setiap Muslim.","h25":"Siapa yang beriman kepada Allah dan hari akhir, janganlah ia menyakiti tetangganya.","h26":"Kekayaan bukanlah banyaknya harta; kekayaan yang sejati adalah kayanya jiwa.","h27":"Sungguh menakjubkan urusan orang mukmin: semuanya baik baginya, dan itu tidak dimiliki siapa pun selain orang mukmin. Jika mendapat kebaikan ia bersyukur, dan itu baik baginya; jika tertimpa keburukan ia bersabar, dan itu baik baginya.","h28":"Allah tidak melihat rupa dan hartamu, tetapi Dia melihat hati dan amalmu.","h29":"Amal yang paling dicintai Allah adalah yang paling rutin, walaupun sedikit.","h30":"Siapa yang mengucapkan SubhanAllahi wa bihamdihi seratus kali sehari, dosa-dosanya diampuni meskipun sebanyak buih di lautan."},"names":{"n1":"Yang Maha Pengasih","n2":"Yang Maha Penyayang","n3":"Sang Raja","n4":"Yang Mahasuci","n5":"Sumber Kedamaian","n6":"Pemberi Rasa Aman","n7":"Yang Maha Memelihara","n8":"Yang Mahaperkasa","n9":"Yang Maha Memaksa","n10":"Yang Mahaagung","n11":"Sang Pencipta","n12":"Yang Mengadakan","n13":"Pembentuk Rupa","n14":"Yang Maha Pengampun","n15":"Yang Maha Menundukkan","n16":"Maha Pemberi Karunia","n17":"Maha Pemberi Rezeki","n18":"Maha Pembuka","n19":"Yang Maha Mengetahui","n20":"Yang Menyempitkan","n21":"Yang Melapangkan","n22":"Yang Merendahkan","n23":"Yang Meninggikan","n24":"Yang Memuliakan","n25":"Yang Menghinakan","n26":"Yang Maha Mendengar","n27":"Yang Maha Melihat","n28":"Yang Maha Menetapkan Hukum","n29":"Yang Maha Adil","n30":"Yang Maha Lembut","n31":"Yang Maha Teliti","n32":"Yang Maha Penyantun","n33":"Yang Maha Agung","n34":"Yang Maha Pengampun","n35":"Yang Maha Mensyukuri","n36":"Yang Mahatinggi","n37":"Yang Mahabesar","n38":"Yang Maha Menjaga","n39":"Yang Maha Memberi Kecukupan","n40":"Yang Maha Menghitung","n41":"Yang Maha Mulia","n42":"Yang Maha Dermawan","n43":"Yang Maha Mengawasi","n44":"Yang Maha Mengabulkan","n45":"Yang Maha Luas","n46":"Yang Mahabijaksana","n47":"Yang Maha Mencintai","n48":"Yang Mahamulia","n49":"Yang Membangkitkan","n50":"Yang Maha Menyaksikan","n51":"Yang Mahabenar","n52":"Yang Maha Dipercaya","n53":"Yang Mahakuat","n54":"Yang Mahakokoh","n55":"Yang Maha Melindungi","n56":"Yang Maha Terpuji","n57":"Yang Maha Menghitung","n58":"Yang Memulai","n59":"Yang Mengembalikan","n60":"Yang Menghidupkan","n61":"Yang Mematikan","n62":"Yang Mahahidup","n63":"Yang Maha Berdiri Sendiri","n64":"Yang Maha Menemukan","n65":"Yang Mahamulia","n66":"Yang Maha Esa","n67":"Yang Maha Tunggal","n68":"Tempat Bergantung","n69":"Yang Maha Mampu","n70":"Yang Mahakuasa","n71":"Yang Mendahulukan","n72":"Yang Mengakhirkan","n73":"Yang Awal","n74":"Yang Akhir","n75":"Yang Zahir","n76":"Yang Batin","n77":"Yang Maha Mengatur","n78":"Yang Mahatinggi","n79":"Sumber Kebaikan","n80":"Penerima Tobat","n81":"Yang Maha Menghukum","n82":"Yang Maha Pemaaf","n83":"Yang Maha Santun","n84":"Pemilik Segala Kerajaan","n85":"Pemilik Keagungan dan Kemuliaan","n86":"Yang Maha Adil","n87":"Yang Mengumpulkan","n88":"Yang Maha Kaya","n89":"Yang Memberi Kekayaan","n90":"Yang Maha Mencegah","n91":"Yang Memberi Mudarat","n92":"Yang Memberi Manfaat","n93":"Cahaya","n94":"Pemberi Petunjuk","n95":"Pencipta Tanpa Contoh","n96":"Yang Maha Kekal","n97":"Pewaris","n98":"Penunjuk Jalan yang Lurus","n99":"Yang Maha Sabar"},"course":[{"id":"L1","w":1,"title":"Siapakah Allah?","teach":"Muslim percaya kepada satu Tuhan, Allah. Dia menciptakan segalanya, tidak punya sekutu dan tidak punya anak, dan tidak ada yang seperti Dia. Keyakinan ini disebut Tawhid. Kata Islam berarti berserah diri dengan damai kepada Allah, dan Muslim adalah orang yang berserah diri kepada-Nya. Allah adalah Ar-Rahman, Yang Maha Pengasih, dan Al-Khaliq, Sang Pencipta.","qs":[{"q":"Apa arti Tawhid?","o":["Keyakinan bahwa Allah itu Esa","Berpuasa di bulan Ramadan","Salat lima kali sehari","Memberi sedekah"],"a":0},{"q":"Apa arti nama Ar-Rahman?","o":["Yang Maha Pengasih","Sang Pencipta","Yang Maha Pengampun","Yang Maha Tinggi"],"a":0},{"q":"Muslim adalah orang yang…","o":["berserah diri kepada Allah","tinggal di Makkah","berbicara bahasa Arab","lahir di keluarga Muslim"],"a":0},{"q":"Benar atau salah: Allah punya sekutu.","o":["Benar","Salah"],"a":1}]},{"id":"N1","w":1,"title":"Nama-Nama Allah yang Indah","teach":"Allah memiliki 99 nama yang indah (Al-Asma’ul-Husna), yang terdapat dalam Al-Quran dan Sunnah. Nabi ﷺ bersabda bahwa Allah memiliki sembilan puluh sembilan nama, dan siapa yang mempelajarinya dan mengamalkannya akan masuk surga (Sahih al-Bukhari, Sahih Muslim). Contohnya Ar-Rahman (Yang Maha Pengasih), Al-Malik (Sang Raja) dan Al-Ghaffar (Yang Maha Pengampun). Kita memohon kepada Allah dengan nama-nama-Nya saat berdoa: ‘Dan milik Allah nama-nama yang terbaik, maka berdoalah kepada-Nya dengan menyebut nama-nama itu’ (Quran 7:180). Lihat semua 99 nama di tab Nama.","qs":[{"q":"Berapa banyak nama indah Allah yang terkenal?","o":["99","33","40","114"],"a":0},{"q":"Apa arti Al-Ghaffar?","o":["Yang Maha Pengampun","Sang Raja","Sang Pencipta","Sang Pemberi Rezeki"],"a":0},{"q":"Apa yang Allah perintahkan kepada kita tentang nama-nama-Nya yang indah?","o":["Berdoa kepada-Nya dengan nama-nama itu","Merahasiakannya","Membacanya sekali saja","Menuliskannya di dinding"],"a":0},{"q":"Apa arti Al-Malik?","o":["Sang Raja","Sang Penyembuh","Sang Hakim","Sang Cahaya"],"a":0}]},{"id":"L3","w":1,"title":"Enam rukun Iman","teach":"Iman berarti keyakinan. Seorang Muslim percaya pada enam hal: Allah, malaikat-Nya, kitab-kitab-Nya, rasul-rasul-Nya, Hari Akhir, dan Qadr, yaitu pengetahuan dan ketetapan Allah atas segala sesuatu, yang baik dan yang buruk. Malaikat diciptakan dari cahaya, manusia dari tanah liat, dan jin dari api tanpa asap.","qs":[{"q":"Ada berapa rukun Iman?","o":["6","5","4","7"],"a":0},{"q":"Manakah yang BUKAN salah satu dari enam rukun Iman?","o":["Puasa","Percaya kepada malaikat","Percaya kepada Hari Akhir","Percaya kepada kitab-kitab Allah"],"a":0},{"q":"Malaikat diciptakan dari…","o":["Cahaya","Tanah liat","Api tanpa asap","Air"],"a":0},{"q":"Manusia diciptakan dari…","o":["Tanah liat","Cahaya","Api tanpa asap","Batu"],"a":0}]},{"id":"L5","w":1,"title":"Lima rukun Islam","teach":"Islam dibangun di atas lima rukun. 1. Syahadat: menyatakan keimanan. 2. Salat: salat lima kali sehari. 3. Zakat: memberi sedekah dari hartamu. 4. Puasa: berpuasa di bulan Ramadan. 5. Haji: ibadah ke Makkah, sekali seumur hidup bagi yang mampu.","qs":[{"q":"Ada berapa rukun Islam?","o":["5","6","3","4"],"a":0},{"q":"Rukun manakah yang berupa salat lima kali sehari?","o":["Salat","Zakat","Haji","Puasa"],"a":0},{"q":"Di bulan apa umat Muslim berpuasa?","o":["Ramadan","Syawal","Muharram","Rajab"],"a":0},{"q":"Haji diwajibkan…","o":["sekali seumur hidup, bagi yang mampu","setiap tahun","setiap bulan","hanya untuk ulama"],"a":0}]},{"id":"L7","w":2,"title":"Mengucapkan Syahadat","teach":"Syahadat adalah pernyataan iman yang membuat seseorang menjadi Muslim: ‘Ash-hadu an la ilaha illallah, wa ash-hadu anna Muhammadan rasulullah.’ Artinya: Aku bersaksi bahwa tidak ada tuhan selain Allah, dan aku bersaksi bahwa Muhammad adalah Utusan Allah. Syahadat harus diucapkan dengan pemahaman dan ketulusan.","qs":[{"q":"Apa arti Syahadat?","o":["Bersaksi","Puasa","Salat","Sedekah"],"a":0},{"q":"Bagian pertama menyatakan tidak ada tuhan selain…","o":["Allah","Sang Nabi","Para malaikat","Ka’bah"],"a":0},{"q":"Bagian kedua menyatakan Muhammad adalah…","o":["Utusan Allah","Seorang raja","Seorang malaikat","Seorang tuhan"],"a":0},{"q":"Syahadat harus diucapkan dengan…","o":["pemahaman dan ketulusan","suara keras saja","berkelompok saja","bahasa Arab saja"],"a":0}]},{"id":"L21","w":2,"title":"Para nabi Allah","teach":"Allah mengutus para nabi kepada setiap bangsa dengan pesan yang sama: sembahlah Allah saja. Al-Quran menyebut 25 di antaranya, termasuk Adam, Nuh, Ibrahim, Musa, Isa dan Muhammad ﷺ, nabi terakhir. Musa menerima Tawrat, Dawud menerima Zabur, Isa menerima Injil, dan Muhammad ﷺ menerima Al-Quran.","qs":[{"q":"Siapakah nabi terakhir?","o":["Muhammad ﷺ","Isa","Musa","Ibrahim"],"a":0},{"q":"Kitab mana yang diberikan kepada Musa?","o":["Tawrat","Injil","Zabur","Al-Quran"],"a":0},{"q":"Al-Quran diturunkan kepada…","o":["Muhammad ﷺ","Dawud","Isa","Nuh"],"a":0},{"q":"Apa pesan setiap nabi?","o":["Sembahlah Allah saja","Bangunlah kota","Mulailah berdagang","Raihlah kekuasaan"],"a":0}]},{"id":"L17","w":2,"title":"Nabi ﷺ: masa kecil dan remaja","teach":"Muhammad ﷺ lahir di Makkah sekitar tahun 570 M, pada Tahun Gajah. Ayahnya wafat sebelum beliau lahir dan ibunya wafat ketika beliau berusia sekitar enam tahun. Kakeknya, lalu pamannya Abu Talib, membesarkannya. Beliau dikenal sebagai As-Sadiq Al-Amin, yang jujur dan dapat dipercaya. Pada usia 25 tahun beliau menikah dengan Khadijah, semoga Allah meridainya.","qs":[{"q":"Di mana Nabi ﷺ lahir?","o":["Makkah","Madinah","Yerusalem","Taif"],"a":0},{"q":"Beliau dikenal sebagai…","o":["yang jujur dan dapat dipercaya","yang terkaya","yang terkuat","sang penyair"],"a":0},{"q":"Siapa yang beliau nikahi pada usia 25 tahun?","o":["Khadijah","Aisyah","Hafsah","Maryam"],"a":0},{"q":"Siapa yang membesarkannya setelah kakeknya?","o":["Pamannya Abu Talib","Abu Lahab","Abu Bakar","Umar"],"a":0}]},{"id":"L19","w":3,"title":"Wahyu dan Hijrah","teach":"Pada usia 40 tahun, di Gua Hira, malaikat Jibril membawa wahyu pertama: ‘Iqra’ (Bacalah!), awal Surah Al-Alaq. Selama 13 tahun Nabi ﷺ menyeru orang kepada Allah di Makkah dan menghadapi kesulitan. Pada tahun 622 M beliau hijrah ke Madinah. Hijrah ini menandai awal kalender Islam.","qs":[{"q":"Di mana wahyu pertama turun?","o":["Gua Hira","Ka’bah","Madinah","Gunung Sinai"],"a":0},{"q":"Apa kata pertama yang diwahyukan?","o":["Iqra (Bacalah)","Bismillah","Qul (Katakanlah)","Alhamdulillah"],"a":0},{"q":"Hijrah adalah perpindahan ke…","o":["Madinah","Mesir","Yaman","Baghdad"],"a":0},{"q":"Hijrah menandai awal…","o":["kalender Islam","Ramadan","Haji","Hari Raya"],"a":0}]},{"id":"L23","w":3,"title":"Madinah dan penaklukan Makkah","teach":"Di Madinah, Nabi ﷺ membangun masjid pertama, Masjid an-Nabawi, dan membentuk masyarakat yang berdasarkan persaudaraan dan keadilan. Pada tahun 630 M Makkah dibuka bagi umat Muslim, dan Nabi ﷺ memaafkan orang-orang yang dulu menentangnya. Beliau wafat pada tahun 632 M di usia 63 tahun dan dimakamkan di Madinah.","qs":[{"q":"Apa yang pertama kali dibangun Nabi ﷺ di Madinah?","o":["Sebuah masjid","Sebuah benteng","Sebuah pasar","Sebuah sekolah"],"a":0},{"q":"Bagaimana beliau memperlakukan bekas musuhnya di Makkah?","o":["Beliau memaafkan mereka","Beliau menghukum mereka","Beliau mengabaikan mereka","Beliau mengusir mereka"],"a":0},{"q":"Di mana Nabi ﷺ dimakamkan?","o":["Madinah","Makkah","Taif","Yerusalem"],"a":0},{"q":"Surah mana yang berbicara tentang kemenangan dan orang-orang yang masuk Islam berbondong-bondong?","o":["An-Nasr","Al-Fil","Al-Asr","Quraysh"],"a":0}]},{"id":"N2","w":3,"title":"Al-Quran: wahyu dan penjagaannya","teach":"Al-Quran adalah firman Allah, diwahyukan kepada Nabi ﷺ dalam bahasa Arab selama sekitar 23 tahun. Al-Quran memiliki 114 surah. Al-Quran dihafal dan ditulis pada masa hidup Nabi ﷺ. Setelah beliau, Abu Bakar mengumpulkannya menjadi satu mushaf, dan Utsman membuat salinan teks standar lalu mengirimkannya ke kota-kota utama. Allah berjanji akan menjaganya (Quran 15:9).","qs":[{"q":"Berapa surah yang dimiliki Al-Quran?","o":["114","99","30","60"],"a":0},{"q":"Berapa lama Al-Quran diwahyukan?","o":["23 tahun","3 tahun","40 tahun","1 tahun"],"a":0},{"q":"Siapa yang mengumpulkan Al-Quran menjadi satu mushaf?","o":["Abu Bakar","Abu Lahab","Hamzah","Bilal"],"a":0},{"q":"Siapa yang mengirim salinan teks standar ke kota-kota utama?","o":["Utsman","Ali","Umar","Khalid"],"a":0}]},{"id":"L9","w":4,"title":"Wudu: bersuci untuk salat","teach":"Wudu adalah membasuh anggota tubuh yang diperlukan sebelum salat. Berniatlah dalam hati dan ucapkan Bismillah. Lalu basuh tanganmu 3 kali, berkumurlah 3 kali, hirup air ke hidung lalu keluarkan 3 kali, basuh wajahmu 3 kali, basuh lengan sampai siku 3 kali (kanan dulu, lalu kiri), usap kepalamu sekali (bersama telinga), dan basuh kakimu sampai mata kaki 3 kali (kanan dulu, lalu kiri). Wudu batal karena buang air, buang angin, tidur nyenyak, atau hilang kesadaran.","qs":[{"q":"Apa yang diucapkan di awal wudu?","o":["Bismillah","Allahu Akbar","Alhamdulillah","SubhanAllah"],"a":0},{"q":"Berapa kali kepala diusap?","o":["Sekali","Tiga kali","Tidak diusap","Tujuh kali"],"a":0},{"q":"Manakah yang membatalkan wudu?","o":["Tidur nyenyak","Makan roti","Berjalan","Membaca"],"a":0},{"q":"Lengan dibasuh sampai…","o":["Siku","Pergelangan tangan","Bahu","Lutut"],"a":0}]},{"id":"L11","w":4,"title":"Salat: waktu dan rakaat","teach":"Umat Muslim salat lima kali sehari, menghadap Kiblat (arah Ka’bah di Makkah). Subuh (fajar) 2 rakaat, Zuhur (tengah hari) 4, Asar (sore) 4, Magrib (matahari terbenam) 3, dan Isya (malam) 4. Satu rakaat adalah satu putaran berdiri, rukuk, dan sujud. Usahakan salat tepat pada waktunya.","qs":[{"q":"Berapa rakaat salat Subuh?","o":["2","3","4","5"],"a":0},{"q":"Salat manakah yang 3 rakaat?","o":["Magrib","Subuh","Asar","Isya"],"a":0},{"q":"Ke arah mana umat Muslim menghadap saat salat?","o":["Kiblat, ke arah Ka’bah","Utara","Timur","Matahari"],"a":0},{"q":"Ada berapa salat wajib dalam sehari?","o":["5","3","4","6"],"a":0}]},{"id":"L13","w":4,"title":"Cara salat: langkah demi langkah","teach":"1. Berniatlah, ucapkan ‘Allahu Akbar’ dan angkat kedua tanganmu. 2. Berdiri dan bacalah Al-Fatihah serta satu surah lain. 3. Rukuk: membungkuk dan ucapkan ‘Subhana Rabbiyal ‘Azim’. 4. Berdiri sambil mengucapkan ‘Sami’allahu liman hamidah’. 5. Sujud: bersujud dengan tujuh anggota (dahi bersama hidung, kedua tangan, kedua lutut, kedua kaki) dan ucapkan ‘Subhana Rabbiyal A’la’. 6. Duduk, lalu sujud lagi. Pada rakaat terakhir, duduklah untuk Tasyahud, bacalah selawat untuk Nabi ﷺ, dan akhiri dengan Taslim: ‘As-salamu alaykum wa rahmatullah’ ke kanan dan ke kiri. Akan sangat membantu jika ada orang yang menunjukkannya langsung kepadamu.","qs":[{"q":"Apa yang diucapkan saat rukuk (membungkuk)?","o":["Subhana Rabbiyal ‘Azim","Subhana Rabbiyal A’la","Bismillah","Alhamdulillah"],"a":0},{"q":"Saat sujud, berapa anggota tubuh yang menyentuh tanah?","o":["7","3","5","10"],"a":0},{"q":"Bagaimana salat dimulai?","o":["Takbir: Allahu Akbar","Salam","Rukuk","Sujud"],"a":0},{"q":"Bagaimana salat diakhiri?","o":["Taslim: As-salamu alaykum wa rahmatullah","Takbir","Al-Fatihah","Sujud"],"a":0}]},{"id":"L25","w":5,"title":"Puasa dan Ramadan","teach":"Ramadan adalah bulan kesembilan dalam kalender Islam. Umat Muslim berpuasa dari fajar (Subuh) hingga matahari terbenam (Magrib): tanpa makan dan minum. Puasa mengajarkan kesabaran, rasa syukur, dan kepedulian kepada orang miskin. Al-Quran pertama kali diwahyukan di bulan Ramadan, dan Laylat al-Qadr, Malam Kemuliaan, ada di sepuluh malam terakhirnya. Idulfitri datang setelah bulan itu.","qs":[{"q":"Kapan puasa harian berlangsung?","o":["Dari fajar sampai matahari terbenam","Dari matahari terbit sampai tengah hari","Dari matahari terbenam sampai fajar","Dari tengah hari sampai malam"],"a":0},{"q":"Laylat al-Qadr ada di…","o":["sepuluh malam terakhir Ramadan","Muharram","Dzulhijjah","malam pertama Ramadan"],"a":0},{"q":"Hari raya apa yang datang setelah Ramadan?","o":["Idulfitri","Iduladha","Arafah","Hijrah"],"a":0},{"q":"Ramadan adalah bulan ke berapa dalam kalender Islam?","o":["Ke-9","Ke-1","Ke-12","Ke-5"],"a":0}]},{"id":"L27","w":5,"title":"Zakat dan Sedekah","teach":"Zakat adalah rukun Islam yang ketiga. Besarnya 2,5% dari tabungan yang tetap berada di atas jumlah minimum (nisab) selama satu tahun qamariah, diberikan kepada orang yang membutuhkan dan golongan lain yang disebut dalam Al-Quran. Sedekah adalah amal sukarela: berapa pun jumlahnya, bahkan kata yang baik atau senyuman. Sedekah menyucikan harta dan hati.","qs":[{"q":"Berapa persen zakat atas tabungan?","o":["2,5%","10%","50%","1%"],"a":0},{"q":"Apa nama amal sukarela?","o":["Sedekah","Zakat","Haji","Puasa"],"a":0},{"q":"Untuk siapa zakat?","o":["Orang miskin dan yang membutuhkan, serta golongan lain","Kerabat yang kaya","Pemilik toko","Siapa saja yang meminta"],"a":0},{"q":"Sedekah menyucikan…","o":["harta dan hati","hanya tubuh","rumah","mobil"],"a":0}]},{"id":"L29","w":5,"title":"Haji dan Umrah","teach":"Haji adalah ibadah ke Makkah pada bulan Dzulhijjah, diwajibkan sekali seumur hidup bagi yang mampu. Para jemaah memakai pakaian putih sederhana (ihram), mengelilingi Ka’bah (tawaf), berjalan antara Safa dan Marwah, dan wukuf di Padang Arafah, hari yang paling penting. Umrah adalah ibadah yang lebih kecil yang dapat dilakukan kapan saja sepanjang tahun.","qs":[{"q":"Haji dilakukan pada bulan apa?","o":["Dzulhijjah","Ramadan","Rajab","Muharram"],"a":0},{"q":"Apa nama mengelilingi Ka’bah?","o":["Tawaf","Sa’i","Ihram","Wudu"],"a":0},{"q":"Apa hari terpenting dalam Haji?","o":["Wukuf di Arafah","Hari Raya","Hari Jumat","Matahari terbit"],"a":0},{"q":"Manakah ibadah yang lebih kecil?","o":["Umrah","Zakat","Salat","Puasa"],"a":0}]},{"id":"L15","w":6,"title":"Adab dan akhlak yang baik","teach":"Umat Muslim memberi salam dengan ‘As-salamu alaykum’ (semoga keselamatan atasmu), dan jawabannya ‘Wa alaykumus-salam’. Ucapkan ‘Bismillah’ sebelum makan dan ‘Alhamdulillah’ sesudahnya. Jadilah orang yang jujur, baik kepada tetangga, dan hormat kepada orang tua: Allah memerintahkan kita agar tidak mengucapkan ‘uf’ kepada mereka (Quran 17:23). Hindari ghibah, yaitu membicarakan keburukan seseorang saat ia tidak ada. Nabi ﷺ bersabda: ‘Yang terbaik di antara kalian adalah yang terbaik akhlaknya’ (Sahih al-Bukhari).","qs":[{"q":"Apa jawaban untuk ‘As-salamu alaykum’?","o":["Wa alaykumus-salam","Bismillah","SubhanAllah","Allahu Akbar"],"a":0},{"q":"Apa yang kita ucapkan sebelum makan?","o":["Bismillah","Alhamdulillah","Astaghfirullah","Insyaallah"],"a":0},{"q":"Apa yang Allah larang kita ucapkan kepada orang tua?","o":["‘Uf’ (kata yang menunjukkan kekesalan)","Terima kasih","Salam","Selamat datang"],"a":0},{"q":"Menurut Nabi ﷺ, orang terbaik adalah yang terbaik…","o":["akhlaknya","hartanya","rumahnya","pakaiannya"],"a":0}]},{"id":"L31","w":6,"title":"Halal dan haram","teach":"Halal berarti diperbolehkan dan haram berarti dilarang. Allah melarang hal-hal yang berbahaya seperti alkohol, daging babi, judi, mencuri, berbohong, dan riba (bunga). Kebanyakan hal adalah halal kecuali yang dilarang Allah. Carilah uang dengan jujur dan gunakan dengan bijak. Jika kamu ragu, tanyakan kepada ulama yang dipercaya.","qs":[{"q":"Apa arti halal?","o":["Diperbolehkan","Dilarang","Dibenci","Diwajibkan"],"a":0},{"q":"Manakah yang haram?","o":["Riba (bunga)","Perdagangan yang jujur","Memberi sedekah","Berpuasa"],"a":0},{"q":"Kebanyakan hal adalah…","o":["halal kecuali dilarang","haram kecuali diizinkan","terlarang","pilihan bebas"],"a":0},{"q":"Bagaimana seharusnya kita mencari uang?","o":["Dengan jujur","Dengan cara apa pun","Dengan menipu","Dengan berjudi"],"a":0}]},{"id":"L32","w":6,"title":"Akhirat","teach":"Setiap orang akan meninggal dan kembali kepada Allah. Para malaikat mencatat amal kita. Setelah kematian datang kehidupan alam kubur (barzakh), lalu Hari Kiamat, ketika semua orang dibangkitkan dan dimintai pertanggungjawaban. Orang-orang yang saleh akan masuk Jannah (surga) karena rahmat Allah. Allah Maha Pengasih dan mengampuni orang yang bertobat dengan tulus.","qs":[{"q":"Apa yang datang setelah kematian?","o":["Kehidupan alam kubur, lalu Hari Kiamat","Tidak ada apa-apa","Kehidupan lain di bumi","Tidur selamanya"],"a":0},{"q":"Siapa yang mencatat amal kita?","o":["Para malaikat","Manusia","Jin","Burung"],"a":0},{"q":"Apa nama surga?","o":["Jannah","Jahannam","Barzakh","Qadr"],"a":0},{"q":"Allah mengampuni orang yang…","o":["bertobat dengan tulus","menyombongkan diri","tidak pernah salat","bersembunyi"],"a":0}]},{"id":"N3","w":6,"title":"Cara berdoa","teach":"Doa berarti memohon kepada Allah. Nabi ﷺ bersabda: ‘Doa adalah ibadah’ (Abu Dawud, At-Tirmidhi). Adab berdoa: mulailah dengan memuji Allah dan bersalawat kepada Nabi ﷺ, bersungguh-sungguh, yakin bahwa Allah mendengarmu, memohon berulang kali, dan jangan pernah meminta sesuatu yang berdosa. Waktu-waktu yang sangat diharapkan doanya dikabulkan antara lain sepertiga malam terakhir, saat sujud dalam salat, dan antara azan dan iqamah. Allah dapat memberi apa yang kamu minta, menjauhkan bahaya darimu, atau menyimpan pahalanya untuk akhirat.","qs":[{"q":"Nabi ﷺ bersabda bahwa doa adalah…","o":["ibadah","hanya untuk orang sakit","hanya untuk hari Jumat","sebuah kebiasaan"],"a":0},{"q":"Cara yang baik untuk memulai doa adalah…","o":["dengan memuji Allah","dengan mengeluh","dengan berteriak","dengan meminta keburukan"],"a":0},{"q":"Manakah waktu yang sangat diharapkan doanya dikabulkan?","o":["Sepertiga malam terakhir","Tidak pernah di malam hari","Hanya saat tengah hari","Hanya di bulan Ramadan"],"a":0},{"q":"Jika doamu belum langsung terkabul, kamu sebaiknya…","o":["terus berdoa dan percaya kepada Allah","berhenti berdoa","hanya menyalahkan diri sendiri","meminta kepada orang lain, bukan kepada Allah"],"a":0}]},{"id":"N4","w":7,"title":"Tiga bagian Tawhid","teach":"Para ulama sering menjelaskan Tawhid dalam tiga bagian. Tawhid ar-Rububiyyah: hanya Allah Tuhan, Pencipta, dan Pemelihara. Tawhid al-Uluhiyyah: hanya Allah yang berhak disembah. Tawhid al-Asma was-Sifat: meyakini nama dan sifat Allah sebagaimana dijelaskan Al-Quran dan Sunnah, tanpa menyamakan-Nya dengan makhluk-Nya. Ini adalah salah satu cara umum untuk menyusun pembahasan ini.","qs":[{"q":"Para ulama sering membagi Tawhid menjadi berapa bagian?","o":["3","2","5","7"],"a":0},{"q":"Tawhid ar-Rububiyyah berarti hanya Allah yang menjadi…","o":["Tuhan dan Pencipta","satu-satunya nabi","satu-satunya malaikat","satu-satunya kota"],"a":0},{"q":"Tawhid al-Uluhiyyah berarti hanya Allah yang berhak mendapat…","o":["ibadah","pajak","pasukan","rumah"],"a":0},{"q":"Tawhid al-Asma was-Sifat adalah keyakinan pada…","o":["nama dan sifat Allah","nama-nama kota","hanya nama-nama malaikat","nama-nama bulan"],"a":0}]},{"id":"N5","w":7,"title":"Syirik dan hal yang merusak iman","teach":"Syirik berarti menyekutukan Allah. Syirik adalah dosa terbesar jika seseorang meninggal dalam keadaan itu (Quran 4:48). Syirik termasuk menyembah atau berdoa kepada selain Allah. Ada juga syirik kecil, seperti pamer dalam ibadah, yang disebut riya. Nabi ﷺ mengkhawatirkan hal ini menimpa umatnya. Pintu tobat tetap terbuka: Allah mengampuni orang yang kembali kepada-Nya dengan tulus sebelum ajal tiba.","qs":[{"q":"Apa arti syirik?","o":["Menyekutukan Allah","Tidak berpuasa","Terlambat","Makan berlebihan"],"a":0},{"q":"Pamer dalam ibadah disebut…","o":["riya","zakat","sujud","hijrah"],"a":0},{"q":"Apakah pintu tobat terbuka?","o":["Ya, sampai ajal tiba","Tidak, tidak pernah","Hanya pada hari Jumat","Hanya untuk ulama"],"a":0},{"q":"Kepada siapa kita berdoa dan bersandar?","o":["Allah saja","Orang-orang suci","Matahari","Nenek moyang kita"],"a":0}]},{"id":"N6","w":7,"title":"Cara hadis dinilai","teach":"Hadis adalah riwayat tentang perkataan, perbuatan, atau persetujuan Nabi ﷺ. Hadis memiliki dua bagian: isnad (rantai perawi) dan matn (teksnya). Para ulama memeriksa setiap perawi dan menilai hadis sebagai sahih (shahih), hasan (baik), da’if (lemah), atau mawdu’ (palsu). Sahih al-Bukhari dan Sahih Muslim adalah kitab yang paling dipercaya. Bersama Abu Dawud, At-Tirmidhi, An-Nasa’i, dan Ibn Majah, keduanya membentuk enam kitab hadis utama.","qs":[{"q":"Isnad sebuah hadis adalah…","o":["rantai perawi","teksnya","judulnya","sampul bukunya"],"a":0},{"q":"Matn sebuah hadis adalah…","o":["teksnya","rantainya","penilaiannya","penerjemahnya"],"a":0},{"q":"Apa arti mawdu’?","o":["Palsu","Sahih","Baik","Terkenal"],"a":0},{"q":"Ada berapa kitab hadis utama?","o":["6","3","10","99"],"a":0}]},{"id":"N7","w":8,"title":"Sumber hukum Islam","teach":"Hukum Islam (syariah) diambil dari sumber-sumber secara berurutan. 1. Al-Quran. 2. Sunnah, ajaran dan teladan Nabi ﷺ. 3. Ijma, kesepakatan para ulama atas suatu hukum. 4. Qiyas, penalaran dengan membandingkan pada hukum yang sudah diketahui. Fiqh adalah pemahaman atas hukum-hukum ini oleh para ulama yang berkompeten. Jika kita tidak tahu sesuatu, kita bertanya kepada orang yang berilmu.","qs":[{"q":"Apa sumber pertama hukum Islam?","o":["Al-Quran","Ijma","Qiyas","Adat"],"a":0},{"q":"Sunnah berarti…","o":["Ajaran dan teladan Nabi ﷺ","Sebuah kota","Sejenis sajadah","Bulan puasa"],"a":0},{"q":"Ijma adalah…","o":["kesepakatan para ulama","sebuah perayaan","sebuah sedekah","sebuah salat"],"a":0},{"q":"Apa yang kita lakukan jika tidak tahu suatu hukum?","o":["Bertanya kepada orang yang berilmu","Menebak","Mengabaikannya","Bertanya kepada siapa saja di internet"],"a":0}]},{"id":"N8","w":8,"title":"Empat khulafaur rasyidin","teach":"Setelah Nabi ﷺ, umat Muslim dipimpin oleh empat khalifah yang mendapat petunjuk (Al-Khulafa ar-Rashidun): Abu Bakar as-Siddiq, Umar bin Khattab, Utsman bin Affan, dan Ali bin Abi Talib, semoga Allah meridai mereka. Abu Bakar mengumpulkan Al-Quran, Umar dikenal karena keadilannya, Utsman menyalin teks standar, dan Ali adalah sepupu sekaligus menantu Nabi ﷺ. Ini adalah pandangan Sunni tentang urutan dan kedudukan mereka.","qs":[{"q":"Ada berapa khulafaur rasyidin?","o":["4","2","3","7"],"a":0},{"q":"Siapa khalifah pertama?","o":["Abu Bakar","Umar","Utsman","Ali"],"a":0},{"q":"Siapa yang membuat salinan teks standar Al-Quran?","o":["Utsman","Umar","Bilal","Hamzah"],"a":0},{"q":"Ali adalah ... bagi Nabi ﷺ","o":["sepupu dan menantu","saudara","paman","guru"],"a":0}]},{"id":"N9","w":8,"title":"Empat mazhab fiqh","teach":"Muslim Sunni mengikuti salah satu dari empat mazhab fiqh klasik: Hanafi (Abu Hanifah), Maliki (Malik bin Anas), Syafi’i (Imam asy-Syafi’i), dan Hanbali (Ahmad bin Hanbal). Mereka sepakat dalam akidah dan rukun Islam, dan berbeda pada beberapa rincian, misalnya cara melakukan sebagian ibadah. Perbedaan pendapat ulama dalam masalah cabang adalah hal yang wajar dan bukan alasan untuk bertengkar. Banyak Muslim di Indonesia mengikuti mazhab Syafi’i.","qs":[{"q":"Ada berapa mazhab fiqh Sunni klasik?","o":["4","2","6","10"],"a":0},{"q":"Mazhab mana yang dinamai menurut Imam asy-Syafi’i?","o":["Syafi’i","Hanafi","Maliki","Hanbali"],"a":0},{"q":"Para mazhab sepakat dalam…","o":["akidah dan rukun Islam","setiap detail kecil","tidak ada sama sekali","hanya tanggal Hari Raya"],"a":0},{"q":"Bagaimana kita menyikapi perbedaan dalam masalah cabang?","o":["Dengan saling menghormati, tanpa bertengkar","Dengan berkelahi","Dengan mengejek orang lain","Dengan meninggalkan Islam"],"a":0}]}]}};

const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function streak(){const d=new Date();let n=0;if(!S.days[isoOf(d)])d.setDate(d.getDate()-1);while(S.days[isoOf(d)]){n++;d.setDate(d.getDate()-1)}return n}

function mark(){const i=isoOf(new Date());if(!S.days[i]){S.days[i]=1;save();const c=$('#stk');if(c)c.innerHTML=stkHTML()}}
const ddKey=id=>isoOf(new Date())+'|'+id;
const ddOn=id=>!!S.dd[ddKey(id)];
function ddToggle(id){const td=isoOf(new Date());Object.keys(S.dd).forEach(x=>{if(x.indexOf(td+'|')!==0)delete S.dd[x]});const k=ddKey(id);if(S.dd[k])delete S.dd[k];else{S.dd[k]=1;mark()}save()}

QULS:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ<br>قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ<br>قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',
BAQ:'آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ'};

function noise(ctx,brown){const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){l=(l+0.02*w)/1.02;d[i]=l*3.5}else d[i]=w}const s=ctx.createBufferSource();s.buffer=b;s.loop=true;return s}
function burst(ctx,out,freq,vol,dur){const s=noise(ctx,false),f=ctx.createBiquadFilter(),g2=ctx.createGain(),tt=ctx.currentTime;f.type='bandpass';f.frequency.value=freq;g2.gain.setValueAtTime(vol,tt);g2.gain.exponentialRampToValueAtTime(0.001,tt+dur);s.connect(f);f.connect(g2);g2.connect(out);s.start(tt);s.stop(tt+dur+.05)}

    const u=await window.claude.use('user');if(u){uid=await u.id()}
    dbh=await window.claude.use('db');if(!dbh){refreshLive();return}
    ['istighfar','salawat'].forEach(k=>{dbh.collection(k).onSnapshot(snap=>{let tt=0;snap.docs.forEach(d=>{const n=(d.data()||{}).n;if(typeof n==='number')tt+=n});live[k]=tt;if(!snap.metadata.fromCache){live.online=true;clearTimeout(to)}refreshLive()},()=>{live.timedOut=true;refreshLive()})});
  }catch(e){}}
function refreshLive(){['istighfar','salawat'].forEach(k=>{setText('#lt_'+k,(live.online?live[k]:S.myLive[k]).toLocaleString());setText('#lm_'+k,S.myLive[k].toLocaleString())});
  setText('#lnote',live.online?'Live from everyone using the app':(live.timedOut?'Live counts unavailable. Counting on this phone for now.':'Connecting to the live count…'))}
function queueFlush(k){dirty[k]=true;clearTimeout(flushT);flushT=setTimeout(flush,1500)}
async function flush(){if(flushing||!dbh||!uid)return;flushing=true;try{for(const k of ['istighfar','salawat']){if(dirty[k]){dirty[k]=false;await dbh.collection(k).doc(uid).set({n:S.myLive[k]})}}}catch(e){}flushing=false;if(dirty.istighfar||dirty.salawat)flushT=setTimeout(flush,1500)}

/* ---------- Journal and Quran by juz (English only for now) ---------- */
function vJournal(){const moods=['Anxious','Sad','Angry','Tired','Grateful','Calm'];
  const list=S.journal.map((e,i)=>`<div class="card"><div class="row sp"><span class="badge">${esc(e.m||'Note')}</span><span class="small muted">${new Date(e.t).toLocaleString()}</span></div><p style="white-space:pre-wrap">${esc(e.x)}</p><div class="row"><button class="btn warn sm" data-a="jdel" data-v="${i}">${jc===i?'Tap again to delete':'Delete'}</button></div></div>`).join('');
  return back()+`<h1>${esc(t('m_journal'))}</h1><div class="card"><h3>How are you feeling?</h3><div class="tabs">${moods.map(m=>`<button class="chip ${mood===m?'on':''}" data-a="mood" data-v="${m}">${m}</button>`).join('')}</div>
   <textarea id="jx" placeholder="Write freely. This stays on this phone."></textarea><button class="btn" data-a="jsave">Save entry</button></div>${list||'<p class="muted">No entries yet.</p>'}`}
const JUZ=['Alif Lam Mim','Sayaqul','Tilkal Rusul','Lan Tanalu','Wal Muhsanat','La Yuhibbullah','Wa Idha Sami’u','Wa Law Annana','Qalal Mala’u','Wa A’lamu','Ya’taziruna','Wa Ma Min Dabbah','Wa Ma Ubarri’u','Rubama','Subhanalladhi','Qal Alam','Iqtaraba','Qad Aflaha','Wa Qalalladhina','A’man Khalaqa','Utlu Ma Uhiya','Wa Man Yaqnut','Wa Mali','Fa Man Azlamu','Ilayhi Yuraddu','Ha Mim','Qala Fa Ma Khatbukum','Qad Sami’allah','Tabarakalladhi','Amma'];
const juzDone=()=>Object.values(S.juz).filter(Boolean).length;
function vJuz(){const n=juzDone();
  return back()+`<h1>${esc(t('m_juz'))}</h1><div class="card"><div class="row sp"><h3>Quran by juz</h3><span class="muted small" id="juzn">${n} of 30 juz</span></div><div class="bar"><i id="juzb" style="width:${n/30*100}%"></i></div>
   <div class="list">${JUZ.map((nm,i)=>`<div class="item"><button class="chk ${S.juz[i+1]?'on':''}" data-a="juz" data-v="${i+1}" aria-label="Mark juz ${i+1} read">${S.juz[i+1]?'✓':''}</button><span class="grow">Juz ${i+1} <span class="muted small">${esc(nm)}</span></span><a href="https://quran.com/juz/${i+1}" target="_blank" rel="noopener">Read</a></div>`).join('')}</div>
   <button class="btn warn sm" data-a="juzreset">Start a new khatmah</button></div>`}

/* ---------- render ---------- */
function render(keep){bStop(true);nav();const v={duas:vDuas,learn:vLearn,hadith:vHadith,names:vNames,more:vMore}[tab]();$('#app').innerHTML=hdr()+v;if(!keep)window.scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  switch(a){
   case'tab':tab=v;sub=null;LS=null;jc=-1;juzC=false;render();break;
   case'go':sub=v||null;jc=-1;juzC=false;render();break;
   case'support':tab='more';sub='support';render();break;
   case'lang':S.lang=v;save();applyLang();render(true);break;
   case'adtab':adTab=v;$('#adk').outerHTML=adhkarCard();break;
   case'dd':ddToggle(v);if(tab==='duas'){const q=duaQ;$('#adk').outerHTML=adhkarCard();$('#lst').innerHTML=duaListHTML()}break;
   case'cat':duaCat=v;duaQ='';render(true);break;
   case'lstart':LS={i:+v,step:'teach'};render();break;
   case'lexit':LS=null;render();break;
   case'lbegin':lbegin();render(true);break;
   case'lpick':if(LS&&!LS.checked){LS.pick=+v;render(true)}break;
   case'lcheck':lcheck();render(true);break;
   case'lnext':lnext();render(LS.step==='quiz');break;
   case'htp':hTopic=v;render(true);break;
   case'nm':{if(S.names[v])delete S.names[v];else{S.names[v]=1;mark()}save();$('#lst').innerHTML=namesListHTML();const d=namesDone();setText('#nmn',d+'/99');const nb=$('#nmb');if(nb)nb.style.width=(d/99*100)+'%';break}
   case'copynum':{const done=()=>toast(t('dn_copied'));if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(NUMBER).then(done).catch(()=>{const n=$('.numr');if(n){const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)}})}else{const n=$('.numr');if(n){const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)}}break}
   case'breathe':bGo();break;
   case'snd':S.sound=v;save();render(true);break;
   case'tmr':S.timer=b.checked;save();break;
   case'phr':S.phrase=+v;save();render(true);break;
   case'tgt':S.tasbihTarget=+v;save();render(true);break;
   case'treset':S.tasbihN=0;save();render(true);break;
   case'tas':S.tasbihN++;mark();if(navigator.vibrate)try{navigator.vibrate(8)}catch(x){}setText('#tn',String(S.tasbihN));const tb=$('#tb');if(tb)tb.style.width=Math.min(100,S.tasbihN/S.tasbihTarget*100)+'%';if(S.tasbihN%S.tasbihTarget===0)toast(S.tasbihN+' reached. SubhanAllah.');save();break;
   case'live':S.myLive[v]++;mark();if(live.online)live[v]++;refreshLive();queueFlush(v);save();break;
   case'mood':mood=mood===v?'':v;render(true);break;
   case'jsave':{const x=$('#jx').value.trim();if(!x){toast('Write something first');break}S.journal.unshift({t:Date.now(),m:mood,x});mark();mood='';save();render(true);toast('Saved');break}
   case'jdel':{const i=+v;if(jc===i){S.journal.splice(i,1);jc=-1;save()}else jc=i;render(true);break}
   case'juz':{S.juz[v]=!S.juz[v];if(S.juz[v])mark();b.classList.toggle('on',!!S.juz[v]);b.textContent=S.juz[v]?'✓':'';const n=juzDone();setText('#juzn',n+' of 30 juz');const jb=$('#juzb');if(jb)jb.style.width=(n/30*100)+'%';save();break}
   case'juzreset':if(juzC){S.juz={};juzC=false;save();render(true)}else{juzC=true;b.textContent='Tap again to clear all 30'}break;
  }});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='dq'){duaQ=e.target.value;$('#lst').innerHTML=duaListHTML();document.querySelectorAll('.tabs .chip[data-a="cat"]').forEach(c=>c.classList.toggle('on',!duaQ&&c.dataset.v===duaCat))}
  if(id==='hq'){hQ=e.target.value;$('#lst').innerHTML=hadithListHTML()}
  if(id==='nq'){nQ=e.target.value;$('#lst').innerHTML=namesListHTML()}});
document.addEventListener('change',e=>{if(e.target.id==='lang'){S.lang=e.target.value;save();applyLang();render(true)}});

/* ---------- boot ---------- */
applyLang();render();initLive();
})();
</script>
</body></html>
